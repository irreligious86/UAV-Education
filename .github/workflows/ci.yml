# Site CI: content must be valid, the committed site must be rebuilt from content,
# and every local link must resolve. GitHub Pages serves main as-is.
name: content-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check diagrams
        run: |
          python scripts/diagrams/build_diagrams.py
          python scripts/check_diagrams.py

      - name: Validate content and curriculum
        run: python scripts/validate_content.py

      - name: Rebuild site
        run: |
          python scripts/build_site.py
          python scripts/build_curriculum_page.py

      - name: Built site must be committed in sync with content
        run: |
          if [ -n "$(git status --porcelain -- index.html m ref pages api quiz cap path tasks projects curriculum sw.js manifest.webmanifest assets/diagrams)" ]; then
            echo "::error::Site is stale. Run 'python scripts/publish.py' locally and commit the result."
            git status --short -- index.html m ref pages api quiz cap path tasks projects curriculum sw.js manifest.webmanifest assets/diagrams
            exit 1
          fi

      - name: Check local links
        run: python scripts/check_links.py

      - name: Rendering check (no raw Markdown tables, bold or headings in pages)
        run: python scripts/check_rendering.py

      - name: Compile starter examples
        run: python -m compileall -q examples

      - name: Lab grader self-test (synthetic DataFlash fixtures)
        run: |
          pip install --quiet pymavlink
          python examples/sitl-pymavlink/test_check_lab_log.py

      - name: Lab code self-tests (MAVLink, web GCS, perception, landing, follow, Blackbox grader)
        run: |
          pip install --quiet pytest numpy lupa
          python -m pytest -q -p no:cacheprovider examples/mavlink/tests
          python -m pytest -q -p no:cacheprovider examples/web-gcs/tests
          python -m pytest -q -p no:cacheprovider examples/perception/tests
          python -m pytest -q -p no:cacheprovider examples/precision-landing/tests
          python -m pytest -q -p no:cacheprovider examples/follow-target/tests
          python -m pytest -q -p no:cacheprovider examples/blackbox-grader/tests
          python -m pytest -q -p no:cacheprovider examples/inspection/tests
          python -m pytest -q -p no:cacheprovider examples/tx16s-companion/tests
          python -m pytest -q -p no:cacheprovider examples/fleet-telemetry/tests
          python -m pytest -q -p no:cacheprovider examples/cell-bridge/tests
          python -m pytest -q -p no:cacheprovider examples/lua-protection/tests

      - name: ROS 2 labs logic (frames, offboard state machine) and compose file
        run: |
          pip install --quiet pyyaml
          python -m pytest -q -p no:cacheprovider examples/ros2-docker/ws/src/uav_ros2_labs/test
          python -c "import yaml; yaml.safe_load(open('examples/ros2-docker/docker-compose.yml'))"

      - name: Project starters (log report)
        run: python -m pytest -q -p no:cacheprovider examples/log-report/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax check
        run: for f in assets/*.js assets/widgets/*.js; do node --check "$f"; done

      - name: Account logic (merge rules) and account UI end-to-end (fake backend, Chromium)
        run: |
          node --test tests/js/*.test.js
          npm install --global --silent playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium > /dev/null
          python -m http.server 8765 > /dev/null 2>&1 &
          sleep 2
          NODE_PATH="$(npm root -g)" node tests/e2e/accounts.e2e.js http://localhost:8765
          NODE_PATH="$(npm root -g)" node tests/e2e/exams.e2e.js http://localhost:8765

      - name: Design system is pinned to a release tag
        run: |
          git -C lib/ground-control-ui fetch -q --tags origin
          git -C lib/ground-control-ui describe --tags --exact-match

  database-access-rules:
    # Roles and Row Level Security of the multi-user backend (supabase/migrations), on real Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: RLS and role tests
        env:
          PG_DSN: "host=localhost port=5432 user=postgres password=postgres"
        run: |
          pip install --quiet pytest "psycopg[binary]"
          python -m pytest -q -p no:cacheprovider supabase/tests
