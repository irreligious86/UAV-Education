# Site CI: content must be valid, the committed site must be rebuilt from content,
# and every local link must resolve. GitHub Pages serves main as-is.
name: content-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check diagrams
        run: |
          python scripts/diagrams/build_diagrams.py
          python scripts/check_diagrams.py

      - name: Validate content and curriculum
        run: python scripts/validate_content.py

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Built site must be committed in sync with content
        run: |
          if [ -n "$(git status --porcelain -- index.html m ref pages api quiz cap path tasks projects sw.js manifest.webmanifest assets/diagrams)" ]; then
            echo "::error::Site is stale. Run 'python scripts/publish.py' locally and commit the result."
            git status --short -- index.html m ref pages api quiz cap path tasks projects sw.js manifest.webmanifest assets/diagrams
            exit 1
          fi

      - name: Check local links
        run: python scripts/check_links.py

      - name: Compile starter examples
        run: python -m compileall -q examples

      - name: Lab grader self-test (synthetic DataFlash fixtures)
        run: |
          pip install --quiet pymavlink
          python examples/sitl-pymavlink/test_check_lab_log.py

      - name: MAVLink, web GCS and perception labs (fake vehicle, no SITL)
        run: |
          pip install --quiet pytest numpy
          python -m pytest -q -p no:cacheprovider examples/mavlink/tests
          python -m pytest -q -p no:cacheprovider examples/web-gcs/tests
          python -m pytest -q -p no:cacheprovider examples/perception/tests
          python -m pytest -q -p no:cacheprovider examples/precision-landing/tests
          python -m pytest -q -p no:cacheprovider examples/follow-target/tests

      - name: ROS 2 labs logic (frames, offboard state machine) and compose file
        run: |
          pip install --quiet pyyaml
          python -m pytest -q -p no:cacheprovider examples/ros2-docker/ws/src/uav_ros2_labs/test
          python -c "import yaml; yaml.safe_load(open('examples/ros2-docker/docker-compose.yml'))"

      - name: Project starters (log report)
        run: python -m pytest -q -p no:cacheprovider examples/log-report/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax check
        run: for f in assets/*.js assets/widgets/*.js; do node --check "$f"; done

      - name: Design system is pinned to a release tag
        run: |
          git -C lib/ground-control-ui fetch -q --tags origin
          git -C lib/ground-control-ui describe --tags --exact-match
