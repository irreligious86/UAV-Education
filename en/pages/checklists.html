<h2>✅ Quick Preflight Checklists</h2>
        <div class="grid">
          <div class="checklist-card">
            <h3>Before powering up</h3>
            <ul>
              <li><input type="checkbox"><label>Props removed (setup) / tightened (flight)</label></li>
              <li><input type="checkbox"><label>Battery charged, voltage within limits</label></li>
              <li><input type="checkbox"><label>VTX and receiver antennas installed</label></li>
              <li><input type="checkbox"><label>SD card inserted (logs/scripts)</label></li>
              <li><input type="checkbox"><label>No visible damage to the frame or wires</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>After connecting to the GCS</h3>
            <ul>
              <li><input type="checkbox"><label>Config backup made (diff / param)</label></li>
              <li><input type="checkbox"><label>Accelerometer calibrated</label></li>
              <li><input type="checkbox"><label>Compass calibrated (if MAG is present)</label></li>
              <li><input type="checkbox"><label>GPS fix acquired (≥ 8 satellites, HDOP &lt; 1.5)</label></li>
              <li><input type="checkbox"><label>Modes assigned to switches</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>Before takeoff (armed)</h3>
            <ul>
              <li><input type="checkbox"><label>Check motor spin direction</label></li>
              <li><input type="checkbox"><label>Check servo movement (for wings)</label></li>
              <li><input type="checkbox"><label>Check OSD and telemetry</label></li>
              <li><input type="checkbox"><label>Check failsafe (turn off the radio)</label></li>
              <li><input type="checkbox"><label>Drone in a safe area, people at a distance</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>After the flight</h3>
            <ul>
              <li><input type="checkbox"><label>Save the flight log (Blackbox / .bin)</label></li>
              <li><input type="checkbox"><label>Check motor and ESC temperature</label></li>
              <li><input type="checkbox"><label>Check remaining battery voltage</label></li>
              <li><input type="checkbox"><label>Visual inspection for damage</label></li>
              <li><input type="checkbox"><label>Write your observations in the failure log</label></li>
            </ul>
          </div>
        </div>

    </div>
