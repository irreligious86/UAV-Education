<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Резервированное питание X8</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">X8 6S: две АКБ, предохранители по веткам, два BEC — отказ одной ветки борт переживает</text><rect class="box" x="10.0" y="40.0" width="150.0" height="58.0" rx="6"/><text x="85.0" y="59.0" text-anchor="middle" style="font-size:11px">АКБ 1 6S,</text><text x="85.0" y="73.0" text-anchor="middle" style="font-size:11px">предохранитель</text><text x="85.0" y="87.0" text-anchor="middle" style="font-size:11px">1.3 × I_max ветки</text><rect class="box" x="10.0" y="120.0" width="150.0" height="58.0" rx="6"/><text x="85.0" y="139.0" text-anchor="middle" style="font-size:11px">АКБ 2 6S,</text><text x="85.0" y="153.0" text-anchor="middle" style="font-size:11px">предохранитель</text><text x="85.0" y="167.0" text-anchor="middle" style="font-size:11px">1.3 × I_max ветки</text><rect class="box" x="190.0" y="66.0" width="130.0" height="84.0" rx="6"/><text x="255.0" y="91.0" text-anchor="middle" style="font-size:11px">ORing или</text><text x="255.0" y="105.0" text-anchor="middle" style="font-size:11px">параллель:</text><text x="255.0" y="119.0" text-anchor="middle" style="font-size:11px">отказ АКБ —</text><text x="255.0" y="133.0" text-anchor="middle" style="font-size:11px">летим на второй</text><rect class="boxa" x="350.0" y="72.0" width="128.0" height="72.0" rx="6"/><text x="414.0" y="98.0" text-anchor="middle" class="b" style="font-size:11px">PDB / медные</text><text x="414.0" y="112.0" text-anchor="middle" style="font-size:11px">шины 150+ А</text><text x="414.0" y="126.0" text-anchor="middle" style="font-size:11px">(пик ~130 А)</text><rect class="box" x="520.0" y="36.0" width="190.0" height="84.0" rx="6"/><text x="615.0" y="61.0" text-anchor="middle" style="font-size:11px">4 луча × 2 мотора:</text><text x="615.0" y="75.0" text-anchor="middle" style="font-size:11px">до ~32 А на луч,</text><text x="615.0" y="89.0" text-anchor="middle" style="font-size:11px">12–14 AWG, XT90;</text><text x="615.0" y="103.0" text-anchor="middle" style="font-size:11px">предохранителей нет</text><rect class="box" x="520.0" y="140.0" width="190.0" height="44.0" rx="6"/><text x="615.0" y="159.0" text-anchor="middle" style="font-size:11px">предохранитель →</text><text x="615.0" y="173.0" text-anchor="middle" style="font-size:11px">companion / нагрузка</text><rect class="box" x="190.0" y="236.0" width="210.0" height="34.0" rx="6"/><text x="295.0" y="257.0" text-anchor="middle" style="font-size:11px">предохранитель → BEC 1 5 В</text><rect class="box" x="190.0" y="292.0" width="210.0" height="34.0" rx="6"/><text x="295.0" y="313.0" text-anchor="middle" style="font-size:11px">предохранитель → BEC 2 5 В</text><rect class="box" x="430.0" y="245.0" width="130.0" height="72.0" rx="6"/><text x="495.0" y="271.0" text-anchor="middle" style="font-size:11px">диодный ORing:</text><text x="495.0" y="285.0" text-anchor="middle" style="font-size:11px">отказ BEC —</text><text x="495.0" y="299.0" text-anchor="middle" style="font-size:11px">борт жив</text><rect class="boxa" x="590.0" y="262.0" width="120.0" height="38.0" rx="6"/><text x="650.0" y="285.0" text-anchor="middle" class="b" style="font-size:11px">FC + приёмник</text><path class="ln" d="M160 69 L175 69 L175 98 L190 98" marker-end="url(#ar)"/><path class="ln" d="M160 149 L175 149 L175 118 L190 118" marker-end="url(#ar)"/><path class="lna" d="M320 108 L350 108" marker-end="url(#ara)"/><path class="lna" d="M478 92 L499 92 L499 78 L520 78" marker-end="url(#ara)"/><path class="ln" d="M478 124 L499 124 L499 162 L520 162" marker-end="url(#ar)"/><path class="ln" d="M414 144 L414 204 L172 204 L172 253 L190 253" marker-end="url(#ar)"/><path class="ln" d="M172 253 L172 309 L190 309" marker-end="url(#ar)"/><path class="ln" d="M400 253 L415 253 L415 270 L430 270" marker-end="url(#ar)"/><path class="ln" d="M400 309 L415 309 L415 292 L430 292" marker-end="url(#ar)"/><path class="lna" d="M560 281 L590 281" marker-end="url(#ara)"/><text x="16" y="346" text-anchor="start" class="m t">Мотор: висение ~3.6–3.9 А, максимум ~15–16 А; луч = 2 мотора → до ~32 А:</text><text x="16" y="362" text-anchor="start" class="m t">XT60 (30 А длительно) на пределе, XT90 — с запасом. Предохранители — на АКБ, ветках нагрузки и BEC.</text><text x="16" y="378" text-anchor="start" class="m t">Одна шина и один BEC → отказ разъёма обрывает лог без события дизарма.</text></svg>
