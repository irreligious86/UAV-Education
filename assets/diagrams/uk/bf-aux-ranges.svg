<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Раскладка режимов на оси AUX-канала</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Раскладка команды на оси AUX: режим активен, пока канал внутри своего диапазона</text><text x="140" y="44" text-anchor="end" class="m t" style="font-size:10px">положение тумблера</text><path d="M190.0 48 L190.0 264" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.4" stroke-dasharray="3 3"/><text x="190.04" y="44" text-anchor="middle" class="a t" style="font-size:10px">≈988</text><path d="M423.0 48 L423.0 264" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.4" stroke-dasharray="3 3"/><text x="423.0" y="44" text-anchor="middle" class="a t" style="font-size:10px">≈1500</text><path d="M656.0 48 L656.0 264" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.4" stroke-dasharray="3 3"/><text x="655.96" y="44" text-anchor="middle" class="a t" style="font-size:10px">≈2012</text><text x="140" y="82" text-anchor="end" style="font-size:11.5px">AUX1</text><rect class="boxa" x="515.0" y="64" width="180.0" height="28" rx="4"/><text x="605.0" y="82" text-anchor="middle" class="b" style="font-size:11px">ARM</text><text x="140" y="122" text-anchor="end" style="font-size:11.5px">AUX8 (7&quot;+)</text><rect class="boxa" x="515.0" y="104" width="180.0" height="28" rx="4"/><text x="605.0" y="122" text-anchor="middle" class="b" style="font-size:11px">PREARM</text><text x="140" y="162" text-anchor="end" style="font-size:11.5px">AUX3</text><rect class="box" x="151.0" y="144" width="180.0" height="28" rx="4"/><text x="241.0" y="162" text-anchor="middle" class="m" style="font-size:11px">ACRO: ничего</text><rect class="boxa" x="333.0" y="144" width="180.0" height="28" rx="4"/><text x="423.0" y="162" text-anchor="middle" class="b" style="font-size:11px">ANGLE</text><rect class="boxa" x="515.0" y="144" width="180.0" height="28" rx="4"/><text x="605.0" y="162" text-anchor="middle" class="b" style="font-size:11px">HORIZON</text><text x="140" y="202" text-anchor="end" style="font-size:11.5px">AUX6</text><rect class="boxa" x="515.0" y="184" width="180.0" height="28" rx="4"/><text x="605.0" y="202" text-anchor="middle" class="b" style="font-size:11px">FAILSAFE</text><text x="140" y="242" text-anchor="end" style="font-size:11.5px">AUX7</text><rect class="boxa" x="515.0" y="224" width="180.0" height="28" rx="4"/><text x="605.0" y="242" text-anchor="middle" class="b" style="font-size:11px">BEEPER</text><line class="lnm" x1="150.0" y1="264" x2="696.0" y2="264" style="stroke-dasharray:none"/><line class="ln" x1="150.0" y1="260" x2="150.0" y2="268"/><text x="150.0" y="282" text-anchor="middle" class="m t" style="font-size:11px">900</text><line class="ln" x1="332.0" y1="260" x2="332.0" y2="268"/><text x="332.0" y="282" text-anchor="middle" class="m t" style="font-size:11px">1300</text><line class="ln" x1="514.0" y1="260" x2="514.0" y2="268"/><text x="514.0" y="282" text-anchor="middle" class="m t" style="font-size:11px">1700</text><line class="ln" x1="696.0" y1="260" x2="696.0" y2="268"/><text x="696.0" y="282" text-anchor="middle" class="m t" style="font-size:11px">2100</text><text x="423.0" y="298" text-anchor="middle" class="m t" style="font-size:10px">мкс; диапазоны с шагом 25</text><path d="M332.0 175 L423.0 175" stroke="var(--gc-signal-amber, #f0b24c)" stroke-width="1.6"/><text x="16" y="316" text-anchor="start" class="m t">До границы диапазона 200–312 мкс (жёлтая черта — 200): джиттер канала не переключает режим.</text><text x="16" y="332" text-anchor="start" class="m t">Арм — только когда ARM и PREARM оба в диапазоне; ANGLE в Stage 2 failsafe включается и без тумблера.</text></svg>
