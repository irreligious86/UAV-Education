<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Потеря позиции в INAV: реакция по режимам</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">INAV 9.1.0 (navigation.c): что делает аппарат, когда оценка позиции пропала</text><path class="ln" d="M360.0 74 L360.0 91.0 L240.0 91.0 L240.0 108" marker-end="url(#ar)"/><text x="246" y="103.5" text-anchor="start" class="a t b" style="font-size:10.5px">RTH, WP</text><path class="ln" d="M360.0 74 L360.0 91.0 L560.0 91.0 L560.0 108" marker-end="url(#ar)"/><text x="566" y="103.5" text-anchor="start" class="a t b" style="font-size:10.5px">CRUISE, COURSE HOLD</text><path class="ln" d="M240.0 150 L240.0 170.0 L120.0 170.0 L120.0 190" marker-end="url(#ar)"/><text x="126" y="184.0" text-anchor="start" class="a t b" style="font-size:10.5px">N = 1–10 с (умолч. 5)</text><path class="ln" d="M240.0 150 L240.0 170.0 L370.0 170.0 L370.0 190" marker-end="url(#ar)"/><text x="376" y="184.0" text-anchor="start" class="a t b" style="font-size:10.5px">0</text><path class="ln" d="M240.0 324 L240.0 344.0 L150.0 344.0 L150.0 364" marker-end="url(#ar)"/><text x="156" y="358.0" text-anchor="start" class="a t b" style="font-size:10.5px">так</text><path class="ln" d="M240.0 324 L240.0 344.0 L470.0 344.0 L470.0 364" marker-end="url(#ar)"/><text x="476" y="358.0" text-anchor="start" class="a t b" style="font-size:10.5px">ні</text><path class="lna" d="M120 244 L120 266 L230 266 L230 282" marker-end="url(#ara)"/><path class="lna" d="M370 244 L370 266 L250 266 L250 282" marker-end="url(#ara)"/><text x="376" y="260" text-anchor="start" class="a t b" style="font-size:10.5px">failsafe-RTH</text><rect class="boxa" x="160.0" y="32.0" width="400.0" height="42.0" rx="6"/><text x="360.0" y="50.5" text-anchor="middle" class="b" style="font-size:10.5px">Оценки позиции нет совсем (счисления</text><text x="360.0" y="63.5" text-anchor="middle" style="font-size:10.5px">inav_allow_dead_reckoning не осталось): какой режим?</text><rect class="box" x="90.0" y="108.0" width="300.0" height="42.0" rx="6"/><text x="240.0" y="126.5" text-anchor="middle" style="font-size:10.5px">RTH или миссия WP:</text><text x="240.0" y="139.5" text-anchor="middle" style="font-size:10.5px">nav_position_timeout?</text><rect class="box" x="460.0" y="108.0" width="200.0" height="42.0" rx="16"/><text x="560.0" y="126.5" text-anchor="middle" style="font-size:10.5px">режим выключается,</text><text x="560.0" y="139.5" text-anchor="middle" style="font-size:10.5px">управление — пилоту</text><rect class="box" x="15.0" y="190.0" width="210.0" height="54.0" rx="6"/><text x="120.0" y="208.0" text-anchor="middle" style="font-size:10.5px">нет позиции дольше</text><text x="120.0" y="221.0" text-anchor="middle" style="font-size:10.5px">N с → аварийная посадка</text><text x="120.0" y="234.0" text-anchor="middle" style="font-size:10.5px">(emergency landing)</text><rect class="box" x="240.0" y="190.0" width="260.0" height="54.0" rx="6"/><text x="370.0" y="208.0" text-anchor="middle" style="font-size:10.5px">ждать без конца; RTH по</text><text x="370.0" y="221.0" text-anchor="middle" style="font-size:10.5px">failsafe, начатый без позиции,</text><text x="370.0" y="234.0" text-anchor="middle" style="font-size:10.5px">— посадка сразу на месте</text><rect class="boxa" x="90.0" y="282.0" width="300.0" height="42.0" rx="6"/><text x="240.0" y="300.5" text-anchor="middle" class="b" style="font-size:10.5px">Аварийная посадка:</text><text x="240.0" y="313.5" text-anchor="middle" style="font-size:10.5px">оценка высоты есть?</text><rect class="box" x="15.0" y="364.0" width="270.0" height="54.0" rx="16"/><text x="150.0" y="382.0" text-anchor="middle" style="font-size:10.5px">снижение со скоростью</text><text x="150.0" y="395.0" text-anchor="middle" style="font-size:10.5px">nav_emerg_landing_speed (умолч.</text><text x="150.0" y="408.0" text-anchor="middle" style="font-size:10.5px">500 см/с) до детектора посадки</text><rect class="box" x="350.0" y="364.0" width="240.0" height="54.0" rx="16"/><text x="470.0" y="382.0" text-anchor="middle" style="font-size:10.5px">снижения по скорости нет:</text><text x="470.0" y="395.0" text-anchor="middle" style="font-size:10.5px">фиксированный газ</text><text x="470.0" y="408.0" text-anchor="middle" style="font-size:10.5px">failsafe_throttle</text></svg>
