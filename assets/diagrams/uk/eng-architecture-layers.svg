<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Архитектура дрона: слои питания и данных</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Архитектура на одном листе: питание — тонкие, данные — цветные</text><rect class="box" x="20" y="120" width="110" height="46" rx="6"/><text x="75.0" y="147.0" text-anchor="middle" style="font-size:11.5px">АКБ</text><rect class="box" x="200" y="30" width="120" height="46" rx="6"/><text x="260.0" y="57.0" text-anchor="middle" style="font-size:11.5px">ESC ×4</text><rect class="box" x="200" y="120" width="120" height="46" rx="6"/><text x="260.0" y="147.0" text-anchor="middle" style="font-size:11.5px">BEC 5 В</text><rect class="box" x="200" y="210" width="120" height="46" rx="6"/><text x="260.0" y="237.0" text-anchor="middle" style="font-size:11.5px">BEC 9 В</text><rect class="boxa" x="400" y="120" width="130" height="46" rx="6"/><text x="465.0" y="147.0" text-anchor="middle" class="b" style="font-size:11.5px">FC</text><rect class="box" x="400" y="210" width="130" height="46" rx="6"/><text x="465.0" y="237.0" text-anchor="middle" style="font-size:11.5px">Флеш</text><rect class="box" x="590" y="30" width="120" height="46" rx="6"/><text x="650.0" y="57.0" text-anchor="middle" style="font-size:11.5px">Приймач</text><rect class="box" x="590" y="120" width="120" height="46" rx="6"/><text x="650.0" y="140.5" text-anchor="middle" style="font-size:11.5px">GPS + компас</text><text x="650.0" y="153.5" text-anchor="middle" style="font-size:11.5px">на мачте</text><rect class="box" x="590" y="210" width="120" height="46" rx="6"/><text x="650.0" y="237.0" text-anchor="middle" style="font-size:11.5px">VTX</text><path class="ln" d="M130 135 L165 135 L165 53 L200 53" marker-end="url(#ar)"/><path class="ln" d="M130 143 L200 143" marker-end="url(#ar)"/><path class="ln" d="M130 151 L165 151 L165 233 L200 233" marker-end="url(#ar)"/><path class="ln" d="M320 143 L400 143" marker-end="url(#ar)"/><text x="360" y="137" text-anchor="middle" class="t" style="font-size:10px">5 В</text><text x="360" y="170" text-anchor="middle" class="m t" style="font-size:10px">→ FC, RX, GPS</text><path class="ln" d="M260 256 L260 284 L650 284 L650 260" marker-end="url(#ar)"/><text x="455" y="278" text-anchor="middle" class="t" style="font-size:10px">9 В</text><path class="lna" d="M440 120 L440 90 L330 90 L330 53 L324 53" marker-end="url(#ara)"/><text x="385" y="84" text-anchor="middle" class="a t" style="font-size:10px">DShot</text><path class="lna" d="M590 53 L560 53 L560 133 L534 133" marker-end="url(#ara)"/><text x="566" y="100" text-anchor="start" class="a t" style="font-size:10px">CRSF · UART1</text><path class="lna" d="M590 148 L534 148" marker-end="url(#ara)"/><text x="560" y="162" text-anchor="middle" class="a t" style="font-size:10px">UBX</text><text x="560" y="174" text-anchor="middle" class="a t" style="font-size:10px">UART2</text><path class="lna" d="M515 166 L515 186 L575 186 L575 228 L586 228" marker-end="url(#ara)"/><text x="569" y="202" text-anchor="end" class="a t" style="font-size:10px">MSP/OSD · UART3</text><path class="lna" d="M440 166 L440 206" marker-end="url(#ara)"/><text x="434" y="192" text-anchor="end" class="a t" style="font-size:10px">Blackbox</text><text x="16" y="316" text-anchor="start" class="m t">Ток подписать на каждой стрелке питания — своими числами; решение — одной фразой («GPS на мачте —</text><text x="16" y="329" text-anchor="start" class="m t">компас подальше от силовых»)</text></svg>
