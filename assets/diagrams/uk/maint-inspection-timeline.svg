<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 274" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Регламент осмотров по налёту</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Регламент осмотров по налёту: интервалы стартовые, свои — по журналу</text><line class="lnm" x1="150.0" y1="248" x2="696.0" y2="248"/><line class="lnm" x1="150.0" y1="244" x2="150.0" y2="252"/><text x="150.0" y="266" text-anchor="middle" class="m t" style="font-size:11px">0 ч</text><line class="lnm" x1="259.2" y1="244" x2="259.2" y2="252"/><text x="259.2" y="266" text-anchor="middle" class="m t" style="font-size:11px">10 ч</text><line class="lnm" x1="368.4" y1="244" x2="368.4" y2="252"/><text x="368.4" y="266" text-anchor="middle" class="m t" style="font-size:11px">20 ч</text><line class="lnm" x1="477.6" y1="244" x2="477.6" y2="252"/><text x="477.6" y="266" text-anchor="middle" class="m t" style="font-size:11px">30 ч</text><line class="lnm" x1="586.8" y1="244" x2="586.8" y2="252"/><text x="586.8" y="266" text-anchor="middle" class="m t" style="font-size:11px">40 ч</text><line class="lnm" x1="696.0" y1="244" x2="696.0" y2="252"/><text x="696.0" y="266" text-anchor="middle" class="m t" style="font-size:11px">50 ч</text><text x="140" y="68" text-anchor="end" style="font-size:11.5px">Каждый полёт</text><text x="140" y="108" text-anchor="end" style="font-size:11.5px">После удара</text><text x="140" y="148" text-anchor="end" style="font-size:11.5px">Каждые 10–20 ч</text><text x="140" y="188" text-anchor="end" style="font-size:11.5px">Пример журнала</text><text x="140" y="228" text-anchor="end" style="font-size:11.5px">~50 ч, сезон</text><rect class="box" x="150.0" y="50" width="546.0" height="28" rx="4"/><text x="423.0" y="68.0" text-anchor="middle" style="font-size:11px">до: винты, АКБ, антенны · после: нагрев моторов и ESC, журнал</text><rect class="box" x="150.0" y="90" width="546.0" height="28" rx="4"/><text x="423.0" y="108.0" text-anchor="middle" style="font-size:11px">в любой момент: чек-лист после аварии, все винты — замена</text><rect class="boxa" x="259.2" y="130" width="109.19999999999999" height="28" rx="4"/><text x="313.79999999999995" y="148.0" text-anchor="middle" class="b" style="font-size:11px">подшипники</text><text x="376.4" y="148" text-anchor="start" class="m t" style="font-size:11px">+ винты рамы, пайка, демпферы FC</text><rect class="box" x="150.0" y="170" width="327.6" height="28" rx="4"/><text x="160.0" y="188.0" text-anchor="start" style="font-size:11px">подшипники умирают за 30 ч</text><path d="M368.4 167 L368.4 201" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="2.4"/><path d="M586.8 167 L586.8 201" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="2.4"/><text x="594.8" y="188" text-anchor="start" class="a t" style="font-size:11px">осмотр: шаг 20 ч</text><rect class="boxa" x="619.56" y="210" width="76.44000000000005" height="28" rx="4"/><text x="657.78" y="228.0" text-anchor="middle" class="b" style="font-size:11px">разборка</text><text x="611.56" y="228" text-anchor="end" class="m t" style="font-size:11px">проводка, изоляция, разъёмы питания, прошивка</text></svg>
