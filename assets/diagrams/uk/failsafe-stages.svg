<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Betaflight failsafe: от потери пакетов до процедуры</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Betaflight failsafe: от потери пакетов до процедуры</text><text x="112" y="67" text-anchor="end" style="font-size:11px">Пакеты RC</text><line class="lnm" x1="120" y1="78" x2="704" y2="78"/><rect class="boxa" x="120.0" y="51" width="22.5" height="22" rx="3"/><text x="146.46153846153845" y="66" text-anchor="start" class="m t" style="font-size:10px">ок</text><rect class="box" x="142.5" y="51" width="426.8" height="22" rx="3"/><text x="355.84615384615387" y="66" text-anchor="middle" style="font-size:10px">нет валидных кадров</text><text x="112" y="101" text-anchor="end" style="font-size:11px">Детекция</text><