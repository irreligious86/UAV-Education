<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348.0" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Режим SURFACE в INAV: два предела</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">INAV 9.1.0: высота над поверхностью — режим SURFACE, а не источник, как EK3_SRC1_POSZ = 2</text><rect class="boxa" x="30.0" y="30.0" width="660.0" height="54.0" rx="6"/><text x="360.0" y="48.0" text-anchor="middle" class="b" style="font-size:10.5px">SURFACE (id 33) есть на вкладке Modes, только если мультиротор + барометр + дальномер;</text><text x="360.0" y="61.0" text-anchor="middle" style="font-size:10.5px">работает поверх ALTHOLD или POSHOLD, газ задаёт высоту над землёй;</text><text x="360.0" y="74.0" text-anchor="middle" style="font-size:10.5px">inav_max_surface_altitude = 200 см (умолч.): выше отсчёт дальномера не принимается</text><path class="ln" d="M360 84 L360 100" marker-end="url(#ar)"/><rect x="80" y="180.0" width="260" height="136.0" fill="var(--gc-accent-hud, #5ef1d2)" opacity="0.08"/><rect x="80" y="112.0" width="260" height="68.0" fill="var(--gc-signal-red, #e8636b)" opacity="0.10"/><g stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"><line x1="76" y1="316.0" x2="80" y2="316.0"/><line x1="76" y1="282.0" x2="80" y2="282.0"/><line x1="76" y1="248.0" x2="80" y2="248.0"/><line x1="76" y1="214.0" x2="80" y2="214.0"/><line x1="76" y1="180.0" x2="80" y2="180.0"/><line x1="76" y1="146.0" x2="80" y2="146.0"/><line x1="76" y1="112.0" x2="80" y2="112.0"/></g><text x="72" y="320.0" text-anchor="end" class="m t" style="font-size:10.5px">0</text><text x="72" y="286.0" text-anchor="end" class="m t" style="font-size:10.5px">50</text><text x="72" y="252.0" text-anchor="end" class="m t" style="font-size:10.5px">100</text><text x="72" y="218.0" text-anchor="end" class="m t" style="font-size:10.5px">150</text><text x="72" y="184.0" text-anchor="end" class="m t" style="font-size:10.5px">200</text><text x="72" y="150.0" text-anchor="end" class="m t" style="font-size:10.5px">250</text><text x="72" y="116.0" text-anchor="end" class="m t" style="font-size:10.5px">300</text><line x1="80" y1="316.0" x2="80" y2="112.0" stroke="currentColor" stroke-width="1"/><line x1="80" y1="180.0" x2="340" y2="180.0" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.4" stroke-dasharray="5 3"/><text x="336" y="195.0" text-anchor="end" class="d t" style="font-size:10.5px">предел 200 см</text><text x="336" y="210.0" text-anchor="end" class="a t" style="font-size:10.5px">дальномер учитывается</text><text x="336" y="122.19999999999999" text-anchor="end" class="d t" style="font-size:10.5px">отсчёт не принимается →</text><text x="336" y="135.2" text-anchor="end" class="d t" style="font-size:10.5px">AGL недостоверна → снижение</text><path d="M110 316.0 L110 248.0" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="10" fill="none"/><line x1="98" y1="248.0" x2="122" y2="248.0" stroke="currentColor" stroke-width="2"/><text x="124" y="252.0" text-anchor="start" class="b" style="font-size:10.5px">полный газ = 100 см</text><text x="124" y="310.0" text-anchor="start" class="t" style="font-size:10.5px">газ 0 % = 0 см</text><text x="210.0" y="336.0" text-anchor="middle" class="b" style="font-size:10.5px">Норма: nav_max_terrain_follow_alt = 100 (умолч.)</text><rect x="440" y="180.0" width="260" height="136.0" fill="var(--gc-accent-hud, #5ef1d2)" opacity="0.08"/><rect x="440" y="112.0" width="260" height="68.0" fill="var(--gc-signal-red, #e8636b)" opacity="0.10"/><g stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"><line x1="436" y1="316.0" x2="440" y2="316.0"/><line x1="436" y1="282.0" x2="440" y2="282.0"/><line x1="436" y1="248.0" x2="440" y2="248.0"/><line x1="436" y1="214.0" x2="440" y2="214.0"/><line x1="436" y1="180.0" x2="440" y2="180.0"/><line x1="436" y1="146.0" x2="440" y2="146.0"/><line x1="436" y1="112.0" x2="440" y2="112.0"/></g><text x="432" y="320.0" text-anchor="end" class="m t" style="font-size:10.5px">0</text><text x="432" y="286.0" text-anchor="end" class="m t" style="font-size:10.5px">50</text><text x="432" y="252.0" text-anchor="end" class="m t" style="font-size:10.5px">100</text><text x="432" y="218.0" text-anchor="end" class="m t" style="font-size:10.5px">150</text><text x="432" y="184.0" text-anchor="end" class="m t" style="font-size:10.5px">200</text><text x="432" y="150.0" text-anchor="end" class="m t" style="font-size:10.5px">250</text><text x="432" y="116.0" text-anchor="end" class="m t" style="font-size:10.5px">300</text><line x1="440" y1="316.0" x2="440" y2="112.0" stroke="currentColor" stroke-width="1"/><line x1="440" y1="180.0" x2="700" y2="180.0" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.4" stroke-dasharray="5 3"/><text x="696" y="195.0" text-anchor="end" class="d t" style="font-size:10.5px">предел 200 см</text><text x="696" y="210.0" text-anchor="end" class="a t" style="font-size:10.5px">дальномер учитывается</text><text x="696" y="122.19999999999999" text-anchor="end" class="d t" style="font-size:10.5px">отсчёт не принимается →</text><text x="696" y="135.2" text-anchor="end" class="d t" style="font-size:10.5px">AGL недостоверна → снижение</text><path d="M470 316.0 L470 180.0" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="10" fill="none"/><path d="M470 180.0 L470 146.0" stroke="var(--gc-signal-red, #e8636b)" stroke-width="10" fill="none"/><line x1="458" y1="146.0" x2="482" y2="146.0" stroke="currentColor" stroke-width="2"/><text x="484" y="150.0" text-anchor="start" class="b" style="font-size:10.5px">полный газ = 250 см</text><text x="484" y="310.0" text-anchor="start" class="t" style="font-size:10.5px">газ 0 % = 0 см</text><text x="570.0" y="336.0" text-anchor="middle" class="b" style="font-size:10.5px">Ошибка: nav_max_terrain_follow_alt = 250</text><text x="16" y="214.0" text-anchor="start" class="m t" style="font-size:10.5px">см</text><text x="484" y="167.0" text-anchor="start" class="d t" style="font-size:10.5px">верхние 20 % газа — без дальномера</text></svg>
