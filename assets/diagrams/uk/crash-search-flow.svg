<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Поиск упавшего аппарата</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="34" width="160" height="58" rx="6"/><text x="90.0" y="53.0" text-anchor="middle">1. Дизарм. Пилот:</text><text x="90.0" y="67.0" text-anchor="middle">ориентир вслух,</text><text x="90.0" y="81.0" text-anchor="middle">никто не бежит</text><rect class="box" x="190" y="34" width="160" height="58" rx="6"/><text x="270.0" y="53.0" text-anchor="middle">2. Пульт включён:</text><text x="270.0" y="67.0" text-anchor="middle">координаты,</text><text x="270.0" y="81.0" text-anchor="middle">BEEPER</text><rect class="box" x="370" y="34" width="160" height="58" rx="6"/><text x="450.0" y="60.0" text-anchor="middle">3. DVR: стоп записи,</text><text x="450.0" y="74.0" text-anchor="middle">последние кадры</text><rect class="box" x="550" y="34" width="160" height="58" rx="6"/><text x="630.0" y="60.0" text-anchor="middle">4. Время падения,</text><text x="630.0" y="74.0" text-anchor="middle">остаток АКБ</text><rect class="boxa" x="550" y="134" width="160" height="70" rx="6"/><text x="630.0" y="159.0" text-anchor="middle" class="b">Остання точка:</text><text x="630.0" y="173.0" text-anchor="middle" class="b">телеметрия → OSD</text><text x="630.0" y="187.0" text-anchor="middle" class="b">→ tlog → курс</text><rect class="boxa" x="370" y="134" width="160" height="70" rx="6"/><text x="450.0" y="159.0" text-anchor="middle" class="b">+ инерция v·√(2h/g):</text><text x="450.0" y="173.0" text-anchor="middle" class="b">20 м/с, 30 м ≈ 50 м</text><text x="450.0" y="187.0" text-anchor="middle" class="b">вперёд по курсу</text><rect class="box" x="190" y="134" width="160" height="70" rx="6"/><text x="270.0" y="159.0" text-anchor="middle">Полоса по курсу →</text><text x="270.0" y="173.0" text-anchor="middle">спираль; тишина</text><text x="270.0" y="187.0" text-anchor="middle">10–15 с / 20–30 м</text><rect class="boxa" x="10" y="134" width="160" height="70" rx="6"/><text x="90.0" y="152.0" text-anchor="middle" class="b">Нашли: подход сбоку,</text><text x="90.0" y="166.0" text-anchor="middle" class="b">сразу отключить АКБ;</text><text x="90.0" y="180.0" text-anchor="middle" class="b">нет за 30–40 мин —</text><text x="90.0" y="194.0" text-anchor="middle" class="b">решение старшего</text><path class="ln" d="M170 63.0 L190 63.0" marker-end="url(#ar)"/><path class="ln" d="M350 63.0 L370 63.0" marker-end="url(#ar)"/><path class="ln" d="M530 63.0 L550 63.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 92 L630.0 134" marker-end="url(#ar)"/><path class="lna" d="M550 169.0 L530 169.0" marker-end="url(#ara)"/><path class="lna" d="M370 169.0 L350 169.0" marker-end="url(#ara)"/><path class="ln" d="M190 169.0 L170 169.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">Поиск упавшего аппарата: первая минута → последняя точка → схема поиска</text><text x="10" y="232" text-anchor="start" class="m t">Бюджет АКБ: 6S, 30 % от 1300 мА·ч = 0.39 А·ч × 22 В ≈ 8.6 Вт·ч — с цифровым видео (10 Вт)</text><text x="10" y="248" text-anchor="start" class="m t">≈ 51 мин, только FC + RX + GPS + пищалка (3 Вт) ≈ 2.9 ч; шаг галсов 5–10 м в траве</text></svg>
