<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">EKF ведёт себя плохо: от сообщения к причине</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">EKF ведёт себя плохо: от сообщения к причине</text><rect class="box" x="304.0" y="34" width="112.0" height="50" rx="6"/><text x="360.0" y="57.0" text-anchor="middle" style="font-size:9.5px">Что видно</text><text x="360.0" y="69.0" text-anchor="middle" style="font-size:9.5px">в GCS?</text><path class="ln" d="M360.0 84 L360.0 101.0 L68.3 101.0 L68.3 118" marker-end="url(#ar)"/><text x="72.33333333333334" y="97.0" text-anchor="start" class="a t" style="font-size:10px">PreArm AHRS</text><rect class="box" x="13.0" y="118" width="110.7" height="50" rx="18"/><text x="68.33333333333334" y="135.0" text-anchor="middle" style="font-size:9.5px">строка PreArm:</text><text x="68.33333333333334" y="147.0" text-anchor="middle" style="font-size:9.5px">AHRS_EKF_TYPE,</text><text x="68.33333333333334" y="159.0" text-anchor="middle" style="font-size:9.5px">EK3_ENABLE, GPS</text><path class="ln" d="M360.0 84 L360.0 101.0 L301.7 101.0 L301.7 118" marker-end="url(#ar)"/><text x="305.6666666666667" y="97.0" text-anchor="start" class="a t" style="font-size:10px">EKF variance</text><rect class="boxa" x="245.7" y="118" width="112.0" height="50" rx="6"/><text x="301.6666666666667" y="141.0" text-anchor="middle" class="b" style="font-size:9.5px">XKF4: что</text><text x="301.6666666666667" y="153.0" text-anchor="middle" class="b" style="font-size:9.5px">выше 0.8?</text><path class="ln" d="M301.7 168 L301.7 185.0 L185.0 185.0 L185.0 202" marker-end="url(#ar)"/><text x="189.0" y="181.0" text-anchor="start" class="a t" style="font-size:10px">SM</text><rect class="box" x="129.7" y="202" width="110.7" height="50" rx="18"/><text x="185.0" y="219.0" text-anchor="middle" style="font-size:9.5px">компас: ток,</text><text x="185.0" y="231.0" text-anchor="middle" style="font-size:9.5px">калибровка,</text><text x="185.0" y="243.0" text-anchor="middle" style="font-size:9.5px">YAW 3 или 8</text><path class="ln" d="M301.7 168 L301.7 185.0 L301.7 185.0 L301.7 202" marker-end="url(#ar)"/><text x="305.6666666666667" y="181.0" text-anchor="start" class="a t" style="font-size:10px">SV/SP</text><rect class="box" x="246.3" y="202" width="110.7" height="50" rx="18"/><text x="301.6666666666667" y="219.0" text-anchor="middle" style="font-size:9.5px">GPS: NSats,</text><text x="301.6666666666667" y="231.0" text-anchor="middle" style="font-size:9.5px">HAcc, глитч,</text><text x="301.6666666666667" y="243.0" text-anchor="middle" style="font-size:9.5px">задержка</text><path class="ln" d="M301.7 168 L301.7 185.0 L418.3 185.0 L418.3 202" marker-end="url(#ar)"/><text x="422.3333333333333" y="181.0" text-anchor="start" class="a t" style="font-size:10px">всё ≈ 0</text><rect class="boxa" x="363.0" y="202" width="110.7" height="50" rx="18"/><text x="418.3333333333333" y="219.0" text-anchor="middle" class="b" style="font-size:9.5px">SS без бит 3/4:</text><text x="418.3333333333333" y="231.0" text-anchor="middle" class="b" style="font-size:9.5px">источник позиции</text><text x="418.3333333333333" y="243.0" text-anchor="middle" class="b" style="font-size:9.5px">пропал</text><path class="ln" d="M360.0 84 L360.0 101.0 L535.0 101.0 L535.0 118" marker-end="url(#ar)"/><text x="539.0" y="97.0" text-anchor="start" class="a t" style="font-size:10px">lane switch</text><rect class="box" x="479.7" y="118" width="110.7" height="50" rx="18"/><text x="535.0" y="135.0" text-anchor="middle" style="font-size:9.5px">сравни C=0/1:</text><text x="535.0" y="147.0" text-anchor="middle" style="font-size:9.5px">IMU, вибрации,</text><text x="535.0" y="159.0" text-anchor="middle" style="font-size:9.5px">клиппинг</text><path class="ln" d="M360.0 84 L360.0 101.0 L651.7 101.0 L651.7 118" marker-end="url(#ar)"/><text x="655.6666666666667" y="97.0" text-anchor="start" class="a t" style="font-size:10px">DCM</text><rect class="box" x="596.3" y="118" width="110.7" height="50" rx="18"/><text x="651.6666666666667" y="135.0" text-anchor="middle" style="font-size:9.5px">Plane: EKF3 без</text><text x="651.6666666666667" y="147.0" text-anchor="middle" style="font-size:9.5px">позиции/нездоров;</text><text x="651.6666666666667" y="159.0" text-anchor="middle" style="font-size:9.5px">DCM идёт по GPS</text><text x="16" y="312.0" text-anchor="start" class="m t">Порог FS_EKF_THRESH не поднимать: 0.8 при воротах 500 — это уже 4σ</text><text x="16" y="328.0" text-anchor="start" class="m t">SITL: GPS выключен в Loiter — все вариации 0.01, а Land через 8 с (флаги 0x033f -&gt; 0x0025)</text></svg>
