<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Энергия удара в трёх разобранных авариях</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="20" text-anchor="start" class="b" style="font-size:13px">Энергия удара трёх аварий против порога серьёзной травмы (лог. шкала)</text><line x1="230.0" y1="44" x2="230.0" y2="250" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.5" opacity="0.5"/><text x="230.0" y="264" text-anchor="middle" class="m t">10 Дж</text><line x1="336.2" y1="44" x2="336.2" y2="250" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.5" opacity="0.5"/><text x="336.25" y="264" text-anchor="middle" class="m t">100 Дж</text><line x1="442.5" y1="44" x2="442.5" y2="250" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.5" opacity="0.5"/><text x="442.5" y="264" text-anchor="middle" class="m t">1 000 Дж</text><line x1="548.8" y1="44" x2="548.8" y2="250" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.5" opacity="0.5"/><text x="548.75" y="264" text-anchor="middle" class="m t">10 000 Дж</text><line x1="655.0" y1="44" x2="655.0" y2="250" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.5" opacity="0.5"/><text x="655.0" y="264" text-anchor="middle" class="m t">100 000 Дж</text><text x="220" y="68" text-anchor="end" style="font-size:11.5px">Matternet M2, 2019</text><text x="220" y="84" text-anchor="end" class="m t" style="font-size:10px">без груза; 50 м от детей</text><rect x="230.0" y="58" width="113.9" height="26" rx="3" fill="var(--gc-signal-amber, #f0b24c)" opacity="0.55"/><text x="349.88746327627587" y="76" text-anchor="start" class="t b">118 Дж = 1.5× порога</text><text x="220" y="130" text-anchor="end" style="font-size:11.5px">Freefly Alta X, 2022</text><text x="220" y="146" text-anchor="end" class="m t" style="font-size:10px">28 кг, ≈ 30 м/с; удар в лодку</text><rect x="230.0" y="120" width="333.3" height="26" rx="3" fill="var(--gc-signal-red, #e8636b)" opacity="0.55"/><text x="569.2765602603682" y="138" text-anchor="start" class="t b">13 700 Дж = 171×</text><text x="220" y="192" text-anchor="end" style="font-size:11.5px">Airspeeder Mk II, 2019</text><text x="220" y="208" text-anchor="end" class="m t" style="font-size:10px">95 кг; 40 м от домов</text><rect x="230.0" y="182" width="360.7" height="26" rx="3" fill="var(--gc-signal-red, #e8636b)" opacity="0.55"/><text x="596.6604910877854" y="200" text-anchor="start" class="t b">24 800 Дж = 310×</text><line x1="326.0" y1="40" x2="326.0" y2="250" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 3"/><text x="329.95331111789403" y="36" text-anchor="start" class="t">~80 Дж — порог серьёзной травмы</text><text x="16" y="284" text-anchor="start" class="m t">Пострадавших нет во всех трёх — везение: лёгкий аппарат опасен, тяжёлый смертелен</text></svg>
