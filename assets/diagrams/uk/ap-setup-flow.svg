<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ArduCopter 4.6 с нуля: 17 шагов, где каждый делается</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="12" y="40" width="158" height="46" rx="6"/><text x="91.0" y="60.0" text-anchor="middle">1. Прошивка, .param</text><text x="91.0" y="74.0" text-anchor="middle">стол + SITL</text><rect class="box" x="188" y="40" width="158" height="46" rx="6"/><text x="267.0" y="60.0" text-anchor="middle">2. FRAME_CLASS/TYPE</text><text x="267.0" y="74.0" text-anchor="middle">SITL</text><rect class="box" x="364" y="40" width="158" height="46" rx="6"/><text x="443.0" y="60.0" text-anchor="middle">3. SERIALn_PROTOCOL</text><text x="443.0" y="74.0" text-anchor="middle">SITL</text><rect class="box" x="540" y="40" width="158" height="46" rx="6"/><text x="619.0" y="60.0" text-anchor="middle">4. Приёмник, bind</text><text x="619.0" y="74.0" text-anchor="middle">стол</text><rect class="box" x="540" y="116" width="158" height="46" rx="6"/><text x="619.0" y="136.0" text-anchor="middle">5. Калибровка RC</text><text x="619.0" y="150.0" text-anchor="middle">стол</text><rect class="box" x="364" y="116" width="158" height="46" rx="6"/><text x="443.0" y="136.0" text-anchor="middle">6. MOT_PWM_TYPE</text><text x="443.0" y="150.0" text-anchor="middle">SITL + стол</text><rect class="box" x="188" y="116" width="158" height="46" rx="6"/><text x="267.0" y="136.0" text-anchor="middle">7. Motor Test</text><text x="267.0" y="150.0" text-anchor="middle">SITL + стол</text><rect class="box" x="12" y="116" width="158" height="46" rx="6"/><text x="91.0" y="136.0" text-anchor="middle">8. ESC cal, SPIN_*</text><text x="91.0" y="150.0" text-anchor="middle">стол</text><rect class="box" x="12" y="192" width="158" height="46" rx="6"/><text x="91.0" y="212.0" text-anchor="middle">9. Accel + компас</text><text x="91.0" y="226.0" text-anchor="middle">стол (SITL)</text><rect class="box" x="188" y="192" width="158" height="46" rx="6"/><text x="267.0" y="212.0" text-anchor="middle">10. BATT_VOLT/AMP</text><text x="267.0" y="226.0" text-anchor="middle">SITL + стол</text><rect class="box" x="364" y="192" width="158" height="46" rx="6"/><text x="443.0" y="212.0" text-anchor="middle">11. Режимы, арм</text><text x="443.0" y="226.0" text-anchor="middle">SITL</text><rect class="box" x="540" y="192" width="158" height="46" rx="6"/><text x="619.0" y="212.0" text-anchor="middle">12. FS_THR, BATT_FS</text><text x="619.0" y="226.0" text-anchor="middle">SITL + стол</text><rect class="box" x="540" y="268" width="158" height="46" rx="6"/><text x="619.0" y="288.0" text-anchor="middle">13. OSD_TYPE</text><text x="619.0" y="302.0" text-anchor="middle">стол</text><rect class="box" x="364" y="268" width="158" height="46" rx="6"/><text x="443.0" y="288.0" text-anchor="middle">14. GPS, RTL_ALT</text><text x="443.0" y="302.0" text-anchor="middle">SITL</text><rect class="boxa" x="188" y="268" width="158" height="46" rx="6"/><text x="267.0" y="288.0" text-anchor="middle" class="b">15. Висение S→AH→L</text><text x="267.0" y="302.0" text-anchor="middle" class="b">SITL → поле</text><rect class="boxa" x="12" y="268" width="158" height="46" rx="6"/><text x="91.0" y="288.0" text-anchor="middle" class="b">16. QuikTune/AutoTune</text><text x="91.0" y="302.0" text-anchor="middle" class="b">поле</text><rect class="boxa" x="12" y="344" width="158" height="46" rx="6"/><text x="91.0" y="364.0" text-anchor="middle" class="b">17. Лог + .param</text><text x="91.0" y="378.0" text-anchor="middle" class="b">SITL + поле</text><path class="ln" d="M170 63.0 L188 63.0" marker-end="url(#ar)"/><path class="ln" d="M346 63.0 L364 63.0" marker-end="url(#ar)"/><path class="ln" d="M522 63.0 L540 63.0" marker-end="url(#ar)"/><path class="ln" d="M619.0 86 L619.0 116" marker-end="url(#ar)"/><path class="ln" d="M540 139.0 L522 139.0" marker-end="url(#ar)"/><path class="ln" d="M364 139.0 L346 139.0" marker-end="url(#ar)"/><path class="ln" d="M188 139.0 L170 139.0" marker-end="url(#ar)"/><path class="ln" d="M91.0 162 L91.0 192" marker-end="url(#ar)"/><path class="ln" d="M170 215.0 L188 215.0" marker-end="url(#ar)"/><path class="ln" d="M346 215.0 L364 215.0" marker-end="url(#ar)"/><path class="ln" d="M522 215.0 L540 215.0" marker-end="url(#ar)"/><path class="ln" d="M619.0 238 L619.0 268" marker-end="url(#ar)"/><path class="ln" d="M540 291.0 L522 291.0" marker-end="url(#ar)"/><path class="lna" d="M364 291.0 L346 291.0" marker-end="url(#ara)"/><path class="lna" d="M188 291.0 L170 291.0" marker-end="url(#ara)"/><path class="lna" d="M91.0 314 L91.0 344" marker-end="url(#ara)"/><text x="12" y="406" text-anchor="start" class="m t">Рамка с акцентом — шаги с пропеллерами (поле).</text><text x="12" y="420" text-anchor="start" class="m t">До шага 15 пропы сняты: арм, Motor Test, ESC cal и failsafe — без пропов.</text><text x="12" y="434" text-anchor="start" class="m t">SITL: 1–3, 6, 7, 9–12, 14, 15, 17; bind, RC cal, ESC cal, OSD, тюн — только железо.</text></svg>
