<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">VIO потерял трекинг: что companion шлёт в EKF3 и что EKF с этим делает</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">VIO потерял трекинг: что companion шлёт в EKF3 и что EKF с этим делает</text><rect class="box" x="277.0" y="34" width="166.0" height="58" rx="6"/><text x="360.0" y="61.0" text-anchor="middle" style="font-size:10.5px">VIO потерял трекинг.</text><text x="360.0" y="73.0" text-anchor="middle" style="font-size:10.5px">Что приходит в EKF?</text><path class="ln" d="M360.0 92 L360.0 106.0 L97.5 106.0 L97.5 120" marker-end="url(#ar)"/><rect class="box" x="14.5" y="120" width="166.0" height="58" rx="6"/><text x="97.5" y="147.0" text-anchor="middle" style="font-size:10.5px">Ничего: companion</text><text x="97.5" y="159.0" text-anchor="middle" style="font-size:10.5px">перестал слать</text><path class="ln" d="M97.5 178 L97.5 192.0 L97.5 192.0 L97.5 206" marker-end="url(#ar)"/><rect class="boxa" x="14.5" y="206" width="166.0" height="58" rx="18"/><text x="97.5" y="221.0" text-anchor="middle" class="b" style="font-size:10.5px">Через 300 мс источник</text><text x="97.5" y="233.0" text-anchor="middle" class="b" style="font-size:10.5px">«нездоров»: инерциалка</text><text x="97.5" y="245.0" text-anchor="middle" class="b" style="font-size:10.5px">→ failsafe</text><text x="97.5" y="257.0" text-anchor="middle" class="b" style="font-size:10.5px">(FS_EKF_ACTION)</text><path class="ln" d="M360.0 92 L360.0 106.0 L272.5 106.0 L272.5 120" marker-end="url(#ar)"/><rect class="box" x="189.5" y="120" width="166.0" height="58" rx="6"/><text x="272.5" y="153.0" text-anchor="middle" style="font-size:10.5px">Скачок позы</text><path class="ln" d="M272.5 178 L272.5 192.0 L272.5 192.0 L272.5 206" marker-end="url(#ar)"/><rect class="box" x="189.5" y="206" width="166.0" height="58" rx="18"/><text x="272.5" y="221.0" text-anchor="middle" style="font-size:10.5px">Ворота EK3_POS_I_GATE</text><text x="272.5" y="233.0" text-anchor="middle" style="font-size:10.5px">500 (5σ) отбрасывают;</text><text x="272.5" y="245.0" text-anchor="middle" style="font-size:10.5px">через 7 с (10 с со</text><text x="272.5" y="257.0" text-anchor="middle" style="font-size:10.5px">скоростью) — сброс</text><path class="ln" d="M360.0 92 L360.0 106.0 L447.5 106.0 L447.5 120" marker-end="url(#ar)"/><rect class="box" x="364.5" y="120" width="166.0" height="58" rx="6"/><text x="447.5" y="147.0" text-anchor="middle" style="font-size:10.5px">Замёрзшая поза</text><text x="447.5" y="159.0" text-anchor="middle" style="font-size:10.5px">с прежней частотой</text><path class="ln" d="M447.5 178 L447.5 192.0 L447.5 192.0 L447.5 206" marker-end="url(#ar)"/><rect class="box" x="364.5" y="206" width="166.0" height="58" rx="18"/><text x="447.5" y="221.0" text-anchor="middle" style="font-size:10.5px">Ворота не ловят:</text><text x="447.5" y="233.0" text-anchor="middle" style="font-size:10.5px">инновация мала, EKF</text><text x="447.5" y="245.0" text-anchor="middle" style="font-size:10.5px">«стоит», а аппарат</text><text x="447.5" y="257.0" text-anchor="middle" style="font-size:10.5px">уплывает</text><path class="ln" d="M360.0 92 L360.0 106.0 L622.5 106.0 L622.5 120" marker-end="url(#ar)"/><rect class="box" x="539.5" y="120" width="166.0" height="58" rx="6"/><text x="622.5" y="147.0" text-anchor="middle" style="font-size:10.5px">ODOMETRY, quality</text><text x="622.5" y="159.0" text-anchor="middle" style="font-size:10.5px">&lt; VISO_QUAL_MIN</text><path class="ln" d="M622.5 178 L622.5 192.0 L622.5 192.0 L622.5 206" marker-end="url(#ar)"/><rect class="box" x="539.5" y="206" width="166.0" height="58" rx="18"/><text x="622.5" y="233.0" text-anchor="middle" style="font-size:10.5px">Измерение в EKF</text><text x="622.5" y="245.0" text-anchor="middle" style="font-size:10.5px">не передаётся</text><rect x="364.5" y="206" width="166.0" height="58" rx="18" fill="none" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.8"/><text x="16" y="318.0" text-anchor="start" class="m t">Защита — первая ветка: companion по статусу трекинга перестаёт слать; резерв EK3_SRC2 на GPS</text><text x="16" y="334.0" text-anchor="start" class="m t">и пилот с AltHold на тумблере</text></svg>
