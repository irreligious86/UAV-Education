<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 132" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Кадр MAVLink 2 (12 байт заголовка й CRC + корисне навантаження + підпис)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="16.0" y="28" width="42.8" height="46" rx="3"/><text x="37.39294432567096" y="48" text-anchor="middle" style="font-size:9px">STX 0xFD</text><text x="37.39294432567096" y="64" text-anchor="middle" class="m t" style="font-size:9px">1 байт</text><rect class="box" x="58.8" y="28" width="42.8" height="46" rx="3"/><text x="80.17883297701289" y="48" text-anchor="middle" style="font-size:9px">len</text><text x="80.17883297701289" y="64" text-anchor="middle" class="m t" style="font-size:9px">1 байт</text><rect class="box" x="101.6" y="28" width="42.8" height="46" rx="3"/><text x="122.9647216283548" y="48" text-anchor="middle" style="font-size:9px">incompat</text><text x="122.9647216283548" y="64" text-anchor="middle" class="m t" style="font-size:9px">1 байт</text><line class="lnm" x1="123.0" y1="74" x2="123.0" y2="78"/><text x="122.9647216283548" y="88" text-anchor="middle" class="m t" style="font-size:9.5px">біт 0 — підпис</text><rect class="box" x="144.4" y="28" width="42.8" height="46" rx="3"/><text x="165.75061027969673" y="48" text-anchor="middle" style="font-size:9px">compat</text><text x="165.75061027969673" y="64" text-anchor="middle" class="m t" style="font-size:9px">1 байт</text><rect class="box" x="187.1" y="28" width="42.8" height="46" rx="3"/><text x="208.53649893103864" y="48" text-anchor="middle" style="font-size:9px">seq</text><text x="208.53649893103864" y="64" text-anchor="middle" class="m t" style="font-size:9px">1 байт</text><rect class="boxa" x="229.9" y="28" width="42.8" height="46" rx="3"/><text x="251.32238758238054" y="48" text-anchor="middle" class="b" style="font-size:9px">sysid</text><text x="251.32238758238054" y="64" text-anchor="middle" class="m t" style="font-size:9px">1 байт</text><rect class="boxa" x="272.7" y="28" width="42.8" height="46" rx="3"/><text x="294.10827623372245" y="48" text-anchor="middle" class="b" style="font-size:9px">compid</text><text x="294.10827623372245" y="64" text-anchor="middle" class="m t" style="font-size:9px">1 байт</text><rect class="boxa" x="315.5" y="28" width="42.8" height="46" rx="3"/><text x="336.89416488506436" y="48" text-anchor="middle" class="b" style="font-size:9px">msgid</text><text x="336.89416488506436" y="64" text-anchor="middle" class="m t" style="font-size:9px">3 байт</text><rect class="boxa" x="358.3" y="28" width="247.1" height="46" rx="3"/><text x="481.85126077711425" y="48" text-anchor="middle" class="b" style="font-size:11px">payload</text><text x="481.85126077711425" y="64" text-anchor="middle" class="m t" style="font-size:9px">255 байт</text><line class="lnm" x1="481.9" y1="74" x2="481.9" y2="78"/><text x="481.85126077711425" y="88" text-anchor="middle" class="m t" style="font-size:9.5px">до 255, нулі в кінці обрізаються</text><rect class="box" x="605.4" y="28" width="42.8" height="46" rx="3"/><text x="626.8083566691641" y="48" text-anchor="middle" style="font-size:9px">CRC16</text><text x="626.8083566691641" y="64" text-anchor="middle" class="m t" style="font-size:9px">2 байт</text><line class="lnm" x1="626.8" y1="74" x2="626.8" y2="92"/><text x="626.8083566691641" y="102" text-anchor="middle" class="m t" style="font-size:9.5px">+ CRC_EXTRA</text><rect class="box" x="648.2" y="28" width="55.8" height="46" rx="3"/><text x="676.1006504974175" y="48" text-anchor="middle" style="font-size:9px">signature</text><text x="676.1006504974175" y="64" text-anchor="middle" class="m t" style="font-size:9px">13 байт</text><line class="lnm" x1="676.1" y1="74" x2="676.1" y2="78"/><text x="676.1006504974175" y="88" text-anchor="end" class="m t" style="font-size:9.5px">опційно</text><text x="16" y="16" text-anchor="start" class="m t">Кадр MAVLink 2 (12 байт заголовка й CRC + корисне навантаження + підпис)</text><text x="16" y="124" text-anchor="start" class="m t">CRC — MCRF4XX за кадром без STX, плюс CRC_EXTRA байт повідомлення з XML</text></svg>
