<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Изменение конфига через git: до, после, одна строка</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="34" width="160" height="48" rx="6"/><text x="90.0" y="55.0" text-anchor="middle">Файл «до»:</text><text x="90.0" y="69.0" text-anchor="middle">diff all или .param</text><rect class="box" x="190" y="34" width="160" height="48" rx="6"/><text x="270.0" y="55.0" text-anchor="middle">configs/ГГГГ-ММ-ДД_</text><text x="270.0" y="69.0" text-anchor="middle">имя_плата_diff.txt</text><rect class="box" x="370" y="34" width="160" height="48" rx="6"/><text x="450.0" y="55.0" text-anchor="middle">git commit</text><text x="450.0" y="69.0" text-anchor="middle">«имя: baseline дата»</text><rect class="box" x="550" y="34" width="160" height="48" rx="6"/><text x="630.0" y="55.0" text-anchor="middle">Одно изменение →</text><text x="630.0" y="69.0" text-anchor="middle">новый файл «после»</text><rect class="boxa" x="550" y="126" width="160" height="56" rx="6"/><text x="630.0" y="144.0" text-anchor="middle" class="b">git diff: ровно</text><text x="630.0" y="158.0" text-anchor="middle" class="b">одна строка — та,</text><text x="630.0" y="172.0" text-anchor="middle" class="b">что менял?</text><rect class="boxa" x="190" y="126" width="300" height="56" rx="6"/><text x="340.0" y="144.0" text-anchor="middle" class="b">git commit с «зачем»:</text><text x="340.0" y="158.0" text-anchor="middle" class="b">«rpm_filter_min_hz 100→50:</text><text x="340.0" y="172.0" text-anchor="middle" class="b">моторы 10&quot; ниже 100 Гц»</text><text x="340.0" y="195" text-anchor="middle" class="m t">следующее изменение — снова с файла «после»</text><rect class="box" x="190" y="230" width="520" height="60" rx="6"/><text x="450.0" y="250.0" text-anchor="middle">Строк больше: другая версия прошивки, сброс к умолчаниям,</text><text x="450.0" y="264.0" text-anchor="middle">чужие правки — разобраться до полёта; сотни строк — dump,</text><text x="450.0" y="278.0" text-anchor="middle">а не diff all; после обновления прошивки — новый baseline</text><path class="ln" d="M170 58.0 L190 58.0" marker-end="url(#ar)"/><path class="ln" d="M350 58.0 L370 58.0" marker-end="url(#ar)"/><path class="ln" d="M530 58.0 L550 58.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 82 L630.0 126" marker-end="url(#ar)"/><path class="lna" d="M550 154.0 L490 154.0" marker-end="url(#ara)"/><text x="520.0" y="147.0" text-anchor="middle" class="m t" style="font-size:10px">так</text><path class="ln" d="M630.0 182 L630.0 206.0 L450.0 206.0 L450.0 230" marker-end="url(#ar)"/><text x="546.0" y="202.0" text-anchor="middle" class="m t" style="font-size:10px">ні</text><text x="10" y="20" text-anchor="start" class="m t">Правило инструментов: конфиг «до» и «после» — в git, разница видна одной строкой</text></svg>
