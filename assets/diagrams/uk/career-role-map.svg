<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 458" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Карта ролей: роли и треки курса</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Роли отрасли и треки курса: ● основной трек, ○ поддерживающий</text><text x="216" y="102" transform="rotate(-40 216 102)" text-anchor="start" class="t">Фундамент</text><text x="268" y="102" transform="rotate(-40 268 102)" text-anchor="start" class="t">Оператор</text><text x="320" y="102" transform="rotate(-40 320 102)" text-anchor="start" class="t">Электроника</text><text x="372" y="102" transform="rotate(-40 372 102)" text-anchor="start" class="t">Конструктор</text><text x="424" y="102" transform="rotate(-40 424 102)" text-anchor="start" class="t">Интегратор</text><text x="476" y="102" transform="rotate(-40 476 102)" text-a