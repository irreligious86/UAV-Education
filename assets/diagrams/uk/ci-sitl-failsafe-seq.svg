<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">SITL-автотест в CI: падает, если failsafe сломан (2–4 мин)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">SITL-автотест в CI: падает, если failsafe сломан (2–4 мин)</text><rect class="box" x="20.0" y="26" width="120" height="26" rx="5"/><text x="80.0" y="43" text-anchor="middle" class="b" style="font-size:11px">sitl_test.py</text><line class="lnm" x1="80.0" y1="52" x2="80.0" y2="380"/><rect class="box" x="410.0" y="26" width="120" height="26" rx="5"/><text x="470.0" y="43" text-anchor="middle" class="b" style="font-size:11px">SITL ArduCopter</text><line class="lnm" x1="470.0" y1="52" x2="470.0" y2="380"/><text x="275.0" y="78" text-anchor="middle" class="w t" style="font-size:10px">— sim_vehicle.py --add-param-file params.param —</text><path class="ln" d="M80.0 104 L466.0 104" marker-end="url(#ar)"/><text x="275.0" y="99" text-anchor="middle" class="t" style="font-size:10px">режим GUIDED, арм (COMMAND_LONG)</text><path class="ln" style="stroke-dasharray:5 4" d="M470.0 134 L84.0 134" marker-end="url(#ar)"/><text x="275.0" y="129" text-anchor="middle" class="t" style="font-size:10px">COMMAND_ACK ACCEPTED</text><path class="ln" d="M80.0 164 L466.0 164" marker-end="url(#ar)"/><text x="275.0" y="159" text-anchor="middle" class="t" style="font-size:10px">взлёт на 10 м (MAV_CMD_NAV_TAKEOFF)</text><path class="ln" style="stroke-dasharray:5 4" d="M470.0 194 L84.0 194" marker-end="url(#ar)"/><text x="275.0" y="189" text-anchor="middle" class="t" style="font-size:10px">GLOBAL_POSITION_INT: 10 м</text><path class="lna" d="M80.0 224 L466.0 224" marker-end="url(#ara)"/><text x="275.0" y="219" text-anchor="middle" class="a t" style="font-size:10px">PARAM_SET SIM_RC_FAIL = 1 — пульт «пропал»</text><path class="lna" style="stroke-dasharray:5 4" d="M470.0 254 L84.0 254" marker-end="url(#ara)"/><text x="275.0" y="249" text-anchor="middle" class="a t" style="font-size:10px">HEARTBEAT: режим RTL или LAND за ≤ 5 с</text><text x="275.0" y="288" text-anchor="middle" class="w t" style="font-size:10px">— отдельный прогон: SIM_RC_FAIL = 0 —</text><path class="ln" d="M80.0 314 L466.0 314" marker-end="url(#ar)"/><text x="275.0" y="309" text-anchor="middle" class="t" style="font-size:10px">миссия из 4 точек, AUTO</text><path class="ln" style="stroke-dasharray:5 4" d="M470.0 344 L84.0 344" marker-end="url(#ar)"/><text x="275.0" y="339" text-anchor="middle" class="t" style="font-size:10px">все 4 точки достигнуты</text><text x="704" y="138" text-anchor="end" class="m t" style="font-size:10px">assert арм</text><text x="704" y="198" text-anchor="end" class="m t" style="font-size:10px">assert высота</text><text x="704" y="258" text-anchor="end" class="m t" style="font-size:10px">assert: нет → CI красный</text><text x="704" y="348" text-anchor="end" class="m t" style="font-size:10px">assert: миссия пройдена</text><text x="16" y="406.0" text-anchor="start" class="m t">Сломан failsafe (FS_THR_ENABLE = 0 или параметр переименован) → режим за 5 с</text><text x="16" y="422.0" text-anchor="start" class="m t">не сменился → assert падает → CI красный, PR не сливается</text></svg>
