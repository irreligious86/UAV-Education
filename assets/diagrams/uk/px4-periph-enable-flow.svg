<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">PX4: подключение периферии — параметр → перезагрузка → проверка</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="170" height="58" rx="6"/><text x="95.0" y="59.0" text-anchor="middle" class="b">UART: порт</text><text x="95.0" y="73.0" text-anchor="middle" class="b">&lt;DRIVER&gt;_CONFIG / _CFG</text><text x="95.0" y="87.0" text-anchor="middle" class="b">+ SER_&lt;порт&gt;_BAUD</text><rect class="boxa" x="10" y="112" width="170" height="46" rx="6"/><text x="95.0" y="132.0" text-anchor="middle" class="b">I²C / SPI:</text><text x="95.0" y="146.0" text-anchor="middle" class="b">SENS_EN_&lt;датчик&gt; = 1…</text><rect class="boxa" x="10" y="172" width="170" height="58" rx="6"/><text x="95.0" y="191.0" text-anchor="middle" class="b">DroneCAN:</text><text x="95.0" y="205.0" text-anchor="middle" class="b">UAVCAN_ENABLE ≥ 1,</text><text x="95.0" y="219.0" text-anchor="middle" class="b">UAVCAN_SUB_&lt;тип&gt;</text><rect class="box" x="214" y="112" width="118" height="46" rx="6"/><text x="273.0" y="132.0" text-anchor="middle" style="font-size:10.5px">Перезагрузка</text><text x="273.0" y="146.0" text-anchor="middle" style="font-size:10.5px">(reboot_required)</text><rect class="box" x="366" y="106" width="150" height="58" rx="6"/><text x="441.0" y="125.0" text-anchor="middle">rc.serial, rc.sensors,</text><text x="441.0" y="139.0" text-anchor="middle">rcS: uavcan start</text><text x="441.0" y="153.0" text-anchor="middle">→ драйвер запущен</text><rect class="box" x="556" y="40" width="152" height="46" rx="6"/><text x="632.0" y="60.0" text-anchor="middle">&lt;driver&gt; status,</text><text x="632.0" y="74.0" text-anchor="middle">dmesg</text><rect class="box" x="556" y="112" width="152" height="46" rx="6"/><text x="632.0" y="132.0" text-anchor="middle">listener &lt;топик&gt;,</text><text x="632.0" y="146.0" text-anchor="middle">uorb top</text><rect class="box" x="556" y="172" width="152" height="58" rx="6"/><text x="632.0" y="191.0" text-anchor="middle">SYS_HAS_NUM_DIST,</text><text x="632.0" y="205.0" text-anchor="middle">SYS_HAS_NUM_ASPD</text><text x="632.0" y="219.0" text-anchor="middle">→ preflight</text><path class="ln" d="M180 69.0 L197.0 69.0 L197.0 135.0 L214 135.0" marker-end="url(#ar)"/><path class="ln" d="M180 135.0 L214 135.0" marker-end="url(#ar)"/><path class="ln" d="M180 201.0 L197.0 201.0 L197.0 135.0 L214 135.0" marker-end="url(#ar)"/><path class="lna" d="M332 135.0 L366 135.0" marker-end="url(#ara)"/><path class="ln" d="M516 135.0 L536.0 135.0 L536.0 63.0 L556 63.0" marker-end="url(#ar)"/><path class="ln" d="M516 135.0 L556 135.0" marker-end="url(#ar)"/><path class="ln" d="M516 135.0 L536.0 135.0 L536.0 201.0 L556 201.0" marker-end="url(#ar)"/><text x="10" y="252" text-anchor="start" class="m t">Параметр только разрешает запуск: драйвер стартует скриптом при загрузке, поэтому без перезагрузки ничего не появится.</text><text x="10" y="267" text-anchor="start" class="m t">Проверка в два шага: драйвер жив (status) и данные идут (listener: sensor_gps, distance_sensor, differential_pressure).</text></svg>
