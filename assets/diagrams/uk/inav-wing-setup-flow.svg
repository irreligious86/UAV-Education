<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">INAV-крыло с нуля: 17 шагов, где их делать</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="14" width="160" height="44" rx="6"/><text x="90.0" y="33.0" text-anchor="middle" class="b">1. Прошивка, бэкап</text><text x="90.0" y="47.0" text-anchor="middle" class="b">SITL + USB</text><rect class="boxa" x="190" y="14" width="160" height="44" rx="6"/><text x="270.0" y="33.0" text-anchor="middle" class="b">2. Платформа, миксер</text><text x="270.0" y="47.0" text-anchor="middle" class="b">SITL</text><rect class="boxa" x="370" y="14" width="160" height="44" rx="6"/><text x="450.0" y="33.0" text-anchor="middle" class="b">3. Порты UART</text><text x="450.0" y="47.0" text-anchor="middle" class="b">SITL</text><rect class="box" x="550" y="14" width="160" height="44" rx="6"/><text x="630.0" y="33.0" text-anchor="middle">4–5. Приёмник, RC</text><text x="630.0" y="47.0" text-anchor="middle">стол</text><rect class="box" x="550" y="86" width="160" height="44" rx="6"/><text x="630.0" y="105.0" text-anchor="middle">6–8. Мотор, ESC</text><text x="630.0" y="119.0" text-anchor="middle">стол, без пропа</text><rect class="box" x="370" y="86" width="160" height="44" rx="6"/><text x="450.0" y="105.0" text-anchor="middle">7б. Сервы: реверс,</text><text x="450.0" y="119.0" text-anchor="middle">центр, расходы — стол</text><rect class="box" x="190" y="86" width="160" height="44" rx="6"/><text x="270.0" y="105.0" text-anchor="middle">9. Акселер., ЦТ</text><text x="270.0" y="119.0" text-anchor="middle">стол</text><rect class="box" x="10" y="86" width="160" height="44" rx="6"/><text x="90.0" y="105.0" text-anchor="middle">10. Батарея V / мА·ч</text><text x="90.0" y="119.0" text-anchor="middle">стол + поле</text><rect class="boxa" x="10" y="158" width="160" height="44" rx="6"/><text x="90.0" y="177.0" text-anchor="middle" class="b">11. Режимы, арм</text><text x="90.0" y="191.0" text-anchor="middle" class="b">SITL</text><rect class="boxa" x="190" y="158" width="160" height="44" rx="6"/><text x="270.0" y="177.0" text-anchor="middle" class="b">12. Failsafe</text><text x="270.0" y="191.0" text-anchor="middle" class="b">SITL, затем стол</text><rect class="boxa" x="370" y="158" width="160" height="44" rx="6"/><text x="450.0" y="177.0" text-anchor="middle" class="b">13–14. OSD, GPS, RTH</text><text x="450.0" y="191.0" text-anchor="middle" class="b">SITL (RF/X-Plane)</text><rect class="box" x="550" y="158" width="160" height="44" rx="6"/><text x="630.0" y="177.0" text-anchor="middle">15. Предполётка,</text><text x="630.0" y="191.0" text-anchor="middle">бросок — поле</text><rect class="box" x="550" y="230" width="160" height="44" rx="6"/><text x="630.0" y="249.0" text-anchor="middle">16. Autotrim,</text><text x="630.0" y="263.0" text-anchor="middle">autotune — поле</text><rect class="boxa" x="370" y="230" width="160" height="44" rx="6"/><text x="450.0" y="249.0" text-anchor="middle" class="b">17. Лог + diff all</text><text x="450.0" y="263.0" text-anchor="middle" class="b">SITL + поле</text><path class="ln" d="M170 36.0 L190 36.0" marker-end="url(#ar)"/><path class="ln" d="M350 36.0 L370 36.0" marker-end="url(#ar)"/><path class="ln" d="M530 36.0 L550 36.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 58 L630.0 86" marker-end="url(#ar)"/><path class="ln" d="M550 108.0 L530 108.0" marker-end="url(#ar)"/><path class="ln" d="M370 108.0 L350 108.0" marker-end="url(#ar)"/><path class="ln" d="M190 108.0 L170 108.0" marker-end="url(#ar)"/><path class="ln" d="M90.0 130 L90.0 158" marker-end="url(#ar)"/><path class="ln" d="M170 180.0 L190 180.0" marker-end="url(#ar)"/><path class="ln" d="M350 180.0 L370 180.0" marker-end="url(#ar)"/><path class="lna" d="M530 180.0 L550 180.0" marker-end="url(#ara)"/><path class="ln" d="M630.0 202 L630.0 230" marker-end="url(#ar)"/><path class="ln" d="M550 252.0 L530 252.0" marker-end="url(#ar)"/><text x="10" y="296" text-anchor="start" class="m t">Акцентная рамка — шаг можно пройти в SITL; обычная — только на железе.</text><text x="10" y="311" text-anchor="start" class="w t">Проп ставится только на шаге 15, после теста failsafe и направлений рулей.</text></svg>
