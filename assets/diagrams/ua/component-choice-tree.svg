<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 204" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Підбір силової установки</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Підбір силової установки</text><rect class="box" x="285.0" y="34" width="150.0" height="40" rx="6"/><text x="360.0" y="52.0" text-anchor="middle" style="font-size:10.5px">Задача → маса,</text><text x="360.0" y="64.0" text-anchor="middle" style="font-size:10.5px">T/W, час</text><path class="ln" d="M360.0 74 L360.0 94.0 L97.5 94.0 L97.5 114" marker-end="url(#ar)"/><text x="101.5" y="90.0" text-anchor="start" class="a t" style="font-size:10px">фристайл 5&quot;</text><rect class="box" x="22.5" y="114" width="150.0" height="40" rx="18"/><text x="97.5" y="132.0" text-anchor="middle" style="font-size:10.5px">T/W ≥ 5</text><text x="97.5" y="144.0" text-anchor="middle" style="font-size:10.5px">2207 1700–2300KV 6S</text><path class="ln" d="M360.0 74 L360.0 94.0 L272.5 94.0 L272.5 114" marker-end="url(#ar)"/><text x="276.5" y="90.0" text-anchor="start" class="a t" style="font-size:10px">long range 7&quot;</text><rect class="box" x="197.5" y="114" width="150.0" height="40" rx="18"/><text x="272.5" y="132.0" text-anchor="middle" style="font-size:10.5px">T/W 3–4</text><text x="272.5" y="144.0" text-anchor="middle" style="font-size:10.5px">2806.5 1300KV, Li-Ion</text><path class="ln" d="M360.0 74 L360.0 94.0 L447.5 94.0 L447.5 114" marker-end="url(#ar)"/><text x="451.5" y="90.0" text-anchor="start" class="a t" style="font-size:10px">вантажний 10–15&quot;</text><rect class="boxa" x="372.5" y="114" width="150.0" height="40" rx="18"/><text x="447.5" y="132.0" text-anchor="middle" class="b" style="font-size:10.5px">T/W 2–2.5</text><text x="447.5" y="144.0" text-anchor="middle" class="b" style="font-size:10.5px">4008 380KV, X8, Li-Ion</text><path class="ln" d="M360.0 74 L360.0 94.0 L622.5 94.0 L622.5 114" marker-end="url(#ar)"/><text x="626.5" y="90.0" text-anchor="start" class="a t" style="font-size:10px">крило</text><rect class="box" x="547.5" y="114" width="150.0" height="40" rx="18"/><text x="622.5" y="132.0" text-anchor="middle" style="font-size:10.5px">за V_s і крейсером</text><text x="622.5" y="144.0" text-anchor="middle" style="font-size:10.5px">тяга 0.4–0.6 ваги</text></svg>
