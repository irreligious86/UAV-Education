ий потік</text><text x="126.66666666666667" y="134.0" text-anchor="middle" style="font-size:10.5px">+ далекомір</text><path class="ln" d="M126.7 144 L126.7 159.0 L126.7 159.0 L126.7 174" marker-end="url(#ar)"/><rect class="box" x="51.7" y="174" width="150.0" height="40" rx="18"/><text x="126.66666666666667" y="192.0" text-anchor="middle" style="font-size:10.5px">OPTICAL_FLOW</text><text x="126.66666666666667" y="204.0" text-anchor="middle" style="font-size:10.5px">EK3_SRC*_VELXY=5</text><path class="ln" d="M360.0 74 L360.0 89.0 L360.0 89.0 L360.0 104" marker-end="url(#ar)"/><text x="364.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">поза</text><rect class="boxa" x="285.0" y="104" width="150.0" height="40" rx="6"/><text x="360.0" y="122.0" text-anchor="middle" class="b" style="font-size:10.5px">VIO</text><text x="360.0" y="134.0" text-anchor="middle" class="b" style="font-size:10.5px">камера + IMU</text><path class="ln" d="M360.0 144 L360.0 159.0 L360.0 159.0 L360.0 174" marker-end="url(#ar)"/><rect class="box" x="285.0" y="174" width="150.0" height="40" rx="18"/><text x="360.0" y="192.0" text-anchor="middle" style="font-size:10.5px">ODOMETRY /</text><text x="360.0" y="204.0" text-anchor="middle" style="font-size:10.5px">VISION_POSITION_*</text><path class="ln" d="M360.0 74 L360.0 89.0 L593.3 89.0 L593.3 104" marker-end="url(#ar)"/><text x="597.3333333333334" y="85.0" text-anchor="start" class="a t" style="font-size:10px">поза + карта</text><rect class="box" x="518.3" y="104" width="150.0" height="40" rx="6"/><text x="593.3333333333334" y="122.0" text-anchor="middle" style="font-size:10.5px">SLAM</text><text x="593.3333333333334" y="134.0" text-anchor="middle" style="font-size:10.5px">замикання петель</text><path class="ln" d="M593.3 144 L593.3 159.0 L593.3 159.0 L593.3 174" marker-end="url(#ar)"/><rect class="box" x="518.3" y="174" width="150.0" height="40" rx="18"/><text x="593.3333333333334" y="192.0" text-anchor="middle" style="font-size:10.5p