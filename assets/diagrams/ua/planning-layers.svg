<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Шари навігації: від карти до уставок</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="30" width="170" height="44" rx="6"/><text x="95.0" y="49.0" text-anchor="middle">Лідар / глибина</text><text x="95.0" y="63.0" text-anchor="middle">OBSTACLE_DISTANCE</text><rect class="box" x="250" y="30" width="170" height="44" rx="6"/><text x="335.0" y="49.0" text-anchor="middle">Сітка зайнятості</text><text x="335.0" y="63.0" text-anchor="middle">+ роздування</text><rect class="boxa" x="490" y="30" width="190" height="44" rx="6"/><text x="585.0" y="49.0" text-anchor="middle" class="b">Глобальний план</text><text x="585.0" y="63.0" text-anchor="middle" class="b">A*, 1 Гц</text><rect class="box" x="490" y="120" width="190" height="44" rx="6"/