<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Lifecycle-вузол ROS 2: явні стани й переходи</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="140" height="44" rx="6"/><text x="80.0" y="66.0" text-anchor="middle">unconfigured</text><rect class="box" x="210" y="40" width="170" height="44" rx="6"/><text x="295.0" y="59.0" text-anchor="middle">inactive</text><text x="295.0" y="73.0" text-anchor="middle">налаштовано, не працює</text><rect class="boxa" x="450" y="40" width="190" height="44" rx="6"/><text x="545.0" y="59.0" text-anchor="middle" class="b">active</text><text x="545.0" y="73.0" text-anchor="middle" class="b">публікує, обробляє</text><rect class="box" x="450" y="140" width="190" height="44" rx="6"/><text x="545.0" y="166.0" text-anchor="middle">finalized</text><path class="ln" d="M150 71.0 L210 71.0" marker-end="url(#ar)"/><text x="180.0" y="64.0" text-anchor="middle" class="m t" style="font-size:10px">configure</text><path class="lna" d="M380 71.0 L450 71.0" marker-end="url(#ara)"/><text x="415.0" y="64.0" text-anchor="middle" class="m t" style="font-size:10px">activate</text><path class="ln" d="M450 71.0 L380 71.0" marker-end="url(#ar)"/><text x="415.0" y="84.0" text-anchor="middle" class="m t" style="font-size:10px">deactivate</text><path class="ln" d="M210 71.0 L150 71.0" marker-end="url(#ar)"/><text x="180.0" y="84.0" text-anchor="middle" class="m t" style="font-size:10px">cleanup</text><path class="ln" d="M545.0 84 L545.0 140" marker-end="url(#ar)"/><text x="551.0" y="108.0" text-anchor="middle" class="m t" style="font-size:10px">shutdown</text><text x="10" y="215" text-anchor="start" class="m t">configure: відкрити камеру, завантажити модель — помилку видно до зльоту;</text><text x="10" y="231" text-anchor="start" class="m t">deactivate: пауза без убивства процесу (сприйняття на посадці).</text></svg>
