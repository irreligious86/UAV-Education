<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Канал Jetson ↔ PX4: на одном порту — один протокол</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Канал Jetson ↔ PX4: на одном порту — один протокол</text><rect class="box" x="275.0" y="34" width="170.0" height="48" rx="6"/><text x="360.0" y="56.0" text-anchor="middle" style="font-size:10.5px">Jetson ↔ PX4 1.17:</text><text x="360.0" y="68.0" text-anchor="middle" style="font-size:10.5px">какой канал?</text><path class="ln" d="M360.0 82 L360.0 97.0 L97.5 97.0 L97.5 112" marker-end="url(#ar)"/><text x="101.5" y="93.0" text-anchor="start" class="a t" style="font-size:10px">есть Ethernet (6X)</text><rect class="box" x="13.0" y="112" width="169.0" height="48" rx="6"/><text x="97.5" y="134.0" text-anchor="middle" style="font-size:10.5px">UDP: MAV_2_CONFIG = 1000,</text><text x="97.5" y="146.0" text-anchor="middle" style="font-size:10.5px">UXRCE_DDS_CFG = 1000</text><path class="ln" d="M97.5 160 L97.5 175.0 L97.5 175.0 L97.5 190" marker-end="url(#ar)"/><rect class="boxa" x="13.0" y="190" width="169.0" height="48" rx="18"/><text x="97.5" y="212.0" text-anchor="middle" class="b" style="font-size:10.5px">UXRCE_DDS_AG_IP =</text><text x="97.5" y="224.0" text-anchor="middle" class="b" style="font-size:10.5px">IP как int32</text><path class="ln" d="M360.0 82 L360.0 97.0 L447.5 97.0 L447.5 112" marker-end="url(#ar)"/><text x="451.5" y="93.0" text-anchor="start" class="a t" style="font-size:10px">только UART</text><rect class="box" x="362.5" y="112" width="170.0" height="48" rx="6"/><text x="447.5" y="134.0" text-anchor="middle" style="font-size:10.5px">нужны ROS 2 и</text><text x="447.5" y="146.0" text-anchor="middle" style="font-size:10.5px">топики /fmu/*?</text><path class="ln" d="M447.5 160 L447.5 175.0 L272.5 175.0 L272.5 190" marker-end="url(#ar)"/><text x="276.5" y="171.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="188.0" y="190" width="169.0" height="48" rx="6"/><text x="272.5" y="206.0" text-anchor="middle" style="font-size:10.5px">uXRCE-DDS, TELEM2:</text><text x="272.5" y="218.0" text-anchor="middle" style="font-size:10.5px">все топики = 117 %</text><text x="272.5" y="230.0" text-anchor="middle" style="font-size:10.5px">от 921600</text><path class="ln" d="M272.5 238 L272.5 253.0 L272.5 253.0 L272.5 268" marker-end="url(#ar)"/><rect class="boxa" x="188.0" y="268" width="169.0" height="48" rx="18"/><text x="272.5" y="290.0" text-anchor="middle" class="b" style="font-size:10.5px">3 Мбод (36 %) или</text><text x="272.5" y="302.0" text-anchor="middle" class="b" style="font-size:10.5px">смотреть Payload tx</text><path class="ln" d="M447.5 160 L447.5 175.0 L447.5 175.0 L447.5 190" marker-end="url(#ar)"/><text x="451.5" y="171.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="363.0" y="190" width="169.0" height="48" rx="18"/><text x="447.5" y="206.0" text-anchor="middle" style="font-size:10.5px">MAVLink, TELEM2:</text><text x="447.5" y="218.0" text-anchor="middle" style="font-size:10.5px">MAV_1_CONFIG = 102,</text><text x="447.5" y="230.0" text-anchor="middle" style="font-size:10.5px">Onboard, 46080 B/s</text><path class="ln" d="M447.5 160 L447.5 175.0 L622.5 175.0 L622.5 190" marker-end="url(#ar)"/><text x="626.5" y="171.0" text-anchor="start" class="a t" style="font-size:10px">оба</text><rect class="box" x="538.0" y="190" width="169.0" height="48" rx="18"/><text x="622.5" y="206.0" text-anchor="middle" style="font-size:10.5px">MAVLink — TELEM1/</text><text x="622.5" y="218.0" text-anchor="middle" style="font-size:10.5px">USB/ETH, DDS —</text><text x="622.5" y="230.0" text-anchor="middle" style="font-size:10.5px">TELEM2</text></svg>
