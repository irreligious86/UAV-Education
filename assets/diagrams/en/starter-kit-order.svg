<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Buying order: from long-lived to consumables</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="8" y="56" width="124" height="48" rx="6"/><text x="70.0" y="77.0" text-anchor="middle" class="b" style="font-size:10.5px">1. EdgeTX radio</text><text x="70.0" y="91.0" text-anchor="middle" class="b" style="font-size:10.5px">+ ELRS 2.4 GHz</text><text x="70.0" y="117" text-anchor="middle" class="m t">outlives everything</text><rect class="box" x="152" y="56" width="124" height="48" rx="6"/><text x="214.0" y="77.0" text-anchor="middle" style="font-size:10.5px">2. Simulator</text><text x="214.0" y="91.0" text-anchor="middle" style="font-size:10.5px">5–10 h in acro</text><text x="214.0" y="117" text-anchor="middle" class="m t">radio over USB</text><rect class="boxa" x="296" y="56" width="124" height="48" rx="6"/><text x="358.0" y="77.0" text-anchor="middle" class="b" style="font-size:10.5px">3. Video system</text><text x="358.0" y="91.0" text-anchor="middle" class="b" style="font-size:10.5px">and goggles</text><text x="358.0" y="117" text-anchor="middle" class="m t">ecosystem lock-in</text><rect class="box" x="440" y="56" width="124" height="48" rx="6"/><text x="502.0" y="77.0" text-anchor="middle" style="font-size:10.5px">4. Aircraft</text><text x="502.0" y="91.0" text-anchor="middle" style="font-size:10.5px">BNF for your goggles</text><text x="502.0" y="117" text-anchor="middle" class="m t">consumable</text><rect class="box" x="584" y="56" width="124" height="48" rx="6"/><text x="646.0" y="77.0" text-anchor="middle" style="font-size:10.5px">5. Batteries, charger,</text><text x="646.0" y="91.0" text-anchor="middle" style="font-size:10.5px">tools</text><text x="646.0" y="117" text-anchor="middle" class="m t">for the aircraft class</text><path class="ln" d="M132 80.0 L152 80.0" marker-end="url(#ar)"/><path class="ln" d="M276 80.0 L296 80.0" marker-end="url(#ar)"/><path class="lna" d="M420 80.0 L440 80.0" marker-end="url(#ara)"/><path class="ln" d="M564 80.0 L584 80.0" marker-end="url(#ar)"/><text x="8" y="150" text-anchor="start" class="m t">Goggles are chosen before the aircraft: the aircraft&#x27;s VTX must match the goggles&#x27; system.</text></svg>
