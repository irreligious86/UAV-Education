<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">“No OSD in the goggles”: the checks in the order the firmware makes them</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">“No OSD in the goggles”: the checks in the order the firmware makes them</text><rect class="box" x="280.0" y="34" width="160.0" height="40" rx="6"/><text x="360.0" y="52.0" text-anchor="middle" style="font-size:10.5px">Video yes,</text><text x="360.0" y="64.0" text-anchor="middle" style="font-size:10.5px">no OSD</text><path class="ln" d="M360.0 74 L360.0 90.0 L97.5 90.0 L97.5 106" marker-end="url(#ar)"/><text x="101.5" y="86.0" text-anchor="start" class="a t" style="font-size:10px">mask not 131073</text><rect class="boxa" x="17.5" y="106" width="160.0" height="40" rx="18"/><text x="97.5" y="124.0" text-anchor="middle" class="b" style="font-size:10.5px">Ports: VTX (MSP +</text><text x="97.5" y="136.0" text-anchor="middle" class="b" style="font-size:10.5px">DisplayPort), 115200</text><path class="ln" d="M360.0 74 L360.0 90.0 L447.5 90.0 L447.5 106" marker-end="url(#ar)"/><text x="451.5" y="86.0" text-anchor="start" class="a t" style="font-size:10px">mask 131073</text><rect class="box" x="367.5" y="106" width="160.0" height="40" rx="6"/><text x="447.5" y="124.0" text-anchor="middle" style="font-size:10.5px">vcd_video_system = HD,</text><text x="447.5" y="136.0" text-anchor="middle" style="font-size:10.5px">feature OSD?</text><path class="ln" d="M447.5 146 L447.5 162.0 L272.5 162.0 L272.5 178" marker-end="url(#ar)"/><text x="276.5" y="158.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="boxa" x="192.5" y="178" width="160.0" height="40" rx="18"/><text x="272.5" y="196.0" text-anchor="middle" class="b" style="font-size:10.5px">set vcd_video_system</text><text x="272.5" y="208.0" text-anchor="middle" class="b" style="font-size:10.5px">= HD, OSD on</text><path class="ln" d="M447.5 146 L447.5 162.0 L535.0 162.0 L535.0 178" marker-end="url(#ar)"/><text x="539.0" y="158.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="455.0" y="178" width="160.0" height="40" rx="6"/><text x="535.0" y="196.0" text-anchor="middle" style="font-size:10.5px">Does the module answer over MSP?</text><text x="535.0" y="208.0" text-anchor="middle" style="font-size:10.5px">LED, vtx_info, canvas</text><path class="ln" d="M535.0 218 L535.0 234.0 L447.5 234.0 L447.5 250" marker-end="url(#ar)"/><text x="451.5" y="230.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="boxa" x="367.5" y="250" width="160.0" height="40" rx="18"/><text x="447.5" y="268.0" text-anchor="middle" class="b" style="font-size:10.5px">TX↔RX crossed, GND,</text><text x="447.5" y="280.0" text-anchor="middle" class="b" style="font-size:10.5px">not SoftSerial</text><path class="ln" d="M535.0 218 L535.0 234.0 L622.5 234.0 L622.5 250" marker-end="url(#ar)"/><text x="626.5" y="230.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="542.5" y="250" width="160.0" height="40" rx="18"/><text x="622.5" y="268.0" text-anchor="middle" class="b" style="font-size:10.5px">Goggles: Canvas/OSD,</text><text x="622.5" y="280.0" text-anchor="middle" class="b" style="font-size:10.5px">firmware, font</text></svg>
