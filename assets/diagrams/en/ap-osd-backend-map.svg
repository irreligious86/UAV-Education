<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ArduPilot 4.7: OSD type, port protocol and who draws</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="20" y="130" width="150" height="48" rx="6"/><text x="95.0" y="151.0" text-anchor="middle" class="b">AP_OSD</text><text x="95.0" y="165.0" text-anchor="middle" class="b">screens OSD1…OSD6</text><rect class="box" x="250" y="40" width="170" height="44" rx="6"/><text x="335.0" y="59.0" text-anchor="middle">OSD_TYPE = 1</text><text x="335.0" y="73.0" text-anchor="middle">MAX7456 on the board</text><rect class="boxa" x="250" y="130" width="170" height="48" rx="6"/><text x="335.0" y="151.0" text-anchor="middle" class="b">OSD_TYPE = 5</text><text x="335.0" y="165.0" text-anchor="middle" class="b">DisplayPort: cells</text><rect class="box" x="250" y="226" width="170" height="44" rx="6"/><text x="335.0" y="245.0" text-anchor="middle">OSD_TYPE = 3</text><text x="335.0" y="259.0" text-anchor="middle">MSP: numbers only</text><rect class="box" x="520" y="40" width="180" height="44" rx="6"/><text x="610.0" y="59.0" text-anchor="middle">Analog VTX</text><text x="610.0" y="73.0" text-anchor="middle">the chip draws, 30×16/13</text><rect class="boxa" x="520" y="130" width="180" height="48" rx="6"/><text x="610.0" y="151.0" text-anchor="middle" class="b">HDZero, Walksnail,</text><text x="610.0" y="165.0" text-anchor="middle" class="b">DJI O3/O4, WTFOS</text><rect class="box" x="520" y="226" width="180" height="44" rx="6"/><text x="610.0" y="245.0" text-anchor="middle">DJI FPV V1/V2</text><text x="610.0" y="259.0" text-anchor="middle">the goggles draw it themselves</text><path class="ln" d="M170 154.0 L210.0 154.0 L210.0 62.0 L250 62.0" marker-end="url(#ar)"/><text x="210.0" y="56.0" text-anchor="middle" class="m t" style="font-size:10px">SPI</text><path class="lna" d="M170 154.0 L250 154.0" marker-end="url(#ara)"/><path class="ln" d="M170 154.0 L210.0 154.0 L210.0 248.0 L250 248.0" marker-end="url(#ar)"/><path class="ln" d="M420 62.0 L520 62.0" marker-end="url(#ar)"/><text x="470.0" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">video + OSD</text><path class="lna" d="M420 154.0 L520 154.0" marker-end="url(#ara)"/><text x="470.0" y="147.0" text-anchor="middle" class="m t" style="font-size:10px">PROTOCOL 42</text><path class="ln" d="M420 248.0 L520 248.0" marker-end="url(#ar)"/><text x="470.0" y="241.0" text-anchor="middle" class="m t" style="font-size:10px">PROTOCOL 33</text><text x="20" y="302" text-anchor="start" class="a t">UART 115200 (SERIALn_BAUD = 115), TX and RX wires. DisplayPort grid: OSDn_TXT_RES 0/1/2 = 30×16 / 50×18 / 60×22.</text><text x="20" y="317" text-anchor="start" class="m t">MSP_OPTIONS: bit 2 (4) — Betaflight font, bit 3 (8) — INAV, bit 0 (1) — push telemetry, protocol 33 only.</text><text x="20" y="332" text-anchor="start" class="w t">OSD_TYPE2 adds a second backend: 1 + 5 or 1 + 3. The pair 3 + 5 and two of the same type do not start.</text></svg>
