<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 172" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Glass-to-command latency budget, ms (companion stages are p95 from the lab, 2 x86 cores)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Glass-to-command latency budget, ms (companion stages are p95 from the lab, 2 x86 cores)</text><text x="112" y="67" text-anchor="end" style="font-size:11px">sensor</text><line class="lnm" x1="120" y1="78" x2="704" y2="78"/><rect class="box" x="120.0" y="51" width="324.4" height="22" rx="3"/><text x="282.22222222222223" y="66" text-anchor="middle" style="font-size:10px">exposure + readout, typically 10–30</text><text x="112" y="101" text-anchor="end" style="font-size:11px">companion</text><line class="lnm" x1="120" y1="112" x2="704" y2="112"/><rect class="boxa" x="444.4" y="85" width="43.0" height="22" rx="3"/><text x="465.9226666666667" y="100" text-anchor="middle" class="b" style="font-size:10px">capture+undistort 2.1 · HSV 1.0 · tracker+geo 0.2 = 3.3</text><text x="112" y="135" text-anchor="end" style="font-size:11px">link + FC</text><line class="lnm" x1="120" y1="146" x2="704" y2="146"/><rect class="box" x="487.4" y="119" width="103.8" height="22" rx="3"/><text x="539.312" y="134" text-anchor="middle" style="font-size:10px">MAVLink → FC, typically 8</text><line class="lnm" x1="120.0" y1="40" x2="120.0" y2="152"/><text x="120.0" y="166" text-anchor="middle" class="m t" style="font-size:10px">0 ms</text><line class="lnm" x1="236.8" y1="40" x2="236.8" y2="152"/><text x="236.8" y="166" text-anchor="middle" class="m t" style="font-size:10px">9 ms</text><line class="lnm" x1="353.6" y1="40" x2="353.6" y2="152"/><text x="353.6" y="166" text-anchor="middle" class="m t" style="font-size:10px">18 ms</text><line class="lnm" x1="470.4" y1="40" x2="470.4" y2="152"/><text x="470.4" y="166" text-anchor="middle" class="m t" style="font-size:10px">27 ms</text><line class="lnm" x1="587.2" y1="40" x2="587.2" y2="152"/><text x="587.2" y="166" text-anchor="middle" class="m t" style="font-size:10px">36 ms</text><line class="lnm" x1="704.0" y1="40" x2="704.0" y2="152"/><text x="704.0" y="166" text-anchor="middle" class="m t" style="font-size:10px">45 ms</text><line class="lna" x1="591.2" y1="38" x2="591.2" y2="152"/><text x="570" y="34" text-anchor="start" class="a t" style="font-size:10px">command: 36 ms (YOLO on CPU: 65)</text></svg>
