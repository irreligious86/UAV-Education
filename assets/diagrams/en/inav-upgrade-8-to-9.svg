<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 494" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Upgrading INAV 8.0 → 9.1</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Upgrading INAV 8.0 → 9.1 following the steps of the 9.0.0 and 9.1.0 release notes</text><rect class="box" x="150.0" y="30.0" width="420.0" height="40.0" rx="6"/><text x="360.0" y="47.5" text-anchor="middle" style="font-size:10.5px">1. Configurator 9.1; on firmware 8.0 — diff all to a file</text><text x="360.0" y="60.5" text-anchor="middle" style="font-size:10.5px">the version and date in the file name</text><path class="ln" d="M360 70 L360 88" marker-end="url(#ar)"/><rect class="boxa" x="150.0" y="88.0" width="420.0" height="40.0" rx="6"/><text x="360.0" y="105.5" text-anchor="middle" class="b" style="font-size:10.5px">2. Flash 9.1 with Full chip erase</text><text x="360.0" y="118.5" text-anchor="middle" style="font-size:10.5px">mandatory when moving between major versions</text><path class="ln" d="M360 128 L360 142 L180 142"/><path class="ln" d="M180 142 L180 166" marker-end="url(#ar)"/><path class="ln" d="M360 142 L545 142 L545 166" marker-end="url(#ar)"/><text x="186" y="160" text-anchor="start" class="a t b" style="font-size:10.5px">by hand</text><text x="551" y="160" text-anchor="start" class="a t b" style="font-size:10.5px">or the Configurator itself</text><rect class="box" x="14.0" y="166.0" width="332.0" height="56.0" rx="6"/><text x="180.0" y="185.0" text-anchor="middle" style="font-size:10.5px">3. Paste the old diff into the CLI;</text><text x="180.0" y="198.0" text-anchor="middle" style="font-size:10.5px">write down the red “### ERROR: Invalid name” lines</text><text x="180.0" y="211.0" text-anchor="middle" style="font-size:10.5px">and fix them in a copy using the rename table</text><path class="ln" d="M180 222 L180 236" marker-end="url(#ar)"/><rect class="box" x="14.0" y="236.0" width="332.0" height="70.0" rx="6"/><text x="180.0" y="255.5" text-anchor="middle" style="font-size:10.5px">4. defaults → after the reboot paste</text><text x="180.0" y="268.5" text-anchor="middle" style="font-size:10.5px">the fixed diff → save; with several profiles,</text><text x="180.0" y="281.5" text-anchor="middle" style="font-size:10.5px">first everything up to # master and save,</text><text x="180.0" y="294.5" text-anchor="middle" style="font-size:10.5px">then from # control_profile 1</text><rect class="box" x="380.0" y="166.0" width="330.0" height="140.0" rx="6"/><text x="545.0" y="201.0" text-anchor="middle" style="font-size:10.5px">Steps 3–4 in Configurator 9.1:</text><text x="545.0" y="214.0" text-anchor="middle" style="font-size:10.5px">after flashing with Full chip erase</text><text x="545.0" y="227.0" text-anchor="middle" style="font-size:10.5px">it offers to restore the backup</text><text x="545.0" y="240.0" text-anchor="middle" style="font-size:10.5px">and shows the 8 → 9 migration window</text><text x="545.0" y="253.0" text-anchor="middle" style="font-size:10.5px">(renames and warnings);</text><text x="545.0" y="266.0" text-anchor="middle" style="font-size:10.5px">still compare the result</text><text x="545.0" y="279.0" text-anchor="middle" style="font-size:10.5px">with your own diff all</text><path class="ln" d="M545 306 L545 322 L360 322"/><path class="ln" d="M180 306 L180 322 L360 322 L360 336" marker-end="url(#ar)"/><rect class="box" x="70.0" y="336.0" width="580.0" height="40.0" rx="6"/><text x="360.0" y="353.5" text-anchor="middle" style="font-size:10.5px">5. Not carried over by itself: whatever you did not touch gets the 9.x defaults:</text><text x="360.0" y="366.5" text-anchor="middle" style="font-size:10.5px">GPS constellations and rate, inav_w_z_*, nav_fw_pos_z_ff; a new OSD font</text><path class="ln" d="M360 376 L360 390" marker-end="url(#ar)"/><rect class="box" x="70.0" y="390.0" width="580.0" height="40.0" rx="6"/><text x="360.0" y="407.5" text-anchor="middle" style="font-size:10.5px">6. Props off: motor and servo outputs on the Outputs tab,</text><text x="360.0" y="420.5" text-anchor="middle" style="font-size:10.5px">then a ground check of the estimator (step 3b)</text><path class="ln" d="M360 430 L360 444" marker-end="url(#ar)"/><rect class="boxa" x="70.0" y="444.0" width="580.0" height="40.0" rx="6"/><text x="360.0" y="461.5" text-anchor="middle" class="b" style="font-size:10.5px">7. nav_mc_pos_z_p / nav_mc_vel_z_p raised above the defaults 50 / 100?</text><text x="360.0" y="474.5" text-anchor="middle" style="font-size:10.5px">restore them or retune — otherwise throttle oscillates in RTH, WP, CRUISE</text></svg>
