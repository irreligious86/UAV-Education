<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Scopes of the diff command</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">What goes into the diff output: only diff all takes all 4 + 4 profiles</text><text x="185.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">hardware:</text><text x="185.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">resource,</text><text x="185.0" y="66" text-anchor="middle" class="m t" style="font-size:10px">serial, dma</text><text x="255.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">the rest</text><text x="255.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">master: aux,</text><text x="255.0" y="66" text-anchor="middle" class="m t" style="font-size:10px">map, rxfail</text><text x="325.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">PID-</text><text x="325.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">profile</text><text x="325.0" y="66" text-anchor="middle" class="m t" style="font-size:10px">active</text><text x="395.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">PID-</text><text x="395.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">profiles</text><text x="395.0" y="66" text-anchor="middle" class="m t" style="font-size:10px">3 more</text><text x="465.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">rate</text><text x="465.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">profile</text><text x="465.0" y="66" text-anchor="middle" class="m t" style="font-size:10px">active</text><text x="535.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">rate</text><text x="535.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">profiles</text><text x="535.0" y="66" text-anchor="middle" class="m t" style="font-size:10px">3 more</text><text x="605.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">mcu_id,</text><text x="605.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">signature</text><text x="605.0" y="66" text-anchor="middle" class="m t" style="font-size:10px"></text><text x="675.0" y="40" text-anchor="middle" class="m t" style="font-size:10px">defaults</text><text x="675.0" y="53" text-anchor="middle" class="m t" style="font-size:10px">nosave …</text><text x="675.0" y="66" text-anchor="middle" class="m t" style="font-size:10px">save</text><text x="140" y="101.0" text-anchor="end" style="font-size:11.5px">diff profile</text><rect x="154" y="84" width="62" height="26" rx="4" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="224" y="84" width="62" height="26" rx="4" fill="none" stroke="var(--gc-ink-muted, #8a93a3)"