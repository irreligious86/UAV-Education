<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Charging window and the stages of Li-ion/LiPo thermal runaway</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Cell temperature: the charging window and the thermal runaway stages</text><rect x="65.0" y="56" width="87.5" height="22" fill="var(--gc-accent-hud, #5ef1d2)" fill-opacity="0.25" stroke="var(--gc-accent-hud, #5ef1d2)"/><text x="108.75" y="71" text-anchor="middle" class="b" style="font-size:10px">charging 10–45</text><text x="108.75" y="48" text-anchor="middle" class="a t" style="font-size:10px">course window</text><rect x="240.0" y="56" width="450.0" height="22" fill="var(--gc-signal-red, #e8636b)" fill-opacity="0.18" stroke="var(--gc-signal-red, #e8636b)"/><text x="465.0" y="48" text-anchor="middle" class="d t" style="font-size:10px">the reactions run by themselves: cool it or let it burn out</text><rect x="152.5" y="56" width="87.5" height="22" fill="var(--gc-signal-amber, #f0b24c)" fill-opacity="0.18"/><text x="196.25" y="71" text-anchor="middle" class="w t" style="font-size:10px">35 °C</text><line x1="40" y1="78" x2="690" y2="78" stroke="currentColor" stroke-width="1.2"/><line x1="40.0" y1="78" x2="40.0" y2="83" stroke="currentColor"/><text x="40.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">0</text><line x1="90.0" y1="78" x2="90.0" y2="83" stroke="currentColor"/><text x="90.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">20</text><line x1="140.0" y1="78" x2="140.0" y2="83" stroke="currentColor"/><text x="140.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">40</text><line x1="190.0" y1="78" x2="190.0" y2="83" stroke="currentColor"/><text x="190.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">60</text><line x1="240.0" y1="78" x2="240.0" y2="83" stroke="currentColor"/><text x="240.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">80</text><line x1="290.0" y1="78" x2="290.0" y2="83" stroke="currentColor"/><text x="290.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">100</text><line x1="340.0" y1="78" x2="340.0" y2="83" stroke="currentColor"/><text x="340.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">120</text><line x1="390.0" y1="78" x2="390.0" y2="83" stroke="currentColor"/><text x="390.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">140</text><line x1="440.0" y1="78" x2="440.0" y2="83" stroke="currentColor"/><text x="440.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">160</text><line x1="490.0" y1="78" x2="490.0" y2="83" stroke="currentColor"/><text x="490.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">180</text><line x1="540.0" y1="78" x2="540.0" y2="83" stroke="currentColor"/><text x="540.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">200</text><line x1="590.0" y1="78" x2="590.0" y2="83" stroke="currentColor"/><text x="590.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">220</text><line x1="640.0" y1="78" x2="640.0" y2="83" stroke="currentColor"/><text x="640.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">240</text><line x1="690.0" y1="78" x2="690.0" y2="83" stroke="currentColor"/><text x="690.0" y="96" text-anchor="middle" class="m t" style="font-size:10px">260</text><text x="690" y="110" text-anchor="end" class="m t" style="font-size:10px">°C</text><line class="lnm" x1="240.0" y1="78" x2="240.0" y2="118"/><text x="243.0" y="130" text-anchor="start" class="b" style="font-size:10.5px">~80 °C</text><text x="243.0" y="143" text-anchor="start" style="font-size:10.5px">self-heating</text><line class="lnm" x1="265.0" y1="78" x2="265.0" y2="158"/><text x="268.0" y="170" text-anchor="start" class="b" style="font-size:10.5px">~90 °C</text><text x="268.0" y="183" text-anchor="start" style="font-size:10.5px">SEI breakdown, gas</text><line class="lnm" x1="377.5" y1="78" x2="377.5" y2="198"/><text x="380.5" y="210" text-anchor="start" class="b" style="font-size:10.5px">~135 °C</text><text x="380.5" y="223" text-anchor="start" style="font-size:10.5px">PE separator melts</text><line class="lnm" x1="452.5" y1="78" x2="452.5" y2="118"/><text x="455.5" y="130" text-anchor="start" class="b" style="font-size:10.5px">~165 °C</text><text x="455.5" y="143" text-anchor="start" style="font-size:10.5px">PP melts</text><line class="lnm" x1="490.0" y1="78" x2="490.0" y2="158"/><text x="493.0" y="170" text-anchor="start" class="b" style="font-size:10.5px">180–250 °C</text><text x="493.0" y="183" text-anchor="start" style="font-size:10.5px">LiCoO2 releases O2</text><text x="16" y="256" text-anchor="start" class="m t">There are 35 °C between the top of the charging window and the start of self-heating: never charge a pack still hot from a flight</text></svg>
