<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Compass in ArduPilot 4.7: which calibration method to choose</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Compass in ArduPilot 4.7: which calibration method to choose</text><rect class="box" x="265.0" y="34" width="190.0" height="42" rx="6"/><text x="360.0" y="53.0" text-anchor="middle" style="font-size:10.5px">Can you rotate the vehicle</text><text x="360.0" y="65.0" text-anchor="middle" style="font-size:10.5px">by hand on every side?</text><path class="ln" d="M360.0 76 L360.0 92.0 L243.3 92.0 L243.3 108" marker-end="url(#ar)"/><text x="247.33333333333334" y="88.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="148.3" y="108" width="190.0" height="42" rx="6"/><text x="243.33333333333334" y="127.0" text-anchor="middle" style="font-size:10.5px">Rotation calibration</text><text x="243.33333333333334" y="139.0" text-anchor="middle" style="font-size:10.5px">fitness ≤ COMPASS_CAL_FIT</text><path class="ln" d="M243.3 150 L243.3 166.0 L243.3 166.0 L243.3 182" marker-end="url(#ar)"/><rect class="box" x="148.3" y="182" width="190.0" height="42" rx="6"/><text x="243.33333333333334" y="201.0" text-anchor="middle" style="font-size:10.5px">Does the field change</text><text x="243.33333333333334" y="213.0" text-anchor="middle" style="font-size:10.5px">with current (MAG and BAT.Curr)?</text><path class="ln" d="M243.3 224 L243.3 240.0 L126.7 240.0 L126.7 256" marker-end="url(#ar)"/><text x="130.66666666666669" y="236.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="31.7" y="256" width="190.0" height="42" rx="18"/><text x="126.66666666666667" y="275.0" text-anchor="middle" style="font-size:10.5px">Done: check</text><text x="126.66666666666667" y="287.0" text-anchor="middle" style="font-size:10.5px">|OFS|, |B|, XKF4.SM</text><path class="ln" d="M243.3 224 L243.3 240.0 L360.0 240.0 L360.0 256" marker-end="url(#ar)"/><text x="364.0" y="236.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="265.0" y="256" width="190.0" height="42" rx="18"/><text x="360.0" y="275.0" text-anchor="middle" class="b" style="font-size:10.5px">Move the compass away from wires,</text><text x="360.0" y="287.0" text-anchor="middle" class="b" style="font-size:10.5px">the rest: CompassMot / MagFit</text><path class="ln" d="M360.0 76 L360.0 92.0 L593.3 92.0 L593.3 108" marker-end="url(#ar)"/><text x="597.3333333333334" y="88.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="498.3" y="108" width="190.0" height="42" rx="6"/><text x="593.3333333333334" y="127.0" text-anchor="middle" style="font-size:10.5px">COMPASS_ORIENT by hand,</text><text x="593.3333333333334" y="139.0" text-anchor="middle" style="font-size:10.5px">Large Vehicle MagCal</text><path class="ln" d="M593.3 150 L593.3 166.0 L593.3 166.0 L593.3 182" marker-end="url(#ar)"/><rect class="box" x="498.3" y="182" width="190.0" height="42" rx="6"/><text x="593.3333333333334" y="201.0" text-anchor="middle" style="font-size:10.5px">First flight</text><text x="593.3333333333334" y="213.0" text-anchor="middle" style="font-size:10.5px">without position hold</text><path class="ln" d="M593.3 224 L593.3 240.0 L593.3 240.0 L593.3 256" marker-end="url(#ar)"/><rect class="boxa" x="498.3" y="256" width="190.0" height="42" rx="18"/><text x="593.3333333333334" y="275.0" text-anchor="middle" class="b" style="font-size:10.5px">MagFit from the log:</text><text x="593.3333333333334" y="287.0" text-anchor="middle" class="b" style="font-size:10.5px">heading error &lt; 10°</text></svg>
