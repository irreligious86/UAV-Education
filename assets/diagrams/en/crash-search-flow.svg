<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Finding a crashed aircraft</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="34" width="160" height="58" rx="6"/><text x="90.0" y="53.0" text-anchor="middle">1. Disarm. Pilot:</text><text x="90.0" y="67.0" text-anchor="middle">landmark out loud,</text><text x="90.0" y="81.0" text-anchor="middle">nobody runs</text><rect class="box" x="190" y="34" width="160" height="58" rx="6"/><text x="270.0" y="53.0" text-anchor="middle">2. Radio on:</text><text x="270.0" y="67.0" text-anchor="middle">coordinates,</text><text x="270.0" y="81.0" text-anchor="middle">BEEPER</text><rect class="box" x="370" y="34" width="160" height="58" rx="6"/><text x="450.0" y="60.0" text-anchor="middle">3. DVR: stop recording,</text><text x="450.0" y="74.0" text-anchor="middle">last frames</text><rect class="box" x="550" y="34" width="160" height="58" rx="6"/><text x="630.0" y="60.0" text-anchor="middle">4. Time of the crash,</text><text x="630.0" y="74.0" text-anchor="middle">battery remaining</text><rect class="boxa" x="550" y="134" width="160" height="70" rx="6"/><text x="630.0" y="159.0" text-anchor="middle" class="b">Last waypoint:</text><text x="630.0" y="173.0" text-anchor="middle" class="b">telemetry → OSD</text><text x="630.0" y="187.0" text-anchor="middle" class="b">→ tlog → heading</text><rect class="boxa" x="370" y="134" width="160" height="70" rx="6"/><text x="450.0" y="159.0" text-anchor="middle" class="b">+ momentum v·√(2h/g):</text><text x="450.0" y="173.0" text-anchor="middle" class="b">20 m/s, 30 m ≈ 50 m</text><text x="450.0" y="187.0" text-anchor="middle" class="b">ahead along the heading</text><rect class="box" x="190" y="134" width="160" height="70" rx="6"/><text x="270.0" y="159.0" text-anchor="middle">Strip along the heading →</text><text x="270.0" y="173.0" text-anchor="middle">spiral; silence</text><text x="270.0" y="187.0" text-anchor="middle">10–15 s / 20–30 m</text><rect class="boxa" x="10" y="134" width="160" height="70" rx="6"/><text x="90.0" y="152.0" text-anchor="middle" class="b">Found it: approach from the side,</text><text x="90.0" y="166.0" text-anchor="middle" class="b">unplug the battery at once;</text><text x="90.0" y="180.0" text-anchor="middle" class="b">nothing in 30–40 min —</text><text x="90.0" y="194.0" text-anchor="middle" class="b">the lead decides</text><path class="ln" d="M170 63.0 L190 63.0" marker-end="url(#ar)"/><path class="ln" d="M350 63.0 L370 63.0" marker-end="url(#ar)"/><path class="ln" d="M530 63.0 L550 63.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 92 L630.0 134" marker-end="url(#ar)"/><path class="lna" d="M550 169.0 L530 169.0" marker-end="url(#ara)"/><path class="lna" d="M370 169.0 L350 169.0" marker-end="url(#ara)"/><path class="ln" d="M190 169.0 L170 169.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">Finding a crashed aircraft: the first minute → the last point → the search pattern</text><text x="10" y="232" text-anchor="start" class="m t">Battery budget: 6S, 30 % of 1300 mAh = 0.39 Ah × 22 V ≈ 8.6 Wh — with digital video (10 W)</text><text x="10" y="248" text-anchor="start" class="m t">≈ 51 min, FC + RX + GPS + buzzer only (3 W) ≈ 2.9 h; pass spacing 5–10 m in grass</text></svg>
