<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Геометрия съёмки и перекрытие</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Съёмка: footprint кадра, продольное и поперечное перекрытие</text><rect class="boxa" x="60.0" y="40.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="60.0" y="60.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="60.0" y="80.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="60.0" y="100.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><path class="lna" d="M120.0 32 L120.0 188.0" marker-end="url(#ara)"/><rect class="box" x="102.0" y="40.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="102.0" y="60.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="102.0" y="80.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="102.0" y="100.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><path class="lna" d="M162.0 32 L162.0 188.0" marker-end="url(#ara)"/><rect class="box" x="144.0" y="40.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="144.0" y="60.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="144.0" y="80.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><rect class="box" x="144.0" y="100.0" width="120" height="80" style="fill-opacity:0.35" rx="2"/><path class="lna" d="M204.0 32 L204.0 188.0" marker-end="url(#ara)"/><path class="ln" d="M46 40 L46 60.0"/><text x="42" y="54.0" text-anchor="end" class="t">шаг</text><path class="ln" d="M60 206.0 L102.0 206.0"/><text x="81.0" y="220.0" text-anchor="middle" class="t">галс</text><text x="360" y="60" text-anchor="start" class="t">footprint = 2H·tan(FOV/2)</text><text x="360" y="78" text-anchor="start" class="t">шаг = footprint_вдоль·(1 − p_прод)</text><text x="360" y="96" text-anchor="start" class="t">галсы = footprint_поперёк·(1 − p_попер)</text><text x="360" y="114" text-anchor="start" class="t">GSD = H·w_сенсора / (f·W_px)</text><text x="360" y="132" text-anchor="start" class="m t"></text><text x="360" y="150" text-anchor="start" class="m t">100 м, HFOV 84°, VFOV 62°, 80/70 %:</text><text x="360" y="168" text-anchor="start" class="m t">footprint 180 × 120 м,</text><text x="360" y="186" text-anchor="start" class="m t">шаг 24 м, галсы через 54 м</text></svg>
