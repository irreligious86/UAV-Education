th="24" height="36" rx="1"/><text x="580.0" y="174.0" text-anchor="middle" class="m" style="font-size:10.5px">FB</text><rect class="box" x="592" y="152" width="24" height="36" rx="1"/><text x="604.0" y="174.0" text-anchor="middle" class="m" style="font-size:10.5px">FC</text><rect class="box" x="616" y="152" width="24" height="36" rx="1"/><text x="628.0" y="174.0" text-anchor="middle" class="m" style="font-size:10.5px">FD</text><rect class="box" x="640" y="152" width="24" height="36" rx="1"/><text x="652.0" y="174.0" text-anchor="middle" class="m" style="font-size:10.5px">FE</text><rect class="box" x="664" y="152" width="24" height="36" rx="1"/><text x="676.0" y="174.0" text-anchor="middle" class="m" style="font-size:10.5px">FF</text><rect x="112" y="44" width="576" height="144" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.6"/><text x="400.0" y="206" text-anchor="middle" class="a t" style="font-size:11px">image 288 × 72 px: 24 × 12 px wide, 4 × 18 px high</text><rect class="box" x="16" y="228" width="430.0" height="28" rx="3"/><rect class="boxa" x="446.0" y="228" width="258.0" height="28" rx="3"/><text x="231.0" y="246" text-anchor="middle" style="font-size:11.5px">0–159: letters, digits, OSD icons</text><text x="575.0" y="246" text-anchor="middle" class="b" style="font-size:11.5px">160–255: logo</text><text x="16" y="272" text-anchor="start" class="m t" style="font-size:11px">The MAX7456 font memory is 256 characters in the chip&#x27;s NVM, not in the FC flash.</text><text x="16" y="294" text-anchor="start" class="m t" style="font-size:11px">Image colors: only 0,255,0 (transparent), 0,0,0 (black) and 255,255,255 (white); PNG or BMP.</text><text x="16" y="311" text-anchor="start" class="m t" style="font-size:11px">Upload Font writes all 256 characters: the logo is characters 160–255 of the font uploaded last.</text><text x="16" y="328" text-anchor="start" class="m t" style="font-size:11px">HD (MSP DisplayPort): the same codes 160–255 go to the goggles, and the goggles&#x27; font draws the image.</text></svg>
