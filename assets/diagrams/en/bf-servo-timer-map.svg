<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">SpeedyBee F405 V4 (4.5): one timer — one time base for all its channels</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="8" y="30" width="108" height="58" rx="6"/><text x="62.0" y="49.0" text-anchor="middle" class="b" style="font-size:10.5px">TIM4</text><text x="62.0" y="63.0" text-anchor="middle" class="b" style="font-size:10.5px">DShot600</text><text x="62.0" y="77.0" text-anchor="middle" class="b" style="font-size:10.5px">PSC 6 · ARR 19</text><rect class="boxa" x="126" y="30" width="108" height="58" rx="6"/><text x="180.0" y="49.0" text-anchor="middle" class="b" style="font-size:10.5px">TIM3</text><text x="180.0" y="63.0" text-anchor="middle" class="b" style="font-size:10.5px">DShot600</text><text x="180.0" y="77.0" text-anchor="middle" class="b" style="font-size:10.5px">PSC 6 · ARR 19</text><rect class="box" x="244" y="30" width="108" height="58" rx="6"/><text x="298.0" y="49.0" text-anchor="middle" style="font-size:10.5px">TIM2</text><text x="298.0" y="63.0" text-anchor="middle" style="font-size:10.5px">servo 50 Hz</text><text x="298.0" y="77.0" text-anchor="middle" style="font-size:10.5px">PSC 83 · ARR 19999</text><rect class="box" x="362" y="30" width="108" height="58" rx="6"/><text x="416.0" y="49.0" text-anchor="middle" style="font-size:10.5px">TIM12</text><text x="416.0" y="63.0" text-anchor="middle" style="font-size:10.5px">servo 50 Hz</text><text x="416.0" y="77.0" text-anchor="middle" style="font-size:10.5px">PSC 83 · ARR 19999</text><rect class="box" x="480" y="30" width="108" height="58" rx="6"/><text x="534.0" y="49.0" text-anchor="middle" style="font-size:10.5px">TIM8</text><text x="534.0" y="63.0" text-anchor="middle" style="font-size:10.5px">free</text><text x="534.0" y="77.0" text-anchor="middle" style="font-size:10.5px">(bitbang pacer)</text><rect class="box" x="598" y="30" width="108" height="58" rx="6"/><text x="652.0" y="49.0" text-anchor="middle" style="font-size:10.5px">TIM1</text><text x="652.0" y="63.0" text-anchor="middle" style="font-size:10.5px">LED_STRIP</text><text x="652.0" y="77.0" text-anchor="middle" style="font-size:10.5px">800 kHz + DMA</text><rect class="box" x="8" y="140" width="108" height="50" rx="6"/><text x="62.0" y="162.0" text-anchor="middle" style="font-size:10.5px">M1 B06 · CH1</text><text x="62.0" y="176.0" text-anchor="middle" style="font-size:10.5px">M2 B07 · CH2</text><rect class="box" x="126" y="140" width="108" height="50" rx="6"/><text x="180.0" y="162.0" text-anchor="middle" style="font-size:10.5px">M3 B00 · CH3</text><text x="180.0" y="176.0" text-anchor="middle" style="font-size:10.5px">M4 B01 · CH4</text><rect class="box" x="244" y="140" width="108" height="50" rx="6"/><text x="298.0" y="162.0" text-anchor="middle" style="font-size:10.5px">M7 B10 → SERVO 2</text><text x="298.0" y="176.0" text-anchor="middle" style="font-size:10.5px">M8 A15 · free</text><rect class="box" x="362" y="140" width="108" height="50" rx="6"/><text x="416.0" y="162.0" text-anchor="middle" style="font-size:10.5px">S9 B15 → SERVO 1</text><text x="416.0" y="176.0" text-anchor="middle" style="font-size:10.5px">CAM B14 → NONE</text><rect class="box" x="480" y="140" width="108" height="50" rx="6"/><text x="534.0" y="162.0" text-anchor="middle" style="font-size:10.5px">M5 C08 · M6 C09</text><text x="534.0" y="176.0" text-anchor="middle" style="font-size:10.5px">do not touch with bitbang</text><rect class="box" x="598" y="140" width="108" height="50" rx="6"/><text x="652.0" y="162.0" text-anchor="middle" style="font-size:10.5px">LED A08 · CH1</text><text x="652.0" y="176.0" text-anchor="middle" style="font-size:10.5px">DMA opt 0</text><path class="lna" d="M62.0 88 L62.0 140" marker-end="url(#ara)"/><path class="lna" d="M180.0 88 L180.0 140" marker-end="url(#ara)"/><path class="ln" d="M298.0 88 L298.0 140" marker-end="url(#ar)"/><path class="ln" d="M416.0 88 L416.0 140" marker-end="url(#ar)"/><path class="ln" d="M534.0 88 L534.0 140" marker-end="url(#ar)"/><path class="ln" d="M652.0 88 L652.0 140" marker-end="url(#ar)"/><text x="8" y="222" text-anchor="start" class="w t">Motors M1–M4 take TIM4 and TIM3 entirely: no servo on their channels.</text><text x="8" y="238" text-anchor="start" class="m t">SERVO 1 on S9 shares TIM12 with CAMERA_CONTROL: free the camera joystick (resource CAMERA_CONTROL NONE).</text><text x="8" y="254" text-anchor="start" class="m t">SERVO 2 goes on pad M7 (TIM2): neither a motor nor DShot bitbang touches this timer.</text></svg>
