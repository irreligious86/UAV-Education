<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Finding a crashed quad, Betaflight 2025.12</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Finding a crashed quad, Betaflight 2025.12</text><rect class="box" x="293.0" y="34" width="134.0" height="86" rx="6"/><text x="360.0" y="75.0" text-anchor="middle" style="font-size:9.5px">The quad crashed:</text><text x="360.0" y="87.0" text-anchor="middle" style="font-size:9.5px">what is still beeping?</text><path class="ln" d="M360.0 120 L360.0 136.0 L80.0 136.0 L80.0 152" marker-end="url(#ar)"/><text x="84.0" y="132.0" text-anchor="start" class="a t" style="font-size:10px">battery came off</text><rect class="boxa" x="13.0" y="152" width="134.0" height="86" rx="18"/><text x="80.0" y="181.0" text-anchor="middle" class="b" style="font-size:9.5px">Only a</text><text x="80.0" y="193.0" text-anchor="middle" class="b" style="font-size:9.5px">self-powered</text><text x="80.0" y="205.0" text-anchor="middle" class="b" style="font-size:9.5px">buzzer with</text><text x="80.0" y="217.0" text-anchor="middle" class="b" style="font-size:9.5px">its own cell</text><path class="ln" d="M360.0 120 L360.0 136.0 L360.0 136.0 L360.0 152" marker-end="url(#ar)"/><text x="364.0" y="132.0" text-anchor="start" class="a t" style="font-size:10px">in place</text><rect class="box" x="293.0" y="152" width="134.0" height="86" rx="6"/><text x="360.0" y="193.0" text-anchor="middle" style="font-size:9.5px">FC alive, radio</text><text x="360.0" y="205.0" text-anchor="middle" style="font-size:9.5px">linked?</text><path class="ln" d="M360.0 238 L360.0 254.0 L220.0 254.0 L220.0 270" marker-end="url(#ar)"/><text x="224.0" y="250.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="153.0" y="270" width="134.0" height="86" rx="18"/><text x="220.0" y="293.0" text-anchor="middle" style="font-size:9.5px">BEEPER switch:</text><text x="220.0" y="305.0" text-anchor="middle" style="font-size:9.5px">RX_SET 0.1/0.1 s,</text><text x="220.0" y="317.0" text-anchor="middle" style="font-size:9.5px">strip at 4 Hz,</text><text x="220.0" y="329.0" text-anchor="middle" style="font-size:9.5px">motors when</text><text x="220.0" y="341.0" text-anchor="middle" style="font-size:9.5px">beacon RX_SET</text><path class="ln" d="M360.0 238 L360.0 254.0 L430.0 254.0 L430.0 270" marker-end="url(#ar)"/><text x="434.0" y="250.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="363.0" y="270" width="134.0" height="86" rx="6"/><text x="430.0" y="305.0" text-anchor="middle" style="font-size:9.5px">FC sees USB?</text><text x="430.0" y="317.0" text-anchor="middle" style="font-size:9.5px">(VCP or</text><text x="430.0" y="329.0" text-anchor="middle" style="font-size:9.5px">detect pin)</text><path class="ln" d="M430.0 356 L430.0 372.0 L360.0 372.0 L360.0 388" marker-end="url(#ar)"/><text x="364.0" y="368.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="293.0" y="388" width="134.0" height="86" rx="18"/><text x="360.0" y="429.0" text-anchor="middle" style="font-size:9.5px">RX_LOST is silent</text><text x="360.0" y="441.0" text-anchor="middle" style="font-size:9.5px">(2025.12)</text><path class="ln" d="M430.0 356 L430.0 372.0 L500.0 372.0 L500.0 388" marker-end="url(#ar)"/><text x="504.0" y="368.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="boxa" x="433.0" y="388" width="134.0" height="86" rx="18"/><text x="500.0" y="405.0" text-anchor="middle" class="b" style="font-size:9.5px">RX_LOST 0.5/0.5 s</text><text x="500.0" y="417.0" text-anchor="middle" class="b" style="font-size:9.5px">for failsafe_</text><text x="500.0" y="429.0" text-anchor="middle" class="b" style="font-size:9.5px">delay (4.5: after</text><text x="500.0" y="441.0" text-anchor="middle" class="b" style="font-size:9.5px">arming); motors</text><text x="500.0" y="453.0" text-anchor="middle" class="b" style="font-size:9.5px">≥ 1.2 s after</text><text x="500.0" y="465.0" text-anchor="middle" class="b" style="font-size:9.5px">disarming</text><path class="ln" d="M360.0 120 L360.0 136.0 L640.0 136.0 L640.0 152" marker-end="url(#ar)"/><text x="644.0" y="132.0" text-anchor="start" class="a t" style="font-size:10px">+ DShot</text><rect class="box" x="573.0" y="152" width="134.0" height="86" rx="18"/><text x="640.0" y="169.0" text-anchor="middle" style="font-size:9.5px">Bluejay beacon</text><text x="640.0" y="181.0" text-anchor="middle" style="font-size:9.5px">(battery + DShot</text><text x="640.0" y="193.0" text-anchor="middle" style="font-size:9.5px">from the FC): after</text><text x="640.0" y="205.0" text-anchor="middle" style="font-size:9.5px">beacon delay;</text><text x="640.0" y="217.0" text-anchor="middle" style="font-size:9.5px">independent of the radio</text><text x="640.0" y="229.0" text-anchor="middle" style="font-size:9.5px">and USB</text></svg>
