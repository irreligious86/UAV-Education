<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">CLI script: change, re-read, compare</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="150" height="50" rx="6"/><text x="85.0" y="62.0" text-anchor="middle" class="b">find_craft:</text><text x="85.0" y="76.0" text-anchor="middle" class="b">port by craft_name</text><rect class="box" x="186" y="40" width="150" height="50" rx="6"/><text x="261.0" y="62.0" text-anchor="middle">diff all →</text><text x="261.0" y="76.0" text-anchor="middle">*_before_diff.txt</text><rect class="box" x="362" y="40" width="150" height="50" rx="6"/><text x="437.0" y="62.0" text-anchor="middle">set from CHANGES,</text><text x="437.0" y="76.0" text-anchor="middle">save</text><rect class="box" x="550" y="34" width="160" height="62" rx="6"/><text x="630.0" y="55.0" text-anchor="middle">reboot:</text><text x="630.0" y="69.0" text-anchor="middle">wait 6 s, the port</text><text x="630.0" y="83.0" text-anchor="middle">may have changed</text><rect class="boxa" x="550" y="140" width="160" height="50" rx="6"/><text x="630.0" y="162.0" text-anchor="middle" class="b">find_craft</text><text x="630.0" y="176.0" text-anchor="middle" class="b">again</text><rect class="box" x="362" y="140" width="150" height="50" rx="6"/><text x="437.0" y="162.0" text-anchor="middle">get for every</text><text x="437.0" y="176.0" text-anchor="middle">key: all OK?</text><rect class="box" x="186" y="140" width="150" height="50" rx="6"/><text x="261.0" y="162.0" text-anchor="middle">diff all →</text><text x="261.0" y="176.0" text-anchor="middle">*_after_diff.txt</text><rect class="boxa" x="10" y="140" width="150" height="50" rx="6"/><text x="85.0" y="162.0" text-anchor="middle" class="b">git diff: exactly</text><text x="85.0" y="176.0" text-anchor="middle" class="b">the CHANGES lines</text><rect class="box" x="352" y="236" width="170" height="50" rx="6"/><text x="437.0" y="258.0" text-anchor="middle">FAIL: not saved</text><text x="437.0" y="272.0" text-anchor="middle">or the key was renamed</text><rect class="box" x="10" y="236" width="150" height="50" rx="6"/><text x="85.0" y="258.0" text-anchor="middle">extra line:</text><text x="85.0" y="272.0" text-anchor="middle">edited by hand</text><path class="ln" d="M160 65.0 L186 65.0" marker-end="url(#ar)"/><path class="ln" d="M336 65.0 L362 65.0" marker-end="url(#ar)"/><path class="ln" d="M512 65.0 L550 65.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 96 L630.0 140" marker-end="url(#ar)"/><path class="ln" d="M550 165.0 L512 165.0" marker-end="url(#ar)"/><path class="lna" d="M362 165.0 L336 165.0" marker-end="url(#ara)"/><path class="lna" d="M186 165.0 L160 165.0" marker-end="url(#ara)"/><path class="ln" d="M437.0 190 L437.0 236" marker-end="url(#ar)"/><path class="ln" d="M85.0 190 L85.0 236" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">Editing by script: re-read every value after save, compare the result with two backups</text><text x="560" y="236" text-anchor="start" class="m t">do not send exit: it</text><text x="560" y="252" text-anchor="start" class="m t">reboots the FC,</text><text x="560" y="268" text-anchor="start" class="m t">and noreboot does not</text><text x="560" y="284" text-anchor="start" class="m t">until 4.5.4</text><text x="352" y="304" text-anchor="start" class="m t">renames: the table in bf-intro</text><text x="10" y="304" text-anchor="start" class="m t">read diff all until “# ”, not on a timer</text></svg>
