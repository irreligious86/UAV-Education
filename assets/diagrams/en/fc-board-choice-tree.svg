<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Choosing an FC board: firmware → navigation → ports and outputs</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Choosing an FC board: firmware → navigation → ports and outputs</text><rect class="box" x="277.0" y="34" width="166.0" height="46" rx="6"/><text x="360.0" y="55.0" text-anchor="middle" style="font-size:10.5px">Is there a target for the firmware</text><text x="360.0" y="67.0" text-anchor="middle" style="font-size:10.5px">and version you need?</text><path class="ln" d="M360.0 80 L360.0 94.0 L80.0 94.0 L80.0 108" marker-end="url(#ar)"/><text x="84.0" y="90.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="13.0" y="108" width="134.0" height="46" rx="18"/><text x="80.0" y="135.0" text-anchor="middle" style="font-size:9.5px">A different board</text><path class="ln" d="M360.0 80 L360.0 94.0 L430.0 94.0 L430.0 108" marker-end="url(#ar)"/><text x="434.0" y="90.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="347.0" y="108" width="166.0" height="46" rx="6"/><text x="430.0" y="129.0" text-anchor="middle" style="font-size:10.5px">Navigation: INAV,</text><text x="430.0" y="141.0" text-anchor="middle" style="font-size:10.5px">ArduPilot, PX4?</text><path class="ln" d="M430.0 154 L430.0 168.0 L290.0 168.0 L290.0 182" marker-end="url(#ar)"/><text x="294.0" y="164.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="207.0" y="182" width="166.0" height="46" rx="6"/><text x="290.0" y="203.0" text-anchor="middle" style="font-size:10.5px">Betaflight: SBUS-</text><text x="290.0" y="215.0" text-anchor="middle" style="font-size:10.5px">receiver on an F4?</text><path class="ln" d="M290.0 228 L290.0 242.0 L220.0 242.0 L220.0 256" marker-end="url(#ar)"/><text x="224.0" y="238.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="153.0" y="256" width="134.0" height="46" rx="18"/><text x="220.0" y="277.0" text-anchor="middle" style="font-size:9.5px">A port with a hardware</text><text x="220.0" y="289.0" text-anchor="middle" style="font-size:9.5px">inverter (SBUS)</text><path class="ln" d="M290.0 228 L290.0 242.0 L360.0 242.0 L360.0 256" marker-end="url(#ar)"/><text x="364.0" y="238.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="293.0" y="256" width="134.0" height="46" rx="18"/><text x="360.0" y="277.0" text-anchor="middle" style="font-size:9.5px">F4/F7: any UART</text><text x="360.0" y="289.0" text-anchor="middle" style="font-size:9.5px">for the receiver</text><path class="ln" d="M430.0 154 L430.0 168.0 L570.0 168.0 L570.0 182" marker-end="url(#ar)"/><text x="574.0" y="164.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="487.0" y="182" width="166.0" height="46" rx="6"/><text x="570.0" y="197.0" text-anchor="middle" class="b" style="font-size:10.5px">Need a baro, compass,</text><text x="570.0" y="209.0" text-anchor="middle" class="b" style="font-size:10.5px">UART ≥ 4 (RX, GPS, VTX,</text><text x="570.0" y="221.0" text-anchor="middle" class="b" style="font-size:10.5px">companion). VTOL/large?</text><path class="ln" d="M570.0 228 L570.0 242.0 L500.0 242.0 L500.0 256" marker-end="url(#ar)"/><text x="504.0" y="238.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="433.0" y="256" width="134.0" height="46" rx="18"/><text x="500.0" y="277.0" text-anchor="middle" style="font-size:9.5px">A board with a baro,</text><text x="500.0" y="289.0" text-anchor="middle" style="font-size:9.5px">compass, 4+ UARTs</text><path class="ln" d="M570.0 228 L570.0 242.0 L640.0 242.0 L640.0 256" marker-end="url(#ar)"/><text x="644.0" y="238.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="573.0" y="256" width="134.0" height="46" rx="18"/><text x="640.0" y="277.0" text-anchor="middle" class="b" style="font-size:9.5px">H7: CAN (DroneCAN),</text><text x="640.0" y="289.0" text-anchor="middle" class="b" style="font-size:9.5px">8+ outputs</text><text x="16" y="356.0" text-anchor="start" class="m t">For any branch: BEC current under load, size and weight, 30.5/20 mm mounting</text></svg>
