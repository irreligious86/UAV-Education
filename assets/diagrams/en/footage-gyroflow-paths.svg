<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Gyroflow: where the motion data comes from and what you need for a result</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="170" height="48" rx="6"/><text x="95.0" y="61.0" text-anchor="middle" class="b">Camera with a gyro</text><text x="95.0" y="75.0" text-anchor="middle" class="b">GoPro 8+, DJI, Insta360</text><rect class="box" x="215" y="40" width="150" height="48" rx="6"/><text x="290.0" y="61.0" text-anchor="middle">MP4 + gyro in the file</text><text x="290.0" y="75.0" text-anchor="middle">EIS off (DJI)</text><rect class="boxa" x="10" y="130" width="170" height="48" rx="6"/><text x="95.0" y="151.0" text-anchor="middle" class="b">Flight controller: Blackbox</text><text x="95.0" y="165.0" text-anchor="middle" class="b">250 Hz, .bbl/.bfl</text><rect class="box" x="215" y="130" width="150" height="48" rx="6"/><text x="290.0" y="151.0" text-anchor="middle">Log + video without</text><text x="290.0" y="165.0" text-anchor="middle">gyro; camera tilt</text><rect class="box" x="10" y="220" width="170" height="44" rx="6"/><text x="95.0" y="239.0" text-anchor="middle">No gyro</text><text x="95.0" y="253.0" text-anchor="middle">in the frame</text><rect class="box" x="215" y="220" width="150" height="44" rx="6"/><text x="290.0" y="239.0" text-anchor="middle">Optical correction</text><text x="290.0" y="253.0" text-anchor="middle">motion from pixels</text><rect class="boxa" x="430" y="40" width="140" height="224" rx="6"/><text x="500.0" y="135.0" text-anchor="middle" class="b">Gyroflow</text><text x="500.0" y="149.0" text-anchor="middle" class="b">lens profile</text><text x="500.0" y="163.0" text-anchor="middle" class="b">synchronization</text><text x="500.0" y="177.0" text-anchor="middle" class="b">smoothing, RS</text><rect class="box" x="600" y="130" width="115" height="44" rx="6"/><text x="657.5" y="149.0" text-anchor="middle" style="font-size:10.5px">Export / plugin</text><text x="657.5" y="163.0" text-anchor="middle" style="font-size:10.5px">crop by margin</text><path class="ln" d="M180 64.0 L215 64.0" marker-end="url(#ar)"/><path class="ln" d="M365 64.0 L397.5 64.0 L397.5 152.0 L430 152.0" marker-end="url(#ar)"/><text x="397.5" y="58.0" text-anchor="middle" class="m t" style="font-size:10px">no sync</text><path class="ln" d="M180 154.0 L215 154.0" marker-end="url(#ar)"/><path class="lna" d="M365 154.0 L397.5 154.0 L397.5 152.0 L430 152.0" marker-end="url(#ara)"/><text x="397.5" y="146.0" text-anchor="middle" class="m t" style="font-size:10px">sync</text><path class="ln" d="M180 242.0 L215 242.0" marker-end="url(#ar)"/><path class="ln" d="M365 242.0 L397.5 242.0 L397.5 152.0 L430 152.0" marker-end="url(#ar)"/><path class="ln" d="M570 152.0 L600 152.0" marker-end="url(#ar)"/><text x="10" y="282" text-anchor="start" class="m t">Camera tilt for an FC log: Motion data → Rotation → Pitch; an error in it makes the horizon drift</text></svg>
