<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">First contribution to an open-source autopilot</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="150" height="48" rx="6"/><text x="85.0" y="61.0" text-anchor="middle">1. CONTRIBUTING</text><text x="85.0" y="75.0" text-anchor="middle">and the project rules</text><rect class="box" x="195" y="40" width="160" height="48" rx="6"/><text x="275.0" y="61.0" text-anchor="middle">2. Task: an issue</text><text x="275.0" y="75.0" text-anchor="middle">or a docs fix</text><rect class="boxa" x="390" y="40" width="150" height="48" rx="6"/><text x="465.0" y="61.0" text-anchor="middle" class="b">3. Reproduce</text><text x="465.0" y="75.0" text-anchor="middle" class="b">in SITL, record a log</text><rect class="box" x="565" y="40" width="150" height="48" rx="6"/><text x="640.0" y="61.0" text-anchor="middle">4. A small PR:</text><text x="640.0" y="75.0" text-anchor="middle">one change</text><rect class="boxa" x="470" y="130" width="160" height="44" rx="6"/><text x="550.0" y="149.0" text-anchor="middle" class="b">test / before-after log,</text><text x="550.0" y="163.0" text-anchor="middle" class="b">Fixes/Resolves #N</text><rect class="box" x="250" y="130" width="170" height="44" rx="6"/><text x="335.0" y="149.0" text-anchor="middle">5. Review: changes</text><text x="335.0" y="163.0" text-anchor="middle">per the project rules</text><rect class="boxa" x="40" y="130" width="160" height="44" rx="6"/><text x="120.0" y="149.0" text-anchor="middle" class="b">6. Link to the PR</text><text x="120.0" y="163.0" text-anchor="middle" class="b">in your portfolio</text><path class="ln" d="M160 64.0 L195 64.0" marker-end="url(#ar)"/><path class="ln" d="M355 64.0 L390 64.0" marker-end="url(#ar)"/><path class="lna" d="M540 64.0 L565 64.0" marker-end="url(#ara)"/><path class="ln" d="M640.0 88 L640.0 109.0 L550.0 109.0 L550.0 130" marker-end="url(#ar)"/><path class="ln" d="M470 152.0 L420 152.0" marker-end="url(#ar)"/><path class="lna" d="M250 152.0 L200 152.0" marker-end="url(#ara)"/><text x="10" y="198" text-anchor="start" class="m t">It is easier to start with a docs fix or a reproduced bug with a log than with a new feature</text></svg>
