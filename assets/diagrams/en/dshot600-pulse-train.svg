 class="m t" style="font-size:11px">25</text><line x1="611.1" y1="246.0" x2="611.1" y2="258.0" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.6"/><text x="616.0967741935484" y="270" text-anchor="start" class="a t" style="font-size:10.5px">frame 26.7</text><text x="320.4516129032258" y="286" text-anchor="middle" class="m t" style="font-size:11px">time, µs</text><text x="16" y="302" text-anchor="start" class="m t">CRC = (v ⊕ v&gt;&gt;4 ⊕ v&gt;&gt;8) &amp; 0xF, v — the 12 bits of throttle and telemetry. The pulse width carries the bit,</text><text x="16" y="318" text-anchor="start" class="m t">not the level. After the frame the line stays low until the next one: at an 8 kHz loop a frame every 125 µs.</text></svg>
