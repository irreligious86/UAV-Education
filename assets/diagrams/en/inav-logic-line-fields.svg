<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Строка logic в INAV по полям</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Строка logic по полям: пример «дальше 100 м — мощность VTX 3» (шаг 2 практики, 9.1.0)</text><rect class="box" x="10.0" y="30.0" width="224.0" height="52.0" rx="6"/><text x="122.0" y="47.0" text-anchor="middle" class="b" style="font-size:10.5px">1. Вход</text><text x="122.0" y="60.0" text-anchor="middle" style="font-size:10.5px">фраза: «если &lt;величина&gt;</text><text x="122.0" y="73.0" text-anchor="middle" style="font-size:10.5px">&lt;сравнение&gt; &lt;порог&gt;, то …»</text><path class="ln" d="M234 56 L248 56" marker-end="url(#ar)"/><rect class="boxa" x="248.0" y="30.0" width="224.0" height="52.0" rx="6"/><text x="360.0" y="47.0" text-anchor="middle" class="b" style="font-size:10.5px">2. Решение</text><text x="360.0" y="60.0" text-anchor="middle" style="font-size:10.5px">тип и № операнда, порог</text><text x="360.0" y="73.0" text-anchor="middle" style="font-size:10.5px">в его единицах, № операции</text><path class="ln" d="M472 56 L486 56" marker-end="url(#ar)"/><rect class="box" x="486.0" y="30.0" width="224.0" height="52.0" rx="6"/><text x="598.0" y="47.0" text-anchor="middle" class="b" style="font-size:10.5px">3. Проверка</text><text x="598.0" y="60.0" text-anchor="middle" style="font-size:10.5px">logic печатает правило обратно,</text><text x="598.0" y="73.0" text-anchor="middle" style="font-size:10.5px">Programming — живое значение</text><path class="ln" d="M360 82 L360 100" marker-end="url(#ar)"/><text x="54.22222222222222" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">правило</text><text x="130.66666666666666" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">вкл</text><text x="207.11111111111111" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">активатор</text><text x="283.55555555555554" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">operation</text><text x="360.0" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">тип A</text><text x="436.44444444444446" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">знач. A</text><text x="512.8888888888888" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">тип B</text><text x="589.3333333333333" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">знач. B</text><text x="665.7777777777777" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">flags</text><rect class="boxa" x="18.0" y="122.0" width="72.4" height="30.0" rx="4"/><text x="54.22222222222222" y="142" text-anchor="middle" class="a b" style="font-size:13px">0</text><text x="54.22222222222222" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">№ 0</text><rect class="box" x="94.4" y="122.0" width="72.4" height="30.0" rx="4"/><text x="130.66666666666666" y="142" text-anchor="middle" class="b" style="font-size:13px">1</text><text x="130.66666666666666" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">1 — да</text><rect class="box" x="170.9" y="122.0" width="72.4" height="30.0" rx="4"/><text x="207.11111111111111" y="142" text-anchor="middle" class="b" style="font-size:13px">-1</text><text x="207.11111111111111" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">−1 —</text><text x="207.11111111111111" y="181" text-anchor="middle" class="m t" style="font-size:10.5px">всегда</text><rect class="box" x="247.3" y="122.0" width="72.4" height="30.0" rx="4"/><text x="283.55555555555554" y="142" text-anchor="middle" class="b" style="font-size:13px">2</text><text x="283.55555555555554" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">2 — «&gt;»</text><text x="283.55555555555554" y="181" text-anchor="middle" class="m t" style="font-size:10.5px">GREATER</text><rect class="box" x="323.8" y="122.0" width="72.4" height="30.0" rx="4"/><text x="360.0" y="142" text-anchor="middle" class="b" style="font-size:13px">2</text><text x="360.0" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">2 —</text><text x="360.0" y="181" text-anchor="middle" class="m t" style="font-size:10.5px">параметр</text><text x="360.0" y="194" text-anchor="middle" class="m t" style="font-size:10.5px">полёта</text><rect class="box" x="400.2" y="122.0" width="72.4" height="30.0" rx="4"/><text x="436.44444444444446" y="142" text-anchor="middle" class="b" style="font-size:13px">1</text><text x="436.44444444444446" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">1 — до</text><text x="436.44444444444446" y="181" text-anchor="middle" class="m t" style="font-size:10.5px">дома, м</text><rect class="box" x="476.7" y="122.0" width="72.4" height="30.0" rx="4"/><text x="512.8888888888888" y="142" text-anchor="middle" class="b" style="font-size:13px">0</text><text x="512.8888888888888" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">0 —</text><text x="512.8888888888888" y="181" text-anchor="middle" class="m t" style="font-size:10.5px">число</text><rect class="box" x="553.1" y="122.0" width="72.4" height="30.0" rx="4"/><text x="589.3333333333333" y="142" text-anchor="middle" class="b" style="font-size:13px">100</text><text x="589.3333333333333" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">100 м</text><rect class="box" x="629.6" y="122.0" width="72.4" height="30.0" rx="4"/><text x="665.7777777777777" y="142" text-anchor="middle" class="b" style="font-size:13px">0</text><text x="665.7777777777777" y="168" text-anchor="middle" class="m t" style="font-size:10.5px">0 —</text><text x="665.7777777777777" y="181" text-anchor="middle" class="m t" style="font-size:10.5px">обычное</text><rect class="box" x="18.0" y="240.0" width="72.4" height="30.0" rx="4"/><text x="54.22222222222222" y="260" text-anchor="middle" class="b" style="font-size:13px">1</text><text x="54.22222222222222" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">№ 1</text><rect class="box" x="94.4" y="240.0" width="72.4" height="30.0" rx="4"/><text x="130.66666666666666" y="260" text-anchor="middle" class="b" style="font-size:13px">1</text><text x="130.66666666666666" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">1 — да</text><rect class="boxa" x="170.9" y="240.0" width="72.4" height="30.0" rx="4"/><text x="207.11111111111111" y="260" text-anchor="middle" class="a b" style="font-size:13px">0</text><text x="207.11111111111111" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">0 — пока</text><text x="207.11111111111111" y="299" text-anchor="middle" class="m t" style="font-size:10.5px">правило 0</text><text x="207.11111111111111" y="312" text-anchor="middle" class="m t" style="font-size:10.5px">true</text><rect class="box" x="247.3" y="240.0" width="72.4" height="30.0" rx="4"/><text x="283.55555555555554" y="260" text-anchor="middle" class="b" style="font-size:13px">25</text><text x="283.55555555555554" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">25 —</text><text x="283.55555555555554" y="299" text-anchor="middle" class="m t" style="font-size:10.5px">мощность</text><text x="283.55555555555554" y="312" text-anchor="middle" class="m t" style="font-size:10.5px">VTX</text><rect class="box" x="323.8" y="240.0" width="72.4" height="30.0" rx="4"/><text x="360.0" y="260" text-anchor="middle" class="b" style="font-size:13px">0</text><text x="360.0" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">0 —</text><text x="360.0" y="299" text-anchor="middle" class="m t" style="font-size:10.5px">число</text><rect class="box" x="400.2" y="240.0" width="72.4" height="30.0" rx="4"/><text x="436.44444444444446" y="260" text-anchor="middle" class="b" style="font-size:13px">3</text><text x="436.44444444444446" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">3 —</text><text x="436.44444444444446" y="299" text-anchor="middle" class="m t" style="font-size:10.5px">уровень</text><rect class="box" x="476.7" y="240.0" width="72.4" height="30.0" rx="4"/><text x="512.8888888888888" y="260" text-anchor="middle" class="b" style="font-size:13px">0</text><text x="512.8888888888888" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">0 —</text><text x="512.8888888888888" y="299" text-anchor="middle" class="m t" style="font-size:10.5px">число</text><rect class="box" x="553.1" y="240.0" width="72.4" height="30.0" rx="4"/><text x="589.3333333333333" y="260" text-anchor="middle" class="b" style="font-size:13px">0</text><text x="589.3333333333333" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">0 — не</text><text x="589.3333333333333" y="299" text-anchor="middle" class="m t" style="font-size:10.5px">нужно</text><rect class="box" x="629.6" y="240.0" width="72.4" height="30.0" rx="4"/><text x="665.7777777777777" y="260" text-anchor="middle" class="b" style="font-size:13px">0</text><text x="665.7777777777777" y="286" text-anchor="middle" class="m t" style="font-size:10.5px">0 —</text><text x="665.7777777777777" y="299" text-anchor="middle" class="m t" style="font-size:10.5px">обычное</text><path class="lna" d="M28.2 152 L28.2 212 L207.1 212 L207.1 240" marker-end="url(#ara)"/><text x="225.11111111111111" y="208" text-anchor="start" class="a t" style="font-size:10.5px">активатор правила 1 = номер правила 0:</text><text x="225.11111111111111" y="222" text-anchor="start" class="a t" style="font-size:10.5px">мощность ставится, пока правило 0 true</text><text x="16" y="344" text-anchor="start" class="b" style="font-size:11.5px">logic 0 1 -1 2 2 1 0 100 0  ·  logic 1 1 0 25 0 3 0 0 0  ·  save</text></svg>
