<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">INAV: бэкап, перенос на 9.1 и восстановление</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="150" height="44" rx="6"/><text x="85.0" y="59.0" text-anchor="middle" class="b">Старая прошивка:</text><text x="85.0" y="73.0" text-anchor="middle" class="b">diff all → файл</text><rect class="box" x="200" y="40" width="160" height="44" rx="6"/><text x="280.0" y="59.0" text-anchor="middle">Копия файла:</text><text x="280.0" y="73.0" text-anchor="middle">переименовать/убрать</text><rect class="box" x="400" y="40" width="140" height="44" rx="6"/><text x="470.0" y="59.0" text-anchor="middle">Прошивка 9.1 +</text><text x="470.0" y="73.0" text-anchor="middle">Full chip erase</text><rect class="box" x="580" y="40" width="130" height="44" rx="6"/><text x="645.0" y="59.0" text-anchor="middle">CLI: вставить</text><text x="645.0" y="73.0" text-anchor="middle">файл целиком</text><rect class="boxa" x="580" y="140" width="130" height="44" rx="6"/><text x="645.0" y="159.0" text-anchor="middle" class="b">Есть строки</text><text x="645.0" y="173.0" text-anchor="middle" class="b">### ERROR ?</text><rect class="box" x="380" y="140" width="150" height="44" rx="6"/><text x="455.0" y="159.0" text-anchor="middle">Исправить файл,</text><text x="455.0" y="173.0" text-anchor="middle">defaults, вставить</text><rect class="box" x="580" y="240" width="130" height="44" rx="6"/><text x="645.0" y="259.0" text-anchor="middle">save</text><text x="645.0" y="273.0" text-anchor="middle">(перезагрузка)</text><rect class="boxa" x="380" y="240" width="150" height="44" rx="6"/><text x="455.0" y="259.0" text-anchor="middle" class="b">Снова diff all,</text><text x="455.0" y="273.0" text-anchor="middle" class="b">сравнить с файлом</text><rect class="box" x="170" y="240" width="160" height="44" rx="6"/><text x="250.0" y="259.0" text-anchor="middle">status: флаги,</text><text x="250.0" y="273.0" text-anchor="middle">калибровки, выходы</text><path class="ln" d="M160 62.0 L200 62.0" marker-end="url(#ar)"/><path class="ln" d="M360 62.0 L400 62.0" marker-end="url(#ar)"/><path class="ln" d="M540 62.0 L580 62.0" marker-end="url(#ar)"/><path class="ln" d="M645.0 84 L645.0 140" marker-end="url(#ar)"/><path class="ln" d="M580 162.0 L530 162.0" marker-end="url(#ar)"/><text x="555.0" y="155.0" text-anchor="middle" class="m t" style="font-size:10px">yes</text><path class="lna" d="M645.0 184 L645.0 240" marker-end="url(#ara)"/><text x="651.0" y="208.0" text-anchor="middle" class="m t" style="font-size:10px">no</text><path class="lna" d="M580 262.0 L530 262.0" marker-end="url(#ara)"/><path class="lna" d="M380 262.0 L330 262.0" marker-end="url(#ara)"/><text x="10" y="108" text-anchor="start" class="m t">Первая строка файла — версия</text><text x="10" y="122" text-anchor="start" class="m t">и target: # INAV/TARGET 8.0.1 …</text><text x="10" y="306" text-anchor="start" class="a t">batch start в файле: при любой ошибке save откажет и напечатает число ошибок — полусобранный</text><text x="10" y="321" text-anchor="start" class="m t">конфиг не сохранится командой save. Но команды выбора профиля пишут EEPROM сами, поэтому</text><text x="10" y="336" text-anchor="start" class="w t">после неудачной вставки — defaults, а не exit. Пропы сняты до проверки выходов.</text><path class="ln" d="M455 140 L455 104 L562 104 L562 74 L580 74" marker-end="url(#ar)"/><text x="508" y="99" text-anchor="middle" class="m t" style="font-size:10px">заново</text></svg>
