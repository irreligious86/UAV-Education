<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">MatekH743 timer groups and the output plan</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="20" y="20" text-anchor="start" class="b" style="font-size:13px">MatekH743 (standard 4.7.2 build): timer groups and the step 1 plan</text><rect x="20" y="42" width="92" height="102" rx="6" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1" stroke-dasharray="4 3"/><text x="66.0" y="36" text-anchor="middle" class="b" style="font-size:12px">TIM8</text><text x="66.0" y="136" text-anchor="middle" class="a t" style="font-size:10px">DShot600</text><rect x="23" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.5"/><text x="43.0" y="79" text-anchor="middle" class="b" style="font-size:13px">1</text><text x="43.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G50</text><rect x="69" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.5"/><text x="89.0" y="79" text-anchor="middle" class="b" style="font-size:13px">2</text><text x="89.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G51</text><rect x="126" y="42" width="184" height="102" rx="6" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1" stroke-dasharray="4 3"/><text x="218.0" y="36" text-anchor="middle" class="b" style="font-size:12px">TIM5</text><text x="218.0" y="136" text-anchor="middle" class="a t" style="font-size:10px">DShot600</text><rect x="129" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.5"/><text x="149.0" y="79" text-anchor="middle" class="b" style="font-size:13px">3</text><text x="149.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G52</text><rect x="175" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.5"/><text x="195.0" y="79" text-anchor="middle" class="b" style="font-size:13px">4</text><text x="195.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G53</text><rect x="221" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="241.0" y="79" text-anchor="middle" class="b" style="font-size:13px">5</text><text x="241.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G54</text><rect x="267" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="287.0" y="79" text-anchor="middle" class="b" style="font-size:13px">6</text><text x="287.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G55</text><rect x="324" y="42" width="184" height="102" rx="6" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1" stroke-dasharray="4 3"/><text x="416.0" y="36" text-anchor="middle" class="b" style="font-size:12px">TIM4</text><text x="416.0" y="136" text-anchor="middle" class="m t" style="font-size:10px">PWM 50 Hz</text><rect x="327" y="62" width="40" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="347.0" y="79" text-anchor="middle" class="b" style="font-size:13px">7</text><text x="347.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G56</text><rect x="373" y="62" width="40" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="393.0" y="79" text-anchor="middle" class="b" style="font-size:13px">8</text><text x="393.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G57</text><rect x="419" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-signal-amber, #f0b24c)" stroke-width="1.5"/><text x="439.0" y="79" text-anchor="middle" class="b" style="font-size:13px">9</text><text x="439.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G58</text><rect x="465" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="485.0" y="79" text-anchor="middle" class="b" style="font-size:13px">10</text><text x="485.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G59</text><rect x="522" y="42" width="92" height="102" rx="6" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1" stroke-dasharray="4 3"/><text x="568.0" y="36" text-anchor="middle" class="b" style="font-size:12px">TIM15</text><text x="568.0" y="136" text-anchor="middle" class="m t" style="font-size:10px">PWM 50 Hz</text><rect x="525" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="545.0" y="79" text-anchor="middle" class="b" style="font-size:13px">11</text><text x="545.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G60</text><rect x="571" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="591.0" y="79" text-anchor="middle" class="b" style="font-size:13px">12</text><text x="591.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G61</text><rect x="628" y="42" width="46" height="102" rx="6" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1" stroke-dasharray="4 3"/><text x="651.0" y="36" text-anchor="middle" class="b" style="font-size:12px">TIM1</text><text x="651.0" y="136" text-anchor="middle" class="m t" style="font-size:10px">NeoP</text><rect x="631" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-signal-amber, #f0b24c)" stroke-width="1.5"/><text x="651.0" y="79" text-anchor="middle" class="b" style="font-size:13px">13</text><text x="651.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G62</text><text x="64" y="164" text-anchor="end" class="b" style="font-size:11px">1–4</text><text x="74" y="164" text-anchor="start" class="a t" style="font-size:11px">Motor1–4, DShot600: TIM8 and TIM5 entirely in digital mode</text><text x="64" y="180" text-anchor="end" class="b" style="font-size:11px">5–6</text><text x="74" y="180" text-anchor="start" class="w t" style="font-size:11px">TIM5 shared with motors 3 and 4 — no PWM servo here (GPIO or two more DShot motors are fine)</text><text x="64" y="196" text-anchor="end" class="b" style="font-size:11px">7–8</text><text x="74" y="196" text-anchor="start" class="t" style="font-size:11px">50 Hz servos: gripper (28) and gimbal tilt (7) — TIM4, SERVO_RATE</text><text x="64" y="212" text-anchor="end" class="b" style="font-size:11px">9</text><text x="74" y="212" text-anchor="start" class="t" style="font-size:11px">SERVO9_FUNCTION = −1, RELAY1_PIN = 58: the pin is removed from the TIM4 group</text><text x="64" y="228" text-anchor="end" class="b" style="font-size:11px">13</text><text x="74" y="228" text-anchor="start" class="t" style="font-size:11px">NeoPixel (120): alone on TIM1, disables nothing</text><text x="64" y="244" text-anchor="end" class="b" style="font-size:11px">10–12</text><text x="74" y="244" text-anchor="start" class="m t" style="font-size:11px">free; a strip on 9 or 10 would disable the servos on 7 and 8</text><text x="20" y="268" text-anchor="start" class="m t">Under the output number is the GPIO pin number (G50…G62). Lost for PWM with motors on 1–4: outputs 5 and 6.</text><text x="20" y="283" text-anchor="start" class="m t">In the MatekH743-bdshot build the groups differ: 1–2 TIM3, 3–4 TIM2, 5–6 TIM5, 7–10 TIM4.</text></svg>
