545.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G60</text><rect x="571" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="591.0" y="79" text-anchor="middle" class="b" style="font-size:13px">12</text><text x="591.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G61</text><rect x="628" y="42" width="46" height="102" rx="6" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1" stroke-dasharray="4 3"/><text x="651.0" y="36" text-anchor="middle" class="b" style="font-size:12px">TIM1</text><text x="651.0" y="136" text-anchor="middle" class="m t" style="font-size:10px">NeoP</text><rect x="631" y="62" width="40" height="40" rx="4" fill="none" stroke="var(--gc-signal-amber, #f0b24c)" stroke-width="1.5"/><text x="651.0" y="79" text-anchor="middle" class="b" style="font-size:13px">13</text><text x="651.0" y="94" text-anchor="middle" class="m t" style="font-size:9px">G62</text><text x="64" y="164" text-anchor="end" class="b" style="font-size:11px">1–4</text><text x="74" y="164" text-anchor="start" class="a t" style="font-size:11px">Motor1–4, DShot600: TIM8 и TIM5 целиком в цифровом режиме</text><text x="64" y="180" text-anchor="end" class="b" style="font-size:11px">5–6</text><text x="74" y="180" text-anchor="start" class="w t" style="font-size:11px">общий TIM5 с моторами 3 и 4 — PWM-серву сюда нельзя (можно GPIO или ещё два DShot-мотора)</text><text x="64" y="196" text-anchor="end" class="b" style="font-size:11px">7–8</text><text x="74" y="196" text-anchor="start" class="t" style="font-size:11px">сервы 50 Гц: захват (28) и наклон подвеса (7) — TIM4, SERVO_RATE</text><text x="64" y="212" text-anchor="end" class="b" style="font-size:11px">9</text><text x="74" y="212" text-anchor="start" class="t" style="font-size:11px">SERVO9_FUNCTION = −1, RELAY1_PIN = 58: ножка исключена из группы TIM4</text><text x="64" y="228" text-anchor="end" class="b" style="font-size:11px">13</text><text x="74" y="228" text-anchor="start" class="t" style="font-size:11px">NeoPixel (120): одна на TIM1, никого не отключает</text><text x="64" y="244" text-anchor="end" class="b" style="font-size:11px">10–12</text><text x="74" y="244" text-anchor="start" class="m t" style="font-size:11px">свободны; лента на 9 или 10 отключила бы сервы на 7 и 8</text><text x="20" y="268" text-anchor="start" class="m t">Под номером выхода — номер ножки GPIO (G50…G62). Потеряны для PWM при моторах на 1–4: выходы 5 и 6.</text><text x="20" y="283" text-anchor="start" class="m t">В сборке MatekH743-bdshot группы другие: 1–2 TIM3, 3–4 TIM2, 5–6 TIM5, 7–10 TIM4.</text></svg>
