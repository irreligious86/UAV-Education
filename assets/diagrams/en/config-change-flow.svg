<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Changing a config through git: before, after, one line</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="34" width="160" height="48" rx="6"/><text x="90.0" y="55.0" text-anchor="middle">“Before” file:</text><text x="90.0" y="69.0" text-anchor="middle">diff all or .param</text><rect class="box" x="190" y="34" width="160" height="48" rx="6"/><text x="270.0" y="55.0" text-anchor="middle">configs/YYYY-MM-DD_</text><text x="270.0" y="69.0" text-anchor="middle">name_board_diff.txt</text><rect class="box" x="370" y="34" width="160" height="48" rx="6"/><text x="450.0" y="55.0" text-anchor="middle">git commit</text><text x="450.0" y="69.0" text-anchor="middle">“name: baseline date”</text><rect class="box" x="550" y="34" width="160" height="48" rx="6"/><text x="630.0" y="55.0" text-anchor="middle">One change →</text><text x="630.0" y="69.0" text-anchor="middle">a new “after” file</text><rect class="boxa" x="550" y="126" width="160" height="56" rx="6"/><text x="630.0" y="144.0" text-anchor="middle" class="b">git diff: exactly</text><text x="630.0" y="158.0" text-anchor="middle" class="b">one line — the one</text><text x="630.0" y="172.0" text-anchor="middle" class="b">you changed?</text><rect class="boxa" x="190" y="126" width="300" height="56" rx="6"/><text x="340.0" y="144.0" text-anchor="middle" class="b">git commit with the “why”:</text><text x="340.0" y="158.0" text-anchor="middle" class="b">«rpm_filter_min_hz 100→50:</text><text x="340.0" y="172.0" text-anchor="middle" class="b">motors on the 10&quot; below 100 Hz”</text><text x="340.0" y="195" text-anchor="middle" class="m t">the next change starts again from the “after” file</text><rect class="box" x="190" y="230" width="520" height="60" rx="6"/><text x="450.0" y="250.0" text-anchor="middle">More lines: a different firmware version, a reset to defaults,</text><text x="450.0" y="264.0" text-anchor="middle">someone else&#x27;s edits — sort it out before flying; hundreds of lines — use dump,</text><text x="450.0" y="278.0" text-anchor="middle">not diff all; after a firmware update — a new baseline</text><path class="ln" d="M170 58.0 L190 58.0" marker-end="url(#ar)"/><path class="ln" d="M350 58.0 L370 58.0" marker-end="url(#ar)"/><path class="ln" d="M530 58.0 L550 58.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 82 L630.0 126" marker-end="url(#ar)"/><path class="lna" d="M550 154.0 L490 154.0" marker-end="url(#ara)"/><text x="520.0" y="147.0" text-anchor="middle" class="m t" style="font-size:10px">yes</text><path class="ln" d="M630.0 182 L630.0 206.0 L450.0 206.0 L450.0 230" marker-end="url(#ar)"/><text x="546.0" y="202.0" text-anchor="middle" class="m t" style="font-size:10px">no</text><text x="10" y="20" text-anchor="start" class="m t">Tool rule: the “before” and “after” config is in git, the difference shows as one line</text></svg>
