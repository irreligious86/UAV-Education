<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Adjustments in Betaflight 4.5: from the switch to EEPROM</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="14" width="160" height="44" rx="6"/><text x="90.0" y="33.0" text-anchor="middle">Range channel</text><text x="90.0" y="47.0" text-anchor="middle">AUX2 within start..end?</text><rect class="box" x="190" y="14" width="160" height="44" rx="6"/><text x="270.0" y="33.0" text-anchor="middle">adjrange slot</text><text x="270.0" y="47.0" text-anchor="middle">0…29 active</text><rect class="boxa" x="370" y="14" width="160" height="44" rx="6"/><text x="450.0" y="33.0" text-anchor="middle" class="b">Function N from the CLI</text><text x="450.0" y="47.0" text-anchor="middle" class="b">= configs[N − 1]</text><rect class="box" x="550" y="14" width="160" height="44" rx="6"/><text x="630.0" y="33.0" text-anchor="middle">Adjustment channel</text><text x="630.0" y="47.0" text-anchor="middle">AUX4 / pot</text><rect class="box" x="10" y="100" width="220" height="58" rx="6"/><text x="120.0" y="119.0" text-anchor="middle">STEP: center = 0</text><text x="120.0" y="133.0" text-anchor="middle">&gt; 1700 → +1, &lt; 1300 → −1</text><text x="120.0" y="147.0" text-anchor="middle">repeat 500 ms</text><rect class="box" x="250" y="100" width="220" height="58" rx="6"/><text x="360.0" y="119.0" text-anchor="middle">ABSOLUTE: center ≠ 0</text><text x="360.0" y="133.0" text-anchor="middle">c + (rc − 1500)·s / 500</text><text x="360.0" y="147.0" text-anchor="middle">on every rc change</text><rect class="box" x="490" y="100" width="220" height="58" rx="6"/><text x="600.0" y="119.0" text-anchor="middle">SELECT: 12, 24, 25, 29, 30</text><text x="600.0" y="133.0" text-anchor="middle">pos. = (rc − 900) / (1200/N)</text><text x="600.0" y="147.0" text-anchor="middle">rate/OSD/LED profile</text><rect class="boxa" x="10" y="200" width="160" height="44" rx="6"/><text x="90.0" y="219.0" text-anchor="middle" class="b">Value in RAM</text><text x="90.0" y="233.0" text-anchor="middle" class="b">config dirty</text><rect class="box" x="190" y="200" width="160" height="44" rx="6"/><text x="270.0" y="219.0" text-anchor="middle">OSD 2 s</text><text x="270.0" y="233.0" text-anchor="middle">«PITCH/ROLL D:  41»</text><rect class="box" x="370" y="200" width="160" height="44" rx="6"/><text x="450.0" y="219.0" text-anchor="middle">Blackbox event</text><text x="450.0" y="233.0" text-anchor="middle">code = enum, not CLI</text><rect class="boxa" x="550" y="200" width="160" height="44" rx="6"/><text x="630.0" y="219.0" text-anchor="middle" class="b">Save: disarmed,</text><text x="630.0" y="233.0" text-anchor="middle" class="b">T↓ Y← P↓ R→</text><path class="ln" d="M170 36.0 L190 36.0" marker-end="url(#ar)"/><path class="ln" d="M350 36.0 L370 36.0" marker-end="url(#ar)"/><path class="ln" d="M530 36.0 L550 36.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 58 L630.0 79.0 L120.0 79.0 L120.0 100" marker-end="url(#ar)"/><path class="ln" d="M630.0 58 L630.0 79.0 L360.0 79.0 L360.0 100" marker-end="url(#ar)"/><path class="ln" d="M630.0 58 L630.0 79.0 L600.0 79.0 L600.0 100" marker-end="url(#ar)"/><path class="lna" d="M360.0 158 L360.0 179.0 L90.0 179.0 L90.0 200" marker-end="url(#ara)"/><path class="ln" d="M170 222.0 L190 222.0" marker-end="url(#ar)"/><path class="ln" d="M350 222.0 L370 222.0" marker-end="url(#ar)"/><path class="lna" d="M530 222.0 L550 222.0" marker-end="url(#ara)"/><text x="10" y="268" text-anchor="start" class="w t">Without a stick save or Save in the Configurator the change lasts only until power-off.</text><text x="10" y="284" text-anchor="start" class="m t">Adjustments are not processed in CLI mode, nor in PARALYZE or while disarmed.</text></svg>
