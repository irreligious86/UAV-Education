<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">AP_Notify 4.7: from the event to the LED and the buzzer</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="14" y="96" width="128" height="48" rx="6"/><text x="78.0" y="117.0" text-anchor="middle" style="font-size:10.5px">Firmware code</text><text x="78.0" y="131.0" text-anchor="middle" style="font-size:10.5px">arm, failsafe, EKF</text><text x="78.0" y="157" text-anchor="middle" class="m t">flags and events</text><rect class="boxa" x="176" y="96" width="128" height="48" rx="6"/><text x="240.0" y="117.0" text-anchor="middle" class="b" style="font-size:10.5px">AP_Notify</text><text x="240.0" y="131.0" text-anchor="middle" class="b" style="font-size:10.5px">50 times per second</text><text x="240.0" y="157" text-anchor="middle" class="m t">NTF_* parameters</text><rect class="boxa" x="348" y="28" width="150" height="44" rx="6"/><text x="423.0" y="47.0" text-anchor="middle" class="b">RGBLed</text><text x="423.0" y="61.0" text-anchor="middle" class="b">one color table</text><rect class="box" x="348" y="98" width="150" height="44" rx="6"/><text x="423.0" y="117.0" text-anchor="middle">Board LEDs</text><text x="423.0" y="131.0" text-anchor="middle">1–2 of them, a pattern</text><rect class="boxa" x="348" y="168" width="150" height="44" rx="6"/><text x="423.0" y="187.0" text-anchor="middle" class="b">ToneAlarm</text><text x="423.0" y="201.0" text-anchor="middle" class="b">tunes</text><rect class="box" x="348" y="238" width="150" height="44" rx="6"/><text x="423.0" y="257.0" text-anchor="middle">Buzzer</text><text x="423.0" y="271.0" text-anchor="middle">NTF_BUZZ_PIN</text><rect class="box" x="548" y="28" width="158" height="44" rx="6"/><text x="627.0" y="47.0" text-anchor="middle">I2C, CAN, NeoPixel,</text><text x="627.0" y="61.0" text-anchor="middle">ProfiLED, ESC LED</text><rect class="box" x="548" y="168" width="158" height="44" rx="6"/><text x="627.0" y="187.0" text-anchor="middle">BUZZ pad, DroneCAN,</text><text x="627.0" y="201.0" text-anchor="middle">motor beeps</text><rect class="box" x="548" y="238" width="158" height="44" rx="6"/><text x="627.0" y="257.0" text-anchor="middle">active buzzer</text><text x="627.0" y="271.0" text-anchor="middle">on a GPIO pin</text><path class="ln" d="M142 120.0 L176 120.0" marker-end="url(#ar)"/><path class="lna" d="M304 120.0 L326.0 120.0 L326.0 50.0 L348 50.0" marker-end="url(#ara)"/><path class="ln" d="M304 120.0 L348 120.0" marker-end="url(#ar)"/><path class="lna" d="M304 120.0 L326.0 120.0 L326.0 190.0 L348 190.0" marker-end="url(#ara)"/><path class="ln" d="M304 120.0 L326.0 120.0 L326.0 260.0 L348 260.0" marker-end="url(#ar)"/><path class="lna" d="M498 50.0 L548 50.0" marker-end="url(#ara)"/><path class="lna" d="M498 190.0 L548 190.0" marker-end="url(#ara)"/><path class="ln" d="M498 260.0 L548 260.0" marker-end="url(#ar)"/><text x="14" y="312" text-anchor="start" class="a t">The flags are shared: the board RGB LED, the GPS module LED and the strip show the same thing.</text><text x="14" y="328" text-anchor="start" class="w t">Motor beeps (NTF_BUZZ_TYPES bit 1), ESC LEDs (NTF_LED_TYPES bit 11): disarmed only.</text><text x="14" y="344" text-anchor="start" class="m t">Devices are created at boot: after changing NTF_LED_TYPES or NTF_BUZZ_TYPES, reboot.</text><text x="14" y="360" text-anchor="start" class="m t">The I2C display (NTF_DISPLAY_TYPE) is a separate device and is not updated while armed.</text></svg>
