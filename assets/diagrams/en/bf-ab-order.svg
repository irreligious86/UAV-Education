ize:12px">B10</text><text x="150" y="116" text-anchor="start" class="d t">average drift: A +6 %, B +21 % → the extra +15 % on B ate the effect: estimate −3.1 %</text><text x="142" y="155" text-anchor="end" style="font-size:11px">ABBA ABBA AB</text><rect class="box" x="152.0" y="134" width="50.0" height="30" rx="4"/><text x="177.0" y="154" text-anchor="middle" style="font-size:12px">A1</text><rect class="boxa" x="206.0" y="134" width="50.0" height="30" rx="4"/><text x="231.0" y="154" text-anchor="middle" class="b" style="font-size:12px">B2</text><rect class="boxa" x="260.0" y="134" width="50.0" height="30" rx="4"/><text x="285.0" y="154" text-anchor="middle" class="b" style="font-size:12px">B3</text><rect class="box" x="314.0" y="134" width="50.0" height="30" rx="4"/><text x="339.0" y="154" text-anchor="middle" style="font-size:12px">A4</text><rect class="box" x="368.0" y="134" width="50.0" height="30" rx="4"/><text x="393.0" y="154" text-anchor="middle" style="font-size:12px">A5</text><rect class="boxa" x="422.0" y="134" width="50.0" height="30" rx="4"/><text x="447.0" y="154" text-anchor="middle" class="b" style="font-size:12px">B6</text><rect class="boxa" x="476.0" y="134" width="50.0" height="30" rx="4"/><text x="501.0" y="154" text-anchor="middle" class="b" style="font-size:12px">B7</text><rect class="box" x="530.0" y="134" width="50.0" height="30" rx="4"/><text x="555.0" y="154" text-anchor="middle" style="font-size:12px">A8</text><rect class="box" x="584.0" y="134" width="50.0" height="30" rx="4"/><text x="609.0" y="154" text-anchor="middle" style="font-size:12px">A9</text><rect class="boxa" x="638.0" y="134" width="50.0" height="30" rx="4"/><text x="663.0" y="154" text-anchor="middle" class="b" style="font-size:12px">B10</text><text x="150" y="184" text-anchor="start" class="a t">average drift: A +13.2 %, B +13.8 % → difference 0.6 %: estimate −20.5 %, p = 0.016</text><text x="16" y="214" text-anchor="start" class="m t">The true effect of B in the model is −1