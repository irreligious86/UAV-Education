<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">План обучения: четыре ступени и ворота между ними</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="150" height="48" rx="6"/><text x="85.0" y="61.0" text-anchor="middle" class="b">1. Симулятор</text><text x="85.0" y="75.0" text-anchor="middle" class="b">акро, свой пульт</text><rect class="box" x="195" y="40" width="150" height="48" rx="6"/><text x="270.0" y="61.0" text-anchor="middle">2. Вуп дома</text><text x="270.0" y="75.0" text-anchor="middle">65–75 мм, 1S</text><rect class="box" x="380" y="40" width="150" height="48" rx="6"/><text x="455.0" y="61.0" text-anchor="middle">3. Поле</text><text x="455.0" y="75.0" text-anchor="middle">LOS, затем FPV</text><rect class="boxa" x="565" y="40" width="150" height="48" rx="6"/><text x="640.0" y="61.0" text-anchor="middle" class="b">4. До 100 АКБ</text><text x="640.0" y="75.0" text-anchor="middle" class="b">журнал, упражнения</text><rect class="box" x="100" y="130" width="160" height="44" rx="6"/><text x="180.0" y="149.0" text-anchor="middle">5 кругов «восьмёрки»</text><text x="180.0" y="163.0" text-anchor="middle">без сброса</text><rect class="box" x="285" y="130" width="160" height="44" rx="6"/><text x="365.0" y="149.0" text-anchor="middle">3 АКБ подряд</text><text x="365.0" y="163.0" text-anchor="middle">без касаний стен</text><rect class="box" x="470" y="130" width="160" height="44" rx="6"/><text x="550.0" y="149.0" text-anchor="middle">10 АКБ: взлёт–круг–</text><text x="550.0" y="163.0" text-anchor="middle">посадка в круг 2 м</text><path class="ln" d="M160 64.0 L195 64.0" marker-end="url(#ar)"/><path class="ln" d="M345 64.0 L380 64.0" marker-end="url(#ar)"/><path class="lna" d="M530 64.0 L565 64.0" marker-end="url(#ara)"/><path class="ln" d="M180.0 130 L180.0 109.0 L85.0 109.0 L85.0 88" marker-end="url(#ar)"/><path class="ln" d="M365.0 130 L365.0 109.0 L270.0 109.0 L270.0 88" marker-end="url(#ar)"/><path class="ln" d="M550.0 130 L550.0 109.0 L455.0 109.0 L455.0 88" marker-end="url(#ar)"/><text x="10" y="198" text-anchor="start" class="m t">Ворота — проверяемый навык, а не число часов: часы только оценка времени</text></svg>
