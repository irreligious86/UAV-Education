<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">RPM filter: from eRPM to a notch on each motor</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10.0" y="30" width="111.2" height="48" rx="6"/><text x="65.6" y="51.0" text-anchor="middle" style="font-size:10.5px">ESC</text><text x="65.6" y="65.0" text-anchor="middle" style="font-size:10.5px">bidir DShot</text><rect class="boxa" x="157.2" y="30" width="111.2" height="48" rx="6"/><text x="212.79999999999998" y="51.0" text-anchor="middle" class="b" style="font-size:10.5px">eRPM ÷ pole</text><text x="212.79999999999998" y="65.0" text-anchor="middle" class="b" style="font-size:10.5px">pairs → rpm</text><rect class="boxa" x="304.4" y="30" width="111.2" height="48" rx="6"/><text x="360.0" y="51.0" text-anchor="middle" class="b" style="font-size:10.5px">f = RPM/60</text><text x="360.0" y="65.0" text-anchor="middle" class="b" style="font-size:10.5px">and 2f, 3f</text><rect class="boxa" x="451.59999999999997" y="30" width="111.2" height="48" rx="6"/><text x="507.2" y="51.0" text-anchor="middle" class="b" style="font-size:10.5px">Notch: 4 motors</text><text x="507.2" y="65.0" text-anchor="middle" class="b" style="font-size:10.5px">× 3 harmonics</text><rect class="box" x="598.8" y="30" width="111.2" height="48" rx="6"/><text x="654.4" y="51.0" text-anchor="middle" style="font-size:10.5px">Clean gyro</text><text x="654.4" y="65.0" text-anchor="middle" style="font-size:10.5px">→ D can go higher</text><rect class="box" x="451.59999999999997" y="130" width="111.2" height="48" rx="6"/><text x="507.2" y="151.0" text-anchor="middle" style="font-size:10.5px">…_min_hz:</text><text x="507.2" y="165.0" text-anchor="middle" style="font-size:10.5px">lower bound</text><rect class="box" x="598.8" y="130" width="111.2" height="48" rx="6"/><text x="654.4" y="151.0" text-anchor="middle" style="font-size:10.5px">…_weights:</text><text x="654.4" y="165.0" text-anchor="middle" style="font-size:10.5px">depth</text><path class="ln" d="M121.2 54.0 L157.2 54.0" marker-end="url(#ar)"/><path class="ln" d="M268.4 54.0 L304.4 54.0" marker-end="url(#ar)"/><path class="ln" d="M415.59999999999997 54.0 L451.59999999999997 54.0" marker-end="url(#ar)"/><path class="ln" d="M562.8 54.0 L598.8 54.0" marker-end="url(#ar)"/><path class="ln" d="M507.2 130 L507.2 78" marker-end="url(#ar)"/><text x="10" y="150" text-anchor="start" class="m t">10&quot;: hover f 50–100 Hz —</text><text x="10" y="164" text-anchor="start" class="m t">100 Hz floor misses</text></svg>
