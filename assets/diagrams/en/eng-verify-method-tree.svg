<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Which verification method a requirement gets (NASA SEH §5.3)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Which verification method a requirement gets (NASA SEH §5.3)</text><rect class="box" x="275.0" y="34" width="170.0" height="50" rx="6"/><text x="360.0" y="51.0" text-anchor="middle" style="font-size:10.5px">Is the property visible or</text><text x="360.0" y="63.0" text-anchor="middle" style="font-size:10.5px">measurable on the finished</text><text x="360.0" y="75.0" text-anchor="middle" style="font-size:10.5px">item without operating it?</text><path class="ln" d="M360.0 84 L360.0 99.0 L97.5 99.0 L97.5 114" marker-end="url(#ar)"/><text x="101.5" y="95.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="13.0" y="114" width="169.0" height="50" rx="18"/><text x="97.5" y="131.0" text-anchor="middle" style="font-size:10.5px">Inspection (I)</text><text x="97.5" y="143.0" text-anchor="middle" style="font-size:10.5px">markings, connectors,</text><text x="97.5" y="155.0" text-anchor="middle" style="font-size:10.5px">completeness per the BOM</text><path class="ln" d="M360.0 84 L360.0 99.0 L447.5 99.0 L447.5 114" marker-end="url(#ar)"/><text x="451.5" y="95.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="362.5" y="114" width="170.0" height="50" rx="6"/><text x="447.5" y="131.0" text-anchor="middle" style="font-size:10.5px">Can the item be</text><text x="447.5" y="143.0" text-anchor="middle" style="font-size:10.5px">operated safely</text><text x="447.5" y="155.0" text-anchor="middle" style="font-size:10.5px">in the required conditions?</text><path class="ln" d="M447.5 164 L447.5 179.0 L272.5 179.0 L272.5 194" marker-end="url(#ar)"/><text x="276.5" y="175.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="boxa" x="188.0" y="194" width="169.0" height="50" rx="18"/><text x="272.5" y="211.0" text-anchor="middle" class="b" style="font-size:10.5px">Analysis (A)</text><text x="272.5" y="223.0" text-anchor="middle" class="b" style="font-size:10.5px">calculation, SITL model,</text><text x="272.5" y="235.0" text-anchor="middle" class="b" style="font-size:10.5px">link budget</text><path class="ln" d="M447.5 164 L447.5 179.0 L535.0 179.0 L535.0 194" marker-end="url(#ar)"/><text x="539.0" y="175.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="450.0" y="194" width="170.0" height="50" rx="6"/><text x="535.0" y="211.0" text-anchor="middle" style="font-size:10.5px">Do you need a number</text><text x="535.0" y="223.0" text-anchor="middle" style="font-size:10.5px">with a tolerance, not</text><text x="535.0" y="235.0" text-anchor="middle" style="font-size:10.5px">just “it works”?</text><path class="ln" d="M535.0 244 L535.0 259.0 L447.5 259.0 L447.5 274" marker-end="url(#ar)"/><text x="451.5" y="255.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="363.0" y="274" width="169.0" height="50" rx="18"/><text x="447.5" y="291.0" text-anchor="middle" style="font-size:10.5px">Demonstration (D)</text><text x="447.5" y="303.0" text-anchor="middle" style="font-size:10.5px">arming per the checklist,</text><text x="447.5" y="315.0" text-anchor="middle" style="font-size:10.5px">RTH switch</text><path class="ln" d="M535.0 244 L535.0 259.0 L622.5 259.0 L622.5 274" marker-end="url(#ar)"/><text x="626.5" y="255.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="538.0" y="274" width="169.0" height="50" rx="18"/><text x="622.5" y="291.0" text-anchor="middle" class="b" style="font-size:10.5px">Test (T)</text><text x="622.5" y="303.0" text-anchor="middle" class="b" style="font-size:10.5px">hover current on the stand,</text><text x="622.5" y="315.0" text-anchor="middle" class="b" style="font-size:10.5px">RTL in the field (T-31)</text></svg>
