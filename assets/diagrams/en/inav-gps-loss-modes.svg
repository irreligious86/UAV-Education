<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Position loss in INAV: the reaction by mode</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">INAV 9.1.0 (navigation.c): what the aircraft does when the position estimate is gone</text><path class="ln" d="M360.0 74 L360.0 91.0 L240.0 91.0 L240.0 108" marker-end="url(#ar)"/><text x="246" y="103.5" text-anchor="start" class="a t b" style="font-size:10.5px">RTH, WP</text><path class="ln" d="M360.0 74 L360.0 91.0 L560.0 91.0 L560.0 108" marker-end="url(#ar)"/><text x="566" y="103.5" text-anchor="start" class="a t b" style="font-size:10.5px">CRUISE, COURSE HOLD</text><path class="ln" d="M240.0 150 L240.0 170.0 L120.0 170.0 L120.0 190" marker-end="url(#ar)"/><text x="126" y="184.0" text-anchor="start" class="a t b" style="font-size:10.5px">N = 1–10 s (default 5)</text><path class="ln" d="M240.0 150 L240.0 170.0 L370.0 170.0 L370.0 190" marker-end="url(#ar)"/><text x="376" y="184.0" text-anchor="start" class="a t b" style="font-size:10.5px">0</text><path class="ln" d="M240.0 324 L240.0 344.0 L150.0 344.0 L150.0 364" marker-end="url(#ar)"/><text x="156" y="358.0" text-anchor="start" class="a t b" style="font-size:10.5px">yes</text><path class="ln" d="M240.0 324 L240.0 344.0 L470.0 344.0 L470.0 364" marker-end="url(#ar)"/><text x="476" y="358.0" text-anchor="start" class="a t b" style="font-size:10.5px">no</text><path class="lna" d="M120 244 L120 266 L230 266 L230 282" marker-end="url(#ara)"/><path class="lna" d="M370 244 L370 266 L250 266 L250 282" marker-end="url(#ara)"/><text x="376" y="260" text-anchor="start" class="a t b" style="font-size:10.5px">failsafe-RTH</text><rect class="boxa" x="160.0" y="32.0" width="400.0" height="42.0" rx="6"/><text x="360.0" y="50.5" text-anchor="middle" class="b" style="font-size:10.5px">No position estimate at all (no</text><text x="360.0" y="63.5" text-anchor="middle" style="font-size:10.5px">inav_allow_dead_reckoning left): which mode?</text><rect class="box" x="90.0" y="108.0" width="300.0" height="42.0" rx="6"/><text x="240.0" y="126.5" text-anchor="middle" style="font-size:10.5px">RTH or WP mission:</text><text x="240.0" y="139.5" text-anchor="middle" style="font-size:10.5px">nav_position_timeout?</text><rect class="box" x="460.0" y="108.0" width="200.0" height="42.0" rx="16"/><text x="560.0" y="126.5" text-anchor="middle" style="font-size:10.5px">the mode turns off,</text><text x="560.0" y="139.5" text-anchor="middle" style="font-size:10.5px">the pilot gets control</text><rect class="box" x="15.0" y="190.0" width="210.0" height="54.0" rx="6"/><text x="120.0" y="208.0" text-anchor="middle" style="font-size:10.5px">no position for longer than</text><text x="120.0" y="221.0" text-anchor="middle" style="font-size:10.5px">N s → emergency landing</text><text x="120.0" y="234.0" text-anchor="middle" style="font-size:10.5px">(emergency landing)</text><rect class="box" x="240.0" y="190.0" width="260.0" height="54.0" rx="6"/><text x="370.0" y="208.0" text-anchor="middle" style="font-size:10.5px">waits indefinitely; RTH from a</text><text x="370.0" y="221.0" text-anchor="middle" style="font-size:10.5px">failsafe started without position</text><text x="370.0" y="234.0" text-anchor="middle" style="font-size:10.5px">lands on the spot at once</text><rect class="boxa" x="90.0" y="282.0" width="300.0" height="42.0" rx="6"/><text x="240.0" y="300.5" text-anchor="middle" class="b" style="font-size:10.5px">Emergency landing:</text><text x="240.0" y="313.5" text-anchor="middle" style="font-size:10.5px">is there an altitude estimate?</text><rect class="box" x="15.0" y="364.0" width="270.0" height="54.0" rx="16"/><text x="150.0" y="382.0" text-anchor="middle" style="font-size:10.5px">descends at</text><text x="150.0" y="395.0" text-anchor="middle" style="font-size:10.5px">nav_emerg_landing_speed (default</text><text x="150.0" y="408.0" text-anchor="middle" style="font-size:10.5px">500 cm/s) to the landing detector</text><rect class="box" x="350.0" y="364.0" width="240.0" height="54.0" rx="16"/><text x="470.0" y="382.0" text-anchor="middle" style="font-size:10.5px">no descent rate:</text><text x="470.0" y="395.0" text-anchor="middle" style="font-size:10.5px">fixed throttle</text><text x="470.0" y="408.0" text-anchor="middle" style="font-size:10.5px">failsafe_throttle</text></svg>
