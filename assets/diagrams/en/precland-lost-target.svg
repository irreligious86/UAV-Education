<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Precision landing: losing the target at different heights</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="130" width="124" height="74" rx="6"/><text x="72.0" y="150.0" text-anchor="middle" class="b" style="font-size:10.5px">Target lost</text><text x="72.0" y="164.0" text-anchor="middle" class="b" style="font-size:10.5px">during landing.</text><text x="72.0" y="178.0" text-anchor="middle" class="b" style="font-size:10.5px">Rangefinder</text><text x="72.0" y="192.0" text-anchor="middle" class="b" style="font-size:10.5px">altitude?</text><rect class="box" x="156" y="36" width="140" height="44" rx="6"/><text x="226.0" y="55.0" text-anchor="middle">above</text><text x="226.0" y="69.0" text-anchor="middle">PLND_ALT_MAX</text><rect class="box" x="156" y="145" width="140" height="44" rx="6"/><text x="226.0" y="164.0" text-anchor="middle">between ALT_MIN</text><text x="226.0" y="178.0" text-anchor="middle">and ALT_MAX</text><rect class="box" x="156" y="276" width="140" height="44" rx="6"/><text x="226.0" y="295.0" text-anchor="middle">below</text><text x="226.0" y="309.0" text-anchor="middle">PLND_ALT_MIN</text><rect class="box" x="318" y="36" width="392" height="44" rx="6"/><text x="514.0" y="62.0" text-anchor="middle">a missing target is not yet treated as a problem</text><rect class="boxa" x="318" y="145" width="104" height="44" rx="6"/><text x="370.0" y="171.0" text-anchor="middle" class="b" style="font-size:10.5px">PLND_STRICT?</text><rect class="box" x="440" y="92" width="270" height="36" rx="6"/><text x="575.0" y="114.0" text-anchor="middle">0: lands vertically at once</text><rect class="boxa" x="440" y="138" width="270" height="58" rx="6"/><text x="575.0" y="157.0" text-anchor="middle" class="b">1 (default): keeps descending for</text><text x="575.0" y="171.0" text-anchor="middle" class="b">PLND_TIMEOUT s → a new approach;</text><text x="575.0" y="185.0" text-anchor="middle" class="b">no target — hovers 7 s and lands</text><rect class="box" x="440" y="206" width="270" height="44" rx="6"/><text x="575.0" y="225.0" text-anchor="middle">2: the same new approach;</text><text x="575.0" y="239.0" text-anchor="middle">no target — hovers, does not land</text><rect class="box" x="318" y="276" width="392" height="44" rx="6"/><text x="514.0" y="295.0" text-anchor="middle">landing continues without the target: near the ground</text><text x="514.0" y="309.0" text-anchor="middle">the camera cannot see the whole marker</text><path class="ln" d="M134 167.0 L145.0 167.0 L145.0 58.0 L156 58.0" marker-end="url(#ar)"/><path class="ln" d="M134 167.0 L156 167.0" marker-end="url(#ar)"/><path class="ln" d="M134 167.0 L145.0 167.0 L145.0 298.0 L156 298.0" marker-end="url(#ar)"/><path class="ln" d="M296 58.0 L318 58.0" marker-end="url(#ar)"/><path class="lna" d="M296 167.0 L318 167.0" marker-end="url(#ara)"/><path class="ln" d="M296 298.0 L318 298.0" marker-end="url(#ar)"/><path class="ln" d="M422 167.0 L431.0 167.0 L431.0 110.0 L440 110.0" marker-end="url(#ar)"/><path class="lna" d="M422 167.0 L440 167.0" marker-end="url(#ara)"/><path class="ln" d="M422 167.0 L431.0 167.0 L431.0 228.0 L440 228.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">ArduPilot PLND: what the aircraft does without a target is decided by altitude (a rangefinder is mandatory)</text><text x="10" y="342" text-anchor="start" class="m t">No more than PLND_RET_MAX new approaches per mode entry</text><text x="10" y="358" text-anchor="start" class="m t">PX4 uses the same logic near the ground: below PLD_FAPPR_ALT the descent continues even if the target is lost</text></svg>
