<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">A synchronous service call in a callback blocks the node</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="30" text-anchor="start" class="d b" style="font-size:11.5px">cli.call(req) inside a timer callback: a synchronous call</text><text x="16" y="64" text-anchor="start" class="b" style="font-size:11px">executor</text><text x="16" y="78" text-anchor="start" class="m t" style="font-size:10.5px">(single thread)</text><text x="16" y="126" text-anchor="start" style="font-size:11px">server node /s</text><line class="lnm" x1="180" y1="80" x2="700" y2="80"/><line class="lnm" x1="180" y1="134" x2="700" y2="134"/><rect class="box" x="180.0" y="52" width="520.0" height="26" rx="3" style="stroke:var(--gc-signal-red, #e8636b)"/><text x="326.5454545454545" y="69" text-anchor="start" class="d" style="font-size:10.5px">tick(): cli.call(req) waits for the reply — and never returns</text><path class="ln" d="M194.2 78 L217.8 106" marker-end="url(#ar)"/><text x="200.0" y="96.0" text-anchor="end" class="m t" style="font-size:10.5px">request</text><rect class="box" x="217.8" y="106.0" width="75.6" height="26.0" rx="3"/><text x="255.63636363636363" y="123" text-anchor="middle" style="font-size:10.5px">processing</text><path class="ln" d="M293.5 106 L312.4 78" marker-end="url(#ar)" style="stroke:var(--gc-signal-red, #e8636b)"/><text x="321.8181818181818" y="123" text-anchor="start" class="m t" style="font-size:10.5px">the reply waits in the queue: the same executor must deliver it</text><text x="298.1818181818182" y="48" text-anchor="middle" class="d b" style="font-size:12px">×</text><text x="416.3636363636364" y="48" text-anchor="middle" class="d b" style="font-size:12px">×</text><text x="534.5454545454545" y="48" text-anchor="middle" class="d b" style="font-size:12px">×</text><text x="652.7272727272727" y="48" text-anchor="middle" class="d b" style="font-size:12px">×</text><text x="180.0" y="48" text-anchor="start" class="m t" style="font-size:10.5px">tick 0</text><text x="307.6363636363636" y="48" text-anchor="start" class="d t" style="font-size:10.5px">tick missed</text><text x="16" y="172" text-anchor="start" class="a b" style="font-size:11.5px">rclpy: cli.call_async(req) — the callback returns at once</text><text x="16" y="206" text-anchor="start" class="b" style="font-size:11px">executor</text><text x="16" y="220" text-anchor="start" class="m t" style="font-size:10.5px">(single thread)</text><text x="16" y="268" text-anchor="start" style="font-size:11px">server node /s</text><line class="lnm" x1="180" y1="222" x2="700" y2="222"/><line class="lnm" x1="180" y1="276" x2="700" y2="276"/><rect class="boxa" x="180.0" y="194.0" width="21.3" height="26.0" rx="3"/><rect class="boxa" x="298.2" y="194.0" width="21.3" height="26.0" rx="3"/><rect class="boxa" x="416.4" y="194.0" width="21.3" height="26.0" rx="3"/><rect class="boxa" x="534.5" y="194.0" width="21.3" height="26.0" rx="3"/><rect class="boxa" x="652.7" y="194.0" width="21.3" height="26.0" rx="3"/><text x="207.63636363636363" y="190" text-anchor="start" class="a t" style="font-size:10.5px">tick() every 50 ms: setpoints keep flowing</text><path class="ln" d="M194.2 220 L217.8 248" marker-end="url(#ar)"/><text x="200.0" y="238.0" text-anchor="end" class="m t" style="font-size:10.5px">request</text><rect class="box" x="217.8" y="248.0" width="99.3" height="26.0" rx="3"/><text x="267.45454545454544" y="265" text-anchor="middle" style="font-size:10.5px">processing</text><path class="lna" d="M317.1 248 L336.0 220" marker-end="url(#ara)"/><rect class="box" x="336.0" y="194.0" width="33.1" height="26.0" rx="3"/><text x="373.8181818181818" y="238" text-anchor="start" class="a t" style="font-size:10.5px">future done callback: the reply is handled between ticks</text><line x1="180" y1="294" x2="700" y2="294" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><line x1="180.0" y1="294" x2="180.0" y2="299" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="180.0" y="312" text-anchor="middle" class="m t" style="font-size:10.5px">0 ms</text><line x1="298.2" y1="294" x2="298.2" y2="299" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="298.1818181818182" y="312" text-anchor="middle" class="m t" style="font-size:10.5px">50 ms</text><line x1="416.4" y1="294" x2="416.4" y2="299" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="416.3636363636364" y="312" text-anchor="middle" class="m t" style="font-size:10.5px">100 ms</text><line x1="534.5" y1="294" x2="534.5" y2="299" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="534.5454545454545" y="312" text-anchor="middle" class="m t" style="font-size:10.5px">150 ms</text><line x1="652.7" y1="294" x2="652.7" y2="299" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="652.7272727272727" y="312" text-anchor="middle" class="m t" style="font-size:10.5px">200 ms</text><text x="16" y="312" text-anchor="start" class="m t" style="font-size:10.5px">timer 0.05 s</text></svg>
