<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="100%" role="img" aria-labelledby="t" style="max-width:740px;display:block;margin:0 auto"><title id="t">INAV 9.1 adjustments: from the switch to EEPROM</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="14" width="165" height="44" rx="6"/><text x="92.5" y="33.0" text-anchor="middle">Range channel</text><text x="92.5" y="47.0" text-anchor="middle">start ≤ AUX &lt; end?</text><rect class="box" x="195" y="14" width="160" height="44" rx="6"/><text x="275.0" y="33.0" text-anchor="middle">adjrange line</text><text x="275.0" y="47.0" text-anchor="middle">0…19, function ≠ 0</text><rect class="boxa" x="375" y="14" width="170" height="44" rx="6"/><text x="460.0" y="33.0" text-anchor="middle" class="b">Slot 0…3 free?</text><text x="460.0" y="47.0" text-anchor="middle" class="b">the lower index takes it</text><rect class="box" x="565" y="14" width="165" height="44" rx="6"/><text x="647.5" y="33.0" text-anchor="middle">Adjustment channel</text><text x="647.5" y="47.0" text-anchor="middle">momentary switch</text><rect class="box" x="10" y="104" width="165" height="44" rx="6"/><text x="92.5" y="123.0" text-anchor="middle">&gt; 1700: + step</text><text x="92.5" y="137.0" text-anchor="middle">2 beeps</text><rect class="box" x="195" y="104" width="160" height="44" rx="6"/><text x="275.0" y="123.0" text-anchor="middle">&lt; 1300: − step</text><text x="275.0" y="137.0" text-anchor="middle">1 beep</text><rect class="box" x="375" y="104" width="170" height="44" rx="6"/><text x="460.0" y="123.0" text-anchor="middle">1300…1700: nothing</text><text x="460.0" y="137.0" text-anchor="middle">slot armed</text><rect class="box" x="565" y="104" width="165" height="44" rx="6"/><text x="647.5" y="123.0" text-anchor="middle">Hold: the first step</text><text x="647.5" y="137.0" text-anchor="middle">at once, repeat 500 ms</text><rect class="boxa" x="10" y="196" width="345" height="44" rx="6"/><text x="182.5" y="215.0" text-anchor="middle" class="b">Value in RAM, within the table limits</text><text x="182.5" y="229.0" text-anchor="middle" class="b">OSD: the number blinks · Blackbox: an event</text><rect class="boxa" x="375" y="196" width="170" height="44" rx="6"/><text x="460.0" y="215.0" text-anchor="middle" class="b">Writing the whole config:</text><text x="460.0" y="229.0" text-anchor="middle" class="b">stick save, CLI, CMS</text><rect class="box" x="565" y="196" width="165" height="44" rx="6"/><text x="647.5" y="215.0" text-anchor="middle">…and as a side effect: stats,</text><text x="647.5" y="229.0" text-anchor="middle">autotrim, profile change</text><path class="ln" d="M175 36.0 L195 36.0" marker-end="url(#ar)"/><path class="ln" d="M355 36.0 L375 36.0" marker-end="url(#ar)"/><path class="ln" d="M545 36.0 L565 36.0" marker-end="url(#ar)"/><path class="ln" d="M647.5 58 L647.5 81.0 L92.5 81.0 L92.5 104" marker-end="url(#ar)"/><path class="ln" d="M647.5 58 L647.5 81.0 L275.0 81.0 L275.0 104" marker-end="url(#ar)"/><path class="ln" d="M647.5 58 L647.5 81.0 L460.0 81.0 L460.0 104" marker-end="url(#ar)"/><path class="ln" d="M647.5 58 L647.5 104" marker-end="url(#ar)"/><path class="lna" d="M92.5 148 L92.5 172.0 L182.5 172.0 L182.5 196" marker-end="url(#ara)"/><path class="lna" d="M275.0 148 L275.0 172.0 L182.5 172.0 L182.5 196" marker-end="url(#ara)"/><path class="lna" d="M355 218.0 L375 218.0" marker-end="url(#ara)"/><path class="ln" d="M545 218.0 L565 218.0" marker-end="url(#ar)"/><text x="10" y="266" text-anchor="start" class="m t">A selector position without a line = adjustment off.</text><text x="10" y="282" text-anchor="start" class="w t">Without an EEPROM write the value lasts only until power-off.</text></svg>
