<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">INAV fixed-wing Autotune: what changes in each mode</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Fixed-wing Autotune in INAV 9.1.0: what it changes depends on the mode under it</text><rect class="box" x="40.0" y="30.0" width="640.0" height="40.0" rx="6"/><text x="360.0" y="47.5" text-anchor="middle" style="font-size:10.5px">The response is recorded only while the stick is deflected beyond fw_autotune_min_stick (default 50 %);</text><text x="360.0" y="60.5" text-anchor="middle" style="font-size:10.5px">the first changes on an axis come after 5 s of such movement (250 samples of 20 ms)</text><path class="ln" d="M360 70 L360 96" marker-end="url(#ar)"/><path class="ln" d="M360.0 136 L360.0 157.0 L85.0 157.0 L85.0 178" marker-end="url(#ar)"/><text x="91" y="171.5" text-anchor="start" class="a t b" style="font-size:10.5px">MANUAL</text><path class="ln" d="M360.0 136 L360.0 157.0 L250.0 157.0 L250.0 178" marker-end="url(#ar)"/><text x="256" y="171.5" text-anchor="start" class="a t b" style="font-size:10.5px">ANGLE</text><path class="ln" d="M360.0 136 L360.0 157.0 L530.0 157.0 L530.0 178" marker-end="url(#ar)"/><text x="536" y="171.5" text-anchor="start" class="a t b" style="font-size:10.5px">ACRO, HORIZON</text><path class="ln" d="M530.0 232 L530.0 250.0 L410.0 250.0 L410.0 268" marker-end="url(#ar)"/><text x="416" y="263.0" text-anchor="start" class="a t b" style="font-size:10.5px">AUTO (default)</text><path class="ln" d="M530.0 232 L530.0 250.0 L545.0 250.0 L545.0 268" marker-end="url(#ar)"/><text x="551" y="263.0" text-anchor="start" class="a t b" style="font-size:10.5px">LIMIT</text><path class="ln" d="M530.0 232 L530.0 250.0 L660.0 250.0 L660.0 268" marker-end="url(#ar)"/><text x="666" y="263.0" text-anchor="start" class="a t b" style="font-size:10.5px">FIXED</text><path class="ln" d="M250 232 L250 338"/><path class="ln" d="M410 322 L410 338"/><path class="ln" d="M545 322 L545 338"/><path class="ln" d="M660 322 L660 338"/><path class="ln" d="M250 338 L660 338"/><path class="ln" d="M360 338 L360 354" marker-end="url(#ar)"/><rect class="box" x="110.0" y="354.0" width="500.0" height="40.0" rx="6"/><text x="360.0" y="371.5" text-anchor="middle" style="font-size:10.5px">Autotune does not touch P and I (set them by hand); the result is not saved by itself:</text><text x="360.0" y="384.5" text-anchor="middle" style="font-size:10.5px">after landing, disarm and use the save stick command or save</text><rect class="boxa" x="230.0" y="96.0" width="260.0" height="40.0" rx="6"/><text x="360.0" y="113.5" text-anchor="middle" class="b" style="font-size:10.5px">AUTOTUNE enabled on top of</text><text x="360.0" y="126.5" text-anchor="middle" style="font-size:10.5px">which mode?</text><rect class="box" x="10.0" y="178.0" width="150.0" height="42.0" rx="16"/><text x="85.0" y="203.0" text-anchor="middle" style="font-size:10.5px">does not work</text><rect class="box" x="170.0" y="178.0" width="160.0" height="54.0" rx="16"/><text x="250.0" y="196.0" text-anchor="middle" style="font-size:10.5px">fw_ff_roll only,</text><text x="250.0" y="209.0" text-anchor="middle" style="font-size:10.5px">fw_ff_pitch, fw_ff_yaw;</text><text x="250.0" y="222.0" text-anchor="middle" style="font-size:10.5px">rates — never</text><rect class="box" x="370.0" y="178.0" width="320.0" height="54.0" rx="6"/><text x="530.0" y="196.0" text-anchor="middle" style="font-size:10.5px">fw_autotune_rate_adjustment?</text><text x="530.0" y="209.0" text-anchor="middle" style="font-size:10.5px">the rate is fitted on a fraction of travel</text><text x="530.0" y="222.0" text-anchor="middle" style="font-size:10.5px">fw_autotune_max_rate_deflection (default 90 %)</text><rect class="boxa" x="350.0" y="268.0" width="120.0" height="54.0" rx="16"/><text x="410.0" y="292.5" text-anchor="middle" class="b" style="font-size:10.5px">FF + rates</text><text x="410.0" y="305.5" text-anchor="middle" style="font-size:10.5px">up and down</text><rect class="box" x="485.0" y="268.0" width="120.0" height="54.0" rx="16"/><text x="545.0" y="292.5" text-anchor="middle" style="font-size:10.5px">FF + rates</text><text x="545.0" y="305.5" text-anchor="middle" style="font-size:10.5px">down only</text><rect class="box" x="615.0" y="268.0" width="90.0" height="54.0" rx="16"/><text x="660.0" y="299.0" text-anchor="middle" style="font-size:10.5px">FF only</text></svg>
