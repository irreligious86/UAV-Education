<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Preflight check: go on or stop</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Preflight check: any “no” means no takeoff</text><rect class="box" x="20" y="34" width="400" height="38" rx="6"/><text x="32" y="57.0" text-anchor="start" style="font-size:11.5px">1. Props: intact, tight, direction per the diagram</text><path class="ln" d="M220.0 72 L220.0 85" marker-end="url(#ar)"/><path class="ln" d="M420 53.0 L536 53.0" marker-end="url(#ar)"/><text x="460" y="48.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="86" width="400" height="38" rx="6"/><text x="32" y="109.0" text-anchor="start" style="font-size:11.5px">2. Battery: no swelling, 4.1–4.2 V/cell, strap</text><path class="ln" d="M220.0 124 L220.0 137" marker-end="url(#ar)"/><path class="ln" d="M420 105.0 L536 105.0" marker-end="url(#ar)"/><text x="460" y="100.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="138" width="400" height="38" rx="6"/><text x="32" y="161.0" text-anchor="start" style="font-size:11.5px">3. RC and VTX antennas in place, not in the prop plane</text><path class="ln" d="M220.0 176 L220.0 189" marker-end="url(#ar)"/><path class="ln" d="M420 157.0 L536 157.0" marker-end="url(#ar)"/><text x="460" y="152.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="190" width="400" height="38" rx="6"/><text x="32" y="213.0" text-anchor="start" style="font-size:11.5px">4. Radio: model, ARM/PREARM off, failsafe test</text><path class="ln" d="M220.0 228 L220.0 241" marker-end="url(#ar)"/><path class="ln" d="M420 209.0 L536 209.0" marker-end="url(#ar)"/><text x="460" y="204.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="242" width="400" height="38" rx="6"/><text x="32" y="265.0" text-anchor="start" style="font-size:11.5px">5. OSD: voltage, LQ/RSSI, no flags</text><path class="ln" d="M220.0 280 L220.0 293" marker-end="url(#ar)"/><path class="ln" d="M420 261.0 L536 261.0" marker-end="url(#ar)"/><text x="460" y="256.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="294" width="400" height="38" rx="6"/><text x="32" y="317.0" text-anchor="start" style="font-size:11.5px">6. Area: people beyond 10–15 m (5&quot;), 30 m (heavy)</text><path class="ln" d="M220.0 332 L220.0 345" marker-end="url(#ar)"/><path class="ln" d="M420 313.0 L536 313.0" marker-end="url(#ar)"/><text x="460" y="308.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="boxa" x="20" y="346" width="400" height="38" rx="6"/><text x="32" y="369.0" text-anchor="start" class="b" style="font-size:11.5px">7. Arm → hover at 0.5–1 m for 2–3 s: response, sound</text><path class="lna" d="M220.0 384 L220.0 397" marker-end="url(#ara)"/><rect class="box" x="540" y="34" width="170" height="298" rx="8" style="stroke:var(--gc-signal-red, #e8636b);stroke-width:1.6"/><text x="625" y="163.0" text-anchor="middle" style="font-size:11.5px">STOP</text><text x="625" y="179.0" text-anchor="middle" style="font-size:11.5px">no takeoff:</text><text x="625" y="195.0" text-anchor="middle" style="font-size:11.5px">fix the cause,</text><text x="625" y="211.0" text-anchor="middle" style="font-size:11.5px">redo the item</text><path class="ln" d="M420 365.0 L536 365.0" marker-end="url(#ar)"/><text x="478" y="360.0" text-anchor="middle" class="w t" style="font-size:10px">anything odd</text><rect class="box" x="540" y="346" width="170" height="38" rx="18" style="stroke:var(--gc-signal-amber, #f0b24c);stroke-width:1.6"/><text x="625" y="369.0" text-anchor="middle" style="font-size:11.5px">land</text><rect class="boxa" x="20" y="398" width="400" height="38" rx="18"/><text x="220.0" y="421.0" text-anchor="middle" class="b">Flight</text><text x="16" y="456" text-anchor="start" class="m t">A flag or PreArm: fix the cause, do not disable the check</text></svg>
