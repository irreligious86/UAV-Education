<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Предполётная проверка: идти дальше или стоп</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Предполётная проверка: любое «нет» — не взлетаем</text><rect class="box" x="20" y="34" width="400" height="38" rx="6"/><text x="32" y="57.0" text-anchor="start" style="font-size:11.5px">1. Пропы: целые, затянуты, направление по схеме</text><path class="ln" d="M220.0 72 L220.0 85" marker-end="url(#ar)"/><path class="ln" d="M420 53.0 L536 53.0" marker-end="url(#ar)"/><text x="460" y="48.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="86" width="400" height="38" rx="6"/><text x="32" y="109.0" text-anchor="start" style="font-size:11.5px">2. АКБ: без вздутий, 4.1–4.2 В/эл., ремень</text><path class="ln" d="M220.0 124 L220.0 137" marker-end="url(#ar)"/><path class="ln" d="M420 105.0 L536 105.0" marker-end="url(#ar)"/><text x="460" y="100.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="138" width="400" height="38" rx="6"/><text x="32" y="161.0" text-anchor="start" style="font-size:11.5px">3. Антенны RC и VTX на месте, не в плоскости пропов</text><path class="ln" d="M220.0 176 L220.0 189" marker-end="url(#ar)"/><path class="ln" d="M420 157.0 L536 157.0" marker-end="url(#ar)"/><text x="460" y="152.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="190" width="400" height="38" rx="6"/><text x="32" y="213.0" text-anchor="start" style="font-size:11.5px">4. Пульт: модель, ARM/PREARM выкл., failsafe-тест</text><path class="ln" d="M220.0 228 L220.0 241" marker-end="url(#ar)"/><path class="ln" d="M420 209.0 L536 209.0" marker-end="url(#ar)"/><text x="460" y="204.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="242" width="400" height="38" rx="6"/><text x="32" y="265.0" text-anchor="start" style="font-size:11.5px">5. OSD: напряжение, LQ/RSSI, флагов нет</text><path class="ln" d="M220.0 280 L220.0 293" marker-end="url(#ar)"/><path class="ln" d="M420 261.0 L536 261.0" marker-end="url(#ar)"/><text x="460" y="256.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="box" x="20" y="294" width="400" height="38" rx="6"/><text x="32" y="317.0" text-anchor="start" style="font-size:11.5px">6. Зона: люди вне 10–15 м (5&quot;), 30 м (тяжёлый)</text><path class="ln" d="M220.0 332 L220.0 345" marker-end="url(#ar)"/><path class="ln" d="M420 313.0 L536 313.0" marker-end="url(#ar)"/><text x="460" y="308.0" text-anchor="middle" class="d t" style="font-size:10px">no</text><rect class="boxa" x="20" y="346" width="400" height="38" rx="6"/><text x="32" y="369.0" text-anchor="start" class="b" style="font-size:11.5px">7. Арм → висение 0.5–1 м, 2–3 с: отклик, звук</text><path class="lna" d="M220.0 384 L220.0 397" marker-end="url(#ara)"/><rect class="box" x="540" y="34" width="170" height="298" rx="8" style="stroke:var(--gc-signal-red, #e8636b);stroke-width:1.6"/><text x="625" y="163.0" text-anchor="middle" style="font-size:11.5px">СТОП</text><text x="625" y="179.0" text-anchor="middle" style="font-size:11.5px">не взлетаем:</text><text x="625" y="195.0" text-anchor="middle" style="font-size:11.5px">устранить причину,</text><text x="625" y="211.0" text-anchor="middle" style="font-size:11.5px">пункт заново</text><path class="ln" d="M420 365.0 L536 365.0" marker-end="url(#ar)"/><text x="478" y="360.0" text-anchor="middle" class="w t" style="font-size:10px">странность</text><rect class="box" x="540" y="346" width="170" height="38" rx="18" style="stroke:var(--gc-signal-amber, #f0b24c);stroke-width:1.6"/><text x="625" y="369.0" text-anchor="middle" style="font-size:11.5px">посадка</text><rect class="boxa" x="20" y="398" width="400" height="38" rx="18"/><text x="220.0" y="421.0" text-anchor="middle" class="b">Flight</text><text x="16" y="456" text-anchor="start" class="m t">Флаг или PreArm — устранить причину, а не отключать проверку</text></svg>
