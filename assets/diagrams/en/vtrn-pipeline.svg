<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Matching a frame to the map: from the camera to GPS_INPUT</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="34" width="150" height="54" rx="6"/><text x="85.0" y="51.0" text-anchor="middle" class="b">Camera down</text><text x="85.0" y="65.0" text-anchor="middle" class="b">640×480, f 500 px</text><text x="85.0" y="79.0" text-anchor="middle" class="b">AGL 100 m: 128×96 m</text><rect class="box" x="190" y="34" width="150" height="54" rx="6"/><text x="265.0" y="51.0" text-anchor="middle">Rectify</text><text x="265.0" y="65.0" text-anchor="middle">s = (AGL/f)/GSD</text><text x="265.0" y="79.0" text-anchor="middle">rotation to heading</text><rect class="box" x="370" y="34" width="150" height="54" rx="6"/><text x="445.0" y="51.0" text-anchor="middle">Features</text><text x="445.0" y="65.0" text-anchor="middle">ORB / AKAZE</text><text x="445.0" y="79.0" text-anchor="middle">SuperPoint</text><rect class="box" x="550" y="34" width="150" height="54" rx="6"/><text x="625.0" y="51.0" text-anchor="middle">3σ map window</text><text x="625.0" y="65.0" text-anchor="middle">ratio test 0.8</text><text x="625.0" y="79.0" text-anchor="middle">LightGlue</text><rect class="box" x="550" y="134" width="150" height="54" rx="6"/><text x="625.0" y="151.0" text-anchor="middle">Homography</text><text x="625.0" y="165.0" text-anchor="middle">RANSAC, 3 px</text><text x="625.0" y="179.0" text-anchor="middle">N = f(w⁴)</text><rect class="box" x="370" y="134" width="150" height="54" rx="6"/><text x="445.0" y="151.0" text-anchor="middle">Checks</text><text x="445.0" y="165.0" text-anchor="middle">inliers ≥ 15</text><text x="445.0" y="179.0" text-anchor="middle">scale 0.8–1.25</text><rect class="boxa" x="190" y="134" width="150" height="54" rx="6"/><text x="265.0" y="151.0" text-anchor="middle" class="b">lat/lon, σ</text><text x="265.0" y="165.0" text-anchor="middle" class="b">heading correction</text><text x="265.0" y="179.0" text-anchor="middle" class="b">25–200 ms</text><rect class="box" x="10" y="234" width="150" height="54" rx="6"/><text x="85.0" y="251.0" text-anchor="middle">frame-to-frame VO</text><text x="85.0" y="265.0" text-anchor="middle">2–5 Hz, 15–50 ms</text><text x="85.0" y="279.0" text-anchor="middle">shift · AGL / f</text><rect class="box" x="190" y="234" width="150" height="54" rx="6"/><text x="265.0" y="251.0" text-anchor="middle">Filter</text><text x="265.0" y="265.0" text-anchor="middle">3σ gate</text><text x="265.0" y="279.0" text-anchor="middle">3 rejections → reset</text><rect class="boxa" x="370" y="234" width="150" height="54" rx="6"/><text x="445.0" y="251.0" text-anchor="middle" class="b">GPS_INPUT 5 Hz</text><text x="445.0" y="265.0" text-anchor="middle" class="b">horiz_accuracy</text><text x="445.0" y="279.0" text-anchor="middle" class="b">blind → fix 1</text><rect class="boxa" x="550" y="234" width="150" height="54" rx="6"/><text x="625.0" y="251.0" text-anchor="middle" class="b">EKF3</text><text x="625.0" y="265.0" text-anchor="middle" class="b">GPS2_TYPE = 14</text><text x="625.0" y="279.0" text-anchor="middle" class="b">UseBest, gates</text><path class="ln" d="M160 61.0 L190 61.0" marker-end="url(#ar)"/><path class="ln" d="M340 61.0 L370 61.0" marker-end="url(#ar)"/><path class="ln" d="M520 61.0 L550 61.0" marker-end="url(#ar)"/><path class="ln" d="M625.0 88 L625.0 134" marker-end="url(#ar)"/><path class="ln" d="M550 161.0 L520 161.0" marker-end="url(#ar)"/><path class="ln" d="M370 161.0 L340 161.0" marker-end="url(#ar)"/><path class="lna" d="M265.0 188 L265.0 234" marker-end="url(#ara)"/><path class="ln" d="M160 261.0 L190 261.0" marker-end="url(#ar)"/><path class="lna" d="M340 261.0 L370 261.0" marker-end="url(#ara)"/><path class="lna" d="M520 261.0 L550 261.0" marker-end="url(#ara)"/><text x="10" y="146" text-anchor="start" class="m t">Map database offline:</text><text x="10" y="160" text-anchor="start" class="m t">51 411 ORB, 1.6 MB</text><text x="10" y="174" text-anchor="start" class="m t">No prediction: VPR</text><text x="10" y="188" text-anchor="start" class="m t">top-5 + geometry</text><text x="10" y="312" text-anchor="start" class="m t">A failed check or gate → the fix is discarded, VO carries on, σ grows.</text><text x="10" y="326" text-anchor="start" class="m t">2 s without VO → fix_type 1; below the working altitude (40 m) — flow and rangefinder.</text></svg>
