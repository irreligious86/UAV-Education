<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 186" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ArduPilot 4.7: the signal path from the function to the pad</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="14" y="34" width="122" height="48" rx="6"/><text x="75.0" y="55.0" text-anchor="middle" style="font-size:10.5px">Source</text><text x="75.0" y="69.0" text-anchor="middle" style="font-size:10.5px">mixer, RC, Lua</text><text x="75.0" y="95" text-anchor="middle" class="m t">function value</text><rect class="boxa" x="160" y="34" width="122" height="48" rx="6"/><text x="221.0" y="55.0" text-anchor="middle" class="b" style="font-size:10.5px">Function</text><text x="221.0" y="69.0" text-anchor="middle" class="b" style="font-size:10.5px">Motor1, Elevator</text><text x="221.0" y="95" text-anchor="middle" class="m t">SERVOn_FUNCTION</text><rect class="box" x="306" y="34" width="122" height="48" rx="6"/><text x="367.0" y="55.0" text-anchor="middle" style="font-size:10.5px">SRV_Channel</text><text x="367.0" y="69.0" text-anchor="middle" style="font-size:10.5px">MIN/MAX/TRIM</text><text x="367.0" y="95" text-anchor="middle" class="m t">microseconds</text><rect class="boxa" x="452" y="34" width="122" height="48" rx="6"/><text x="513.0" y="55.0" text-anchor="middle" class="b" style="font-size:10.5px">RCOutput</text><text x="513.0" y="69.0" text-anchor="middle" class="b" style="font-size:10.5px">PWM, DShot, LED</text><text x="513.0" y="95" text-anchor="middle" class="m t">protocol, frame</text><rect class="box" x="598" y="34" width="108" height="48" rx="6"/><text x="652.0" y="55.0" text-anchor="middle" style="font-size:10.5px">Timer</text><text x="652.0" y="69.0" text-anchor="middle" style="font-size:10.5px">output group</text><text x="652.0" y="95" text-anchor="middle" class="m t">rate, DMA</text><path class="ln" d="M136 58.0 L160 58.0" marker-end="url(#ar)"/><path class="lna" d="M282 58.0 L306 58.0" marker-end="url(#ara)"/><path class="ln" d="M428 58.0 L452 58.0" marker-end="url(#ar)"/><path class="lna" d="M574 58.0 L598 58.0" marker-end="url(#ara)"/><text x="14" y="122" text-anchor="start" class="a t">Per output: SERVOn_FUNCTION, MIN, MAX, TRIM, REVERSED. One function can be given to several outputs.</text><text x="14" y="138" text-anchor="start" class="m t">Per timer: protocol (MOT_PWM_TYPE, SERVO_BLH_OTYPE, LED strip) and rate (RC_SPEED, SERVO_RATE).</text><text x="14" y="154" text-anchor="start" class="w t">A PWM output in a group with DShot or an LED strip is disabled: PreArm “… on disabled channel”.</text><text x="14" y="170" text-anchor="start" class="m t">An output with function −1 (GPIO) is removed from its group at boot and does not affect the timer.</text></svg>
