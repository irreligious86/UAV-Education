<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ArduPilot 4.7.2: from the channel pulse to the aux function call</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="14" y="40" width="112" height="48" rx="6"/><text x="70.0" y="61.0" text-anchor="middle" style="font-size:10.5px">Channel n</text><text x="70.0" y="75.0" text-anchor="middle" style="font-size:10.5px">polled at 10 Hz</text><text x="70.0" y="101" text-anchor="middle" class="m t">RCn_OPTION ≠ 0</text><rect class="boxa" x="150" y="40" width="124" height="48" rx="6"/><text x="212.0" y="61.0" text-anchor="middle" class="b" style="font-size:10.5px">Pulse valid?</text><text x="212.0" y="75.0" text-anchor="middle" class="b" style="font-size:10.5px">800 &lt; PWM &lt; 2200</text><text x="212.0" y="101" text-anchor="middle" class="m t">otherwise skipped</text><rect class="box" x="298" y="40" width="124" height="48" rx="6"/><text x="360.0" y="61.0" text-anchor="middle" style="font-size:10.5px">Position</text><text x="360.0" y="75.0" text-anchor="middle" style="font-size:10.5px">LOW / MID / HIGH</text><text x="360.0" y="101" text-anchor="middle" class="m t">&lt; 1200 · &gt; 1800 µs</text><rect class="boxa" x="446" y="40" width="124" height="48" rx="6"/><text x="508.0" y="61.0" text-anchor="middle" class="b" style="font-size:10.5px">Changed?</text><text x="508.0" y="75.0" text-anchor="middle" class="b" style="font-size:10.5px">held for 200 ms</text><text x="508.0" y="101" text-anchor="middle" class="m t">otherwise restart the count</text><rect class="box" x="594" y="40" width="112" height="48" rx="6"/><text x="650.0" y="61.0" text-anchor="middle" style="font-size:10.5px">Function</text><text x="650.0" y="75.0" text-anchor="middle" style="font-size:10.5px">+ AUXF log entry</text><text x="650.0" y="101" text-anchor="middle" class="m t">one call</text><path class="ln" d="M126 64.0 L150 64.0" marker-end="url(#ar)"/><path class="lna" d="M274 64.0 L298 64.0" marker-end="url(#ara)"/><path class="ln" d="M422 64.0 L446 64.0" marker-end="url(#ar)"/><path class="lna" d="M570 64.0 L594 64.0" marker-end="url(#ara)"/><text x="14" y="128" text-anchor="start" class="a t">No hysteresis: 1200…1800 µs inclusive is MIDDLE. 200–300 ms from the flick to the call.</text><text x="14" y="144" text-anchor="start" class="m t">Reversing a switch: RCn_REVERSED = 1 and bit 7 (128) in RC_OPTIONS — both at once.</text><text x="14" y="160" text-anchor="start" class="m t">First receiver frame: the remembered position is −1, so the current one executes after 200 ms.</text><text x="14" y="176" text-anchor="start" class="w t">Exceptions: 153, 154, 165 (arm) and 22 (parachute) only remember the first position.</text><text x="14" y="192" text-anchor="start" class="m t">In a radio failsafe Copter does not read aux channels; the mode channel is read the same way, but with six positions.</text><text x="14" y="208" text-anchor="start" class="d t">Dangerous in flight: 31 and 165 LOW stop the motors; 81 HIGH and 153 LOW disarm without an altitude check.</text></svg>
