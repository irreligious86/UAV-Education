<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">A command checked with COMMAND_ACK</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="36" width="330" height="46" rx="6"/><text x="175.0" y="56.0" text-anchor="middle" class="b">Attempt k of 3: COMMAND_LONG</text><text x="175.0" y="70.0" text-anchor="middle" class="b">(target_system, target_component, cmd)</text><rect class="box" x="10" y="112" width="330" height="46" rx="6"/><text x="175.0" y="132.0" text-anchor="middle">Wait for COMMAND_ACK up to 1 s</text><text x="175.0" y="146.0" text-anchor="middle">(timeout = 1.0)</text><rect class="box" x="10" y="188" width="330" height="38" rx="6"/><text x="175.0" y="211.0" text-anchor="middle">ack.command == cmd?</text><rect class="box" x="10" y="256" width="330" height="38" rx="6"/><text x="175.0" y="279.0" text-anchor="middle">ack.result?</text><rect class="boxa" x="10" y="324" width="330" height="38" rx="6"/><text x="175.0" y="347.0" text-anchor="middle" class="b">0 ACCEPTED → return True</text><rect class="box" x="410" y="112" width="300" height="46" rx="6"/><text x="560.0" y="132.0" text-anchor="middle">No ACK within 1 s:</text><text x="560.0" y="146.0" text-anchor="middle">k &lt; 3 → retry, k = 3 → TimeoutError</text><rect class="box" x="410" y="185" width="300" height="44" rx="6"/><text x="560.0" y="204.0" text-anchor="middle">ACK for another command:</text><text x="560.0" y="218.0" text-anchor="middle">not ours — keep waiting</text><rect class="box" x="410" y="246" width="300" height="44" rx="6"/><text x="560.0" y="265.0" text-anchor="middle">5 IN_PROGRESS: keep waiting</text><text x="560.0" y="279.0" text-anchor="middle">in the same 1 s window</text><rect class="box" x="410" y="306" width="300" height="44" rx="6"/><text x="560.0" y="325.0" text-anchor="middle">any other code (1–4, 6–10:</text><text x="560.0" y="339.0" text-anchor="middle">denied, failed…) → RuntimeError</text><path class="lna" d="M175.0 82 L175.0 112" marker-end="url(#ara)"/><path class="ln" d="M175.0 158 L175.0 188" marker-end="url(#ar)"/><text x="181.0" y="169.0" text-anchor="start" class="m t" style="font-size:10px">ACK arrived</text><path class="ln" d="M175.0 226 L175.0 256" marker-end="url(#ar)"/><text x="181.0" y="237.0" text-anchor="start" class="m t" style="font-size:10px">yes</text><path class="lna" d="M175.0 294 L175.0 324" marker-end="url(#ara)"/><path class="ln" d="M340 135.0 L410 135.0" marker-end="url(#ar)"/><path class="ln" d="M340 207.0 L410 207.0" marker-end="url(#ar)"/><text x="375.0" y="200.0" text-anchor="start" class="m t" style="font-size:10px">no</text><path class="ln" d="M340 275.0 L375.0 275.0 L375.0 268.0 L410 268.0" marker-end="url(#ar)"/><path class="ln" d="M340 275.0 L375.0 275.0 L375.0 328.0 L410 328.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">A reliable command from the module: cmd(m, command, *params, retries=3, timeout=1.0)</text><text x="420" y="368" text-anchor="start" class="m t">the denial reason is in STATUSTEXT:</text><text x="420" y="384" text-anchor="start" class="m t">«PreArm: …»</text><path class="ln" d="M560 112 L560 59 L340 59" marker-end="url(#ar)" style="stroke-dasharray:5 4"/><text x="450" y="52" text-anchor="middle" class="m t" style="font-size:10px">retry</text></svg>
