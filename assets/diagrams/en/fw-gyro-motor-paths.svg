<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">The gyro → motors path in Betaflight and ArduPilot</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="56" width="340" height="50" rx="6"/><text x="180.0" y="78.0" text-anchor="middle">Scheduler: TASK_GYRO, TASK_PID</text><text x="180.0" y="92.0" text-anchor="middle">scheduler/scheduler.c, fc/tasks.c</text><rect class="box" x="10" y="122" width="340" height="50" rx="6"/><text x="180.0" y="144.0" text-anchor="middle">Gyro: LPF2, RPM, notch 1–2, LPF1, dyn</text><text x="180.0" y="158.0" text-anchor="middle">sensors/gyro.c, gyro_filter_impl.c</text><rect class="boxa" x="10" y="188" width="340" height="50" rx="6"/><text x="180.0" y="210.0" text-anchor="middle" class="b">PID: D on the gyro (D-LPF before the derivative)</text><text x="180.0" y="224.0" text-anchor="middle" class="b">flight/pid.c  pidController()</text><rect class="box" x="10" y="254" width="340" height="50" rx="6"/><text x="180.0" y="276.0" text-anchor="middle">Mixer: pidSum × matrix + throttle</text><text x="180.0" y="290.0" text-anchor="middle">flight/mixer.c  mixTable()</text><rect class="box" x="10" y="320" width="340" height="50" rx="6"/><text x="180.0" y="342.0" text-anchor="middle">DShot: timer + DMA</text><text x="180.0" y="356.0" text-anchor="middle">drivers/dshot.c, src/platform/…/dshot_*.c</text><rect class="box" x="370" y="56" width="340" height="50" rx="6"/><text x="540.0" y="78.0" text-anchor="middle">Scheduler: FAST_TASK in order</text><text x="540.0" y="92.0" text-anchor="middle">ArduCopter/Copter.cpp  scheduler_tasks[]</text><rect class="box" x="370" y="122" width="340" height="50" rx="6"/><text x="540.0" y="144.0" text-anchor="middle">IMU: harmonic notch, LPF</text><text x="540.0" y="158.0" text-anchor="middle">AP_InertialSensor, Filter/HarmonicNotch…</text><rect class="boxa" x="370" y="188" width="340" height="50" rx="6"/><text x="540.0" y="210.0" text-anchor="middle" class="b">Rate PID: D on the error through FLTD</text><text x="540.0" y="224.0" text-anchor="middle" class="b">AC_PID/AC_PID.cpp  update_all()</text><rect class="box" x="370" y="254" width="340" height="50" rx="6"/><text x="540.0" y="276.0" text-anchor="middle">Mixer: roll/pitch → yaw → throttle</text><text x="540.0" y="290.0" text-anchor="middle">AP_MotorsMatrix  output_armed_stabilizing()</text><rect class="box" x="370" y="320" width="340" height="50" rx="6"/><text x="540.0" y="342.0" text-anchor="middle">Output: DShot / PWM</text><text x="540.0" y="356.0" text-anchor="middle">SRV_Channel → AP_HAL RCOutput</text><path class="ln" d="M180.0 106 L180.0 122" marker-end="url(#ar)"/><path class="lna" d="M180.0 172 L180.0 188" marker-end="url(#ara)"/><path class="ln" d="M180.0 238 L180.0 254" marker-end="url(#ar)"/><path class="ln" d="M180.0 304 L180.0 320" marker-end="url(#ar)"/><path class="ln" d="M540.0 106 L540.0 122" marker-end="url(#ar)"/><path class="lna" d="M540.0 172 L540.0 188" marker-end="url(#ara)"/><path class="ln" d="M540.0 238 L540.0 254" marker-end="url(#ar)"/><path class="ln" d="M540.0 304 L540.0 320" marker-end="url(#ar)"/><text x="10" y="22" text-anchor="start" class="m t">The gyro → motors path: where to open the file (in the box: what you look for, under it: the file)</text><text x="10" y="44" text-anchor="start" class="b">Betaflight: src/main/</text><text x="370" y="44" text-anchor="start" class="b">ArduPilot: libraries/, ArduCopter/</text><text x="10" y="406" text-anchor="start" class="m t">Highlighted: the place of the D term — what you cannot carry over from one firmware to another</text></svg>
