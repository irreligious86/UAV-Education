<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Peripheral connection protocol</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Peripheral connection protocol: always the same order, the multimeter before power</text><rect class="box" x="10.0" y="36.0" width="370.0" height="40.0" rx="6"/><text x="195.0" y="53.0" text-anchor="middle" style="font-size:11px">1. Datasheet: interface, levels,</text><text x="195.0" y="67.0" text-anchor="middle" style="font-size:11px">power (V, mA), protocol and baud rate</text><rect class="box" x="10.0" y="90.0" width="370.0" height="40.0" rx="6"/><text x="195.0" y="107.0" text-anchor="middle" style="font-size:11px">2. FC map: a free port,</text><text x="195.0" y="121.0" text-anchor="middle" style="font-size:11px">its inverter and power, the BEC limit</text><rect class="box" x="10.0" y="144.0" width="370.0" height="40.0" rx="6"/><text x="195.0" y="161.0" text-anchor="middle" style="font-size:11px">3. Wires labeled; TX/RX</text><text x="195.0" y="175.0" text-anchor="middle" style="font-size:11px">crossed; common ground</text><rect class="boxa" x="10.0" y="198.0" width="370.0" height="40.0" rx="6"/><text x="195.0" y="215.0" text-anchor="middle" class="b" style="font-size:11px">4. Multimeter before power-up: no short</text><text x="195.0" y="229.0" text-anchor="middle" style="font-size:11px">from 5 V / 3.3 V to GND, power from the right pad</text><rect class="boxa" x="10.0" y="252.0" width="370.0" height="40.0" rx="6"/><text x="195.0" y="269.0" text-anchor="middle" class="b" style="font-size:11px">5. Power up through a smoke stopper,</text><text x="195.0" y="283.0" text-anchor="middle" style="font-size:11px">the voltage at the device is fine</text><rect class="box" x="10.0" y="306.0" width="370.0" height="40.0" rx="6"/><text x="195.0" y="323.0" text-anchor="middle" style="font-size:11px">6. Firmware: port → function →</text><text x="195.0" y="337.0" text-anchor="middle" style="font-size:11px">protocol/baud. Is there data?</text><rect class="box" x="420.0" y="246.0" width="290.0" height="40.0" rx="6"/><text x="565.0" y="263.0" text-anchor="middle" style="font-size:11px">done: GPS — satellites, compass —</text><text x="565.0" y="277.0" text-anchor="middle" style="font-size:11px">heading when rotated, ESC — RPM</text><rect class="boxa" x="420.0" y="356.0" width="290.0" height="30.0" rx="6"/><text x="565.0" y="375.0" text-anchor="middle" class="b" style="font-size:11px">7. Analyzer on the line:</text><path class="ln" d="M195.0 76 L195.0 90" marker-end="url(#ar)"/><path class="ln" d="M195.0 130 L195.0 144" marker-end="url(#ar)"/><path class="ln" d="M195.0 184 L195.0 198" marker-end="url(#ar)"/><path class="ln" d="M195.0 238 L195.0 252" marker-end="url(#ar)"/><path class="ln" d="M195.0 292 L195.0 306" marker-end="url(#ar)"/><path class="lna" d="M380 318.0 L400 318.0 L400 266.0 L420 266.0" marker-end="url(#ara)"/><text x="383" y="314.0" text-anchor="start" class="a t" style="font-size:10.5px">yes</text><path class="ln" d="M380 334.0 L400 334.0 L400 371.0 L420 371.0" marker-end="url(#ar)"/><text x="404" y="348.0" text-anchor="start" class="m t" style="font-size:10.5px">no</text><text x="430" y="404" text-anchor="start" class="w t" style="font-size:10.5px">no bytes →</text><text x="430" y="419" text-anchor="start" class="t" style="font-size:10.5px">TX/RX crossed?</text><text x="430" y="440" text-anchor="start" class="w t" style="font-size:10.5px">garbage bytes →</text><text x="430" y="455" text-anchor="start" class="t" style="font-size:10.5px">baud rate, inversion (SBUS), common ground</text><line x1="424.0" y1="386.0" x2="424.0" y2="455.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.8"/></svg>
