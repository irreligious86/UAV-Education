<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">DroneCAN DNA: how a node gets its number</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">DNA: the flight controller assigns the node ID and remembers it against the node&#x27;s unique ID</text><rect class="box" x="10.0" y="32.0" width="200.0" height="46.0" rx="6"/><text x="110.0" y="52.5" text-anchor="middle" style="font-size:10.5px">New node without an ID</text><text x="110.0" y="65.5" text-anchor="middle" style="font-size:10.5px">(GPS, compass, current sensor)</text><path class="ln" d="M210 55 L240 55" marker-end="url(#ar)"/><rect class="box" x="240.0" y="32.0" width="200.0" height="46.0" rx="6"/><text x="340.0" y="52.5" text-anchor="middle" style="font-size:10.5px">Asks the server for an ID,</text><text x="340.0" y="65.5" text-anchor="middle" style="font-size:10.5px">sends its unique ID</text><path class="ln" d="M440 55 L470 55" marker-end="url(#ar)"/><rect class="boxa" x="470.0" y="26.0" width="240.0" height="58.0" rx="6"/><text x="590.0" y="46.0" text-anchor="middle" class="b" style="font-size:10.5px">DNA server = the FC:</text><text x="590.0" y="59.0" text-anchor="middle" style="font-size:10.5px">is this unique ID</text><text x="590.0" y="72.0" text-anchor="middle" style="font-size:10.5px">already in the table?</text><path class="lnm" d="M484 84 L484 92 L145 92 L145 112"/><text x="151" y="106" text-anchor="start" class="m t" style="font-size:10.5px">who is the server</text><rect class="box" x="10.0" y="112.0" width="270.0" height="128.0" rx="6"/><text x="20" y="141.0" text-anchor="start" style="font-size:10.5px">ArduPilot — the FC, its ID</text><text x="20" y="154.0" text-anchor="start" style="font-size:10.5px">CAN_D1_UC_NODE = 10 (default);</text><text x="20" y="167.0" text-anchor="start" style="font-size:10.5px">must not match the fixed ID</text><text x="20" y="180.0" text-anchor="start" style="font-size:10.5px">of any node;</text><text x="20" y="193.0" text-anchor="start" style="font-size:10.5px">PX4 — only with UAVCAN_ENABLE</text><text x="20" y="206.0" text-anchor="start" style="font-size:10.5px">2 or 3 (default 0 — bus off;</text><text x="20" y="219.0" text-anchor="start" style="font-size:10.5px">1 — node IDs set by hand)</text><path class="ln" d="M590 84 L590 98 L470 98"/><path class="ln" d="M470 98 L470 112" marker-end="url(#ar)"/><path class="ln" d="M590 98 L650 98 L650 112" marker-end="url(#ar)"/><text x="656" y="108" text-anchor="start" class="a t b" style="font-size:10.5px">yes</text><text x="476" y="108" text-anchor="start" class="a t b" style="font-size:10.5px">no</text><rect class="box" x="300.0" y="112.0" width="300.0" height="58.0" rx="6"/><text x="450.0" y="132.0" text-anchor="middle" style="font-size:10.5px">a free ID 1…125 (126, 127 are</text><text x="450.0" y="145.0" text-anchor="middle" style="font-size:10.5px">for service tools),</text><text x="450.0" y="158.0" text-anchor="middle" style="font-size:10.5px">store “ID → number”</text><rect class="box" x="610.0" y="112.0" width="100.0" height="58.0" rx="6"/><text x="660.0" y="138.5" text-anchor="middle" style="font-size:10.5px">the previous</text><text x="660.0" y="151.5" text-anchor="middle" style="font-size:10.5px">ID</text><path class="ln" d="M450 170 L450 186 L660 186 L660 170"/><path class="ln" d="M555 186 L555 200" marker-end="url(#ar)"/><rect class="box" x="400.0" y="200.0" width="310.0" height="40.0" rx="6"/><text x="555.0" y="217.5" text-anchor="middle" style="font-size:10.5px">the node works: NodeStatus</text><text x="555.0" y="230.5" text-anchor="middle" style="font-size:10.5px">(health, mode, uptime)</text><text x="16" y="262" text-anchor="start" class="d t b" style="font-size:10.5px">Where it breaks</text><rect class="box" x="10.0" y="274.0" width="220.0" height="72.0" rx="6"/><text x="120.0" y="294.5" text-anchor="middle" style="font-size:10.5px">nodes were moved between</text><text x="120.0" y="307.5" text-anchor="middle" style="font-size:10.5px">aircraft or the settings</text><text x="120.0" y="320.5" text-anchor="middle" style="font-size:10.5px">were copied: two nodes</text><text x="120.0" y="333.5" text-anchor="middle" style="font-size:10.5px">with the same ID</text><path class="ln" d="M230 310 L252 310" marker-end="url(#ar)"/><rect class="box" x="252.0" y="274.0" width="210.0" height="72.0" rx="6"/><text x="357.0" y="301.0" text-anchor="middle" style="font-size:10.5px">ArduPilot: PreArm</text><text x="357.0" y="314.0" text-anchor="middle" style="font-size:10.5px">“Duplicate Node”, arming</text><text x="357.0" y="327.0" text-anchor="middle" style="font-size:10.5px">refused; the sensor is not seen</text><path class="lna" d="M462 310 L484 310" marker-end="url(#ara)"/><rect class="boxa" x="484.0" y="274.0" width="226.0" height="72.0" rx="6"/><text x="597.0" y="288.0" text-anchor="middle" class="b" style="font-size:10.5px">CAN_D1_UC_OPTION bit 0 (1):</text><text x="597.0" y="301.0" text-anchor="middle" style="font-size:10.5px">clear the table at boot —</text><text x="597.0" y="314.0" text-anchor="middle" style="font-size:10.5px">«UC DNA database reset»,</text><text x="597.0" y="327.0" text-anchor="middle" style="font-size:10.5px">the bit resets itself; or</text><text x="597.0" y="340.0" text-anchor="middle" style="font-size:10.5px">a fixed ID on the node</text></svg>
