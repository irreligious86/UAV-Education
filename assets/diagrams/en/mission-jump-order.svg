<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Mission execution order with DO_JUMP (SITL 4.7.2 run)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="12" y="50" width="150" height="58" rx="6"/><text x="87.0" y="83.0" text-anchor="middle">1 TAKEOFF 20 m</text><rect class="box" x="190" y="50" width="150" height="58" rx="6"/><text x="265.0" y="76.0" text-anchor="middle">2 CHANGE_SPEED</text><text x="265.0" y="90.0" text-anchor="middle">5 m/s</text><rect class="boxa" x="368" y="50" width="150" height="58" rx="6"/><text x="443.0" y="69.0" text-anchor="middle" class="b">3 WP A</text><text x="443.0" y="83.0" text-anchor="middle" class="b">100 m N</text><text x="443.0" y="97.0" text-anchor="middle" class="b">≈ 21–23 s</text><rect class="boxa" x="546" y="50" width="150" height="58" rx="6"/><text x="621.0" y="69.0" text-anchor="middle" class="b">4 WP B</text><text x="621.0" y="83.0" text-anchor="middle" class="b">+100 m E</text><text x="621.0" y="97.0" text-anchor="middle" class="b">≈ 21 s</text><rect class="box" x="546" y="180" width="150" height="58" rx="6"/><text x="621.0" y="206.0" text-anchor="middle">5 DO_JUMP → 3</text><text x="621.0" y="220.0" text-anchor="middle">repeat 1</text><rect class="box" x="368" y="180" width="150" height="58" rx="6"/><text x="443.0" y="206.0" text-anchor="middle">6 CHANGE_SPEED</text><text x="443.0" y="220.0" text-anchor="middle">10 m/s</text><rect class="box" x="190" y="180" width="150" height="58" rx="6"/><text x="265.0" y="199.0" text-anchor="middle">7 WP C</text><text x="265.0" y="213.0" text-anchor="middle">100 m S</text><text x="265.0" y="227.0" text-anchor="middle">14.0 s</text><rect class="box" x="12" y="180" width="150" height="58" rx="6"/><text x="87.0" y="199.0" text-anchor="middle">8 WP D</text><text x="87.0" y="213.0" text-anchor="middle">home</text><text x="87.0" y="227.0" text-anchor="middle">14.8 s</text><rect class="boxa" x="12" y="300" width="190" height="50" rx="6"/><text x="107.0" y="322.0" text-anchor="middle" class="b">end of the list:</text><text x="107.0" y="336.0" text-anchor="middle" class="b">LOITER in AUTO, 20 m</text><path class="ln" d="M162 79.0 L190 79.0" marker-end="url(#ar)"/><path class="ln" d="M340 79.0 L368 79.0" marker-end="url(#ar)"/><path class="ln" d="M518 79.0 L546 79.0" marker-end="url(#ar)"/><path class="ln" d="M621.0 108 L621.0 180" marker-end="url(#ar)"/><path class="ln" d="M546 209.0 L518 209.0" marker-end="url(#ar)"/><path class="ln" d="M368 209.0 L340 209.0" marker-end="url(#ar)"/><path class="ln" d="M190 209.0 L162 209.0" marker-end="url(#ar)"/><path class="lna" d="M87.0 238 L87.0 269.0 L107.0 269.0 L107.0 300" marker-end="url(#ara)"/><text x="368" y="258" text-anchor="start" class="w t">dashed: 5 → 3 (Jump 1/1), A and B once more</text><text x="240" y="320" text-anchor="start" class="m t">Mission without RTL: after 20 s — AUTO, 20.0 m, armed.</text><text x="240" y="336" text-anchor="start" class="m t">100 m without stopping: 5 m/s ≈ 21 s, 10 m/s ≈ 14 s (≈ d/v + turn).</text><path class="lna" style="stroke-dasharray:5 4" d="M566 180 L566 150 L498 150 L498 108" marker-end="url(#ara)"/></svg>
