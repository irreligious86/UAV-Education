<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Деградация навигации: реакция ArduPilot, PX4, INAV</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Что делает прошивка сама, когда навигация деградирует (по ступеням)</text><text x="204.0" y="40" text-anchor="middle" class="b" style="font-size:12px">ArduPilot 4.7</text><text x="408.0" y="40" text-anchor="middle" class="b" style="font-size:12px">PX4 1.18</text><text x="612.0" y="40" text-anchor="middle" class="b" style="font-size:12px">INAV 9.1</text><text x="14" y="84.0" text-anchor="start" class="b" style="font-size:11px">position</text><text x="14" y="98.0" text-anchor="start" class="b" style="font-size:11px">врёт / хуже</text><text x="14" y="175.0" text-anchor="start" class="b" style="font-size:11px">позиции</text><text x="14" y="189.0" text-anchor="start" class="b" style="font-size:11px">no</text><text x="14" y="256.0" text-anchor="start" class="b" style="font-size:11px">нет и</text><text x="14" y="270.0" text-anchor="start" class="b" style="font-size:11px">altitude</text><rect class="box" x="104.0" y="52.0" width="200.0" height="68.0" rx="6"/><text x="204.0" y="70.5" text-anchor="middle" style="font-size:10.5px">GPS glitch: расхождение</text><text x="204.0" y="83.5" text-anchor="middle" style="font-size:10.5px">&gt; EK3_GLITCH_RAD (25 м,</text><text x="204.0" y="96.5" text-anchor="middle" style="font-size:10.5px">умолч.) — сброс позиции</text><text x="204.0" y="109.5" text-anchor="middle" style="font-size:10.5px">и скорости к GPS</text><rect class="box" x="308.0" y="52.0" width="200.0" height="68.0" rx="6"/><text x="408.0" y="70.5" text-anchor="middle" style="font-size:10.5px">Mission / Hold: точность</text><text x="408.0" y="83.5" text-anchor="middle" style="font-size:10.5px">хуже COM_POS_LOW_EPH (умолч.</text><text x="408.0" y="96.5" text-anchor="middle" style="font-size:10.5px">выкл.) → COM_POS_LOW_ACT</text><text x="408.0" y="109.5" text-anchor="middle" style="font-size:10.5px">(умолч. Return)</text><rect class="box" x="512.0" y="52.0" width="200.0" height="68.0" rx="6"/><text x="612.0" y="77.0" text-anchor="middle" style="font-size:10.5px">короткие пропадания:</text><text x="612.0" y="90.0" text-anchor="middle" style="font-size:10.5px">счисление на секунды</text><text x="612.0" y="103.0" text-anchor="middle" style="font-size:10.5px">(inav_allow_dead_reckoning)</text><rect class="boxa" x="104.0" y="138.0" width="200.0" height="78.0" rx="6"/><text x="204.0" y="155.0" text-anchor="middle" class="b" style="font-size:10.5px">EKF failsafe: порог</text><text x="204.0" y="168.0" text-anchor="middle" style="font-size:10.5px">FS_EKF_THRESH; FS_EKF_ACTION</text><text x="204.0" y="181.0" text-anchor="middle" style="font-size:10.5px">1 Land, 2 AltHold — если</text><text x="204.0" y="194.0" text-anchor="middle" style="font-size:10.5px">режим требует позицию;</text><text x="204.0" y="207.0" text-anchor="middle" style="font-size:10.5px">3 Land всегда; 0 сообщение</text><rect class="boxa" x="308.0" y="138.0" width="200.0" height="78.0" rx="6"/><text x="408.0" y="168.0" text-anchor="middle" class="b" style="font-size:10.5px">Position → Altitude</text><text x="408.0" y="181.0" text-anchor="middle" style="font-size:10.5px">(с 1.17 сам; до 1.17 —</text><text x="408.0" y="194.0" text-anchor="middle" style="font-size:10.5px">COM_POSCTL_NAVL)</text><rect class="boxa" x="512.0" y="138.0" width="200.0" height="78.0" rx="6"/><text x="612.0" y="161.5" text-anchor="middle" class="b" style="font-size:10.5px">RTH / WP: нет позиции</text><text x="612.0" y="174.5" text-anchor="middle" style="font-size:10.5px">&gt; nav_position_timeout (5 с)</text><text x="612.0" y="187.5" text-anchor="middle" style="font-size:10.5px">→ аварийная посадка 5 м/с</text><text x="612.0" y="200.5" text-anchor="middle" style="font-size:10.5px">(оба — умолч.) до детектора</text><rect class="box" x="308.0" y="236.0" width="200.0" height="44.0" rx="6"/><text x="408.0" y="262.0" text-anchor="middle" style="font-size:10.5px">Altitude → Stabilized</text><rect class="box" x="512.0" y="236.0" width="200.0" height="44.0" rx="6"/><text x="612.0" y="255.5" text-anchor="middle" style="font-size:10.5px">снижения по скорости нет:</text><text x="612.0" y="268.5" text-anchor="middle" style="font-size:10.5px">газ failsafe_throttle</text><path class="ln" d="M204.0 120 L204.0 138" marker-end="url(#ar)"/><path class="ln" d="M612.0 120 L612.0 138" marker-end="url(#ar)"/><path class="ln" d="M408.0 216 L408.0 236" marker-end="url(#ar)"/><path class="ln" d="M612.0 216 L612.0 236" marker-end="url(#ar)"/><rect class="box" x="14.0" y="302.0" width="698.0" height="54.0" rx="6"/><text x="24" y="320.0" text-anchor="start" style="font-size:10.5px">Всегда: Stabilize / AltHold на тумблере, и пилот умеет ими летать.</text><text x="24" y="333.0" text-anchor="start" style="font-size:10.5px">Действие при потере позиции — по месту: поле — AltHold и ручная посадка;</text><text x="24" y="346.0" text-anchor="start" style="font-size:10.5px">люди — Land; вода — AltHold и ручной возврат к берегу (на инерциалку не рассчитывать)</text></svg>
