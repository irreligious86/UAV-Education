<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 238" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Layout of the 16-bit osd_*_pos value (osd.h, 4.5 and 2025.12)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t" style="font-size:11px">osd_avg_cell_voltage_pos: x = 40, y = 17, visible in profiles 1 and 3 → 11816 (0x2E28)</text><rect class="box" x="17.0" y="44" width="41.0" height="34" rx="3"/><text x="37.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">15</text><text x="37.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="box" x="60.0" y="44" width="41.0" height="34" rx="3"/><text x="80.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">14</text><text x="80.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="boxa" x="103.0" y="44" width="41.0" height="34" rx="3"/><text x="123.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">13</text><text x="123.5" y="66" text-anchor="middle" class="b" style="font-size:14px">1</text><rect class="box" x="146.0" y="44" width="41.0" height="34" rx="3"/><text x="166.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">12</text><text x="166.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="boxa" x="189.0" y="44" width="41.0" height="34" rx="3"/><text x="209.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">11</text><text x="209.5" y="66" text-anchor="middle" class="b" style="font-size:14px">1</text><rect class="boxa" x="232.0" y="44" width="41.0" height="34" rx="3"/><text x="252.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">10</text><text x="252.5" y="66" text-anchor="middle" class="b" style="font-size:14px">1</text><rect class="box" x="275.0" y="44" width="41.0" height="34" rx="3"/><text x="295.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">9</text><text x="295.5" y="66" text-anchor="middle" class="b" style="font-size:14px">1</text><rect class="box" x="318.0" y="44" width="41.0" height="34" rx="3"/><text x="338.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">8</text><text x="338.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="box" x="361.0" y="44" width="41.0" height="34" rx="3"/><text x="381.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">7</text><text x="381.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="box" x="404.0" y="44" width="41.0" height="34" rx="3"/><text x="424.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">6</text><text x="424.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="box" x="447.0" y="44" width="41.0" height="34" rx="3"/><text x="467.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">5</text><text x="467.5" y="66" text-anchor="middle" class="b" style="font-size:14px">1</text><rect class="box" x="490.0" y="44" width="41.0" height="34" rx="3"/><text x="510.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">4</text><text x="510.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="box" x="533.0" y="44" width="41.0" height="34" rx="3"/><text x="553.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">3</text><text x="553.5" y="66" text-anchor="middle" class="b" style="font-size:14px">1</text><rect class="box" x="576.0" y="44" width="41.0" height="34" rx="3"/><text x="596.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">2</text><text x="596.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="box" x="619.0" y="44" width="41.0" height="34" rx="3"/><text x="639.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">1</text><text x="639.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><rect class="box" x="662.0" y="44" width="41.0" height="34" rx="3"/><text x="682.5" y="38" text-anchor="middle" class="m t" style="font-size:11px">0</text><text x="682.5" y="66" text-anchor="middle" class="m" style="font-size:14px">0</text><path d="M19.0 88 L19.0 94 L99.0 94 L99.0 88" stroke="currentColor" stroke-width="1.3" fill="none"/><text x="59.0" y="110" text-anchor="middle" style="font-size:11.5px">variant</text><text x="59.0" y="125" text-anchor="middle" class="m t" style="font-size:11px">bits 14–15</text><text x="59.0" y="142" text-anchor="middle" style="font-size:11.5px">0</text><path d="M105.0 88 L105.0 94 L228.0 94 L228.0 88" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.3" fill="none"/><text x="166.5" y="110" text-anchor="middle" class="b" style="font-size:11.5px">profiles 3·2·1</text><text x="166.5" y="125" text-anchor="middle" class="m t" style="font-size:11px">bits 11–13</text><text x="166.5" y="142" text-anchor="middle" class="a" style="font-size:11.5px">8192 + 2048</text><path d="M234.0 88 L234.0 94 L271.0 94 L271.0 88" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.3" fill="none"/><text x="252.5" y="110" text-anchor="middle" class="b" style="font-size:11.5px">x: bit 5</text><text x="252.5" y="125" text-anchor="middle" class="m t" style="font-size:11px">bit 10</text><text x="252.5" y="142" text-anchor="middle" class="a" style="font-size:11.5px">1024</text><path d="M277.0 88 L277.0 94 L486.0 94 L486.0 88" stroke="currentColor" stroke-width="1.3" fill="none"/><text x="381.5" y="110" text-anchor="middle" style="font-size:11.5px">y</text><text x="381.5" y="125" text-anchor="middle" class="m t" style="font-size:11px">bits 5–9</text><text x="381.5" y="142" text-anchor="middle" style="font-size:11.5px">17 × 32 = 544</text><path d="M492.0 88 L492.0 94 L701.0 94 L701.0 88" stroke="currentColor" stroke-width="1.3" fill="none"/><text x="596.5" y="110" text-anchor="middle" style="font-size:11.5px">x</text><text x="596.5" y="125" text-anchor="middle" class="m t" style="font-size:11px">bits 0–4</text><text x="596.5" y="142" text-anchor="middle" style="font-size:11.5px">40 &amp; 31 = 8</text><text x="16" y="170" text-anchor="start" style="font-size:12px">Sum: 8 + 544 + 1024 + 2048 + 8192 = 11816 → set osd_avg_cell_voltage_pos = 11816</text><text x="16" y="190" text-anchor="start" class="m t" style="font-size:11px">x up to 63 (5 bits + bit 10), y up to 31. Without bit 10 column 40 reads as 8 and the element jumps left.</text><text x="16" y="208" text-anchor="start" class="m t" style="font-size:11px">Backwards: 21665 = 0x54A1 → variant 1, profile 2, x = 1 + 32 = 33, y = 5.</text><text x="16" y="226" text-anchor="start" class="m t" style="font-size:11px">No profile bit at all (341 is the HD build default) → the element is hidden in all three profiles.</text></svg>
