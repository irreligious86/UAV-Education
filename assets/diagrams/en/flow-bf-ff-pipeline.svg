<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Feedforward 4.5.3: what calculateFeedforward() does with every packet</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="128" height="48" rx="6"/><text x="74.0" y="61.0" text-anchor="middle" style="font-size:10.5px">New RC packet</text><text x="74.0" y="75.0" text-anchor="middle" style="font-size:10.5px">rcCommand, sp</text><rect class="boxa" x="152" y="40" width="128" height="48" rx="6"/><text x="216.0" y="61.0" text-anchor="middle" class="b" style="font-size:10.5px">Rate sp</text><text x="216.0" y="75.0" text-anchor="middle" class="b" style="font-size:10.5px">Δsp · f_rx</text><text x="216.0" y="101" text-anchor="middle" class="m t">duplicate: extrapolation</text><rect class="boxa" x="294" y="40" width="128" height="48" rx="6"/><text x="358.0" y="61.0" text-anchor="middle" class="b" style="font-size:10.5px">PT1 of the rate</text><text x="358.0" y="75.0" text-anchor="middle" class="b" style="font-size:10.5px">k = 1 − smooth/100</text><rect class="box" x="436" y="40" width="128" height="48" rx="6"/><text x="500.0" y="61.0" text-anchor="middle" style="font-size:10.5px">+ boost</text><text x="500.0" y="75.0" text-anchor="middle" style="font-size:10.5px">Δv·f·boost/1000</text><rect class="box" x="578" y="40" width="128" height="48" rx="6"/><text x="642.0" y="61.0" text-anchor="middle" style="font-size:10.5px">transition</text><text x="642.0" y="75.0" text-anchor="middle" style="font-size:10.5px">× |x|/tr near center</text><rect class="box" x="578" y="140" width="128" height="48" rx="6"/><text x="642.0" y="161.0" text-anchor="middle" style="font-size:10.5px">averaging</text><text x="642.0" y="175.0" text-anchor="middle" style="font-size:10.5px">average of 2…4 packets</text><rect class="boxa" x="436" y="140" width="128" height="48" rx="6"/><text x="500.0" y="161.0" text-anchor="middle" class="b" style="font-size:10.5px">× jitter_att</text><text x="500.0" y="175.0" text-anchor="middle" class="b" style="font-size:10.5px">Δ rcCommand &lt; j</text><rect class="boxa" x="294" y="140" width="128" height="48" rx="6"/><text x="358.0" y="161.0" text-anchor="middle" class="b" style="font-size:10.5px">max_rate_limit</text><text x="358.0" y="175.0" text-anchor="middle" class="b" style="font-size:10.5px">≤ (max−|sp|)·90</text><rect class="box" x="152" y="140" width="128" height="48" rx="6"/><text x="216.0" y="161.0" text-anchor="middle" style="font-size:10.5px">PT3 RC smoothing</text><text x="216.0" y="175.0" text-anchor="middle" style="font-size:10.5px">FF cutoff (auto)</text><rect class="box" x="10" y="140" width="128" height="48" rx="6"/><text x="74.0" y="161.0" text-anchor="middle" style="font-size:10.5px">× Kf → F term</text><text x="74.0" y="175.0" text-anchor="middle" style="font-size:10.5px">Kf=0.013754·F/100</text><path class="ln" d="M138 64.0 L152 64.0" marker-end="url(#ar)"/><path class="ln" d="M280 64.0 L294 64.0" marker-end="url(#ar)"/><path class="ln" d="M422 64.0 L436 64.0" marker-end="url(#ar)"/><path class="ln" d="M564 64.0 L578 64.0" marker-end="url(#ar)"/><path class="ln" d="M642.0 88 L642.0 140" marker-end="url(#ar)"/><path class="ln" d="M578 164.0 L564 164.0" marker-end="url(#ar)"/><path class="ln" d="M436 164.0 L422 164.0" marker-end="url(#ar)"/><path class="ln" d="M294 164.0 L280 164.0" marker-end="url(#ar)"/><path class="ln" d="M152 164.0 L138 164.0" marker-end="url(#ar)"/><text x="10" y="220" text-anchor="start" class="m t">jitter_att = 1 − max(0, 1 − (Δ + Δprev)/(2·j))², for Δ &lt; j (j = jitter_factor)</text><text x="10" y="238" text-anchor="start" class="m t">everything up to limit — once per RC packet; PT3 and ×Kf — every PID loop; limit — roll/pitch</text></svg>
