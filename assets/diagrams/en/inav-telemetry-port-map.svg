<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 350" width="100%" role="img" aria-labelledby="t" style="max-width:722px;display:block;margin:0 auto"><title id="t">INAV 9.1: protocol → port function → who reads it</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="14" width="205" height="40" rx="6"/><text x="112.5" y="31.0" text-anchor="middle">CRSF telemetry</text><text x="112.5" y="45.0" text-anchor="middle">+ MSP in frames 0x7A–7C</text><rect class="boxa" x="258" y="14" width="205" height="40" rx="6"/><text x="360.5" y="31.0" text-anchor="middle" class="b">RX_SERIAL · 64</text><text x="360.5" y="45.0" text-anchor="middle" class="b">420000, receiver port</text><rect class="box" x="506" y="14" width="205" height="40" rx="6"/><text x="608.5" y="31.0" text-anchor="middle">EdgeTX radio</text><text x="608.5" y="45.0" text-anchor="middle">sensors, FM, Lua</text><rect class="box" x="10" y="68" width="205" height="40" rx="6"/><text x="112.5" y="85.0" text-anchor="middle">SmartPort</text><text x="112.5" y="99.0" text-anchor="middle">polled, + MSP</text><rect class="boxa" x="258" y="68" width="205" height="40" rx="6"/><text x="360.5" y="85.0" text-anchor="middle" class="b">SMARTPORT · 32</text><text x="360.5" y="99.0" text-anchor="middle" class="b">57600, a single TX wire</text><rect class="box" x="506" y="68" width="205" height="40" rx="6"/><text x="608.5" y="85.0" text-anchor="middle">FrSky receiver</text><text x="608.5" y="99.0" text-anchor="middle">radio, Lua panels</text><rect class="box" x="10" y="122" width="205" height="40" rx="6"/><text x="112.5" y="139.0" text-anchor="middle">LTM</text><text x="112.5" y="153.0" text-anchor="middle">downlink only, 105–303 B/s</text><rect class="boxa" x="258" y="122" width="205" height="40" rx="6"/><text x="360.5" y="139.0" text-anchor="middle" class="b">LTM · 16</text><text x="360.5" y="153.0" text-anchor="middle" class="b">AUTO = 19200</text><rect class="box" x="506" y="122" width="205" height="40" rx="6"/><text x="608.5" y="139.0" text-anchor="middle">Antenna tracker</text><text x="608.5" y="153.0" text-anchor="middle">OSD, LTM ground station</text><rect class="box" x="10" y="176" width="205" height="40" rx="6"/><text x="112.5" y="193.0" text-anchor="middle">MAVLink 1 / 2</text><text x="112.5" y="207.0" text-anchor="middle">streams + narrow uplink</text><rect class="boxa" x="258" y="176" width="205" height="40" rx="6"/><text x="360.5" y="193.0" text-anchor="middle" class="b">MAVLINK · 256</text><text x="360.5" y="207.0" text-anchor="middle" class="b">AUTO = 57600</text><rect class="box" x="506" y="176" width="205" height="40" rx="6"/><text x="608.5" y="193.0" text-anchor="middle">MAVLink ground station</text><text x="608.5" y="207.0" text-anchor="middle">companion, ADS-B</text><rect class="box" x="10" y="230" width="205" height="40" rx="6"/><text x="112.5" y="247.0" text-anchor="middle">MSP</text><text x="112.5" y="261.0" text-anchor="middle">request — response</text><rect class="boxa" x="258" y="230" width="205" height="40" rx="6"/><text x="360.5" y="247.0" text-anchor="middle" class="b">MSP · 1</text><text x="360.5" y="261.0" text-anchor="middle" class="b">no more than 3 ports</text><rect class="box" x="506" y="230" width="205" height="40" rx="6"/><text x="608.5" y="247.0" text-anchor="middle">Configurator, BLE/Wi-Fi</text><text x="608.5" y="261.0" text-anchor="middle">MSP RC script</text><path class="ln" d="M215 34.0 L258 34.0" marker-end="url(#ar)"/><path class="ln" d="M463 34.0 L506 34.0" marker-end="url(#ar)"/><path class="ln" d="M215 88.0 L258 88.0" marker-end="url(#ar)"/><path class="ln" d="M463 88.0 L506 88.0" marker-end="url(#ar)"/><path class="ln" d="M215 142.0 L258 142.0" marker-end="url(#ar)"/><path class="ln" d="M463 142.0 L506 142.0" marker-end="url(#ar)"/><path class="ln" d="M215 196.0 L258 196.0" marker-end="url(#ar)"/><path class="lna" d="M463 196.0 L506 196.0" marker-end="url(#ara)"/><path class="ln" d="M215 250.0 L258 250.0" marker-end="url(#ar)"/><path class="lna" d="M463 250.0 L506 250.0" marker-end="url(#ara)"/><text x="10" y="296" text-anchor="start" class="m t">A pair on one UART: MSP + one telemetry (runs while armed) or RX_SERIAL + LTM / IBUS.</text><text x="10" y="312" text-anchor="start" class="w t">Any other pair or a fourth MSP port resets the whole port table.</text><text x="10" y="328" text-anchor="start" class="m t">Without feature TELEMETRY all protocols except MSP are silent.</text></svg>
