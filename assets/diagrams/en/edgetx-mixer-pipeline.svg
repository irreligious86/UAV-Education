<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">EdgeTX: путь сигнала от стика до модуля (и пример с числами)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="44" width="124" height="62" rx="6"/><text x="72.0" y="65.0" text-anchor="middle" style="font-size:10.5px">Sources</text><text x="72.0" y="79.0" text-anchor="middle" style="font-size:10.5px">стики, тумблеры,</text><text x="72.0" y="93.0" text-anchor="middle" style="font-size:10.5px">крутилки, LS, GV</text><rect class="boxa" x="152" y="44" width="124" height="62" rx="6"/><text x="214.0" y="65.0" text-anchor="middle" class="b" style="font-size:10.5px">INPUTS</text><text x="214.0" y="79.0" text-anchor="middle" class="b" style="font-size:10.5px">expo/кривая →</text><text x="214.0" y="93.0" text-anchor="middle" class="b" style="font-size:10.5px">вес → offset, трим</text><rect class="boxa" x="294" y="44" width="124" height="62" rx="6"/><text x="356.0" y="65.0" text-anchor="middle" class="b" style="font-size:10.5px">MIXES</text><text x="356.0" y="79.0" text-anchor="middle" class="b" style="font-size:10.5px">кривая → вес →</text><text x="356.0" y="93.0" text-anchor="middle" class="b" style="font-size:10.5px">offset; Add/Repl</text><rect class="boxa" x="436" y="44" width="124" height="62" rx="6"/><text x="498.0" y="65.0" text-anchor="middle" class="b" style="font-size:10.5px">OUTPUTS</text><text x="498.0" y="79.0" text-anchor="middle" class="b" style="font-size:10.5px">subtrim, Min/Max,</text><text x="498.0" y="93.0" text-anchor="middle" class="b" style="font-size:10.5px">реверс, центр</text><rect class="box" x="578" y="44" width="124" height="62" rx="6"/><text x="640.0" y="65.0" text-anchor="middle" style="font-size:10.5px">RF-модуль</text><text x="640.0" y="79.0" text-anchor="middle" style="font-size:10.5px">CRSF: 16 каналов</text><text x="640.0" y="93.0" text-anchor="middle" style="font-size:10.5px">11 bits each</text><rect class="box" x="10" y="150" width="124" height="44" rx="6"/><text x="72.0" y="169.0" text-anchor="middle" style="font-size:10.5px">стик Ail +50 %</text><text x="72.0" y="183.0" text-anchor="middle" style="font-size:10.5px">512 из ±1024</text><rect class="box" x="152" y="150" width="124" height="44" rx="6"/><text x="214.0" y="169.0" text-anchor="middle" style="font-size:10.5px">expo 40, вес 100</text><text x="214.0" y="183.0" text-anchor="middle" style="font-size:10.5px">35.1 % (359)</text><rect class="box" x="294" y="150" width="124" height="44" rx="6"/><text x="356.0" y="169.0" text-anchor="middle" style="font-size:10.5px">CH1 = I1 · 100 %</text><text x="356.0" y="183.0" text-anchor="middle" style="font-size:10.5px">35.1 %</text><rect class="box" x="436" y="150" width="124" height="44" rx="6"/><text x="498.0" y="169.0" text-anchor="middle" style="font-size:10.5px">1500 + 359/2</text><text x="498.0" y="183.0" text-anchor="middle" style="font-size:10.5px">= 1679 мкс</text><rect class="box" x="578" y="150" width="124" height="44" rx="6"/><text x="640.0" y="169.0" text-anchor="middle" style="font-size:10.5px">992 + 359·4/5</text><text x="640.0" y="183.0" text-anchor="middle" style="font-size:10.5px">= CRSF 1279</text><path class="ln" d="M134 75.0 L152 75.0" marker-end="url(#ar)"/><path class="ln" d="M276 75.0 L294 75.0" marker-end="url(#ar)"/><path class="ln" d="M418 75.0 L436 75.0" marker-end="url(#ar)"/><path class="ln" d="M560 75.0 L578 75.0" marker-end="url(#ar)"/><path class="ln" d="M134 172.0 L152 172.0" marker-end="url(#ar)"/><path class="ln" d="M276 172.0 L294 172.0" marker-end="url(#ar)"/><path class="ln" d="M418 172.0 L436 172.0" marker-end="url(#ar)"/><path class="ln" d="M560 172.0 L578 172.0" marker-end="url(#ar)"/><text x="10" y="136" text-anchor="start" class="m t">Пример модуля: крен +50 %, expo 40 на пульте</text><text x="10" y="218" text-anchor="start" class="m t">−100…+100 % = ±1024 внутри = 988…2012 мкс = CRSF 173…1811.</text><text x="10" y="234" text-anchor="start" class="w t">Для полётника expo и веса оставляют 0 и 100: рейты считает он сам.</text></svg>
