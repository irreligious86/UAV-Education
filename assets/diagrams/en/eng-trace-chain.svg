<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Traceability: from an FMEA line to the matrix</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="64" width="214" height="74" rx="6"/><text x="117.0" y="91.0" text-anchor="middle" class="b">FMEA: the firmware renamed</text><text x="117.0" y="105.0" text-anchor="middle" class="b">parameters</text><text x="117.0" y="119.0" text-anchor="middle" class="b">S 9 · O 3 · D 8 = RPN 216</text><rect class="box" x="253" y="64" width="214" height="74" rx="6"/><text x="360.0" y="91.0" text-anchor="middle">Measure: invariants in CI,</text><text x="360.0" y="105.0" text-anchor="middle">parameter diff</text><text x="360.0" y="119.0" text-anchor="middle">after an update</text><rect class="box" x="496" y="64" width="214" height="74" rx="6"/><text x="603.0" y="91.0" text-anchor="middle">Requirement R-PRC-02:</text><text x="603.0" y="105.0" text-anchor="middle">ID, criterion, method,</text><text x="603.0" y="119.0" text-anchor="middle">source, owner</text><rect class="box" x="496" y="200" width="214" height="74" rx="6"/><text x="603.0" y="227.0" text-anchor="middle">Test: check_params.py</text><text x="603.0" y="241.0" text-anchor="middle">(method: config</text><text x="603.0" y="255.0" text-anchor="middle">analysis in CI)</text><rect class="box" x="253" y="200" width="214" height="74" rx="6"/><text x="360.0" y="227.0" text-anchor="middle">Test record: date,</text><text x="360.0" y="241.0" text-anchor="middle">config tag, log,</text><text x="360.0" y="255.0" text-anchor="middle">verdict</text><rect class="boxa" x="10" y="200" width="214" height="74" rx="6"/><text x="117.0" y="227.0" text-anchor="middle" class="b">Traceability matrix:</text><text x="117.0" y="241.0" text-anchor="middle" class="b">requirement ↔ test</text><text x="117.0" y="255.0" text-anchor="middle" class="b">↔ result</text><path class="ln" d="M224 101.0 L253 101.0" marker-end="url(#ar)"/><path class="ln" d="M467 101.0 L496 101.0" marker-end="url(#ar)"/><path class="ln" d="M603.0 138 L603.0 200" marker-end="url(#ar)"/><path class="ln" d="M496 237.0 L467 237.0" marker-end="url(#ar)"/><path class="ln" d="M253 237.0 L224 237.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">An FMEA line turns into a requirement, a test and a record — the chain can be walked both ways</text><text x="127.0" y="164" text-anchor="start" class="w t">test result → recompute</text><text x="127.0" y="178" text-anchor="start" class="w t">the RPN after the measure</text><text x="10" y="292" text-anchor="start" class="m t">an empty cell — the requirement is not closed;</text><text x="10" y="306" text-anchor="start" class="m t">a test without a requirement is extra</text><text x="10" y="320" text-anchor="start" class="m t">or a requirement was forgotten</text><text x="48" y="50" text-anchor="start" class="m t">incident → review → a new FMEA line or an updated measure</text><path class="ln" d="M360.0 200 L360.0 188 L117.0 188 L117.0 138" marker-end="url(#ar)" style="stroke:var(--gc-signal-amber, #f0b24c);stroke-dasharray:5 4"/><path class="ln" d="M36 32 L36 64" marker-end="url(#ar)"/></svg>
