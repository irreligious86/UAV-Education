s="t b" style="font-size:11px">Ry(90°)</text><text x="360" y="396" text-anchor="middle" class="m t" style="font-size:10.5px">x about x does not change</text><text x="16" y="424" text-anchor="start" class="m t">The same two rotations in a different order: (0, 1, 0) vs (0, 0, −1). Pale dashed: the vector before the step.</text><text x="16" y="440" text-anchor="start" class="m t">For 1° and 1° the difference is 3.0·10⁻⁴ = (1° in radians)², second order, which is why the small-angle approximation works.</text></svg>
