ight="44" rx="6"/><text x="302.0" y="53.0" text-anchor="middle" style="font-size:10.5px">3 Ports,</text><text x="302.0" y="67.0" text-anchor="middle" style="font-size:10.5px">airspeed sensor</text><text x="302.0" y="91" text-anchor="middle" class="m t">bench</text><rect class="box" x="365" y="34" width="106" height="44" rx="6"/><text x="418.0" y="53.0" text-anchor="middle" style="font-size:10.5px">4 Receiver,</text><text x="418.0" y="67.0" text-anchor="middle" style="font-size:10.5px">bind</text><text x="418.0" y="91" text-anchor="middle" class="m t">bench</text><rect class="box" x="481" y="34" width="106" height="44" rx="6"/><text x="534.0" y="53.0" text-anchor="middle" style="font-size:10.5px">5 Radio,</text><text x="534.0" y="67.0" text-anchor="middle" style="font-size:10.5px">transition switch</text><text x="534.0" y="91" text-anchor="middle" class="m t">bench</text><rect class="box" x="597" y="34" width="106" height="44" rx="6"/><text x="650.0" y="53.0" text-anchor="middle" style="font-size:10.5px">6 Protocols</text><text x="650.0" y="67.0" text-anchor="middle" style="font-size:10.5px">per group</text><text x="650.0" y="91" text-anchor="middle" class="m t">bench</text><rect class="box" x="597" y="112" width="106" height="44" rx="6"/><text x="650.0" y="131.0" text-anchor="middle" style="font-size:10.5px">7 Motors</text><text x="650.0" y="145.0" text-anchor="middle" style="font-size:10.5px">and control surfaces</text><text x="650.0" y="169" text-anchor="middle" class="m t">bench, no props</text><rect class="box" x="481" y="112" width="106" height="44" rx="6"/><text x="534.0" y="131.0" text-anchor="middle" style="font-size:10.5px">8 ESC of the pusher</text><text x="534.0" y="145.0" text-anchor="middle" style="font-size:10.5px">motor (PWM)</text><text x="534.0" y="169" text-anchor="middle" class="m t">bench, no props</text><rect class="box" x="365" y="112" width="106" height="44" rx="6"/><text x="418.0" y="131.0" text-anchor="middle" style="font-size:10.5px">9 Sensors,</text><text x="418.0" y="145.0" text-anchor="middle" style="font-size:10.5px">airspeed cal.</text><text x="418.0" y="169" text-anchor="middle" class="m t">bench</text><rect class="box" x="249" y="112" width="106" height="44" rx="6"/><text x="302.0" y="131.0" text-anchor="middle" style="font-size:10.5px">10 Power</text><text x="302.0" y="145.0" text-anchor="middle" style="font-size:10.5px">BAT1_*</text><text x="302.0" y="169" text-anchor="middle" class="m t">bench</text><rect class="box" x="133" y="112" width="106" height="44" rx="6"/><text x="186.0" y="138.0" text-anchor="middle" style="font-size:10.5px">11 Modes</text><text x="186.0" y="169" text-anchor="middle" class="m t">bench</text><rect class="boxa" x="17" y="112" width="106" height="44" rx="6"/><text x="70.0" y="131.0" text-anchor="middle" class="b" style="font-size:10.5px">12 Failsafe,</text><text x="70.0" y="145.0" text-anchor="middle" class="b" style="font-size:10.5px">quad-chute</text><text x="70.0" y="169" text-anchor="middle" class="m t">bench + field</text><rect class="box" x="17" y="190" width="106" height="44" rx="6"/><text x="70.0" y="209.0" text-anchor="middle" style="font-size:10.5px">13 OSD,</text><text x="70.0" y="223.0" text-anchor="middle" style="font-size:10.5px">telemetry</text><text x="70.0" y="247" text-anchor="middle" class="m t">bench</text><rect class="box" x="133" y="190" width="106" height="44" rx="6"/><text x="186.0" y="209.0" text-anchor="middle" style="font-size:10.5px">14 Return,</text><text x="186.0" y="223.0" text-anchor="middle" style="font-size:10.5px">mission landing</text><text x="186.0" y="247" text-anchor="middle" class="m t">bench</text><rect class="boxa" x="249" y="190" width="106" height="44" rx="6"/><text x="302.0" y="209.0" text-anchor="middle" class="b" style="font-size:10.5px">15 Hover →</text><text x="302.0" y="223.0" text-anchor="middle" class="b" style="font-size:10.5px">transition ≥ 20 m</text><text x="302.0" y="247" text-anchor="middle" class="m t">field</text><rect class="boxa" x="365" y="190" width="106" height="44" rx="6"/><text x="418.0" y="209.0" text-anchor="middle" class="b" style="font-size:10.5px">16 MC, then</text><text x="418.0" y="223.0" text-anchor="middle" class="b" style="font-size:10.5px">FW_AT_*</text><text x="418.0" y="247" text-anchor="middle" class="m t">field</text><rect class="box" x="481" y="190" width="106" height="44" rx="6"/><text x="534.0" y="209.0" text-anchor="middle" style="font-size:10.5px">17 ULog,</text><text x="534.0" y="223.0" text-anchor="middle" style="font-size:10.5px">.params</text><text x="534.0" y="247" text-anchor="middle" class="m t">bench</text><path class="ln" d="M123 56.0 L133 56.0" marker-end="url(#ar)"/><path class="ln" d="M239 56.0 L249 56.0" marker-end="url(#ar)"/><path class="ln" d="M355 56.0 L365 56.0" marker-end="url(#ar)"/><path class="ln" d="M471 56.0 L481 56.0" marker-end="url(#ar)"/><path class="ln" d="M587 56.0 L597 56.0" marker-end="url(#ar)"/><path class="ln" d="M650.0 78 L650.0 112" marker-end="url(#ar)"/><path class="ln" d="M597 134.0 L587 134.0" marker-end="url(#ar)"/><path class="ln" d="M481 134.0 L471 134.0" marker-end="url(#ar)"/><path class="ln" d="M365 134.0 L355 134.0" marker-end="url(#ar)"/><path class="ln" d="M249 134.0 L239 134.0" marker-end="url(#ar)"/><path class="ln" d="M133 134.0 L123 134.0" marker-end="url(#ar)"/><path class="ln" d="M70.0 156 L70.0 190" marker-end="url(#ar)"/><path class="ln" d="M123 212.0 L133 212.0" marker-end="url(#ar)"/><path class="ln" d="M239 212.0 L249 212.0" marker-end="url(#ar)"/><path class="ln" d="M355 212.0 L365 212.0" marker-end="url(#ar)"/><path class="ln" d="M471 212.0 L481 212.0" marker-end="url(#ar)"/><text x="17" y="268" text-anchor="start" class="m t">Highlighted: the step needs a field. “bench” = no props; control surfaces after switching to FW without arming.</text><text x="17" y="284" text-anchor="start" class="m t">Propellers go on only at step 15; the first transition at 20 m or higher, into the wind.