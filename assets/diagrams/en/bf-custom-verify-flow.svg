<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Checking your own Betaflight build</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="34" width="330" height="34" rx="6"/><text x="175.0" y="55.0" text-anchor="middle" class="b">1. BUILD KEY → JSON: options as in the record?</text><rect class="box" x="10" y="80" width="330" height="34" rx="6"/><text x="175.0" y="101.0" text-anchor="middle">2. status: gyro detected?</text><rect class="box" x="10" y="126" width="330" height="34" rx="6"/><text x="175.0" y="147.0" text-anchor="middle">3. Ports / Receiver: does the receiver respond?</text><rect class="box" x="10" y="172" width="330" height="34" rx="6"/><text x="175.0" y="193.0" text-anchor="middle">4. Motors without props: DShot and bidir?</text><rect class="box" x="10" y="218" width="330" height="34" rx="6"/><text x="175.0" y="239.0" text-anchor="middle">5. Is the OSD visible in the goggles?</text><rect class="box" x="10" y="264" width="330" height="34" rx="6"/><text x="175.0" y="285.0" text-anchor="middle">6. Does diff all match the backup in meaning?</text><rect class="boxa" x="10" y="310" width="330" height="34" rx="6"/><text x="175.0" y="331.0" text-anchor="middle" class="b">Log: commit hash, EXTRA_FLAGS, checklist</text><rect class="box" x="420" y="123" width="290" height="40" rx="6"/><text x="565.0" y="140.0" text-anchor="middle">no: the receiver protocol</text><text x="565.0" y="154.0" text-anchor="middle">was not selected in the build</text><rect class="box" x="420" y="215" width="290" height="40" rx="6"/><text x="565.0" y="232.0" text-anchor="middle">no: built without HD OSD</text><text x="565.0" y="246.0" text-anchor="middle">(the port mask is not the issue)</text><rect class="box" x="420" y="261" width="290" height="40" rx="6"/><text x="565.0" y="278.0" text-anchor="middle">no servo / smix in the CLI:</text><text x="565.0" y="292.0" text-anchor="middle">built without SERVOS</text><path class="ln" d="M175.0 68 L175.0 80" marker-end="url(#ar)"/><path class="ln" d="M175.0 114 L175.0 126" marker-end="url(#ar)"/><path class="ln" d="M175.0 160 L175.0 172" marker-end="url(#ar)"/><path class="ln" d="M175.0 206 L175.0 218" marker-end="url(#ar)"/><path class="ln" d="M175.0 252 L175.0 264" marker-end="url(#ar)"/><path class="lna" d="M175.0 298 L175.0 310" marker-end="url(#ara)"/><path class="ln" d="M340 143.0 L420 143.0" marker-end="url(#ar)"/><path class="ln" d="M340 235.0 L420 235.0" marker-end="url(#ar)"/><path class="ln" d="M340 281.0 L420 281.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">Six checks in order; if the receiver is silent or there is no OSD, look at the build contents</text><text x="10" y="382" text-anchor="start" class="m t">diff all has no BUILD KEY: keep the status output separately, next to the config</text></svg>
