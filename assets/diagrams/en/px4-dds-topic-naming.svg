<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">How a uORB topic gets its name in ROS 2</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Topic name in ROS 2 = the string from dds_topics.yaml + _vN if MESSAGE_VERSION = N &gt; 0</text><text x="300.0" y="44" text-anchor="middle" class="a t b" style="font-size:11px">from PX4 to ROS 2 ↓</text><text x="576.0" y="44" text-anchor="middle" class="a t b" style="font-size:11px">from ROS 2 to PX4 ↑</text><text x="16" y="82" text-anchor="start" class="b" style="font-size:11px">.msg file</text><rect class="box" x="170.0" y="58.0" width="260.0" height="40.0" rx="6"/><text x="300.0" y="75.5" text-anchor="middle" style="font-size:10.5px">msg/versioned/VehicleLocalPosition.msg</text><text x="300.0" y="88.5" text-anchor="middle" style="font-size:10.5px">MESSAGE_VERSION = 1</text><rect class="box" x="446.0" y="58.0" width="260.0" height="40.0" rx="6"/><text x="576.0" y="75.5" text-anchor="middle" style="font-size:10.5px">msg/versioned/TrajectorySetpoint.msg</text><text x="576.0" y="88.5" text-anchor="middle" style="font-size:10.5px">MESSAGE_VERSION = 0</text><path class="lna" d="M300.0 98 L300.0 118" marker-end="url(#ara)"/><path class="lna" d="M576.0 118 L576.0 98" marker-end="url(#ara)"/><text x="16" y="135" text-anchor="start" class="b" style="font-size:11px">dds_topics.yaml</text><text x="16" y="150" text-anchor="start" class="m t" style="font-size:10px">no line — no topic</text><rect class="box" x="170.0" y="118.0" width="260.0" height="40.0" rx="6"/><text x="300.0" y="142.0" text-anchor="middle" style="font-size:10.5px">/fmu/out/vehicle_local_position</text><rect class="box" x="446.0" y="118.0" width="260.0" height="40.0" rx="6"/><text x="576.0" y="142.0" text-anchor="middle" style="font-size:10.5px">/fmu/in/trajectory_setpoint</text><path class="lna" d="M300.0 158 L300.0 178" marker-end="url(#ara)"/><path class="lna" d="M576.0 178 L576.0 158" marker-end="url(#ara)"/><text x="16" y="195" text-anchor="start" class="b" style="font-size:11px">uxrce_dds_client</text><text x="16" y="210" text-anchor="start" class="m t" style="font-size:10px">(on the flight controller)</text><rect class="box" x="170.0" y="178.0" width="260.0" height="40.0" rx="6"/><text x="300.0" y="202.0" text-anchor="middle" style="font-size:10.5px">version 1 &gt; 0 → suffix _v1</text><rect class="box" x="446.0" y="178.0" width="260.0" height="40.0" rx="6"/><text x="576.0" y="202.0" text-anchor="middle" style="font-size:10.5px">version 0 → no suffix</text><path class="lna" d="M300.0 218 L300.0 238" marker-end="url(#ara)"/><path class="lna" d="M576.0 238 L576.0 218" marker-end="url(#ara)"/><text x="16" y="255" text-anchor="start" class="b" style="font-size:11px">MicroXRCEAgent</text><text x="16" y="270" text-anchor="start" class="m t" style="font-size:10px">(companion / PC)</text><rect class="box" x="170.0" y="238.0" width="536.0" height="40.0" rx="6"/><text x="438.0" y="262.0" text-anchor="middle" style="font-size:10.5px">udp4 -p 8888 (SITL, Wi-Fi) or serial -b 921600 (TELEM2)</text><path class="lna" d="M300.0 278 L300.0 298" marker-end="url(#ara)"/><path class="lna" d="M576.0 298 L576.0 278" marker-end="url(#ara)"/><text x="16" y="322" text-anchor="start" class="b" style="font-size:11px">name in ROS 2</text><rect class="boxa" x="170.0" y="298.0" width="260.0" height="40.0" rx="6"/><text x="300.0" y="322.0" text-anchor="middle" class="b" style="font-size:10.5px">/fmu/out/vehicle_local_position_v1</text><rect class="boxa" x="446.0" y="298.0" width="260.0" height="40.0" rx="6"/><text x="576.0" y="322.0" text-anchor="middle" class="b" style="font-size:10.5px">/fmu/in/trajectory_setpoint</text><path class="lna" d="M300.0 338 L300.0 358" marker-end="url(#ara)"/><path class="lna" d="M576.0 358 L576.0 338" marker-end="url(#ara)"/><text x="16" y="375" text-anchor="start" class="b" style="font-size:11px">your node</text><text x="16" y="390" text-anchor="start" class="m t" style="font-size:10px">px4_msgs = the PX4 version</text><rect class="box" x="170.0" y="358.0" width="260.0" height="40.0" rx="6"/><text x="300.0" y="375.5" text-anchor="middle" style="font-size:10.5px">subscribe to the name with _v1</text><text x="300.0" y="388.5" text-anchor="middle" style="font-size:10.5px">(before 1.17 — no suffix)</text><rect class="box" x="446.0" y="358.0" width="260.0" height="40.0" rx="6"/><text x="576.0" y="382.0" text-anchor="middle" style="font-size:10.5px">publishes TrajectorySetpoint</text></svg>
