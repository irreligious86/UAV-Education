<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">EKF3 source selection by scenario</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">EKF3 source selection by scenario</text><rect class="box" x="285.0" y="34" width="150.0" height="40" rx="6"/><text x="360.0" y="52.0" text-anchor="middle" style="font-size:10.5px">Has GPS</text><text x="360.0" y="64.0" text-anchor="middle" style="font-size:10.5px">with a good fix?</text><path class="ln" d="M360.0 74 L360.0 89.0 L150.0 89.0 L150.0 104" marker-end="url(#ar)"/><text x="154.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="75.0" y="104" width="150.0" height="40" rx="6"/><text x="150.0" y="122.0" text-anchor="middle" class="b" style="font-size:10.5px">POSXY/VELXY = GPS</text><text x="150.0" y="134.0" text-anchor="middle" class="b" style="font-size:10.5px">POSZ = Baro</text><path class="ln" d="M150.0 144 L150.0 159.0 L80.0 159.0 L80.0 174" marker-end="url(#ar)"/><text x="84.0" y="155.0" text-anchor="start" class="a t" style="font-size:10px">jamming</text><rect class="box" x="13.0" y="174" width="134.0" height="40" rx="18"/><text x="80.0" y="192.0" text-anchor="middle" style="font-size:9.5px">+ VELXY flow,</text><text x="80.0" y="204.0" text-anchor="middle" style="font-size:9.5px">POSZ rangefinder</text><path class="ln" d="M150.0 144 L150.0 159.0 L220.0 159.0 L220.0 174" marker-end="url(#ar)"/><text x="224.0" y="155.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="153.0" y="174" width="134.0" height="40" rx="18"/><text x="220.0" y="192.0" text-anchor="middle" style="font-size:9.5px">YAW = compass /</text><text x="220.0" y="204.0" text-anchor="middle" style="font-size:9.5px">GPS fallback (3)</text><path class="ln" d="M360.0 74 L360.0 89.0 L500.0 89.0 L500.0 104" marker-end="url(#ar)"/><text x="504.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="425.0" y="104" width="150.0" height="40" rx="6"/><text x="500.0" y="122.0" text-anchor="middle" style="font-size:10.5px">Textured floor</text><text x="500.0" y="134.0" text-anchor="middle" style="font-size:10.5px">and rangefinder?</text><path class="ln" d="M500.0 144 L500.0 159.0 L360.0 159.0 L360.0 174" marker-end="url(#ar)"/><text x="364.0" y="155.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="293.0" y="174" width="134.0" height="40" rx="18"/><text x="360.0" y="192.0" text-anchor="middle" class="b" style="font-size:9.5px">VELXY flow (5),</text><text x="360.0" y="204.0" text-anchor="middle" class="b" style="font-size:9.5px">POSZ rangefinder (2)</text><path class="ln" d="M500.0 144 L500.0 159.0 L500.0 159.0 L500.0 174" marker-end="url(#ar)"/><text x="504.0" y="155.0" text-anchor="start" class="a t" style="font-size:10px">VIO</text><rect class="box" x="433.0" y="174" width="134.0" height="40" rx="18"/><text x="500.0" y="192.0" text-anchor="middle" style="font-size:9.5px">POSXY/VELXY/YAW</text><text x="500.0" y="204.0" text-anchor="middle" style="font-size:9.5px">ExternalNav (6)</text><path class="ln" d="M500.0 144 L500.0 159.0 L640.0 159.0 L640.0 174" marker-end="url(#ar)"/><text x="644.0" y="155.0" text-anchor="start" class="a t" style="font-size:10px">nothing</text><rect class="box" x="573.0" y="174" width="134.0" height="40" rx="18"/><text x="640.0" y="192.0" text-anchor="middle" style="font-size:9.5px">Stabilize/AltHold;</text><text x="640.0" y="204.0" text-anchor="middle" style="font-size:9.5px">no Loiter</text></svg>
