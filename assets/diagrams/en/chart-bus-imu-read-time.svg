<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">IMU block read time on different buses</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">How long a 14-byte IMU block takes on the bus (clocks per the frame rules, no gaps)</text><text x="110" y="71" text-anchor="end" style="font-size:11.5px">SPI 24 MHz</text><rect x="120" y="57" width="114.6" height="20" rx="2" fill="var(--gc-accent-hud, #5ef1d2)" opacity="0.35" stroke="var(--gc-accent-hud, #5ef1d2)"/><text x="240.58125077770754" y="71" text-anchor="start" class="b t" style="font-size:11px">5 µs</text><text x="110" y="105" text-anchor="end" style="font-size:11.5px">SPI 8 MHz</text><rect x="120" y="91" width="192.8" height="20" rx="2" fill="var(--gc-accent-hud, #5ef1d2)" opacity="0.35" stroke="var(--gc-accent-hud, #5ef1d2)"/><text x="318.7951223305228" y="105" text-anchor="start" class="b t" style="font-size:11px">15 µs</text><text x="110" y="139" text-anchor="end" style="font-size:11.5px">I2C 1 MHz</text><rect x="120" y="125" width="359.5" height="20" rx="2" fill="var(--gc-signal-amber, #f0b24c)" opacity="0.35" stroke="var(--gc-signal-amber, #f0b24c)"/><text x="485.51608514234255" y="139" text-anchor="start" class="b t" style="font-size:11px">156 µs</text><text x="110" y="173" text-anchor="end" style="font-size:11.5px">I2C 400 kHz</text><rect x="120" y="159" width="424.7" height="20" rx="2" fill="var(--gc-signal-amber, #f0b24c)" opacity="0.35" stroke="var(--gc-signal-amber, #f0b24c)"/><text x="550.7498772153626" y="173" text-anchor="start" class="b t" style="font-size:11px">390 µs</text><text x="110" y="207" text-anchor="end" style="font-size:11.5px">I2C 100 kHz</text><rect x="120" y="193" width="523.4" height="20" rx="2" fill="var(--gc-signal-amber, #f0b24c)" opacity="0.35" stroke="var(--gc-signal-amber, #f0b24c)"/><text x="649.4447946247375" y="207" text-anchor="start" class="b t" style="font-size:11px">1.56 ms</text><text x="110" y="241" text-anchor="end" style="font-size:11.5px">UART 921600</text><rect x="120" y="227" width="357.6" height="20" rx="2" fill="currentColor" opacity="0.35" stroke="currentColor"/><text x="483.6245070497961" y="241" text-anchor="start" class="b t" style="font-size:11px">152 µs</text><text x="110" y="275" text-anchor="end" style="font-size:11.5px">UART 115200</text><rect x="120" y="261" width="505.7" height="20" rx="2" fill="currentColor" opacity="0.35" stroke="currentColor"/><text x="631.6668831638581" y="275" text-anchor="start" class="b t" style="font-size:11px">1.22 ms</text><line x1="463.7" y1="44" x2="463.7" y2="290" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.4" stroke-dasharray="5 3"/><text x="467.74375233312253" y="40" text-anchor="start" class="d t" style="font-size:11px">the whole 8 kHz cycle is 125 µs</text><line class="ln" x1="120" y1="292" x2="690" y2="292"/><line class="ln" x1="120.0" y1="288" x2="120.0" y2="296"/><text x="120.0" y="310" text-anchor="middle" class="m t" style="font-size:11px">1</text><line class="ln" x1="198.2" y1="288" x2="198.2" y2="296"/><text x="198.21387155281528" y="310" text-anchor="middle" class="m t" style="font-size:11px">3</text><line class="ln" x1="283.9" y1="288" x2="283.9" y2="296"/><text x="283.9287094823949" y="310" text-anchor="middle" class="m t" style="font-size:11px">10</text><line class="ln" x1="362.1" y1="288" x2="362.1" y2="296"/><text x="362.1425810352101" y="310" text-anchor="middle" class="m t" style="font-size:11px">30</text><line class="ln" x1="447.9" y1="288" x2="447.9" y2="296"/><text x="447.8574189647898" y="310" text-anchor="middle" class="m t" style="font-size:11px">100</text><line class="ln" x1="526.1" y1="288" x2="526.1" y2="296"/><text x="526.0712905176051" y="310" text-anchor="middle" class="m t" style="font-size:11px">300</text><line class="ln" x1="611.8" y1="288" x2="611.8" y2="296"/><text x="611.7861284471846" y="310" text-anchor="middle" class="m t" style="font-size:11px">1000</text><line class="ln" x1="690.0" y1="288" x2="690.0" y2="296"/><text x="690.0" y="310" text-anchor="middle" class="m t" style="font-size:11px">3000</text><text x="405.0" y="326" text-anchor="middle" class="m t" style="font-size:11px">time, µs (log scale: each tick is ×3 or ×3.3)</text><text x="16" y="354" text-anchor="start" class="m t">SPI: (1 + 14) bytes × 8 clocks.  I2C: (address+W, register, address+R + 14) bytes × 9 clocks</text><text x="16" y="370" text-anchor="start" class="m t">(8 bits + ACK) + START, repeated START, STOP.  UART 8N1: 10 bits per byte.</text><text x="16" y="386" text-anchor="start" class="m t">An 8 kHz gyro lives on SPI only: even 1 MHz I2C does not fit in the cycle.</text></svg>
