<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">NED/FRD and ENU/FLU coordinate frames</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Coordinate frames: NED/FRD (ArduPilot, PX4, MAVLink) and ENU/FLU (ROS, REP-103)</text><text x="100" y="28" text-anchor="middle" class="b">NED — world</text><path class="lna" d="M100 120 L170 120" marker-end="url(#ara)"/><text x="178" y="114" text-anchor="start" class="t">N (x)</text><path class="lna" d="M100 120 L55 80" marker-end="url(#ara)"/><text x="47" y="74" text-anchor="end" class="t">E (y)</text><path class="lna" d="M100 120 L100 180" marker-end="url(#ara)"/><text x="108" y="194" text-anchor="start" class="t">D (z) ↓</text><text x="265" y="28" text-anchor="middle" class="b">FRD — body</text><path class="lna" d="M265 120 L335 120" marker-end="url(#ara)"/><text x="343" y="114" text-anchor="start" class="t">F (x)</text><path class="lna" d="M265 120 L220 80" marker-end="url(#ara)"/><text x="212" y="74" text-anchor="end" class="t">R (y)</text><path class="lna" d="M265 120 L265 180" marker-end="url(#ara)"/><text x="273" y="194" text-anchor="start" class="t">D (z) ↓</text><text x="430" y="28" text-anchor="middle" class="b">ENU — world</text><path class="ln" d="M430 120 L500 120" marker-end="url(#ar)"/><text x="508" y="114" text-anchor="start" class="t">E (x)</text><path class="ln" d="M430 120 L385 80" marker-end="url(#ar)"/><text x="377" y="74" text-anchor="end" class="t">N (y)</text><path class="ln" d="M430 120 L430 60" marker-end="url(#ar)"/><text x="438" y="54" text-anchor="start" class="t">U (z)</text><text x="595" y="28" text-anchor="middle" class="b">FLU — body</text><path class="ln" d="M595 120 L665 120" marker-end="url(#ar)"/><text x="673" y="114" text-anchor="start" class="t">F (x)</text><path class="ln" d="M595 120 L550 80" marker-end="url(#ar)"/><text x="542" y="74" text-anchor="end" class="t">L (y)</text><path class="ln" d="M595 120 L595 60" marker-end="url(#ar)"/><text x="603" y="54" text-anchor="start" class="t">U (z)</text><text x="16" y="212" text-anchor="start" class="m t">Body: F — nose, R/L — right/left wing, D/U — down/up.</text><text x="16" y="228" text-anchor="start" class="m t">FRD → FLU: (x, y, z) → (x, −y, −z).   NED → ENU: (n, e, d) → (e, n, −d).   ψ_enu = 90° − ψ_ned.</text><text x="16" y="244" text-anchor="start" class="m t">R_nb = Rz(ψ)·Ry(θ)·Rx(φ): a vector in FRD gets roll first, then pitch, then yaw → NED.</text></svg>
