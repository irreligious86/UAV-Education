<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">PX4 1.18: from the failure flag to the action</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="17" y="36" width="204" height="56" rx="6"/><text x="119.0" y="61.0" text-anchor="middle">commander checks</text><text x="119.0" y="75.0" text-anchor="middle">→ failsafe_flags</text><text x="119.0" y="105" text-anchor="middle" class="m t">RC, GCS, battery, position, geofence, FD</text><rect class="box" x="258" y="36" width="204" height="56" rx="6"/><text x="360.0" y="61.0" text-anchor="middle">Condition → action</text><text x="360.0" y="75.0" text-anchor="middle">NAV_RCL_ACT, GF_ACTION …</text><text x="360.0" y="105" text-anchor="middle" class="m t">each condition has its own</text><rect class="boxa" x="499" y="36" width="204" height="56" rx="6"/><text x="601.0" y="54.0" text-anchor="middle" class="b">The worst one is taken:</text><text x="601.0" y="68.0" text-anchor="middle" class="b">Hold &lt; RTL &lt; Land &lt;</text><text x="601.0" y="82.0" text-anchor="middle" class="b">Descend &lt; Disarm &lt; Terminate</text><rect class="box" x="499" y="142" width="204" height="56" rx="6"/><text x="601.0" y="160.0" text-anchor="middle">Delay? COM_FAIL_ACT_T &gt; 0,</text><text x="601.0" y="174.0" text-anchor="middle">action RTL / Land,</text><text x="601.0" y="188.0" text-anchor="middle">not yet in failsafe</text><text x="601.0" y="211" text-anchor="middle" class="m t">Hold, Disarm, Terminate — at once</text><rect class="boxa" x="258" y="142" width="204" height="56" rx="6"/><text x="360.0" y="160.0" text-anchor="middle" class="b">Hold for COM_FAIL_ACT_T</text><text x="360.0" y="174.0" text-anchor="middle" class="b">(5 s), takeover —</text><text x="360.0" y="188.0" text-anchor="middle" class="b">only by changing the mode</text><rect class="box" x="17" y="142" width="204" height="56" rx="6"/><text x="119.0" y="174.0" text-anchor="middle">The action is executed</text><rect class="box" x="17" y="248" width="204" height="56" rx="6"/><text x="119.0" y="266.0" text-anchor="middle">Mode unavailable →</text><text x="119.0" y="280.0" text-anchor="middle">Hold → RTL → Land →</text><text x="119.0" y="294.0" text-anchor="middle">Descend → Terminate</text><text x="119.0" y="317" text-anchor="middle" class="m t">no position, home, altitude</text><rect class="boxa" x="258" y="248" width="204" height="56" rx="6"/><text x="360.0" y="266.0" text-anchor="middle" class="b">Pilot takeover:</text><text x="360.0" y="280.0" text-anchor="middle" class="b">a mode or a fast</text><text x="360.0" y="294.0" text-anchor="middle" class="b">stick movement (OVERRIDE_SPD)</text><text x="360.0" y="317" text-anchor="middle" class="m t">sticks — multirotor only</text><rect class="box" x="499" y="248" width="204" height="56" rx="6"/><text x="601.0" y="266.0" text-anchor="middle">Cleared: the condition is gone</text><text x="601.0" y="280.0" text-anchor="middle">+ a mode change</text><text x="601.0" y="294.0" text-anchor="middle">or a disarm</text><text x="601.0" y="317" text-anchor="middle" class="m t">Terminate cannot be cleared</text><path class="ln" d="M221 64.0 L258 64.0" marker-end="url(#ar)"/><path class="ln" d="M462 64.0 L499 64.0" marker-end="url(#ar)"/><path class="ln" d="M601.0 92 L601.0 142" marker-end="url(#ar)"/><path class="lna" d="M499 170.0 L462 170.0" marker-end="url(#ara)"/><text x="480.5" y="163.0" text-anchor="middle" class="m t" style="font-size:10px">yes</text><path class="lna" d="M258 170.0 L221 170.0" marker-end="url(#ara)"/><text x="239.5" y="163.0" text-anchor="middle" class="m t" style="font-size:10px">5 s</text><path class="ln" d="M119.0 198 L119.0 248" marker-end="url(#ar)"/><path class="ln" d="M221 276.0 L258 276.0" marker-end="url(#ar)"/><path class="ln" d="M462 276.0 L499 276.0" marker-end="url(#ar)"/><text x="17" y="336" text-anchor="start" class="m t">Source: commander/failsafe/framework.cpp and failsafe.cpp, v1.18.0.</text></svg>
