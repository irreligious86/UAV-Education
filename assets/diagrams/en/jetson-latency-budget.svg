<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Jetson → PX4 latency budget</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">“Camera → command” latency budget: 32 ms over a wire vs up to 162 ms with USB and Wi-Fi</text><text x="16" y="42" text-anchor="start" class="m t" style="font-size:10.5px">Breakdown of 32 ms (scale 0–32 ms)</text><rect class="boxa" x="170.0" y="52.0" width="265.0" height="38.0" rx="3"/><text x="302.5" y="68" text-anchor="middle" class="b" style="font-size:10.5px">CSI camera 60 fps</text><text x="302.5" y="81" text-anchor="middle" style="font-size:10.5px">≤ 16 ms to the frame</text><rect class="boxa" x="435.0" y="52.0" width="198.8" height="38.0" rx="3"/><text x="534.375" y="68" text-anchor="middle" class="b" style="font-size:10.5px">TensorRT YOLO-nano</text><text x="534.375" y="81" text-anchor="middle" style="font-size:10.5px">FP16 ~12 ms</text><rect class="box" x="633.8" y="52.0" width="33.1" height="38.0" rx="3"/><rect class="box" x="666.9" y="52.0" width="33.1" height="38.0" rx="3"/><line class="lnm" x1="650.3" y1="90" x2="650.3" y2="102"/><line class="lnm" x1="683.4" y1="90" x2="683.4" y2="118"/><text x="654.3125" y="110" text-anchor="end" class="m t" style="font-size:10.5px">tracker 2 ms</text><text x="687.4375" y="128" text-anchor="end" class="m t" style="font-size:10.5px">DDS over UART 921600 2 ms</text><text x="16" y="76" text-anchor="start" class="b" style="font-size:11px">CSI + UART</text><text x="16" y="158" text-anchor="start" class="m t" style="font-size:10.5px">Three paths (scale 0–200 ms; dashed — spread per the module)</text><text x="16" y="187" text-anchor="start" class="b" style="font-size:11px">CSI + wire</text><rect class="boxa" x="170.0" y="168.0" width="84.8" height="30.0" rx="3"/><text x="212.4" y="187" text-anchor="middle" class="b" style="font-size:10.5px">32</text><text x="260.8" y="187" text-anchor="start" class="a b" style="font-size:11px">= 32 ms (~35)</text><text x="16" y="231" text-anchor="start" style="font-size:11px">USB camera MJPEG</text><rect class="boxa" x="170.0" y="212.0" width="84.8" height="30.0" rx="3"/><text x="212.4" y="231" text-anchor="middle" class="b" style="font-size:10.5px">32</text><rect class="box" x="254.8" y="212.0" width="106.0" height="30.0" rx="3"/><text x="307.79999999999995" y="231" text-anchor="middle" class="t" style="font-size:10.5px">USB +40…80</text><rect x="360.8" y="212" width="106.0" height="30" rx="3" fill="var(--gc-signal-amber, #f0b24c)" fill-opacity="0.18" stroke="var(--gc-signal-amber, #f0b24c)" stroke-dasharray="4 3"/><text x="472.8" y="231" text-anchor="start" class="w b" style="font-size:11px">72–112 ms</text><text x="16" y="275" text-anchor="start" style="font-size:11px">USB + Wi-Fi bridge</text><rect class="boxa" x="170.0" y="256.0" width="84.8" height="30.0" rx="3"/><text x="212.4" y="275" text-anchor="middle" class="b" style="font-size:10.5px">32</text><rect class="box" x="254.8" y="256.0" width="106.0" height="30.0" rx="3"/><text x="307.79999999999995" y="275" text-anchor="middle" class="t" style="font-size:10.5px">USB</text><rect class="box" x="360.8" y="256.0" width="53.0" height="30.0" rx="3"/><text x="387.29999999999995" y="275" text-anchor="middle" class="t" style="font-size:10.5px">Wi-Fi</text><rect x="413.8" y="256" width="185.5" height="30" rx="3" fill="var(--gc-signal-amber, #f0b24c)" fill-opacity="0.18" stroke="var(--gc-signal-amber, #f0b24c)" stroke-dasharray="4 3"/><text x="605.3" y="275" text-anchor="start" class="w b" style="font-size:11px">92–162 ms</text><line x1="170" y1="298" x2="700" y2="298" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><line x1="170.0" y1="298" x2="170.0" y2="303" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="170.0" y="316" text-anchor="middle" class="m t" style="font-size:10.5px">0 ms</text><line x1="302.5" y1="298" x2="302.5" y2="303" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="302.5" y="316" text-anchor="middle" class="m t" style="font-size:10.5px">50 ms</text><line x1="435.0" y1="298" x2="435.0" y2="303" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="435.0" y="316" text-anchor="middle" class="m t" style="font-size:10.5px">100 ms</text><line x1="567.5" y1="298" x2="567.5" y2="303" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="567.5" y="316" text-anchor="middle" class="m t" style="font-size:10.5px">150 ms</text><line x1="700.0" y1="298" x2="700.0" y2="303" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1"/><text x="700.0" y="316" text-anchor="middle" class="m t" style="font-size:10.5px">200 ms</text></svg>
