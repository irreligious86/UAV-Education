<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Precision landing loop</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="30" width="110" height="44" rx="6"/><text x="65.0" y="56.0" text-anchor="middle" style="font-size:10.5px">Camera down</text><rect class="boxa" x="140" y="30" width="130" height="44" rx="6"/><text x="205.0" y="49.0" text-anchor="middle" class="b">ArUco / IR-LOCK</text><text x="205.0" y="63.0" text-anchor="middle" class="b">4 corners, ID</text><rect class="boxa" x="290" y="30" width="120" height="44" rx="6"/><text x="350.0" y="49.0" text-anchor="middle" class="b" style="font-size:10.5px">Pose: PnP</text><text x="350.0" y="63.0" text-anchor="middle" class="b" style="font-size:10.5px">or angles</text><rect class="boxa" x="430" y="30" width="140" height="44" rx="6"/><text x="500.0" y="49.0" text-anchor="middle" class="b">LANDING_TARGET</text><text x="500.0" y="63.0" text-anchor="middle" class="b">time_usec = frame</text><rect class="box" x="590" y="30" width="120" height="44" rx="6"/><text x="650.0" y="49.0" text-anchor="middle" style="font-size:10.5px">Target filter</text><text x="650.0" y="63.0" text-anchor="middle" style="font-size:10.5px">PLND_EST_TYPE</text><rect class="box" x="430" y="120" width="140" height="44" rx="6"/><text x="500.0" y="139.0" text-anchor="middle">Rangefinder</text><text x="500.0" y="153.0" text-anchor="middle">PLND_ALT_MIN/MAX</text><rect class="box" x="590" y="120" width="120" height="44" rx="6"/><text x="650.0" y="139.0" text-anchor="middle" style="font-size:10.5px">Position loop</text><text x="650.0" y="153.0" text-anchor="middle" style="font-size:10.5px">+ descent</text><path class="ln" d="M120 52.0 L140 52.0" marker-end="url(#ar)"/><path class="ln" d="M270 52.0 L290 52.0" marker-end="url(#ar)"/><path class="ln" d="M410 52.0 L430 52.0" marker-end="url(#ar)"/><path class="lna" d="M570 52.0 L590 52.0" marker-end="url(#ara)"/><path class="ln" d="M650.0 74 L650.0 120" marker-end="url(#ar)"/><path class="ln" d="M570 142.0 L590 142.0" marker-end="url(#ar)"/><text x="10" y="140" text-anchor="start" class="m t">Target lost: above threshold — search/retry,</text><text x="10" y="154" text-anchor="start" class="m t">below PLND_ALT_MIN — keep landing</text></svg>
