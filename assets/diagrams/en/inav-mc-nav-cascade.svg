<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">INAV 9.1: the multirotor navigation and stabilization cascade (defaults)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="160" height="48" rx="6"/><text x="90.0" y="61.0" text-anchor="middle">Position target</text><text x="90.0" y="75.0" text-anchor="middle">navTgtPos[0,1]</text><rect class="boxa" x="190" y="40" width="160" height="48" rx="6"/><text x="270.0" y="61.0" text-anchor="middle" class="b">Pos XY: P → cm/s</text><text x="270.0" y="75.0" text-anchor="middle" class="b">65 → 0.65 1/s</text><rect class="boxa" x="370" y="40" width="160" height="48" rx="6"/><text x="450.0" y="61.0" text-anchor="middle" class="b">Vel XY: PID + FF</text><text x="450.0" y="75.0" text-anchor="middle" class="b">40 → 2.0 1/s → cm/s²</text><rect class="box" x="550" y="40" width="160" height="48" rx="6"/><text x="630.0" y="61.0" text-anchor="middle">Acceleration → angle</text><text x="630.0" y="75.0" text-anchor="middle">≤ nav_mc_bank_angle</text><rect class="boxa" x="550" y="132" width="160" height="48" rx="6"/><text x="630.0" y="153.0" text-anchor="middle" class="b">ANGLE: P</text><text x="630.0" y="167.0" text-anchor="middle" class="b">20 → 3.05 1/s</text><rect class="boxa" x="280" y="132" width="160" height="48" rx="6"/><text x="360.0" y="153.0" text-anchor="middle" class="b">Rate PID</text><text x="360.0" y="167.0" text-anchor="middle" class="b">40 → 1.29 units/(°/s)</text><rect class="box" x="10" y="132" width="160" height="48" rx="6"/><text x="90.0" y="153.0" text-anchor="middle">Mixer</text><text x="90.0" y="167.0" text-anchor="middle">axisPID + throttle</text><rect class="box" x="550" y="224" width="160" height="48" rx="6"/><text x="630.0" y="245.0" text-anchor="middle">Altitude target</text><text x="630.0" y="259.0" text-anchor="middle">navTgtPos[2]</text><rect class="boxa" x="370" y="224" width="160" height="48" rx="6"/><text x="450.0" y="245.0" text-anchor="middle" class="b">Pos Z: sqrt-P → cm/s</text><text x="450.0" y="259.0" text-anchor="middle" class="b">50 → 0.5 1/s</text><rect class="boxa" x="190" y="224" width="160" height="48" rx="6"/><text x="270.0" y="245.0" text-anchor="middle" class="b">Vel Z: PID → µs</text><text x="270.0" y="259.0" text-anchor="middle" class="b">hover_thr + correction</text><path class="ln" d="M170 64.0 L190 64.0" marker-end="url(#ar)"/><path class="ln" d="M350 64.0 L370 64.0" marker-end="url(#ar)"/><path class="ln" d="M530 64.0 L550 64.0" marker-end="url(#ar)"/><path class="lna" d="M630.0 88 L630.0 132" marker-end="url(#ara)"/><text x="636.0" y="106.0" text-anchor="middle" class="m t" style="font-size:10px">angle</text><path class="lna" d="M550 156.0 L440 156.0" marker-end="url(#ara)"/><text x="495.0" y="149.0" text-anchor="middle" class="m t" style="font-size:10px">°/s</text><path class="lna" d="M280 156.0 L170 156.0" marker-end="url(#ara)"/><text x="225.0" y="149.0" text-anchor="middle" class="m t" style="font-size:10px">±500</text><path class="ln" d="M550 248.0 L530 248.0" marker-end="url(#ar)"/><path class="ln" d="M370 248.0 L350 248.0" marker-end="url(#ar)"/><path class="ln" d="M190 248.0 L180.0 248.0 L180.0 156.0 L170 156.0" marker-end="url(#ar)"/><text x="10" y="294" text-anchor="start" class="m t">Feedback of the outer loops is the position estimator (navPos, navVel), of the inner ones the gyro and attitude.</text><text x="10" y="309" text-anchor="start" class="w t">Tune from the inside out: rate → ANGLE → Vel Z / Pos Z → Vel XY / Pos XY.</text></svg>
