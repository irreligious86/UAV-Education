<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Several batteries: the sum on the first monitor, each with its own failsafe</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="14" y="50" width="150" height="50" rx="6"/><text x="89.0" y="72.0" text-anchor="middle">BATT2: type 4</text><text x="89.0" y="86.0" text-anchor="middle">Battery A, 6S 10 Ah</text><rect class="box" x="14" y="130" width="150" height="50" rx="6"/><text x="89.0" y="152.0" text-anchor="middle">BATT3: type 4</text><text x="89.0" y="166.0" text-anchor="middle">Battery B, 6S 10 Ah</text><rect class="box" x="14" y="230" width="150" height="50" rx="6"/><text x="89.0" y="252.0" text-anchor="middle">BATT4: type 3</text><text x="89.0" y="266.0" text-anchor="middle">avionics 3S</text><rect class="boxa" x="216" y="90" width="170" height="50" rx="6"/><text x="301.0" y="112.0" text-anchor="middle" class="b">BATT: type 10 (sum)</text><text x="301.0" y="126.0" text-anchor="middle" class="b">BATT_SUM_MASK = 6</text><rect class="box" x="440" y="40" width="170" height="50" rx="6"/><text x="525.0" y="62.0" text-anchor="middle">SYS_STATUS, OSD,</text><text x="525.0" y="76.0" text-anchor="middle">COMPASS_MOTCT = 2</text><rect class="boxa" x="440" y="130" width="170" height="50" rx="6"/><text x="525.0" y="152.0" text-anchor="middle" class="b">Monitor 1 failsafe</text><text x="525.0" y="166.0" text-anchor="middle" class="b">remaining &lt; 5000 of 20000</text><rect class="boxa" x="440" y="230" width="170" height="50" rx="6"/><text x="525.0" y="252.0" text-anchor="middle" class="b">Monitor 4 failsafe</text><text x="525.0" y="266.0" text-anchor="middle" class="b">BATT4_LOW_VOLT</text><path class="ln" d="M164 75.0 L190.0 75.0 L190.0 115.0 L216 115.0" marker-end="url(#ar)"/><text x="190.0" y="69.0" text-anchor="middle" class="m t" style="font-size:10px">I, mAh</text><path class="ln" d="M164 155.0 L190.0 155.0 L190.0 115.0 L216 115.0" marker-end="url(#ar)"/><path class="ln" d="M386 115.0 L413.0 115.0 L413.0 65.0 L440 65.0" marker-end="url(#ar)"/><path class="lna" d="M386 115.0 L413.0 115.0 L413.0 155.0 L440 155.0" marker-end="url(#ara)"/><path class="lna" d="M164 255.0 L440 255.0" marker-end="url(#ara)"/><text x="302.0" y="248.0" text-anchor="middle" class="m t" style="font-size:10px">V only</text><text x="14" y="300" text-anchor="start" class="m t">Sum: current and mAh add up, voltage is averaged.</text><text x="14" y="316" text-anchor="start" class="m t">Mask 6 = bits 1 and 2 = monitors 2 and 3. Mask 0 on monitor 1 would add the avionics to the average voltage.</text><text x="14" y="332" text-anchor="start" class="m t">BATTn_FS_*_ACT thresholds and actions are checked for each monitor separately, and only while armed.</text></svg>
