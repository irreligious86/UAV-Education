<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Betaflight Quad X: motor numbers, log fields and rotation</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Betaflight Quad X from above: number, log field, rotation (props-in)</text><path class="ln" d="M215.1 187.9 L244.9 215.1 M215.1 142.1 L244.9 114.9 M164.9 187.9 L135.1 215.1 M164.9 142.1 L135.1 114.9" style="stroke-width:5;opacity:0.35"/><rect class="box" x="166" y="141" width="48" height="48" rx="6"/><text x="190" y="169" text-anchor="middle" class="m t">FC</text><path class="lna" d="M190 136 L190 56" marker-end="url(#ara)"/><text x="190" y="46" text-anchor="middle" class="a t">nose, camera</text><circle class="box" cx="270" cy="238" r="34"/><text x="270" y="234" text-anchor="middle" class="b" style="font-size:14px">1 RR</text><text x="270" y="252" text-anchor="middle" class="a t">motor[0]</text><path class="lna" d="M231.9 216.0 A44 44 0 0 1 303.7 209.7" marker-end="url(#ara)"/><text x="328" y="242" text-anchor="start" class="b t">CW</text><circle class="box" cx="270" cy="92" r="34"/><text x="270" y="88" text-anchor="middle" class="b" style="font-size:14px">2 FR</text><text x="270" y="106" text-anchor="middle" class="a t">motor[1]</text><path class="lna" d="M303.7 63.7 A44 44 0 0 0 231.9 70.0" marker-end="url(#ara)"/><text x="328" y="96" text-anchor="start" class="b t">CCW</text><circle class="box" cx="110" cy="238" r="34"/><text x="110" y="234" text-anchor="middle" class="b" style="font-size:14px">3 RL</text><text x="110" y="252" text-anchor="middle" class="a t">motor[2]</text><path class="lna" d="M143.7 209.7 A44 44 0 0 0 71.9 216.0" marker-end="url(#ara)"/><text x="52" y="242" text-anchor="end" class="b t">CCW</text><circle class="box" cx="110" cy="92" r="34"/><text x="110" y="88" text-anchor="middle" class="b" style="font-size:14px">4 FL</text><text x="110" y="106" text-anchor="middle" class="a t">motor[3]</text><path class="lna" d="M71.9 70.0 A44 44 0 0 1 143.7 63.7" marker-end="url(#ara)"/><text x="52" y="96" text-anchor="end" class="b t">CW</text><text x="190" y="306" text-anchor="middle" class="m t">yaw_motors_reversed = ON (props-out):</text><text x="190" y="320" text-anchor="middle" class="m t">all arrows reversed, same numbers</text><text x="400" y="46" text-anchor="start" class="m t">Three pair comparisons by median (in % of travel)</text><path class="lnm" d="M422 94 L468 140 M468 94 L422 140"/><circle cx="468" cy="140" r="10" fill="var(--gc-accent-hud, #5ef1d2)" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="468" y="144" text-anchor="middle" class="b" style="font-size:11px">1</text><circle cx="468" cy="94" r="10" fill="none" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="468" y="98" text-anchor="middle" class="b" style="font-size:11px">2</text><circle cx="422" cy="140" r="10" fill="var(--gc-accent-hud, #5ef1d2)" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="422" y="144" text-anchor="middle" class="b" style="font-size:11px">3</text><circle cx="422" cy="94" r="10" fill="none" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="422" y="98" text-anchor="middle" class="b" style="font-size:11px">4</text><text x="445" y="72" text-anchor="middle" class="b t">pitch</text><text x="445" y="170" text-anchor="middle" class="m t">rear − front</text><text x="445" y="184" text-anchor="middle" class="m t">(1+3) − (2+4)</text><path class="lnm" d="M532 94 L578 140 M578 94 L532 140"/><circle cx="578" cy="140" r="10" fill="none" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="578" y="144" text-anchor="middle" class="b" style="font-size:11px">1</text><circle cx="578" cy="94" r="10" fill="none" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="578" y="98" text-anchor="middle" class="b" style="font-size:11px">2</text><circle cx="532" cy="140" r="10" fill="var(--gc-accent-hud, #5ef1d2)" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="532" y="144" text-anchor="middle" class="b" style="font-size:11px">3</text><circle cx="532" cy="94" r="10" fill="var(--gc-accent-hud, #5ef1d2)" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="532" y="98" text-anchor="middle" class="b" style="font-size:11px">4</text><text x="555" y="72" text-anchor="middle" class="b t">roll</text><text x="555" y="170" text-anchor="middle" class="m t">left − right</text><text x="555" y="184" text-anchor="middle" class="m t">(3+4) − (1+2)</text><path class="lnm" d="M642 94 L688 140 M688 94 L642 140"/><circle cx="688" cy="140" r="10" fill="var(--gc-accent-hud, #5ef1d2)" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="688" y="144" text-anchor="middle" class="b" style="font-size:11px">1</text><circle cx="688" cy="94" r="10" fill="none" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="688" y="98" text-anchor="middle" class="b" style="font-size:11px">2</text><circle cx="642" cy="140" r="10" fill="none" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="642" y="144" text-anchor="middle" class="b" style="font-size:11px">3</text><circle cx="642" cy="94" r="10" fill="var(--gc-accent-hud, #5ef1d2)" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2"/><text x="642" y="98" text-anchor="middle" class="b" style="font-size:11px">4</text><text x="665" y="72" text-anchor="middle" class="b t">yaw</text><text x="665" y="170" text-anchor="middle" class="m t">diagonals</text><text x="665" y="184" text-anchor="middle" class="m t">(1+4) − (2+3)</text><text x="400" y="236" text-anchor="start" class="m t">mixerQuadX: roll −1 on 1, 2; +1 on 3, 4;</text><text x="400" y="252" text-anchor="start" class="m t">pitch +1 on 1, 3; yaw −1 on 1, 4; +1 on 2, 3</text><text x="400" y="274" text-anchor="start" class="a t">One weak motor gives three imbalances of the same</text><text x="400" y="290" text-anchor="start" class="a t">size; CG gives pitch and roll only;</text><text x="400" y="306" text-anchor="start" class="a t">motor tilt gives yaw only.</text></svg>
