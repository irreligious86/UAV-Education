<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">INAV 9.1.0: which sensor feeds which estimator state</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="150" height="44" rx="6"/><text x="85.0" y="59.0" text-anchor="middle" class="b">Rangefinder</text><text x="85.0" y="73.0" text-anchor="middle" class="b">cm, −1 out of range</text><rect class="boxa" x="10" y="120" width="150" height="44" rx="6"/><text x="85.0" y="139.0" text-anchor="middle" class="b">Optical flow</text><text x="85.0" y="153.0" text-anchor="middle" class="b">counts per Δt, quality</text><rect class="box" x="10" y="200" width="150" height="36" rx="6"/><text x="85.0" y="222.0" text-anchor="middle">Barometer</text><rect class="box" x="10" y="256" width="150" height="44" rx="6"/><text x="85.0" y="275.0" text-anchor="middle">GPS</text><text x="85.0" y="289.0" text-anchor="middle">position, velocity</text><rect class="boxa" x="10" y="336" width="150" height="44" rx="6"/><text x="85.0" y="355.0" text-anchor="middle" class="b">Pitot / VIRTUAL</text><text x="85.0" y="369.0" text-anchor="middle" class="b">ΔP, Pa</text><rect class="boxa" x="270" y="40" width="170" height="44" rx="6"/><text x="355.0" y="59.0" text-anchor="middle" class="b">AGL: height and V_z</text><text x="355.0" y="73.0" text-anchor="middle" class="b">above the surface</text><rect class="box" x="270" y="120" width="170" height="44" rx="6"/><text x="355.0" y="139.0" text-anchor="middle">XY: velocity</text><text x="355.0" y="153.0" text-anchor="middle">and position</text><rect class="box" x="270" y="216" width="170" height="44" rx="6"/><text x="355.0" y="235.0" text-anchor="middle">Z: altitude and V_z</text><text x="355.0" y="249.0" text-anchor="middle">from the takeoff point</text><rect class="boxa" x="270" y="336" width="170" height="44" rx="6"/><text x="355.0" y="355.0" text-anchor="middle" class="b">Airspeed</text><text x="355.0" y="369.0" text-anchor="middle" class="b">IAS, cm/s</text><rect class="box" x="540" y="40" width="170" height="44" rx="6"/><text x="625.0" y="59.0" text-anchor="middle">SURFACE, landing</text><text x="625.0" y="73.0" text-anchor="middle">detector, wing flare</text><rect class="box" x="540" y="120" width="170" height="44" rx="6"/><text x="625.0" y="139.0" text-anchor="middle">POSHOLD without GPS</text><text x="625.0" y="153.0" text-anchor="middle">(dead reckoning)</text><rect class="box" x="540" y="216" width="170" height="44" rx="6"/><text x="625.0" y="235.0" text-anchor="middle">ALTHOLD, RTH,</text><text x="625.0" y="249.0" text-anchor="middle">missions</text><rect class="box" x="540" y="336" width="170" height="44" rx="6"/><text x="625.0" y="355.0" text-anchor="middle">APA, turn</text><text x="625.0" y="369.0" text-anchor="middle">coordination, OSD</text><path class="lna" d="M160 62.0 L270 62.0" marker-end="url(#ara)"/><text x="215.0" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">× cos of tilt</text><path class="lna" d="M160 142.0 L270 142.0" marker-end="url(#ara)"/><text x="215.0" y="135.0" text-anchor="middle" class="m t" style="font-size:10px">(flow − gyro) × h</text><path class="ln" d="M160 218.0 L215.0 218.0 L215.0 238.0 L270 238.0" marker-end="url(#ar)"/><path class="ln" d="M160 278.0 L215.0 278.0 L215.0 238.0 L270 238.0" marker-end="url(#ar)"/><path class="lna" d="M160 358.0 L270 358.0" marker-end="url(#ara)"/><text x="215.0" y="351.0" text-anchor="middle" class="m t" style="font-size:10px">√(2ΔP / 1.225)</text><path class="lna" d="M440 62.0 L540 62.0" marker-end="url(#ara)"/><path class="ln" d="M440 142.0 L540 142.0" marker-end="url(#ar)"/><path class="ln" d="M440 238.0 L540 238.0" marker-end="url(#ar)"/><path class="lna" d="M440 358.0 L540 358.0" marker-end="url(#ara)"/><text x="95" y="106" text-anchor="start" class="a t">h</text><text x="446" y="194" text-anchor="start" class="m t">Z and baro</text><text x="446" y="207" text-anchor="start" class="m t">need AGL</text><text x="10" y="406" text-anchor="start" class="a t">Rangefinder gates: tilt no more than half the sensor cone; 0 ≤ altitude ≤ inav_max_surface_altitude;</text><text x="10" y="421" text-anchor="start" class="a t">reliability ≥ 0.75 for AGL and ≥ 0.33 for flow; without a working barometer AGL is not computed at all.</text><text x="10" y="436" text-anchor="start" class="m t">Flow works only while GPS XY is unreliable; position from flow only with inav_allow_dead_reckoning = ON.</text><text x="10" y="451" text-anchor="start" class="m t">Airspeed does not enter the position estimator: it is used by the PID (apa_pow), turns, position estimation without GPS and the OSD.</text><text x="10" y="466" text-anchor="start" class="w t">AGL height is not mixed into Z: it is a separate estimate read by SURFACE and landing.</text><path class="lna" d="M85 84 L85 120" marker-end="url(#ara)"/><path class="lnm" d="M425 216 L425 84" marker-end="url(#ar)"/><path class="ln" d="M160 290 L240 290 L240 150 L270 150" marker-end="url(#ar)"/></svg>
