<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Cloud Build: от списка опций до проверки на плате (Betaflight 4.5.3)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="8" y="40" width="168" height="62" rx="6"/><text x="92.0" y="61.0" text-anchor="middle" class="b">Configurator 10.10</text><text x="92.0" y="75.0" text-anchor="middle" class="b">плата, версия,</text><text x="92.0" y="89.0" text-anchor="middle" class="b">опции, Core Only</text><rect class="box" x="188" y="40" width="168" height="62" rx="6"/><text x="272.0" y="61.0" text-anchor="middle">POST /api/builds</text><text x="272.0" y="75.0" text-anchor="middle">target, release,</text><text x="272.0" y="89.0" text-anchor="middle">CLOUD_BUILD + USE_*</text><rect class="boxa" x="368" y="40" width="168" height="62" rx="6"/><text x="452.0" y="61.0" text-anchor="middle" class="b">Сервер сборки</text><text x="452.0" y="75.0" text-anchor="middle" class="b">make с этими USE_*</text><text x="452.0" y="89.0" text-anchor="middle" class="b">без лишнего кода</text><rect class="box" x="548" y="40" width="168" height="62" rx="6"/><text x="632.0" y="61.0" text-anchor="middle">hex + BUILD KEY</text><text x="632.0" y="75.0" text-anchor="middle">32 символа,</text><text x="632.0" y="89.0" text-anchor="middle">зашит в прошивку</text><rect class="box" x="548" y="160" width="168" height="62" rx="6"/><text x="632.0" y="181.0" text-anchor="middle">Firmware</text><text x="632.0" y="195.0" text-anchor="middle">без Expert mode —</text><text x="632.0" y="209.0" text-anchor="middle">Full chip erase</text><rect class="boxa" x="368" y="160" width="168" height="62" rx="6"/><text x="452.0" y="181.0" text-anchor="middle" class="b">Плата</text><text x="452.0" y="195.0" text-anchor="middle" class="b">status: BUILD KEY</text><text x="452.0" y="209.0" text-anchor="middle" class="b">MSP: опции сборки</text><rect class="box" x="188" y="160" width="168" height="62" rx="6"/><text x="272.0" y="181.0" text-anchor="middle">Вкладка Setup</text><text x="272.0" y="195.0" text-anchor="middle">Config/Log/Options</text><text x="272.0" y="209.0" text-anchor="middle">вкладки по опциям</text><rect class="box" x="8" y="160" width="168" height="62" rx="6"/><text x="92.0" y="181.0" text-anchor="middle">Проверка в CLI</text><text x="92.0" y="195.0" text-anchor="middle">get → INVALID NAME</text><text x="92.0" y="209.0" text-anchor="middle">help: нет команды</text><rect class="box" x="548" y="268" width="168" height="62" rx="6"/><text x="632.0" y="289.0" text-anchor="middle">Локально: make</text><text x="632.0" y="303.0" text-anchor="middle">CONFIG=… OPTIONS=…</text><text x="632.0" y="317.0" text-anchor="middle">BUILD KEY нет</text><path class="ln" d="M176 71.0 L188 71.0" marker-end="url(#ar)"/><path class="ln" d="M356 71.0 L368 71.0" marker-end="url(#ar)"/><path class="ln" d="M536 71.0 L548 71.0" marker-end="url(#ar)"/><path class="lna" d="M632.0 102 L632.0 160" marker-end="url(#ara)"/><path class="lna" d="M548 191.0 L536 191.0" marker-end="url(#ara)"/><path class="ln" d="M368 191.0 L356 191.0" marker-end="url(#ar)"/><path class="ln" d="M188 191.0 L176 191.0" marker-end="url(#ar)"/><path class="ln" d="M632.0 268 L632.0 222" marker-end="url(#ar)"/><text x="10" y="136" text-anchor="start" class="w t">Чего нет в запросе, того нет в коде: настройка, команда и вкладка исчезают молча.</text><text x="10" y="286" text-anchor="start" class="m t">Локальная сборка: в status нет строки BUILD KEY,</text><text x="10" y="300" text-anchor="start" class="m t">Setup пишет «Local Build - no Cloud information».</text><text x="10" y="322" text-anchor="start" class="m t">Ключ из status → build.betaflight.com/api/builds/&lt;ключ&gt;/json — состав сборки.</text></svg>
