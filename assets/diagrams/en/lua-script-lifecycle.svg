<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Жизнь Lua-скрипта: перепланирование или снятие</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="12" y="46" width="190" height="58" rx="6"/><text x="107.0" y="65.0" text-anchor="middle">Загрузка при старте</text><text x="107.0" y="79.0" text-anchor="middle">scripts/*.lua</text><text x="107.0" y="93.0" text-anchor="middle">SCR_ENABLE = 1</text><rect class="boxa" x="236" y="46" width="200" height="58" rx="6"/><text x="336.0" y="65.0" text-anchor="middle" class="b">вызов update()</text><text x="336.0" y="79.0" text-anchor="middle" class="b">лимит инструкций</text><text x="336.0" y="93.0" text-anchor="middle" class="b">SCR_VM_I_COUNT 10000</text><rect class="box" x="470" y="46" width="238" height="58" rx="6"/><text x="589.0" y="65.0" text-anchor="middle">return update, 100</text><text x="589.0" y="79.0" text-anchor="middle">следующий вызов</text><text x="589.0" y="93.0" text-anchor="middle">через ≥ 100 мс</text><rect class="box" x="236" y="170" width="200" height="50" rx="6"/><text x="336.0" y="192.0" text-anchor="middle">ошибка / превышение /</text><text x="336.0" y="206.0" text-anchor="middle">1 или ≥ 3 значения</text><rect class="box" x="470" y="170" width="238" height="50" rx="6"/><text x="589.0" y="192.0" text-anchor="middle">скрипт снят до</text><text x="589.0" y="206.0" text-anchor="middle">перезапуска скриптинга</text><rect class="boxa" x="470" y="270" width="238" height="50" rx="6"/><text x="589.0" y="292.0" text-anchor="middle" class="b">PreArm: Scripting: …</text><text x="589.0" y="306.0" text-anchor="middle" class="b">арм отклонён (ACK 4)</text><path class="ln" d="M202 75.0 L236 75.0" marker-end="url(#ar)"/><path class="lna" d="M436 75.0 L470 75.0" marker-end="url(#ara)"/><text x="453.0" y="68.0" text-anchor="middle" class="m t" style="font-size:10px">ok</text><path class="ln" d="M336.0 104 L336.0 170" marker-end="url(#ar)"/><path class="ln" d="M436 195.0 L470 195.0" marker-end="url(#ar)"/><path class="ln" d="M589.0 220 L589.0 270" marker-end="url(#ar)"/><text x="470" y="122" text-anchor="start" class="m t">прогон SITL: запрошено 100 мс,</text><text x="470" y="136" text-anchor="start" class="m t">измерено ≈ 113 мс</text><text x="236" y="240" text-anchor="start" class="m t">return без значений — снят молча</text><text x="470" y="36" text-anchor="start" class="m t">планировщик вызовет снова</text><text x="12" y="262" text-anchor="start" class="m t">Остальные скрипты работают дальше.</text><text x="12" y="278" text-anchor="start" class="m t">Повтор ошибки: раз в 10 с, до 10 раз.</text><text x="12" y="294" text-anchor="start" class="m t">Исправить файл → перезагрузка</text><text x="12" y="310" text-anchor="start" class="m t">или MAV_CMD_SCRIPTING (3), RCx 316.</text></svg>
