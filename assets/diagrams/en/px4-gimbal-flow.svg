<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">PX4 1.18: от источника команды до подвеса</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="12" y="40" width="150" height="46" rx="6"/><text x="87.0" y="60.0" text-anchor="middle">Пульт: RC_MAP_AUXn</text><text x="87.0" y="74.0" text-anchor="middle">→ MNT_MAN_*</text><text x="87.0" y="99" text-anchor="middle" class="m t">угол или скорость</text><rect class="box" x="12" y="133" width="150" height="46" rx="6"/><text x="87.0" y="153.0" text-anchor="middle">Наземка, companion:</text><text x="87.0" y="167.0" text-anchor="middle">GIMBAL_MANAGER_*</text><text x="87.0" y="192" text-anchor="middle" class="m t">нужен primary control</text><rect class="box" x="12" y="221" width="150" height="46" rx="6"/><text x="87.0" y="241.0" text-anchor="middle">Mission: ROI,</text><text x="87.0" y="255.0" text-anchor="middle">DO_GIMBAL_MANAGER_*</text><text x="87.0" y="280" text-anchor="middle" class="m t">через navigator</text><rect class="boxa" x="190" y="40" width="160" height="46" rx="6"/><text x="270.0" y="60.0" text-anchor="middle" class="b">Вход: MNT_MODE_IN</text><text x="270.0" y="74.0" text-anchor="middle" class="b">0 оба · 1 пульт · 4 v2 · 5 фикс.</text><rect class="boxa" x="190" y="128" width="160" height="56" rx="6"/><text x="270.0" y="146.0" text-anchor="middle" class="b">Gimbal manager:</text><text x="270.0" y="160.0" text-anchor="middle" class="b">кто управляет,</text><text x="270.0" y="174.0" text-anchor="middle" class="b">ROI → углы</text><rect class="box" x="378" y="128" width="160" height="56" rx="6"/><text x="458.0" y="146.0" text-anchor="middle">Только AUX и v1:</text><text x="458.0" y="160.0" text-anchor="middle">DO_STAB, MIN/MAX_PITCH,</text><text x="458.0" y="174.0" text-anchor="middle">LND_P, TAU</text><rect class="box" x="558" y="40" width="150" height="46" rx="6"/><text x="633.0" y="60.0" text-anchor="middle">MNT_MODE_OUT 0:</text><text x="633.0" y="74.0" text-anchor="middle">функции 420–422</text><text x="633.0" y="99" text-anchor="middle" class="m t">mixer: MIN–CENT–MAX, мкс</text><rect class="box" x="558" y="133" width="150" height="46" rx="6"/><text x="633.0" y="153.0" text-anchor="middle">MNT_MODE_OUT 1:</text><text x="633.0" y="167.0" text-anchor="middle">DO_MOUNT_CONTROL</text><text x="633.0" y="192" text-anchor="middle" class="m t">MNT_MAV_SYSID/COMPID</text><rect class="boxa" x="378" y="216" width="160" height="56" rx="6"/><text x="458.0" y="234.0" text-anchor="middle" class="b">MNT_MODE_OUT 2:</text><text x="458.0" y="248.0" text-anchor="middle" class="b">GIMBAL_DEVICE_</text><text x="458.0" y="262.0" text-anchor="middle" class="b">SET_ATTITUDE</text><text x="458.0" y="285" text-anchor="middle" class="m t">кватернион как есть</text><rect class="box" x="558" y="216" width="150" height="56" rx="6"/><text x="633.0" y="234.0" text-anchor="middle">Подвес v2 device:</text><text x="633.0" y="248.0" text-anchor="middle">свои пределы</text><text x="633.0" y="262.0" text-anchor="middle">и стабилизация</text><path class="ln" d="M162 63.0 L190 63.0" marker-end="url(#ar)"/><path class="ln" d="M162 156.0 L190 156.0" marker-end="url(#ar)"/><path class="ln" d="M162 244.0 L176.0 244.0 L176.0 156.0 L190 156.0" marker-end="url(#ar)"/><path class="ln" d="M270.0 86 L270.0 128" marker-end="url(#ar)"/><path class="ln" d="M350 156.0 L378 156.0" marker-end="url(#ar)"/><path class="ln" d="M538 156.0 L548.0 156.0 L548.0 63.0 L558 63.0" marker-end="url(#ar)"/><path class="ln" d="M538 156.0 L558 156.0" marker-end="url(#ar)"/><path class="lna" d="M350 156.0 L364.0 156.0 L364.0 244.0 L378 244.0" marker-end="url(#ara)"/><path class="lna" d="M538 244.0 L558 244.0" marker-end="url(#ara)"/><text x="12" y="308" text-anchor="start" class="m t">MNT_MODE_IN = −1 (по умолчанию): модуль gimbal не запущен. Смена MODE_IN / MODE_OUT — с перезагрузкой.</text><text x="12" y="323" text-anchor="start" class="m t">Выход v2: MNT_MIN/MAX_PITCH, MNT_TAU, MNT_DO_STAB не действуют; адрес — из GIMBAL_DEVICE_INFORMATION.</text></svg>
