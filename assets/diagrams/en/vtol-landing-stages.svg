<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ArduPlane 4.7.2 VTOL landing stages</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="16" y="44" width="160" height="58" rx="6"/><text x="96.0" y="63.0" text-anchor="middle">APPROACH</text><text x="96.0" y="77.0" text-anchor="middle">L1 + TECS, motors</text><text x="96.0" y="91.0" text-anchor="middle">stopped; 19 m/s</text><rect class="boxa" x="192" y="44" width="160" height="58" rx="6"/><text x="272.0" y="63.0" text-anchor="middle" class="b">AIRBRAKE</text><text x="272.0" y="77.0" text-anchor="middle" class="b">lift motors as</text><text x="272.0" y="91.0" text-anchor="middle" class="b">a brake, ≥ 1 s</text><rect class="box" x="368" y="44" width="160" height="58" rx="6"/><text x="448.0" y="63.0" text-anchor="middle">POSITION1</text><text x="448.0" y="77.0" text-anchor="middle">copter loop,</text><text x="448.0" y="91.0" text-anchor="middle">V = √(2·a·d)</text><rect class="box" x="544" y="44" width="160" height="58" rx="6"/><text x="624.0" y="70.0" text-anchor="middle">POSITION2</text><text x="624.0" y="84.0" text-anchor="middle">precise guidance</text><rect class="box" x="544" y="230" width="160" height="58" rx="6"/><text x="624.0" y="256.0" text-anchor="middle">LAND_DESCEND</text><text x="624.0" y="270.0" text-anchor="middle">1.5 m/s</text><rect class="box" x="368" y="230" width="160" height="58" rx="6"/><text x="448.0" y="256.0" text-anchor="middle">LAND_FINAL</text><text x="448.0" y="270.0" text-anchor="middle">0.5 m/s below 6 m</text><rect class="box" x="192" y="230" width="160" height="58" rx="6"/><text x="272.0" y="256.0" text-anchor="middle">LAND_COMPLETE</text><text x="272.0" y="270.0" text-anchor="middle">disarm</text><path class="ln" d="M176 73.0 L192 73.0" marker-end="url(#ar)"/><path class="ln" d="M352 73.0 L368 73.0" marker-end="url(#ar)"/><path class="ln" d="M528 73.0 L544 73.0" marker-end="url(#ar)"/><path class="ln" d="M624.0 102 L624.0 230" marker-end="url(#ar)"/><path class="ln" d="M544 259.0 L528 259.0" marker-end="url(#ar)"/><path class="ln" d="M368 259.0 L352 259.0" marker-end="url(#ar)"/><text x="16" y="22" text-anchor="start" class="m t">VTOL landing in a mission: QPOS stages and transition conditions (a = Q_TRANS_DECEL = 2 m/s²)</text><text x="18" y="120" text-anchor="start" class="m t">→ AIRBRAKE:</text><text x="18" y="134" text-anchor="start" class="m t">d &lt; V²/2a + 2V</text><text x="18" y="148" text-anchor="start" class="m t">= 130.6 m at 19.2 m/s</text><text x="194" y="120" text-anchor="start" class="m t">→ POSITION1:</text><text x="194" y="134" text-anchor="start" class="m t">V &lt; max(MIN−2, ASSIST)</text><text x="194" y="148" text-anchor="start" class="m t">= max(11, 18) = 18 m/s</text><text x="370" y="120" text-anchor="start" class="m t">→ POSITION2:</text><text x="370" y="134" text-anchor="start" class="m t">d &lt; 10 m and V &lt; 9 m/s</text><text x="16" y="314" text-anchor="start" class="m t">SITL 4.7.2: “VTOL airbrake v=19.2 d=130 sd=130”, position1 at 18.0 m/s,</text><text x="16" y="330" text-anchor="start" class="m t">position2 at d=9.5 m and v=6.5 m/s, “Land final started” at 6.0 m</text><text x="632" y="152" text-anchor="start" class="m t">waypoint</text><text x="632" y="166" text-anchor="start" class="m t">reached</text></svg>
