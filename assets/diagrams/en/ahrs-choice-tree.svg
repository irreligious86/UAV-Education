<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Which estimator and which sources: the selection rule</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Which estimator and which sources: the selection rule</text><rect class="box" x="304.0" y="34" width="112.0" height="50" rx="6"/><text x="360.0" y="57.0" text-anchor="middle" style="font-size:9.5px">What vehicle</text><text x="360.0" y="69.0" text-anchor="middle" style="font-size:9.5px">and how much flash?</text><path class="ln" d="M360.0 84 L360.0 101.0 L185.0 101.0 L185.0 118" marker-end="url(#ar)"/><text x="189.0" y="97.0" text-anchor="start" class="a t" style="font-size:10px">copter</text><rect class="boxa" x="129.0" y="118" width="112.0" height="50" rx="6"/><text x="185.0" y="141.0" text-anchor="middle" class="b" style="font-size:9.5px">Where do position</text><text x="185.0" y="153.0" text-anchor="middle" class="b" style="font-size:9.5px">and heading come from?</text><path class="ln" d="M185.0 168 L185.0 185.0 L68.3 185.0 L68.3 202" marker-end="url(#ar)"/><text x="72.33333333333334" y="181.0" text-anchor="start" class="a t" style="font-size:10px">GPS+compass</text><rect class="boxa" x="13.0" y="202" width="110.7" height="50" rx="18"/><text x="68.33333333333334" y="219.0" text-anchor="middle" class="b" style="font-size:9.5px">EKF3, SRC1:</text><text x="68.33333333333334" y="231.0" text-anchor="middle" class="b" style="font-size:9.5px">3/3/1/3/1</text><text x="68.33333333333334" y="243.0" text-anchor="middle" class="b" style="font-size:9.5px">(defaults)</text><path class="ln" d="M185.0 168 L185.0 185.0 L185.0 185.0 L185.0 202" marker-end="url(#ar)"/><text x="189.0" y="181.0" text-anchor="start" class="a t" style="font-size:10px">bad compass</text><rect class="box" x="129.7" y="202" width="110.7" height="50" rx="18"/><text x="185.0" y="219.0" text-anchor="middle" style="font-size:9.5px">EKF3, YAW = 8</text><text x="185.0" y="231.0" text-anchor="middle" style="font-size:9.5px">(GSF) or 2/3</text><text x="185.0" y="243.0" text-anchor="middle" style="font-size:9.5px">with 2 antennas</text><path class="ln" d="M185.0 168 L185.0 185.0 L301.7 185.0 L301.7 202" marker-end="url(#ar)"/><text x="305.6666666666667" y="181.0" text-anchor="start" class="a t" style="font-size:10px">no GPS</text><rect class="box" x="246.3" y="202" width="110.7" height="50" rx="18"/><text x="301.6666666666667" y="219.0" text-anchor="middle" style="font-size:9.5px">EKF3: flow 5,</text><text x="301.6666666666667" y="231.0" text-anchor="middle" style="font-size:9.5px">beacons 4, VIO 6;</text><text x="301.6666666666667" y="243.0" text-anchor="middle" style="font-size:9.5px">fallback in SRC2</text><path class="ln" d="M360.0 84 L360.0 101.0 L476.7 101.0 L476.7 118" marker-end="url(#ar)"/><text x="480.6666666666667" y="97.0" text-anchor="start" class="a t" style="font-size:10px">plane/VTOL</text><rect class="box" x="420.7" y="118" width="112.0" height="50" rx="6"/><text x="476.6666666666667" y="141.0" text-anchor="middle" style="font-size:9.5px">Is there an airspeed</text><text x="476.6666666666667" y="153.0" text-anchor="middle" style="font-size:9.5px">sensor?</text><path class="ln" d="M476.7 168 L476.7 185.0 L418.3 185.0 L418.3 202" marker-end="url(#ar)"/><text x="422.3333333333333" y="181.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="363.0" y="202" width="110.7" height="50" rx="18"/><text x="418.3333333333333" y="219.0" text-anchor="middle" class="b" style="font-size:9.5px">EKF3 + ARSPD:</text><text x="418.3333333333333" y="231.0" text-anchor="middle" class="b" style="font-size:9.5px">wind, dead reckoning</text><text x="418.3333333333333" y="243.0" text-anchor="middle" class="b" style="font-size:9.5px">12 m in 60 s</text><path class="ln" d="M476.7 168 L476.7 185.0 L535.0 185.0 L535.0 202" marker-end="url(#ar)"/><text x="539.0" y="181.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="479.7" y="202" width="110.7" height="50" rx="18"/><text x="535.0" y="219.0" text-anchor="middle" style="font-size:9.5px">EKF3, no GPS</text><text x="535.0" y="231.0" text-anchor="middle" style="font-size:9.5px">96 m in 60 s;</text><text x="535.0" y="243.0" text-anchor="middle" style="font-size:9.5px">DCM as fallback</text><path class="ln" d="M360.0 84 L360.0 101.0 L651.7 101.0 L651.7 118" marker-end="url(#ar)"/><text x="655.6666666666667" y="97.0" text-anchor="start" class="a t" style="font-size:10px">1 MB board</text><rect class="box" x="596.3" y="118" width="110.7" height="50" rx="18"/><text x="651.6666666666667" y="135.0" text-anchor="middle" style="font-size:9.5px">EKF3: GPS, flow,</text><text x="651.6666666666667" y="147.0" text-anchor="middle" style="font-size:9.5px">GSF; ExtNav and</text><text x="651.6666666666667" y="159.0" text-anchor="middle" style="font-size:9.5px">VIO compiled out</text><text x="16" y="312.0" text-anchor="start" class="m t">SRC1 = POSXY/VELXY/POSZ/VELZ/YAW; in 4.7 EKF2 is SITL/custom only, beacons (4) need flash &gt; 2 MB</text><text x="16" y="328.0" text-anchor="start" class="m t">AHRS_EKF_TYPE = 3 everywhere; 0 (DCM) is legitimate only on Plane/Rover — a copter will not arm with it</text></svg>
