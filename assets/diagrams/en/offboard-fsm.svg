<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Автомат состояний offboard-узла (одинаковый для PX4 Offboard и ArduPilot GUIDED)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="130" height="44" rx="6"/><text x="75.0" y="66.0" text-anchor="middle">WAIT_READY</text><rect class="box" x="195" y="40" width="130" height="44" rx="6"/><text x="260.0" y="59.0" text-anchor="middle">STREAM_SP</text><text x="260.0" y="73.0" text-anchor="middle">≥ 1 с уставок</text><rect class="box" x="380" y="40" width="130" height="44" rx="6"/><text x="445.0" y="66.0" text-anchor="middle">ARMING</text><rect class="box" x="565" y="40" width="130" height="44" rx="6"/><text x="630.0" y="66.0" text-anchor="middle">OFFBOARD</text><rect class="box" x="565" y="140" width="130" height="44" rx="6"/><text x="630.0" y="166.0" text-anchor="middle">TAKEOFF</text><rect class="box" x="380" y="140" width="130" height="44" rx="6"/><text x="445.0" y="166.0" text-anchor="middle">SQUARE</text><rect class="box" x="195" y="140" width="130" height="44" rx="6"/><text x="260.0" y="166.0" text-anchor="middle">LAND</text><rect class="box" x="10" y="140" width="130" height="44" rx="6"/><text x="75.0" y="166.0" text-anchor="middle">DONE</text><rect class="boxa" x="10" y="230" width="685" height="34" rx="6"/><text x="352.5" y="251.0" text-anchor="middle" class="b">ABORT → посадка: нет позиции, устаревший статус, таймаут шага</text><path class="ln" d="M140 62.0 L195 62.0" marker-end="url(#ar)"/><text x="167.5" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">позиция</text><path class="ln" d="M325 62.0 L380 62.0" marker-end="url(#ar)"/><path class="ln" d="M510 62.0 L565 62.0" marker-end="url(#ar)"/><text x="537.5" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">armed</text><path class="ln" d="M630.0 84 L630.0 140" marker-end="url(#ar)"/><text x="636.0" y="108.0" text-anchor="middle" class="m t" style="font-size:10px">режим ok</text><path class="ln" d="M565 162.0 L510 162.0" marker-end="url(#ar)"/><text x="537.5" y="155.0" text-anchor="middle" class="m t" style="font-size:10px">высота</text><path class="ln" d="M380 162.0 L325 162.0" marker-end="url(#ar)"/><text x="352.5" y="155.0" text-anchor="middle" class="m t" style="font-size:10px">квадрат</text><path class="ln" d="M195 162.0 L140 162.0" marker-end="url(#ar)"/><text x="167.5" y="155.0" text-anchor="middle" class="m t" style="font-size:10px">сел</text><text x="10" y="290" text-anchor="start" class="m t">Пилот переключил режим → DONE без команд: управление отдано человеку.</text></svg>
