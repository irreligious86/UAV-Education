<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Moving baseline in ArduPilot 4.6: from two F9Ps to the heading in EKF3</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="30" width="160" height="54" rx="6"/><text x="90.0" y="47.0" text-anchor="middle" class="b">F9P base</text><text x="90.0" y="61.0" text-anchor="middle" class="b">GPS1_TYPE = 17</text><text x="90.0" y="75.0" text-anchor="middle" class="b">RTCM 4072.0 + MSM4</text><rect class="boxa" x="10" y="140" width="160" height="54" rx="6"/><text x="90.0" y="157.0" text-anchor="middle" class="b">F9P rover</text><text x="90.0" y="171.0" text-anchor="middle" class="b">GPS2_TYPE = 18</text><text x="90.0" y="185.0" text-anchor="middle" class="b">UBX-NAV-RELPOSNED</text><rect class="box" x="250" y="30" width="180" height="54" rx="6"/><text x="340.0" y="47.0" text-anchor="middle">AP_GPS_UBLOX</text><text x="340.0" y="61.0" text-anchor="middle">relPosHeading, Length</text><text x="340.0" y="75.0" text-anchor="middle">carrSoln = fixed?</text><rect class="box" x="250" y="140" width="180" height="54" rx="6"/><text x="340.0" y="157.0" text-anchor="middle">Base check</text><text x="340.0" y="171.0" text-anchor="middle">L ≥ 5 cm, D from tilt,</text><text x="340.0" y="185.0" text-anchor="middle">|L − L_POS| ≤ 20 %</text><rect class="box" x="250" y="250" width="180" height="54" rx="6"/><text x="340.0" y="267.0" text-anchor="middle">GPS2_RAW.yaw</text><text x="340.0" y="281.0" text-anchor="middle">0 / 65535 / 1…36000</text><text x="340.0" y="295.0" text-anchor="middle">log GPS.Yaw, GPA.YAcc</text><rect class="boxa" x="520" y="140" width="180" height="54" rx="6"/><text x="610.0" y="157.0" text-anchor="middle" class="b">EKF3</text><text x="610.0" y="171.0" text-anchor="middle" class="b">EK3_SRC1_YAW = 2 / 3</text><text x="610.0" y="185.0" text-anchor="middle" class="b">σ_yaw ≥ 5°, XKF3.IYAW</text><path class="lna" d="M90.0 84 L90.0 140" marker-end="url(#ara)"/><text x="96.0" y="108.0" text-anchor="middle" class="m t" style="font-size:10px">UART2→UART2, 1–5 Hz</text><path class="ln" d="M170 167.0 L210.0 167.0 L210.0 57.0 L250 57.0" marker-end="url(#ar)"/><text x="210.0" y="51.0" text-anchor="middle" class="m t" style="font-size:10px">UART1 → FC</text><path class="ln" d="M340.0 84 L340.0 140" marker-end="url(#ar)"/><path class="ln" d="M430 167.0 L520 167.0" marker-end="url(#ar)"/><text x="475.0" y="160.0" text-anchor="middle" class="m t" style="font-size:10px">yaw, σ_yaw</text><path class="ln" d="M340.0 194 L340.0 250" marker-end="url(#ar)"/><text x="520" y="60" text-anchor="start" class="m t">pos/vel in EKF3 as usual;</text><text x="520" y="74" text-anchor="start" class="m t">RTCM corrections — est-gnss.</text><text x="10" y="330" text-anchor="start" class="m t">Without 4072.0 the rover does not enter MB mode; without 1230, GLONASS stays float.</text><text x="10" y="346" text-anchor="start" class="m t">20 % violated or no RELPOSNED → yaw = 65535, EKF3 runs on the gyro.</text></svg>
