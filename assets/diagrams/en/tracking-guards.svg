<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 184" width="100%" role="img" aria-labelledby="t" style="max-width:780px;display:block;margin:0 auto"><title id="t">Following: mandatory safeguards</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Following: mandatory safeguards</text><rect class="box" x="315.0" y="34" width="150.0" height="40" rx="6"/><text x="390.0" y="58.0" text-anchor="middle" style="font-size:10.5px">Condition</text><path class="ln" d="M390.0 74 L390.0 89.0 L86.0 89.0 L86.0 104" marker-end="url(#ar)"/><text x="90.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">target lost</text><rect class="boxa" x="13.0" y="104" width="146.0" height="40" rx="18"/><text x="86.0" y="122.0" text-anchor="middle" class="b" style="font-size:10.5px">&gt; 1 s → hover,</text><text x="86.0" y="134.0" text-anchor="middle" class="b" style="font-size:10.5px">velocity 0</text><path class="ln" d="M390.0 74 L390.0 89.0 L238.0 89.0 L238.0 104" marker-end="url(#ar)"/><text x="242.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">low conf.</text><rect class="box" x="165.0" y="104" width="146.0" height="40" rx="18"/><text x="238.0" y="122.0" text-anchor="middle" style="font-size:10.5px">Don&#x27;t steer</text><text x="238.0" y="134.0" text-anchor="middle" style="font-size:10.5px">on this detection</text><path class="ln" d="M390.0 74 L390.0 89.0 L390.0 89.0 L390.0 104" marker-end="url(#ar)"/><text x="394.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">too close</text><rect class="box" x="317.0" y="104" width="146.0" height="40" rx="18"/><text x="390.0" y="122.0" text-anchor="middle" style="font-size:10.5px">Min. distance</text><text x="390.0" y="134.0" text-anchor="middle" style="font-size:10.5px">→ stop</text><path class="ln" d="M390.0 74 L390.0 89.0 L542.0 89.0 L542.0 104" marker-end="url(#ar)"/><text x="546.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">boundary</text><rect class="box" x="469.0" y="104" width="146.0" height="40" rx="18"/><text x="542.0" y="122.0" text-anchor="middle" style="font-size:10.5px">Geofence &amp; altitude</text><text x="542.0" y="134.0" text-anchor="middle" style="font-size:10.5px">— autopilot&#x27;s job</text><path class="ln" d="M390.0 74 L390.0 89.0 L694.0 89.0 L694.0 104" marker-end="url(#ar)"/><text x="698.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">operator</text><rect class="boxa" x="621.0" y="104" width="146.0" height="40" rx="18"/><text x="694.0" y="122.0" text-anchor="middle" class="b" style="font-size:10.5px">Mode change</text><text x="694.0" y="134.0" text-anchor="middle" class="b" style="font-size:10.5px">from radio — at once</text></svg>
