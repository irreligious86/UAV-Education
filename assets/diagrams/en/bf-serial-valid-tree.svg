<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Конфигурация портов валидна? (isSerialConfigValid, io/serial.c)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Конфигурация портов валидна? (isSerialConfigValid, io/serial.c)</text><rect class="boxa" x="285.0" y="34" width="150.0" height="48" rx="6"/><text x="360.0" y="50.0" text-anchor="middle" class="b" style="font-size:10.5px">MSP на USB VCP есть и</text><text x="360.0" y="62.0" text-anchor="middle" class="b" style="font-size:10.5px">портов с MSP ≤ 3</text><text x="360.0" y="74.0" text-anchor="middle" class="b" style="font-size:10.5px">(вместе с VCP)?</text><path class="ln" d="M360.0 82 L360.0 95.0 L80.0 95.0 L80.0 108" marker-end="url(#ar)"/><text x="84.0" y="91.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="13.0" y="108" width="134.0" height="48" rx="18"/><text x="80.0" y="124.0" text-anchor="middle" style="font-size:9.5px">Невалидно: при</text><text x="80.0" y="136.0" text-anchor="middle" style="font-size:9.5px">загрузке все порты</text><text x="80.0" y="148.0" text-anchor="middle" style="font-size:9.5px">→ умолчания</text><path class="ln" d="M360.0 82 L360.0 95.0 L430.0 95.0 L430.0 108" marker-end="url(#ar)"/><text x="434.0" y="91.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="355.0" y="108" width="150.0" height="48" rx="6"/><text x="430.0" y="130.0" text-anchor="middle" style="font-size:10.5px">На порту</text><text x="430.0" y="142.0" text-anchor="middle" style="font-size:10.5px">одна функция?</text><path class="ln" d="M430.0 156 L430.0 169.0 L220.0 169.0 L220.0 182" marker-end="url(#ar)"/><text x="224.0" y="165.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="153.0" y="182" width="134.0" height="48" rx="18"/><text x="220.0" y="198.0" text-anchor="middle" class="b" style="font-size:9.5px">OK; но VTX_MSP</text><text x="220.0" y="210.0" text-anchor="middle" class="b" style="font-size:9.5px">один — невалидно:</text><text x="220.0" y="222.0" text-anchor="middle" class="b" style="font-size:9.5px">только в паре с MSP</text><path class="ln" d="M430.0 156 L430.0 169.0 L500.0 169.0 L500.0 182" marker-end="url(#ar)"/><text x="504.0" y="165.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="425.0" y="182" width="150.0" height="48" rx="6"/><text x="500.0" y="198.0" text-anchor="middle" style="font-size:10.5px">MSP + телеметрия,</text><text x="500.0" y="210.0" text-anchor="middle" style="font-size:10.5px">Blackbox или VTX</text><text x="500.0" y="222.0" text-anchor="middle" style="font-size:10.5px">(DisplayPort)?</text><path class="ln" d="M500.0 230 L500.0 243.0 L360.0 243.0 L360.0 256" marker-end="url(#ar)"/><text x="364.0" y="239.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="293.0" y="256" width="134.0" height="48" rx="18"/><text x="360.0" y="278.0" text-anchor="middle" class="b" style="font-size:9.5px">OK: 131073 =</text><text x="360.0" y="290.0" text-anchor="middle" class="b" style="font-size:9.5px">MSP + VTX_MSP</text><path class="ln" d="M500.0 230 L500.0 243.0 L570.0 243.0 L570.0 256" marker-end="url(#ar)"/><text x="574.0" y="239.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="495.0" y="256" width="150.0" height="48" rx="6"/><text x="570.0" y="272.0" text-anchor="middle" style="font-size:10.5px">Serial RX + FrSky Hub,</text><text x="570.0" y="284.0" text-anchor="middle" style="font-size:10.5px">LTM или MAVLink</text><text x="570.0" y="296.0" text-anchor="middle" style="font-size:10.5px">на TX-линии?</text><path class="ln" d="M570.0 304 L570.0 317.0 L500.0 317.0 L500.0 330" marker-end="url(#ar)"/><text x="504.0" y="313.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="433.0" y="330" width="134.0" height="48" rx="18"/><text x="500.0" y="352.0" text-anchor="middle" class="b" style="font-size:9.5px">OK: SBUS на RX,</text><text x="500.0" y="364.0" text-anchor="middle" class="b" style="font-size:9.5px">телеметрия на TX</text><path class="ln" d="M570.0 304 L570.0 317.0 L640.0 317.0 L640.0 330" marker-end="url(#ar)"/><text x="644.0" y="313.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="573.0" y="330" width="134.0" height="48" rx="18"/><text x="640.0" y="352.0" text-anchor="middle" style="font-size:9.5px">Невалидно: сброс</text><text x="640.0" y="364.0" text-anchor="middle" style="font-size:9.5px">всех портов</text><text x="16" y="430.0" text-anchor="start" class="m t">Проверяется каждый порт; одного невалидного хватает, чтобы пропал приёмник (флаг RXLOSS)</text><text x="16" y="446.0" text-anchor="start" class="m t">SoftSerial: MSP и Serial RX на нём снимаются сами, скорость ≤ 19200</text></svg>
