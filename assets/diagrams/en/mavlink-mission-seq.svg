<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Mission upload (mission microservice): vehicle leads, client responds</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Mission upload (mission microservice): vehicle leads, client responds</text><rect class="box" x="20.0" y="26" width="120" height="26" rx="5"/><text x="80.0" y="43" text-anchor="middle" class="b" style="font-size:11px">GCS / client</text><line class="lnm" x1="80.0" y1="52" x2="80.0" y2="350"/><rect class="box" x="410.0" y="26" width="120" height="26" rx="5"/><text x="470.0" y="43" text-anchor="middle" class="b" style="font-size:11px">Autopilot</text><line class="lnm" x1="470.0" y1="52" x2="470.0" y2="350"/><path class="lna" d="M80.0 74 L466.0 74" marker-end="url(#ara)"/><text x="275.0" y="69" text-anchor="middle" class="a t" style="font-size:10px">MISSION_COUNT (count = N, mission_type)</text><path class="ln" d="M470.0 104 L84.0 104" marker-end="url(#ar)"/><text x="275.0" y="99" text-anchor="middle" class="t" style="font-size:10px">MISSION_REQUEST_INT seq = 0</text><path class="ln" d="M80.0 134 L466.0 134" marker-end="url(#ar)"/><text x="275.0" y="129" text-anchor="middle" class="t" style="font-size:10px">MISSION_ITEM_INT seq = 0</text><path class="ln" d="M470.0 164 L84.0 164" marker-end="url(#ar)"/><text x="275.0" y="159" text-anchor="middle" class="t" style="font-size:10px">MISSION_REQUEST_INT seq = 1</text><path class="ln" style="stroke-dasharray:5 4" d="M80.0 194 L466.0 194" marker-end="url(#ar)"/><text x="275.0" y="189" text-anchor="middle" class="t" style="font-size:10px">MISSION_ITEM_INT seq = 1 — lost</text><text x="275.0" y="228" text-anchor="middle" class="w t" style="font-size:10px">— timeout: resend same seq —</text><path class="ln" d="M470.0 254 L84.0 254" marker-end="url(#ar)"/><text x="275.0" y="249" text-anchor="middle" class="t" style="font-size:10px">MISSION_REQUEST_INT seq = 1</text><path class="ln" d="M80.0 284 L466.0 284" marker-end="url(#ar)"/><text x="275.0" y="279" text-anchor="middle" class="t" style="font-size:10px">MISSION_ITEM_INT seq = 1 … N−1</text><path class="lna" d="M470.0 314 L84.0 314" marker-end="url(#ara)"/><text x="275.0" y="309" text-anchor="middle" class="a t" style="font-size:10px">MISSION_ACK (ACCEPTED / error)</text><text x="704" y="78" text-anchor="end" class="m t" style="font-size:10px">client announces count</text><text x="704" y="258" text-anchor="end" class="m t" style="font-size:10px">retry is the requester&#x27;s job</text><text x="704" y="318" text-anchor="end" class="m t" style="font-size:10px">no ACK, no mission</text></svg>
