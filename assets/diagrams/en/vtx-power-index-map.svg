<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">vtx_power: level and milliwatts</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">vtx_power is a level number, not milliwatts: one line, three transmitters</text><rect class="boxa" x="300.0" y="30.0" width="220.0" height="34.0" rx="6"/><text x="410.0" y="51.0" text-anchor="middle" class="b" style="font-size:12px">set vtx_power = 3</text><text x="16" y="112" text-anchor="start" class="m t" style="font-size:10.5px">level</text><text x="44" y="145" text-anchor="middle" class="b" style="font-size:13px">1</text><text x="44" y="179" text-anchor="middle" class="b" style="font-size:13px">2</text><text x="44" y="213" text-anchor="middle" class="b" style="font-size:13px">3</text><text x="44" y="247" text-anchor="middle" class="b" style="font-size:13px">4</text><text x="44" y="281" text-anchor="middle" class="b" style="font-size:13px">5</text><rect x="20" y="193" width="690" height="32" rx="4" fill="var(--gc-accent-hud, #5ef1d2)" opacity="0.10"/><path class="lna" d="M410 64 L410 80 L94 80 L94 196" marker-end="url(#ara)"/><text x="205" y="98" text-anchor="middle" class="b" style="font-size:11px">Betaflight, the module&#x27;s vtxtable</text><text x="205" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">powervalues 14 20 26</text><rect class="box" x="117.0" y="127.0" width="176.0" height="28.0" rx="4"/><text x="183" y="145" text-anchor="middle" class="b" style="font-size:11.5px">25 mW</text><text x="253" y="145" text-anchor="middle" class="m t" style="font-size:10.5px">14 dBm</text><rect class="box" x="117.0" y="161.0" width="176.0" height="28.0" rx="4"/><text x="183" y="179" text-anchor="middle" class="b" style="font-size:11.5px">100 mW</text><text x="253" y="179" text-anchor="middle" class="m t" style="font-size:10.5px">20 dBm</text><rect class="boxa" x="117.0" y="195.0" width="176.0" height="28.0" rx="4"/><text x="183" y="213" text-anchor="middle" class="a b" style="font-size:11.5px">400 mW</text><text x="253" y="213" text-anchor="middle" class="m t" style="font-size:10.5px">26 dBm</text><rect class="box" x="117.0" y="229.0" width="176.0" height="28.0" rx="4" style="stroke-dasharray:4 3;opacity:0.7"/><text x="205" y="247" text-anchor="middle" class="d t" style="font-size:10.5px">no: the FC will not send it</text><text x="430" y="98" text-anchor="middle" class="b" style="font-size:11px">Same diff, a different VTX</text><text x="430" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">powervalues 14 23 27 29</text><rect class="box" x="342.0" y="127.0" width="176.0" height="28.0" rx="4"/><text x="408" y="145" text-anchor="middle" class="b" style="font-size:11.5px">25 mW</text><text x="478" y="145" text-anchor="middle" class="m t" style="font-size:10.5px">14 dBm</text><rect class="box" x="342.0" y="161.0" width="176.0" height="28.0" rx="4"/><text x="408" y="179" text-anchor="middle" class="b" style="font-size:11.5px">200 mW</text><text x="478" y="179" text-anchor="middle" class="m t" style="font-size:10.5px">23 dBm</text><rect class="boxa" x="342.0" y="195.0" width="176.0" height="28.0" rx="4"/><text x="408" y="213" text-anchor="middle" class="a b" style="font-size:11.5px">500 mW</text><text x="478" y="213" text-anchor="middle" class="m t" style="font-size:10.5px">27 dBm</text><rect class="box" x="342.0" y="229.0" width="176.0" height="28.0" rx="4"/><text x="408" y="247" text-anchor="middle" class="b" style="font-size:11.5px">800 mW</text><text x="478" y="247" text-anchor="middle" class="m t" style="font-size:10.5px">29 dBm</text><text x="625" y="98" text-anchor="middle" class="b" style="font-size:11px">INAV, Tramp 600 mW</text><text x="625" y="112" text-anchor="middle" class="m t" style="font-size:10.5px">levels io/vtx_tramp.c</text><rect class="box" x="545.0" y="127.0" width="160.0" height="28.0" rx="4"/><text x="625" y="145" text-anchor="middle" class="b" style="font-size:11.5px">25 mW</text><rect class="box" x="545.0" y="161.0" width="160.0" height="28.0" rx="4"/><text x="625" y="179" text-anchor="middle" class="b" style="font-size:11.5px">100 mW</text><rect class="boxa" x="545.0" y="195.0" width="160.0" height="28.0" rx="4"/><text x="625" y="213" text-anchor="middle" class="a b" style="font-size:11.5px">200 mW</text><rect class="box" x="545.0" y="229.0" width="160.0" height="28.0" rx="4"/><text x="625" y="247" text-anchor="middle" class="b" style="font-size:11.5px">400 mW</text><rect class="box" x="545.0" y="263.0" width="160.0" height="28.0" rx="4"/><text x="625" y="281" text-anchor="middle" class="b" style="font-size:11.5px">600 mW</text><rect class="box" x="16.0" y="306.0" width="688.0" height="40.0" rx="6"/><text x="26" y="323.5" text-anchor="start" style="font-size:10.5px">vtx_low_power_disarm = ON: d