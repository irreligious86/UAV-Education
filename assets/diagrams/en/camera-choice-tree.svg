<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Which camera and interface to take: by where the frame goes</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Which camera and interface to take: by where the frame goes</text><rect class="box" x="277.0" y="34" width="166.0" height="46" rx="6"/><text x="360.0" y="55.0" text-anchor="middle" style="font-size:10.5px">Does the frame go into the control</text><text x="360.0" y="67.0" text-anchor="middle" style="font-size:10.5px">loop?</text><path class="ln" d="M360.0 80 L360.0 94.0 L97.5 94.0 L97.5 108" marker-end="url(#ar)"/><text x="101.5" y="90.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="14.5" y="108" width="166.0" height="46" rx="18"/><text x="97.5" y="123.0" text-anchor="middle" style="font-size:10.5px">IP camera / HDMI</text><text x="97.5" y="135.0" text-anchor="middle" style="font-size:10.5px">capture: 100+ ms —</text><text x="97.5" y="147.0" text-anchor="middle" style="font-size:10.5px">a picture for the operator</text><path class="ln" d="M360.0 80 L360.0 94.0 L447.5 94.0 L447.5 108" marker-end="url(#ar)"/><text x="451.5" y="90.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="364.5" y="108" width="166.0" height="46" rx="6"/><text x="447.5" y="129.0" text-anchor="middle" style="font-size:10.5px">Navigation (VIO) or</text><text x="447.5" y="141.0" text-anchor="middle" style="font-size:10.5px">fast motion?</text><path class="ln" d="M447.5 154 L447.5 168.0 L272.5 168.0 L272.5 182" marker-end="url(#ar)"/><text x="276.5" y="164.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="189.5" y="182" width="166.0" height="46" rx="18"/><text x="272.5" y="197.0" text-anchor="middle" class="b" style="font-size:10.5px">Global shutter</text><text x="272.5" y="209.0" text-anchor="middle" class="b" style="font-size:10.5px">(e.g. USB</text><text x="272.5" y="221.0" text-anchor="middle" class="b" style="font-size:10.5px">on OV9281)</text><path class="ln" d="M447.5 154 L447.5 168.0 L535.0 168.0 L535.0 182" marker-end="url(#ar)"/><text x="539.0" y="164.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="452.0" y="182" width="166.0" height="46" rx="6"/><text x="535.0" y="203.0" text-anchor="middle" style="font-size:10.5px">Camera within</text><text x="535.0" y="215.0" text-anchor="middle" style="font-size:10.5px">~30 cm of the companion?</text><path class="ln" d="M535.0 228 L535.0 242.0 L447.5 242.0 L447.5 256" marker-end="url(#ar)"/><text x="451.5" y="238.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="364.5" y="256" width="166.0" height="46" rx="18"/><text x="447.5" y="271.0" text-anchor="middle" class="b" style="font-size:10.5px">CSI: 1–2 frames,</text><text x="447.5" y="283.0" text-anchor="middle" class="b" style="font-size:10.5px">120 fps at low</text><text x="447.5" y="295.0" text-anchor="middle" class="b" style="font-size:10.5px">resolution</text><path class="ln" d="M535.0 228 L535.0 242.0 L622.5 242.0 L622.5 256" marker-end="url(#ar)"/><text x="626.5" y="238.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="539.5" y="256" width="166.0" height="46" rx="18"/><text x="622.5" y="271.0" text-anchor="middle" style="font-size:10.5px">USB UVC: cable</text><text x="622.5" y="283.0" text-anchor="middle" style="font-size:10.5px">3–5 m, MJPEG</text><text x="622.5" y="295.0" text-anchor="middle" style="font-size:10.5px">60–120 ms, CPU</text><text x="16" y="356.0" text-anchor="start" class="m t">A rolling shutter under vibration gives “jello” and breaks VIO, so navigation needs a global shutter</text></svg>
