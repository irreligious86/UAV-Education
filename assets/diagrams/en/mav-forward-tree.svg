<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Where to forward a packet that came in on port A (MAVLink_routing.cpp; never to port A)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Where to forward a packet that came in on port A (MAVLink_routing.cpp; never to port A)</text><rect class="boxa" x="276.0" y="34" width="168.0" height="64" rx="6"/><text x="360.0" y="64.0" text-anchor="middle" class="b" style="font-size:10.5px">target_system</text><text x="360.0" y="76.0" text-anchor="middle" class="b" style="font-size:10.5px">present in the packet and ≠ 0?</text><path class="ln" d="M360.0 98 L360.0 110.0 L97.5 110.0 L97.5 122" marker-end="url(#ar)"/><text x="101.5" y="106.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="boxa" x="13.5" y="122" width="168.0" height="64" rx="18"/><text x="97.5" y="140.0" text-anchor="middle" class="b" style="font-size:10.5px">Broadcast:</text><text x="97.5" y="152.0" text-anchor="middle" class="b" style="font-size:10.5px">to every port where</text><text x="97.5" y="164.0" text-anchor="middle" class="b" style="font-size:10.5px">anyone has been seen;</text><text x="97.5" y="176.0" text-anchor="middle" class="b" style="font-size:10.5px">+ process it ourselves</text><path class="ln" d="M360.0 98 L360.0 110.0 L447.5 110.0 L447.5 122" marker-end="url(#ar)"/><text x="451.5" y="106.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="363.5" y="122" width="168.0" height="64" rx="6"/><text x="447.5" y="152.0" text-anchor="middle" style="font-size:10.5px">target_system =</text><text x="447.5" y="164.0" text-anchor="middle" style="font-size:10.5px">own sysid?</text><path class="ln" d="M447.5 186 L447.5 198.0 L272.5 198.0 L272.5 210" marker-end="url(#ar)"/><text x="276.5" y="194.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="boxa" x="188.5" y="210" width="168.0" height="64" rx="18"/><text x="272.5" y="234.0" text-anchor="middle" class="b" style="font-size:10.5px">Only to the ports</text><text x="272.5" y="246.0" text-anchor="middle" class="b" style="font-size:10.5px">where this sysid</text><text x="272.5" y="258.0" text-anchor="middle" class="b" style="font-size:10.5px">has been seen</text><path class="ln" d="M447.5 186 L447.5 198.0 L535.0 198.0 L535.0 210" marker-end="url(#ar)"/><text x="539.0" y="194.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="451.0" y="210" width="168.0" height="64" rx="6"/><text x="535.0" y="240.0" text-anchor="middle" style="font-size:10.5px">target_component</text><text x="535.0" y="252.0" text-anchor="middle" style="font-size:10.5px">present and ≠ 0?</text><path class="ln" d="M535.0 274 L535.0 286.0 L447.5 286.0 L447.5 298" marker-end="url(#ar)"/><text x="451.5" y="282.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="boxa" x="363.5" y="298" width="168.0" height="64" rx="18"/><text x="447.5" y="316.0" text-anchor="middle" class="b" style="font-size:10.5px">To the ports where</text><text x="447.5" y="328.0" text-anchor="middle" class="b" style="font-size:10.5px">any component of</text><text x="447.5" y="340.0" text-anchor="middle" class="b" style="font-size:10.5px">its sysid was seen;</text><text x="447.5" y="352.0" text-anchor="middle" class="b" style="font-size:10.5px">+ process it ourselves</text><path class="ln" d="M535.0 274 L535.0 286.0 L622.5 286.0 L622.5 298" marker-end="url(#ar)"/><text x="626.5" y="282.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="538.5" y="298" width="168.0" height="64" rx="18"/><text x="622.5" y="316.0" text-anchor="middle" class="b" style="font-size:10.5px">Only to the ports where</text><text x="622.5" y="328.0" text-anchor="middle" class="b" style="font-size:10.5px">this sysid/compid pair</text><text x="622.5" y="340.0" text-anchor="middle" class="b" style="font-size:10.5px">was seen; a silent</text><text x="622.5" y="352.0" text-anchor="middle" class="b" style="font-size:10.5px">script is unreachable</text><text x="16" y="412.0" text-anchor="start" class="m t">Process ourselves: no target, target_system 0, addressed to the FC — or to our own sysid with a compid</text><text x="16" y="428.0" text-anchor="start" class="m t">that was never seen. “Seen” means in the routing table: filled from the sender&#x27;s first packet,</text><text x="16" y="444.0" text-anchor="start" class="m t">cleared on reboot. HEARTBEAT goes to all active ports.</text><text x="16" y="460.0" text-anchor="start" class="m t">A port with MAVn_OPTIONS bit 1 (before 4.7, SERIALn_OPTIONS bit 10) does not forward.</text></svg>
