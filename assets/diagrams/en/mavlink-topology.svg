<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Топология MAVLink: кто кого видит и куда идут пакеты</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="20" width="130" height="44" rx="6"/><text x="75.0" y="39.0" text-anchor="middle">QGC оператора</text><text x="75.0" y="53.0" text-anchor="middle">sys 255</text><rect class="box" x="10" y="120" width="130" height="44" rx="6"/><text x="75.0" y="139.0" text-anchor="middle">Удалённая GCS</text><text x="75.0" y="153.0" text-anchor="middle">sys 254, VPN</text><rect class="box" x="190" y="20" width="140" height="44" rx="6"/><text x="260.0" y="39.0" text-anchor="middle">SiK-радио</text><text x="260.0" y="53.0" text-anchor="middle">57600, RADIO_STATUS</text><rect class="box" x="190" y="120" width="140" height="44" rx="6"/><text x="260.0" y="139.0" text-anchor="middle">4G-модем</text><text x="260.0" y="153.0" text-anchor="middle">UDP/TCP</text><rect class="boxa" x="380" y="120" width="140" height="44" rx="6"/><text x="450.0" y="139.0" text-anchor="middle" class="b">Companion</text><text x="450.0" y="153.0" text-anchor="middle" class="b">mavlink-router</text><rect class="boxa" x="570" y="20" width="140" height="44" rx="6"/><text x="640.0" y="39.0" text-anchor="middle" class="b">Автопилот</text><text x="640.0" y="53.0" text-anchor="middle" class="b">sys 1, comp 1</text><rect class="box" x="570" y="120" width="140" height="44" rx="6"/><text x="640.0" y="139.0" text-anchor="middle">Камера/гимбал</text><text x="640.0" y="153.0" text-anchor="middle">sys 1, comp 100/154</text><rect class="box" x="570" y="200" width="140" height="44" rx="6"/><text x="640.0" y="219.0" text-anchor="middle">Дальномер</text><text x="640.0" y="233.0" text-anchor="middle">sys 1, comp 158</text><path class="ln" d="M140 42.0 L190 42.0" marker-end="url(#ar)"/><path class="ln" d="M330 42.0 L570 42.0" marker-end="url(#ar)"/><text x="450.0" y="35.0" text-anchor="middle" class="m t" style="font-size:10px">TELEM1</text><path class="ln" d="M140 142.0 L190 142.0" marker-end="url(#ar)"/><path class="ln" d="M330 142.0 L380 142.0" marker-end="url(#ar)"/><path class="lna" d="M520 142.0 L545.0 142.0 L545.0 42.0 L570 42.0" marker-end="url(#ara)"/><text x="545.0" y="36.0" text-anchor="middle" class="m t" style="font-size:10px">TELEM2</text><path class="ln" d="M520 142.0 L570 142.0" marker-end="url(#ar)"/><path class="ln" d="M520 142.0 L545.0 142.0 L545.0 222.0 L570 222.0" marker-end="url(#ar)"/><text x="10" y="270" text-anchor="start" class="m t">Автопилот пересылает пакеты между портами по таблице «где я видел sys/comp»;</text><text x="10" y="286" text-anchor="start" class="m t">широковещательные (target 0) — во все порты, кроме входного.</text></svg>
