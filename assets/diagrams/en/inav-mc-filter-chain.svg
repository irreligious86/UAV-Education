<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">INAV 9.1: фильтры гироскопа в порядке применения (умолчания)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="160" height="48" rx="6"/><text x="90.0" y="61.0" text-anchor="middle">Gyro</text><text x="90.0" y="75.0" text-anchor="middle">задача 4 кГц</text><rect class="box" x="190" y="40" width="160" height="48" rx="6"/><text x="270.0" y="61.0" text-anchor="middle">Anti-alias PT1</text><text x="270.0" y="75.0" text-anchor="middle">250 Гц</text><rect class="box" x="370" y="40" width="160" height="48" rx="6"/><text x="450.0" y="61.0" text-anchor="middle">RPM-notch: выкл.</text><text x="450.0" y="75.0" text-anchor="middle">уже в PID-задаче</text><rect class="boxa" x="550" y="40" width="160" height="48" rx="6"/><text x="630.0" y="61.0" text-anchor="middle" class="b">Main LPF PT1</text><text x="630.0" y="75.0" text-anchor="middle" class="b">60 Гц</text><rect class="boxa" x="550" y="132" width="160" height="48" rx="6"/><text x="630.0" y="153.0" text-anchor="middle" class="b">Dynamic notch</text><text x="630.0" y="167.0" text-anchor="middle" class="b">3 пика, Q 1.2</text><rect class="box" x="370" y="132" width="160" height="48" rx="6"/><text x="450.0" y="153.0" text-anchor="middle">3D-notch: выкл.</text><text x="450.0" y="167.0" text-anchor="middle">1 пик, Q 2.0</text><rect class="boxa" x="190" y="132" width="160" height="48" rx="6"/><text x="270.0" y="153.0" text-anchor="middle" class="b">Kalman по setpoint</text><text x="270.0" y="167.0" text-anchor="middle" class="b">q = 100</text><rect class="box" x="10" y="132" width="160" height="48" rx="6"/><text x="90.0" y="153.0" text-anchor="middle">Smith predictor</text><text x="90.0" y="167.0" text-anchor="middle">выкл. (delay 0)</text><rect class="box" x="10" y="224" width="160" height="48" rx="6"/><text x="90.0" y="245.0" text-anchor="middle">P, I и CD</text><text x="90.0" y="259.0" text-anchor="middle">ошибка и setpoint</text><rect class="boxa" x="190" y="224" width="160" height="48" rx="6"/><text x="270.0" y="245.0" text-anchor="middle" class="b">D-term LPF PT2</text><text x="270.0" y="259.0" text-anchor="middle" class="b">110 Гц → D</text><rect class="box" x="370" y="224" width="160" height="48" rx="6"/><text x="450.0" y="245.0" text-anchor="middle">Сумма ±500</text><text x="450.0" y="259.0" text-anchor="middle">(рыскание ±400)</text><rect class="box" x="550" y="224" width="160" height="48" rx="6"/><text x="630.0" y="245.0" text-anchor="middle">Mixer</text><text x="630.0" y="259.0" text-anchor="middle">mmix → моторы</text><path class="ln" d="M170 64.0 L190 64.0" marker-end="url(#ar)"/><path class="ln" d="M350 64.0 L370 64.0" marker-end="url(#ar)"/><path class="ln" d="M530 64.0 L550 64.0" marker-end="url(#ar)"/><path class="lna" d="M630.0 88 L630.0 132" marker-end="url(#ara)"/><path class="ln" d="M550 156.0 L530 156.0" marker-end="url(#ar)"/><path class="ln" d="M370 156.0 L350 156.0" marker-end="url(#ar)"/><path class="ln" d="M190 156.0 L170 156.0" marker-end="url(#ar)"/><path class="ln" d="M90.0 180 L90.0 224" marker-end="url(#ar)"/><path class="ln" d="M170 248.0 L190 248.0" marker-end="url(#ar)"/><path class="ln" d="M350 248.0 L370 248.0" marker-end="url(#ar)"/><path class="ln" d="M530 248.0 L550 248.0" marker-end="url(#ar)"/><text x="10" y="294" text-anchor="start" class="m t">Только anti-alias работает на частоте гироскопа; остальное — в PID-задаче (looptime 500 мкс).</text><text x="10" y="309" text-anchor="start" class="w t">Выделены звенья, включённые по умолчанию после anti-alias. Между RPM и Main LPF — LULU (выкл.).</text></svg>
