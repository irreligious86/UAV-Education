<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Do you need RTK: the required accuracy decides, not “the more accurate the better”</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Do you need RTK: the required accuracy decides, not “the more accurate the better”</text><rect class="box" x="285.0" y="34" width="150.0" height="62" rx="6"/><text x="360.0" y="63.0" text-anchor="middle" style="font-size:10.5px">What must</text><text x="360.0" y="75.0" text-anchor="middle" style="font-size:10.5px">task?</text><path class="ln" d="M360.0 96 L360.0 110.0 L80.0 110.0 L80.0 124" marker-end="url(#ar)"/><text x="84.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">~2 m</text><rect class="box" x="13.0" y="124" width="134.0" height="62" rx="18"/><text x="80.0" y="147.0" text-anchor="middle" style="font-size:9.5px">Waypoint flight, FPV:</text><text x="80.0" y="159.0" text-anchor="middle" style="font-size:9.5px">GNSS + EKF, 1.5–3 m</text><text x="80.0" y="171.0" text-anchor="middle" style="font-size:9.5px">in the field — no RTK needed</text><path class="ln" d="M360.0 96 L360.0 110.0 L290.0 110.0 L290.0 124" marker-end="url(#ar)"/><text x="294.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">cm, in flight</text><rect class="boxa" x="215.0" y="124" width="150.0" height="62" rx="6"/><text x="290.0" y="147.0" text-anchor="middle" class="b" style="font-size:10.5px">RTK: F9P / UM982</text><text x="290.0" y="159.0" text-anchor="middle" class="b" style="font-size:10.5px">on the base and the aircraft,</text><text x="290.0" y="171.0" text-anchor="middle" class="b" style="font-size:10.5px">RTCM corrections</text><path class="ln" d="M290.0 186 L290.0 200.0 L220.0 200.0 L220.0 214" marker-end="url(#ar)"/><text x="224.0" y="196.0" text-anchor="start" class="a t" style="font-size:10px">your own base</text><rect class="boxa" x="153.0" y="214" width="134.0" height="62" rx="18"/><text x="220.0" y="237.0" text-anchor="middle" class="b" style="font-size:9.5px">≤ 10–20 km: fix</text><text x="220.0" y="249.0" text-anchor="middle" class="b" style="font-size:9.5px">1–3 cm, float</text><text x="220.0" y="261.0" text-anchor="middle" class="b" style="font-size:9.5px">10–50 cm</text><path class="ln" d="M290.0 186 L290.0 200.0 L360.0 200.0 L360.0 214" marker-end="url(#ar)"/><text x="364.0" y="196.0" text-anchor="start" class="a t" style="font-size:10px">NTRIP</text><rect class="box" x="293.0" y="214" width="134.0" height="62" rx="18"/><text x="360.0" y="237.0" text-anchor="middle" style="font-size:9.5px">up to 50–100 km:</text><text x="360.0" y="249.0" text-anchor="middle" style="font-size:9.5px">1 ppm and longer</text><text x="360.0" y="261.0" text-anchor="middle" style="font-size:9.5px">convergence</text><path class="ln" d="M360.0 96 L360.0 110.0 L500.0 110.0 L500.0 124" marker-end="url(#ar)"/><text x="504.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">cm, after</text><rect class="box" x="433.0" y="124" width="134.0" height="62" rx="18"/><text x="500.0" y="147.0" text-anchor="middle" style="font-size:9.5px">Photogrammetry:</text><text x="500.0" y="159.0" text-anchor="middle" style="font-size:9.5px">PPK — post-processing</text><text x="500.0" y="171.0" text-anchor="middle" style="font-size:9.5px">from logs</text><path class="ln" d="M360.0 96 L360.0 110.0 L640.0 110.0 L640.0 124" marker-end="url(#ar)"/><text x="644.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">heading</text><rect class="box" x="573.0" y="124" width="134.0" height="62" rx="18"/><text x="640.0" y="141.0" text-anchor="middle" style="font-size:9.5px">Heading without a compass:</text><text x="640.0" y="153.0" text-anchor="middle" style="font-size:9.5px">moving baseline:</text><text x="640.0" y="165.0" text-anchor="middle" style="font-size:9.5px">GPS1_TYPE = 17,</text><text x="640.0" y="177.0" text-anchor="middle" style="font-size:9.5px">GPS2_TYPE = 18</text><text x="16" y="330.0" text-anchor="start" class="m t">RTK does not cure multipath (1–10+ m jumps near a wall) or losing satellites under a roof</text></svg>
