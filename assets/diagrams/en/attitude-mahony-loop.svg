<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">The Mahony loop in Betaflight 2025.12.5 (flight/imu.c)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="20" y="40" width="130" height="44" rx="6"/><text x="85.0" y="59.0" text-anchor="middle">Gyro ω</text><text x="85.0" y="73.0" text-anchor="middle">rad/s, with bias</text><rect class="boxa" x="200" y="40" width="170" height="44" rx="6"/><text x="285.0" y="59.0" text-anchor="middle" class="b">ω + Kp·e + Ki·∫e</text><text x="285.0" y="73.0" text-anchor="middle" class="b">Kp 0.25 (×10 before arming)</text><rect class="box" x="420" y="40" width="170" height="44" rx="6"/><text x="505.0" y="59.0" text-anchor="middle">q ← q ⊗ exp(ω&#x27;Δt/2)</text><text x="505.0" y="73.0" text-anchor="middle">normalize</text><rect class="box" x="600" y="40" width="110" height="44" rx="6"/><text x="655.0" y="59.0" text-anchor="middle" style="font-size:10.5px">quaternion →</text><text x="655.0" y="73.0" text-anchor="middle" style="font-size:10.5px">angles, controller</text><rect class="box" x="420" y="150" width="170" height="44" rx="6"/><text x="505.0" y="169.0" text-anchor="middle">v = Rᵀ(0,0,1)</text><text x="505.0" y="183.0" text-anchor="middle">expected “down”</text><rect class="boxa" x="200" y="150" width="170" height="44" rx="6"/><text x="285.0" y="176.0" text-anchor="middle" class="b">e = (−a/|a|) × v</text><rect class="box" x="200" y="250" width="170" height="44" rx="6"/><text x="285.0" y="269.0" text-anchor="middle">0.9 g &lt; |a| &lt; 1.1 g?</text><text x="285.0" y="283.0" text-anchor="middle">otherwise e = 0</text><rect class="box" x="20" y="250" width="130" height="44" rx="6"/><text x="85.0" y="269.0" text-anchor="middle">PT2 25 Hz</text><text x="85.0" y="283.0" text-anchor="middle">acc_lpf_hz</text><rect class="box" x="20" y="150" width="130" height="44" rx="6"/><text x="85.0" y="169.0" text-anchor="middle">Accelerometer</text><text x="85.0" y="183.0" text-anchor="middle">f = a − g</text><path class="ln" d="M150 62.0 L200 62.0" marker-end="url(#ar)"/><path class="lna" d="M370 62.0 L420 62.0" marker-end="url(#ara)"/><path class="ln" d="M590 62.0 L600 62.0" marker-end="url(#ar)"/><path class="ln" d="M505.0 84 L505.0 150" marker-end="url(#ar)"/><path class="ln" d="M420 172.0 L370 172.0" marker-end="url(#ar)"/><path class="ln" d="M85.0 194 L85.0 250" marker-end="url(#ar)"/><path class="ln" d="M150 272.0 L200 272.0" marker-end="url(#ar)"/><path class="ln" d="M285.0 250 L285.0 194" marker-end="url(#ar)"/><path class="lna" d="M285.0 150 L285.0 84" marker-end="url(#ara)"/><text x="410" y="262" text-anchor="start" class="m t">Ki = 0 by default: the bias is not estimated,</text><text x="410" y="278" text-anchor="start" class="m t">gyro calibration at power-up</text><text x="410" y="294" text-anchor="start" class="m t">removes it; tilt error e = b/Kp</text><text x="410" y="316" text-anchor="start" class="m t">task: 100 Hz in Acro, f_acc/2 in Angle</text></svg>
