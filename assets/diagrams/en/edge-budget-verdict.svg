<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Budget verdict: does the model fit the task or not</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Budget verdict: does the model fit the task or not</text><rect class="box" x="277.0" y="34" width="166.0" height="48" rx="6"/><text x="360.0" y="50.0" text-anchor="middle" style="font-size:10.5px">p99 of the whole pipeline</text><text x="360.0" y="62.0" text-anchor="middle" style="font-size:10.5px">(after warm-up, with video,</text><text x="360.0" y="74.0" text-anchor="middle" style="font-size:10.5px">MAVLink) ≤ budget?</text><path class="ln" d="M360.0 82 L360.0 96.0 L97.5 96.0 L97.5 110" marker-end="url(#ar)"/><text x="101.5" y="92.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="14.5" y="110" width="166.0" height="48" rx="18"/><text x="97.5" y="126.0" text-anchor="middle" style="font-size:10.5px">FP16 on the GPU first;</text><text x="97.5" y="138.0" text-anchor="middle" style="font-size:10.5px">INT8 on an NPU/TPU;</text><text x="97.5" y="150.0" text-anchor="middle" style="font-size:10.5px">no layer fell back to CPU?</text><path class="ln" d="M360.0 82 L360.0 96.0 L447.5 96.0 L447.5 110" marker-end="url(#ar)"/><text x="451.5" y="92.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="364.5" y="110" width="166.0" height="48" rx="6"/><text x="447.5" y="126.0" text-anchor="middle" style="font-size:10.5px">20–30 min in the enclosure:</text><text x="447.5" y="138.0" text-anchor="middle" style="font-size:10.5px">is p99 twice as bad as</text><text x="447.5" y="150.0" text-anchor="middle" style="font-size:10.5px">in the first minute?</text><path class="ln" d="M447.5 158 L447.5 172.0 L272.5 172.0 L272.5 186" marker-end="url(#ar)"/><text x="276.5" y="168.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="189.5" y="186" width="166.0" height="48" rx="18"/><text x="272.5" y="202.0" text-anchor="middle" style="font-size:10.5px">Throttling: airflow,</text><text x="272.5" y="214.0" text-anchor="middle" style="font-size:10.5px">heatsink, power</text><text x="272.5" y="226.0" text-anchor="middle" style="font-size:10.5px">mode</text><path class="ln" d="M447.5 158 L447.5 172.0 L535.0 172.0 L535.0 186" marker-end="url(#ar)"/><text x="539.0" y="168.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="452.0" y="186" width="166.0" height="48" rx="6"/><text x="535.0" y="202.0" text-anchor="middle" style="font-size:10.5px">By slices (distance,</text><text x="535.0" y="214.0" text-anchor="middle" style="font-size:10.5px">light, background) no worse</text><text x="535.0" y="226.0" text-anchor="middle" style="font-size:10.5px">after quantization?</text><path class="ln" d="M535.0 234 L535.0 248.0 L447.5 248.0 L447.5 262" marker-end="url(#ar)"/><text x="451.5" y="244.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="364.5" y="262" width="166.0" height="48" rx="18"/><text x="447.5" y="278.0" text-anchor="middle" style="font-size:10.5px">PTQ calibration</text><text x="447.5" y="290.0" text-anchor="middle" style="font-size:10.5px">over all conditions,</text><text x="447.5" y="302.0" text-anchor="middle" style="font-size:10.5px">QAT or FP16</text><path class="ln" d="M535.0 234 L535.0 248.0 L622.5 248.0 L622.5 262" marker-end="url(#ar)"/><text x="626.5" y="244.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="boxa" x="539.5" y="262" width="166.0" height="48" rx="18"/><text x="622.5" y="278.0" text-anchor="middle" class="b" style="font-size:10.5px">Budget met:</text><text x="622.5" y="290.0" text-anchor="middle" class="b" style="font-size:10.5px">roll out with a version</text><text x="622.5" y="302.0" text-anchor="middle" class="b" style="font-size:10.5px">and a rollback</text><text x="16" y="364.0" text-anchor="start" class="m t">The budget comes from the task: an example spec “p99 camera → bbox ≤ 80 ms at 35 °C, no throttling for 30 minutes”</text></svg>
