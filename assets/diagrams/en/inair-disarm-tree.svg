<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Tree 6: shutdown in the air — the log first, then the branch</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Tree 6: shutdown in the air — the log first, then the branch</text><rect class="boxa" x="265.0" y="34" width="190.0" height="50" rx="6"/><text x="360.0" y="57.0" text-anchor="middle" class="b" style="font-size:10.5px">Log copied before power-up.</text><text x="360.0" y="69.0" text-anchor="middle" class="b" style="font-size:10.5px">Is there a disarm event?</text><path class="ln" d="M360.0 84 L360.0 99.0 L68.3 99.0 L68.3 114" marker-end="url(#ar)"/><text x="72.33333333333334" y="95.0" text-anchor="start" class="a t" style="font-size:10px">no</text><rect class="box" x="13.0" y="114" width="110.7" height="50" rx="18"/><text x="68.33333333333334" y="131.0" text-anchor="middle" style="font-size:9.5px">No disarm:</text><text x="68.33333333333334" y="143.0" text-anchor="middle" style="font-size:9.5px">power, brownout,</text><text x="68.33333333333334" y="155.0" text-anchor="middle" style="font-size:9.5px">VBAT, POWR.VCC</text><path class="ln" d="M360.0 84 L360.0 99.0 L418.3 99.0 L418.3 114" marker-end="url(#ar)"/><text x="422.33333333333337" y="95.0" text-anchor="start" class="a t" style="font-size:10px">yes</text><rect class="box" x="323.3" y="114" width="190.0" height="50" rx="6"/><text x="418.33333333333337" y="137.0" text-anchor="middle" style="font-size:10.5px">The disarm reason</text><text x="418.33333333333337" y="149.0" text-anchor="middle" style="font-size:10.5px">is recorded in the log</text><path class="ln" d="M418.3 164 L418.3 179.0 L185.0 179.0 L185.0 194" marker-end="url(#ar)"/><rect class="box" x="129.7" y="194" width="110.7" height="50" rx="18"/><text x="185.0" y="211.0" text-anchor="middle" style="font-size:9.5px">Failsafe:</text><text x="185.0" y="223.0" text-anchor="middle" style="font-size:9.5px">link — tree 5,</text><text x="185.0" y="235.0" text-anchor="middle" style="font-size:9.5px">what is configured</text><path class="ln" d="M418.3 164 L418.3 179.0 L301.7 179.0 L301.7 194" marker-end="url(#ar)"/><rect class="box" x="246.3" y="194" width="110.7" height="50" rx="18"/><text x="301.6666666666667" y="211.0" text-anchor="middle" style="font-size:9.5px">Switch, sticks:</text><text x="301.6666666666667" y="223.0" text-anchor="middle" style="font-size:9.5px">switch</text><text x="301.6666666666667" y="235.0" text-anchor="middle" style="font-size:9.5px">with a lock</text><path class="ln" d="M418.3 164 L418.3 179.0 L418.3 179.0 L418.3 194" marker-end="url(#ar)"/><rect class="box" x="363.0" y="194" width="110.7" height="50" rx="18"/><text x="418.3333333333333" y="211.0" text-anchor="middle" style="font-size:9.5px">Runaway, crash:</text><text x="418.3333333333333" y="223.0" text-anchor="middle" style="font-size:9.5px">the reason above —</text><text x="418.3333333333333" y="235.0" text-anchor="middle" style="font-size:9.5px">motor/ESC/desync</text><path class="ln" d="M418.3 164 L418.3 179.0 L535.0 179.0 L535.0 194" marker-end="url(#ar)"/><rect class="box" x="479.7" y="194" width="110.7" height="50" rx="18"/><text x="535.0" y="211.0" text-anchor="middle" style="font-size:9.5px">EKF, GPS:</text><text x="535.0" y="223.0" text-anchor="middle" style="font-size:9.5px">XKF4, VIBE,</text><text x="535.0" y="235.0" text-anchor="middle" style="font-size:9.5px">satellites, compass</text><path class="ln" d="M418.3 164 L418.3 179.0 L651.7 179.0 L651.7 194" marker-end="url(#ar)"/><rect class="box" x="596.3" y="194" width="110.7" height="50" rx="18"/><text x="651.6666666666667" y="211.0" text-anchor="middle" style="font-size:9.5px">Auto-disarm:</text><text x="651.6666666666667" y="223.0" text-anchor="middle" style="font-size:9.5px">throttle 0, touchdown,</text><text x="651.6666666666667" y="235.0" text-anchor="middle" style="font-size:9.5px">delay after arming</text></svg>
