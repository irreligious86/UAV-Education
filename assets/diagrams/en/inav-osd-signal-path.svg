<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">INAV OSD: аналог (рисует MAX7456) и HD (рисуют очки)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="130" height="44" rx="6"/><text x="75.0" y="59.0" text-anchor="middle">Аналог. камера</text><text x="75.0" y="73.0" text-anchor="middle">CVBS</text><rect class="box" x="190" y="40" width="140" height="44" rx="6"/><text x="260.0" y="59.0" text-anchor="middle">MAX7456 на FC</text><text x="260.0" y="73.0" text-anchor="middle">30×16 / 30×13</text><rect class="box" x="380" y="40" width="130" height="44" rx="6"/><text x="445.0" y="59.0" text-anchor="middle">Аналог. VTX</text><text x="445.0" y="73.0" text-anchor="middle">5.8 ГГц</text><rect class="box" x="570" y="40" width="140" height="44" rx="6"/><text x="640.0" y="59.0" text-anchor="middle">Очки</text><text x="640.0" y="73.0" text-anchor="middle">показывают кадр</text><rect class="boxa" x="190" y="150" width="140" height="44" rx="6"/><text x="260.0" y="169.0" text-anchor="middle" class="b">FC: osd.c</text><text x="260.0" y="183.0" text-anchor="middle" class="b">сетка символов</text><rect class="boxa" x="380" y="150" width="130" height="44" rx="6"/><text x="445.0" y="169.0" text-anchor="middle" class="b">Возд. модуль HD</text><text x="445.0" y="183.0" text-anchor="middle" class="b">DJI/Avatar/HDZero</text><rect class="boxa" x="570" y="150" width="140" height="44" rx="6"/><text x="640.0" y="169.0" text-anchor="middle" class="b">Очки: шрифт,</text><text x="640.0" y="183.0" text-anchor="middle" class="b">рисуют OSD</text><rect class="box" x="380" y="240" width="130" height="40" rx="6"/><text x="445.0" y="257.0" text-anchor="middle">Цифр. камера</text><text x="445.0" y="271.0" text-anchor="middle">MIPI</text><path class="ln" d="M140 62.0 L190 62.0" marker-end="url(#ar)"/><text x="165.0" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">video</text><path class="ln" d="M330 62.0 L380 62.0" marker-end="url(#ar)"/><text x="355.0" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">+OSD</text><path class="ln" d="M510 62.0 L570 62.0" marker-end="url(#ar)"/><text x="540.0" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">радио</text><path class="ln" d="M260.0 150 L260.0 84" marker-end="url(#ar)"/><text x="266.0" y="113.0" text-anchor="middle" class="m t" style="font-size:10px">SPI</text><path class="lna" d="M330 172.0 L380 172.0" marker-end="url(#ara)"/><text x="355.0" y="165.0" text-anchor="middle" class="m t" style="font-size:10px">UART</text><path class="lna" d="M510 172.0 L570 172.0" marker-end="url(#ara)"/><text x="540.0" y="165.0" text-anchor="middle" class="m t" style="font-size:10px">радио</text><path class="ln" d="M445.0 240 L445.0 194" marker-end="url(#ar)"/><text x="10" y="306" text-anchor="start" class="a t">HD: UART 115200, функция MSP_OSD (33554432); сетку задаёт osd_video_system. Модуль шлёт MSP</text><text x="10" y="321" text-anchor="start" class="m t">раз в ~125 мс; молчит 1 с — полётник перестаёт слать OSD. Выбор в fc_init.c: FrSky OSD → MSP → MAX7456.</text><text x="10" y="336" text-anchor="start" class="w t">Если назначен порт MSP_OSD, чип MAX7456 не используется: аналоговое OSD пропадёт.</text></svg>
