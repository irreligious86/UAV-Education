<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ELRS SPI receiver and the protocol version</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">ELRS SPI receiver and the protocol version</text><rect class="boxa" x="265.0" y="34" width="190.0" height="78" rx="6"/><text x="360.0" y="59.0" text-anchor="middle" class="b" style="font-size:10.5px">Betaflight 2025.12:</text><text x="360.0" y="71.0" text-anchor="middle" class="b" style="font-size:10.5px">SPI ELRS = OTA 3;</text><text x="360.0" y="83.0" text-anchor="middle" class="b" style="font-size:10.5px">radio on ELRS 4.x = OTA 4</text><text x="360.0" y="95.0" text-anchor="middle" class="b" style="font-size:10.5px">→ no link</text><path class="ln" d="M360.0 112 L360.0 121.0 L126.7 121.0 L126.7 130" marker-end="url(#ar)"/><text x="130.66666666666669" y="117.0" text-anchor="start" class="a t" style="font-size:10px">radio</text><rect class="box" x="31.7" y="130" width="190.0" height="78" rx="18"/><text x="126.66666666666667" y="161.0" text-anchor="middle" style="font-size:10.5px">stay on 3.x</text><text x="126.66666666666667" y="173.0" text-anchor="middle" style="font-size:10.5px">or a second module</text><text x="126.66666666666667" y="185.0" text-anchor="middle" style="font-size:10.5px">on 3.x for whoops</text><path class="ln" d="M360.0 112 L360.0 121.0 L360.0 121.0 L360.0 130" marker-end="url(#ar)"/><text x="364.0" y="117.0" text-anchor="start" class="a t" style="font-size:10px">receiver</text><rect class="box" x="265.0" y="130" width="190.0" height="78" rx="18"/><text x="360.0" y="155.0" text-anchor="middle" style="font-size:10.5px">an external ELRS</text><text x="360.0" y="167.0" text-anchor="middle" style="font-size:10.5px">over UART (CRSF),</text><text x="360.0" y="179.0" text-anchor="middle" style="font-size:10.5px">flash 4.x;</text><text x="360.0" y="191.0" text-anchor="middle" style="font-size:10.5px">needs a free UART</text><path class="ln" d="M360.0 112 L360.0 121.0 L593.3 121.0 L593.3 130" marker-end="url(#ar)"/><text x="597.3333333333334" y="117.0" text-anchor="start" class="a t" style="font-size:10px">firmware</text><rect class="box" x="498.3" y="130" width="190.0" height="78" rx="18"/><text x="593.3333333333334" y="155.0" text-anchor="middle" style="font-size:10.5px">Betaflight 2026.6</text><text x="593.3333333333334" y="167.0" text-anchor="middle" style="font-size:10.5px">+ the ELRSV4 option;</text><text x="593.3333333333334" y="179.0" text-anchor="middle" style="font-size:10.5px">more with 3.x</text><text x="593.3333333333334" y="191.0" text-anchor="middle" style="font-size:10.5px">does not work</text></svg>
