<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Onboard ML loop</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="30" width="130" height="44" rx="6"/><text x="75.0" y="49.0" text-anchor="middle">Dataset</text><text x="75.0" y="63.0" text-anchor="middle">from your flights</text><rect class="box" x="160" y="30" width="100" height="44" rx="6"/><text x="210.0" y="56.0" text-anchor="middle" style="font-size:10.5px">Labeling</text><rect class="box" x="280" y="30" width="100" height="44" rx="6"/><text x="330.0" y="56.0" text-anchor="middle" style="font-size:10.5px">Training</text><rect class="boxa" x="400" y="30" width="140" height="44" rx="6"/><text x="470.0" y="49.0" text-anchor="middle" class="b">Quantization +</text><text x="470.0" y="63.0" text-anchor="middle" class="b">per-slice QA</text><rect class="boxa" x="560" y="30" width="150" height="44" rx="6"/><text x="635.0" y="49.0" text-anchor="middle" class="b">Rollout: version</text><text x="635.0" y="63.0" text-anchor="middle" class="b">+ revert</text><rect class="box" x="10" y="130" width="130" height="44" rx="6"/><text x="75.0" y="149.0" text-anchor="middle">Hard examples,</text><text x="75.0" y="163.0" text-anchor="middle">field failures</text><rect class="boxa" x="480" y="130" width="230" height="44" rx="6"/><text x="595.0" y="149.0" text-anchor="middle" class="b">Drift monitoring:</text><text x="595.0" y="163.0" text-anchor="middle" class="b">confidence, detections/min</text><path class="ln" d="M140 52.0 L160 52.0" marker-end="url(#ar)"/><path class="ln" d="M260 52.0 L280 52.0" marker-end="url(#ar)"/><path class="ln" d="M380 52.0 L400 52.0" marker-end="url(#ar)"/><path class="ln" d="M540 52.0 L560 52.0" marker-end="url(#ar)"/><path class="ln" d="M635.0 74 L635.0 102.0 L595.0 102.0 L595.0 130" marker-end="url(#ar)"/><path class="lna" d="M480 152.0 L140 152.0" marker-end="url(#ara)"/><path class="ln" d="M75.0 130 L75.0 74" marker-end="url(#ar)"/></svg>
