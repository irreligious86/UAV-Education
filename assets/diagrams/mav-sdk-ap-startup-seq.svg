<text x="177.5" y="369" text-anchor="middle" class="t" style="font-size:10px">arm(); takeoff()</text><path class="ln" d="M275.0 404 L466.0 404" marker-end="url(#ar)"/><text x="372.5" y="399" text-anchor="middle" class="t" style="font-size:10px">ARM, GUIDED, TAKEOFF</text><text x="704" y="108" text-anchor="end" class="m t" style="font-size:10px">0.9 с</text><text x="704" y="198" text-anchor="end" class="m t" style="font-size:10px">потоки MAVn_* = 0</text><text x="704" y="258" text-anchor="end" class="m t" style="font-size:10px">42.0 с</text><text x="704" y="318" text-anchor="end" class="m t" style="font-size:10px">WAYPOINT + CHANGE_SPEED</text><text x="704" y="408" text-anchor="end" class="m t" style="font-size:10px">GUIDED = OFFBOARD</text></svg>
