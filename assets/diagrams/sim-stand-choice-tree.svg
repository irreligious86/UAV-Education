<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Какой стенд для какой проверки</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Какой стенд для какой проверки</text><rect class="box" x="277.0" y="34" width="166.0" height="48" rx="6"/><text x="360.0" y="62.0" text-anchor="middle" style="font-size:10.5px">Что проверяешь?</text><path class="ln" d="M360.0 82 L360.0 98.0 L97.5 98.0 L97.5 114" marker-end="url(#ar)"/><text x="101.5" y="94.0" text-anchor="start" class="a t" style="font-size:10px">логику без мира</text><rect class="box" x="14.5" y="114" width="166.0" height="48" rx="18"/><text x="97.5" y="130.0" text-anchor="middle" style="font-size:10.5px">SITL без Gazebo:</text><text x="97.5" y="142.0" text-anchor="middle" style="font-size:10.5px">встроенная модель,</text><text x="97.5" y="154.0" text-anchor="middle" style="font-size:10.5px">мира нет</text><path class="ln" d="M360.0 82 L360.0 98.0 L272.5 98.0 L272.5 114" marker-end="url(#ar)"/><text x="276.5" y="94.0" text-anchor="start" class="a t" style="font-size:10px">мир без камер</text><rect class="boxa" x="189.5" y="114" width="166.0" height="48" rx="18"/><text x="272.5" y="130.0" text-anchor="middle" class="b" style="font-size:10.5px">Gazebo без графики:</text><text x="272.5" y="142.0" text-anchor="middle" class="b" style="font-size:10.5px">gz sim -s -r мир.sdf,</text><text x="272.5" y="154.0" text-anchor="middle" class="b" style="font-size:10.5px">pytest → pass/fail</text><path class="ln" d="M360.0 82 L360.0 98.0 L447.5 98.0 L447.5 114" marker-end="url(#ar)"/><text x="451.5" y="94.0" text-anchor="start" class="a t" style="font-size:10px">зрение, посадку</text><rect class="boxa" x="364.5" y="114" width="166.0" height="48" rx="18"/><text x="447.5" y="130.0" text-anchor="middle" class="b" style="font-size:10.5px">Gazebo с камерой;</text><text x="447.5" y="142.0" text-anchor="middle" class="b" style="font-size:10.5px">без экрана —</text><text x="447.5" y="154.0" text-anchor="middle" class="b" style="font-size:10.5px">--headless-rendering</text><path class="ln" d="M360.0 82 L360.0 98.0 L622.5 98.0 L622.5 114" marker-end="url(#ar)"/><text x="626.5" y="94.0" text-anchor="start" class="a t" style="font-size:10px">сам полётник</text><rect class="box" x="539.5" y="114" width="166.0" height="48" rx="18"/><text x="622.5" y="130.0" text-anchor="middle" style="font-size:10.5px">HITL: настоящий FC,</text><text x="622.5" y="142.0" text-anchor="middle" style="font-size:10.5px">датчики от симулятора,</text><text x="622.5" y="154.0" text-anchor="middle" style="font-size:10.5px">моторы не крутятся</text><text x="16" y="220.0" text-anchor="start" class="m t">Камера без шума и размытия обманывает: проверять с шумом (параметры датчика в SDF),</text><text x="16" y="236.0" text-anchor="start" class="m t">сменой освещения и размытием движения. С камерами RTF падает ниже 1: lockstep</text><text x="16" y="252.0" text-anchor="start" class="m t">сохраняет корректность, тест идёт дольше</text></svg>
