<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">px4/fmu-v6x, PX4 1.17: порты и кто на них сидит</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="54" width="108" height="58" rx="6"/><text x="64.0" y="73.0" text-anchor="middle" class="b" style="font-size:10.5px">TELEM1 = 101</text><text x="64.0" y="87.0" text-anchor="middle" class="b" style="font-size:10.5px">ttyS6 · 57600</text><text x="64.0" y="101.0" text-anchor="middle" class="b" style="font-size:10.5px">MAV_0_CONFIG</text><text x="64.0" y="125" text-anchor="middle" class="m t">SiK, Normal</text><rect class="box" x="128" y="54" width="108" height="58" rx="6"/><text x="182.0" y="73.0" text-anchor="middle" style="font-size:10.5px">TELEM2 = 102</text><text x="182.0" y="87.0" text-anchor="middle" style="font-size:10.5px">ttyS4 · 921600</text><text x="182.0" y="101.0" text-anchor="middle" style="font-size:10.5px">MAV_1_CONFIG</text><text x="182.0" y="125" text-anchor="middle" class="m t">companion, Onboard</text><rect class="box" x="246" y="54" width="108" height="58" rx="6"/><text x="300.0" y="73.0" text-anchor="middle" style="font-size:10.5px">TELEM3 = 103</text><text x="300.0" y="87.0" text-anchor="middle" style="font-size:10.5px">ttyS1 · 57600</text><text x="300.0" y="101.0" text-anchor="middle" style="font-size:10.5px">SENS_TFMINI_CFG</text><text x="300.0" y="125" text-anchor="middle" class="m t">TFmini, 115200</text><rect class="boxa" x="364" y="54" width="108" height="58" rx="6"/><text x="418.0" y="73.0" text-anchor="middle" class="b" style="font-size:10.5px">GPS1 = 201</text><text x="418.0" y="87.0" text-anchor="middle" class="b" style="font-size:10.5px">ttyS0 · 0 (авто)</text><text x="418.0" y="101.0" text-anchor="middle" class="b" style="font-size:10.5px">GPS_1_CONFIG</text><text x="418.0" y="125" text-anchor="middle" class="m t">GPS 1</text><rect class="box" x="482" y="54" width="108" height="58" rx="6"/><text x="536.0" y="73.0" text-anchor="middle" style="font-size:10.5px">GPS2 = 202</text><text x="536.0" y="87.0" text-anchor="middle" style="font-size:10.5px">ttyS7 · 0 (авто)</text><text x="536.0" y="101.0" text-anchor="middle" style="font-size:10.5px">GPS_2_CONFIG</text><text x="536.0" y="125" text-anchor="middle" class="m t">GPS 2</text><rect class="box" x="600" y="54" width="108" height="58" rx="6"/><text x="654.0" y="73.0" text-anchor="middle" style="font-size:10.5px">EXT2 = 401</text><text x="654.0" y="87.0" text-anchor="middle" style="font-size:10.5px">ttyS3 · 57600</text><text x="654.0" y="101.0" text-anchor="middle" style="font-size:10.5px">MSP_OSD_CONFIG</text><text x="654.0" y="125" text-anchor="middle" class="m t">msp_osd, 115200</text><rect class="box" x="10" y="182" width="166" height="46" rx="6"/><text x="93.0" y="202.0" text-anchor="middle">I²C (внешняя шина)</text><text x="93.0" y="216.0" text-anchor="middle">SENS_EN_MS4525DO = 1</text><text x="93.0" y="241" text-anchor="middle" class="m t">airspeed, компас</text><rect class="box" x="188" y="182" width="166" height="46" rx="6"/><text x="271.0" y="202.0" text-anchor="middle">CAN1 / CAN2</text><text x="271.0" y="216.0" text-anchor="middle">UAVCAN_ENABLE = 3</text><text x="271.0" y="241" text-anchor="middle" class="m t">ESC: UAVCAN_EC_FUNC1…4</text><rect class="box" x="366" y="182" width="166" height="46" rx="6"/><text x="449.0" y="202.0" text-anchor="middle">Ethernet = 1000</text><text x="449.0" y="216.0" text-anchor="middle">MAV_2_CONFIG</text><text x="449.0" y="241" text-anchor="middle" class="m t">UDP 14550, 100000 B/s</text><rect class="box" x="544" y="182" width="166" height="46" rx="6"/><text x="627.0" y="202.0" text-anchor="middle">RC = 300 · ttyS5</text><text x="627.0" y="216.0" text-anchor="middle">линия PX4IO/RC</text><text x="627.0" y="241" text-anchor="middle" class="m t">занята IO; в списке с 1.17</text><text x="10" y="44" text-anchor="start" class="m t">UART: число — значение параметра *_CONFIG / *_CFG; вторая строка — устройство и умолчание SER_*_BAUD</text><text x="10" y="172" text-anchor="start" class="m t">Остальное: I²C и CAN включаются своим параметром; Ethernet — значение 1000 для MAVLink и uXRCE-DDS</text><text x="10" y="268" text-anchor="start" class="m t">Выделены порты, занятые по умолчанию (MAV_0_CONFIG = 101, GPS_1_CONFIG = 201). Под блоками — план из шага 1.</text><text x="10" y="283" text-anchor="start" class="m t">Один порт — один драйвер: второй получит «Conflicting config for /dev/ttyS…» и не запустится.</text></svg>
