<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Разбор «качает по roll»: топик → модуль → параметр</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Разбор «качает по roll»: на каждом шаге — один вопрос к топику, ответ ведёт к модулю и параметру</text><path class="ln" d="M360.0 74 L360.0 116" marker-end="url(#ar)"/><text x="366" y="109.5" text-anchor="start" class="a t b" style="font-size:10.5px">так</text><path class="ln" d="M360.0 74 L360.0 95.0 L625.0 95.0 L625.0 116" marker-end="url(#ar)"/><text x="631" y="109.5" text-anchor="start" class="a t b" style="font-size:10.5px">ні</text><path class="ln" d="M360.0 158 L360.0 179.0 L182.0 179.0 L182.0 200" marker-end="url(#ar)"/><text x="188" y="193.5" text-anchor="start" class="a t b" style="font-size:10.5px">нет, только в факте</text><path class="ln" d="M360.0 158 L360.0 179.0 L537.0 179.0 L537.0 200" marker-end="url(#ar)"/><text x="543" y="193.5" text-anchor="start" class="a t b" style="font-size:10.5px">так</text><path class="ln" d="M182.0 242 L182.0 263.0 L95.0 263.0 L95.0 284" marker-end="url(#ar)"/><text x="101" y="277.5" text-anchor="start" class="a t b" style="font-size:10.5px">так</text><path class="ln" d="M182.0 242 L182.0 263.0 L272.0 263.0 L272.0 284" marker-end="url(#ar)"/><text x="278" y="277.5" text-anchor="start" class="a t b" style="font-size:10.5px">ні</text><path class="ln" d="M537.0 242 L537.0 263.0 L450.0 263.0 L450.0 284" marker-end="url(#ar)"/><text x="456" y="277.5" text-anchor="start" class="a t b" style="font-size:10.5px">так</text><path class="ln" d="M537.0 242 L537.0 263.0 L625.0 263.0 L625.0 284" marker-end="url(#ar)"/><text x="631" y="277.5" text-anchor="start" class="a t b" style="font-size:10.5px">ні</text><rect class="boxa" x="195.0" y="32.0" width="330.0" height="42.0" rx="6"/><text x="360.0" y="50.5" text-anchor="middle" class="b" style="font-size:10.5px">vehicle_angular_velocity идёт с частотой</text><text x="360.0" y="63.5" text-anchor="middle" style="font-size:10.5px">≈ IMU_GYRO_RATEMAX (800 Гц у мультиротора)?</text><rect class="box" x="545.0" y="116.0" width="160.0" height="42.0" rx="16"/><text x="625.0" y="134.5" text-anchor="middle" style="font-size:10.5px">перегрузка CPU:</text><text x="625.0" y="147.5" text-anchor="middle" style="font-size:10.5px">top / listener cpuload</text><rect class="box" x="235.0" y="116.0" width="250.0" height="42.0" rx="6"/><text x="360.0" y="134.5" text-anchor="middle" style="font-size:10.5px">Колебания видны и в</text><text x="360.0" y="147.5" text-anchor="middle" style="font-size:10.5px">vehicle_rates_setpoint?</text><rect class="box" x="67.0" y="200.0" width="230.0" height="42.0" rx="6"/><text x="182.0" y="218.5" text-anchor="middle" style="font-size:10.5px">Пик моторов в спектре</text><text x="182.0" y="231.5" text-anchor="middle" style="font-size:10.5px">Flight Review — в полосе?</text><rect class="box" x="422.0" y="200.0" width="230.0" height="42.0" rx="6"/><text x="537.0" y="218.5" text-anchor="middle" style="font-size:10.5px">uorb top -1: датчик</text><text x="537.0" y="231.5" text-anchor="middle" style="font-size:10.5px">публикует с пропусками?</text><rect class="box" x="10.0" y="284.0" width="170.0" height="54.0" rx="16"/><text x="95.0" y="302.0" text-anchor="middle" style="font-size:10.5px">IMU_GYRO_CUTOFF /</text><text x="95.0" y="315.0" text-anchor="middle" style="font-size:10.5px">IMU_GYRO_NF0_FRQ /</text><text x="95.0" y="328.0" text-anchor="middle" style="font-size:10.5px">IMU_GYRO_DNF_EN</text><rect class="box" x="192.0" y="284.0" width="160.0" height="54.0" rx="16"/><text x="272.0" y="308.5" text-anchor="middle" style="font-size:10.5px">rate P / D</text><text x="272.0" y="321.5" text-anchor="middle" style="font-size:10.5px">(px4-control)</text><rect class="box" x="370.0" y="284.0" width="160.0" height="54.0" rx="16"/><text x="450.0" y="308.5" text-anchor="middle" style="font-size:10.5px">инновации EKF2</text><text x="450.0" y="321.5" text-anchor="middle" style="font-size:10.5px">по этому датчику</text><rect class="box" x="545.0" y="284.0" width="160.0" height="54.0" rx="16"/><text x="625.0" y="308.5" text-anchor="middle" style="font-size:10.5px">attitude P /</text><text x="625.0" y="321.5" text-anchor="middle" style="font-size:10.5px">контур позиции</text></svg>
