<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Піксель → точка на землі</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="30" width="110" height="44" rx="6"/><text x="65.0" y="56.0" text-anchor="middle" style="font-size:10.5px">Піксель (u, v)</text><rect class="boxa" x="140" y="30" width="130" height="44" rx="6"/><text x="205.0" y="49.0" text-anchor="middle" class="b">K⁻¹ + зняття</text><text x="205.0" y="63.0" text-anchor="middle" class="b">дисторсія→промінь</text><rect class="boxa" x="290" y="30" width="130" height="44" rx="6"/><text x="355.0" y="49.0" text-anchor="middle" class="b">R_bc: кріплення</text><text x="355.0" y="63.0" text-anchor="middle" class="b">→ промінь у FRD</text><rect class="boxa" x="440" y="30" width="120" height="44" rx="6"/><text x="500.0" y="49.0" text-anchor="middle" class="b" style="font-size:10.5px">R_nb(φ,θ,ψ)</text><text x="500.0" y="63.0" text-anchor="middle" class="b" style="font-size:10.5px">→ промінь у NED</text><rect class="box" x="580" y="30" width="130" height="44" rx="6"/><text x="645.0" y="49.0" text-anchor="middle">t = h / r_z</text><text x="645.0" y="63.0" text-anchor="middle">→ (N, E) м</text><rect class="box" x="440" y="120" width="120" height="44" rx="6"/><text x="500.0" y="139.0" text-anchor="middle" style="font-size:10.5px">ATT у момент</text><text x="500.0" y="153.0" text-anchor="middle" style="font-size:10.5px">експозиції</text><rect class="box" x="580" y="120" width="130" height="44" rx="6"/><text x="645.0" y="139.0" text-anchor="middle">Висота над</text><text x="645.0" y="153.0" text-anchor="middle">рельєфом</text><path class="ln" d="M120 52.0 L140 52.0" marker-end="url(#ar)"/><path class="ln" d="M270 52.0 L290 52.0" marker-end="url(#ar)"/><path class="ln" d="M420 52.0 L440 52.0" marker-end="url(#ar)"/><path class="ln" d="M560 52.0 L580 52.0" marker-end="url(#ar)"/><path class="ln" d="M500.0 120 L500.0 74" marker-end="url(#ar)"/><path class="ln" d="M645.0 120 L645.0 74" marker-end="url(#ar)"/><text x="10" y="140" text-anchor="start" class="m t">Похибка 1° орієнтації на 100 м</text><text x="10" y="154" text-anchor="start" class="m t">= 1.7 м на землі (надир)</text></svg>
