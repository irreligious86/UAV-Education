80.9" y1="162" x2="680.9" y2="182" stroke="currentColor" stroke-width="1.4"/><line x1="700.0" y1="162" x2="700.0" y2="182" stroke="currentColor" stroke-width="1.4"/><text x="118" y="204" text-anchor="end" class="m t" style="font-size:11px">статус в FC</text><rect class="boxa" x="128.0" y="192.0" width="572.0" height="20.0" rx="3"/><text x="414.0" y="206" text-anchor="middle" class="a t" style="font-size:10.5px">здоров</text><text x="16" y="248" text-anchor="start" class="b t" style="font-size:11px">3. ≈ 2 Гц, пакет в 1.5 с потерян: пауза 1 с</text><text x="118" y="272" text-anchor="end" class="m t" style="font-size:11px">пакеты</text><line x1="128.0" y1="260" x2="128.0" y2="280" stroke="currentColor" stroke-width="1.4"/><line x1="223.3" y1="260" x2="223.3" y2="280" stroke="currentColor" stroke-width="1.4"/><line x1="318.7" y1="260" x2="318.7" y2="280" stroke="currentColor" stroke-width="1.4"/><line x1="509.3" y1="260" x2="509.3" y2="280" stroke="currentColor" stroke-width="1.4"/><line x1="604.7" y1="260" x2="604.7" y2="280" stroke="currentColor" stroke-width="1.4"/><line x1="700.0" y1="260" x2="700.0" y2="280" stroke="currentColor" stroke-width="1.4"/><text x="118" y="302" text-anchor="end" class="m t" style="font-size:11px">статус в FC</text><rect class="boxa" x="128.0" y="290.0" width="287.9" height="20.0" rx="3"/><text x="271.9533333333334" y="304" text-anchor="middle" class="a t" style="font-size:10.5px">здоров</text><rect x="415.9" y="290" width="93.4" height="20" rx="3" fill="var(--gc-signal-red, #e8636b)" opacity="0.18" stroke="var(--gc-signal-red, #e8636b)"/><text x="462.62" y="304" text-anchor="middle" class="d t" style="font-size:10.5px">нет данных</text><rect class="boxa" x="509.3" y="290.0" width="190.7" height="20.0" rx="3"/><text x="604.6666666666666" y="304" text-anchor="middle" class="a t" style="font-size:10.5px">здоров</text><text x="326.66666666666663" y="78" text-anchor="start" class="m t" style="font-size:10.5px">молчит</text><text x="420.0" y="