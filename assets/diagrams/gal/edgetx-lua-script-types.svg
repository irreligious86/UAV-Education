<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">EdgeTX 2.12: какой тип Lua-скрипта нужен</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">EdgeTX 2.12: какой тип Lua-скрипта нужен</text><rect class="box" x="276.0" y="34" width="168.0" height="50" rx="6"/><text x="360.0" y="57.0" text-anchor="middle" style="font-size:10.5px">Что должен делать</text><text x="360.0" y="69.0" text-anchor="middle" style="font-size:10.5px">скрипт?</text><path class="ln" d="M360.0 84 L360.0 99.0 L150.0 99.0 L150.0 114" marker-end="url(#ar)"/><text x="154.0" y="95.0" text-anchor="start" class="a t" style="font-size:10px">экран</text><rect class="box" x="66.0" y="114" width="168.0" height="50" rx="6"/><text x="150.0" y="143.0" text-anchor="middle" style="font-size:10.5px">Пульт