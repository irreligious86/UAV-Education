le="font-size:9.5px">/SCRIPTS/MIXES</text><text x="500.0" y="155.0" text-anchor="middle" style="font-size:9.5px">имя ≤ 6 симв.</text><path class="ln" d="M360.0 84 L360.0 99.0 L640.0 99.0 L640.0 114" marker-end="url(#ar)"/><text x="644.0" y="95.0" text-anchor="start" class="a t" style="font-size:10px">из меню</text><rect class="box" x="573.0" y="114" width="134.0" height="50" rx="18"/><text x="640.0" y="131.0" text-anchor="middle" style="font-size:9.5px">Tool</text><text x="640.0" y="143.0" text-anchor="middle" style="font-size:9.5px">/SCRIPTS/TOOLS</text><text x="640.0" y="155.0" text-anchor="middle" style="font-size:9.5px">файл или папка</text></svg>
