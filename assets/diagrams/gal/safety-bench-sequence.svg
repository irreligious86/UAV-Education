<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Стенд: порядок включения новой или перепаянной сборки</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="5" y="40" width="170" height="48" rx="6"/><text x="90.0" y="61.0" text-anchor="middle">1. Мультиметр:</text><text x="90.0" y="75.0" text-anchor="middle">нет КЗ на входе</text><rect class="box" x="183" y="40" width="170" height="48" rx="6"/><text x="268.0" y="61.0" text-anchor="middle">2. Smoke stopper или</text><text x="268.0" y="75.0" text-anchor="middle">БП с лимитом тока</text><rect class="box" x="361" y="40" width="170" height="48" rx="6"/><text x="446.0" y="61.0" text-anchor="middle">3. USB, конфигуратор:</text><text x="446.0" y="75.0" text-anchor="middle">пропов нет</text><rect class="box" x="539" y="40" width="176" height="48" rx="6"/><text x="627.0" y="61.0" text-anchor="middle">4. Тест моторов:</text><text x="627.0" y="75.0" text-anchor="middle">направление, газ мал</text><rect class="boxa" x="539" y="140" width="176" height="48" rx="6"/><text x="627.0" y="161.0" text-anchor="middle" class="b">5. Арм тумблером:</text><text x="627.0" y="175.0" text-anchor="middle" class="b">холостые крутятся</text><rect class="boxa" x="361" y="140" width="170" height="48" rx="6"/><text x="446.0" y="161.0" text-anchor="middle" class="b">6. Failsafe-тест:</text><text x="446.0" y="175.0" text-anchor="middle" class="b">пульт выключен</text><rect class="box" x="150" y="140" width="190" height="48" rx="6"/><text x="245.0" y="161.0" text-anchor="middle">7. Пропы — на площадке,</text><text x="245.0" y="175.0" text-anchor="middle">последним шагом</text><path class="ln" d="M175 64.0 L183 64.0" marker-end="url(#ar)"/><path class="ln" d="M353 64.0 L361 64.0" marker-end="url(#ar)"/><path class="ln" d="M531 64.0 L539 64.0" marker-end="url(#ar)"/><path class="ln" d="M627.0 88 L627.0 140" marker-end="url(#ar)"/><path class="ln" d="M539 164.0 L531 164.0" marker-end="url(#ar)"/><path class="lna" d="M361 164.0 L340 164.0" marker-end="url(#ara)"/><text x="10" y="216" text-anchor="start" class="m t">Шаги 1–6 — без пропов. Любой непройденный шаг: обесточить и разбираться, не идти дальше</text></svg>
