<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Медианы участка 10–20 с → индексы → причина (2 % и 5 % — ориентиры курса)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Медианы участка 10–20 с → индексы → причина (2 % и 5 % — ориентиры курса)</text><rect class="boxa" x="294.0" y="34" width="132.0" height="52" rx="6"/><text x="360.0" y="58.0" text-anchor="middle" class="b" style="font-size:9.5px">индексы pitch,</text><text x="360.0" y="70.0" text-anchor="middle" class="b" style="font-size:9.5px">roll, yaw</text><path class="ln" d="M360.0 86 L360.0 106.0 L80.0 106.0 L80.0 126" marker-end="url(#ar)"/><text x="84.0" y="102.0" text-anchor="start" class="a t" style="font-size:10px">все ≤ 2 %</text><rect class="box" x="14.0" y="126" width="132.0" height="52" rx="18"/><text x="80.0" y="150.0" text-anchor="middle" style="font-size:9.5px">механика в норме:</text><text x="80.0" y="162.0" text-anchor="middle" style="font-size:9.5px">фильтры, PID</text><path class="ln" d="M360.0 86 L360.0 106.0 L220.0 106.0 L220.0 126" marker-end="url(#ar)"/><text x="224.0" y="102.0" text-anchor="start" class="a t" style="font-size:10px">pitch/roll</text><rect class="box" x="154.0" y="126" width="132.0" height="52" rx="6"/><text x="220.0" y="150.0" text-anchor="middle" style="font-size:9.5px">yaw ≈ 0:</text><text x="220.0" y="162.0" text-anchor="middle" style="font-size:9.5px">смещён ЦТ</text><path class="ln" d="M220.0 178 L220.0 198.0 L220.0 198.0 L220.0 218" marker-end="url(#ar)"/><rect class="box" x="154.0" y="218" width="132.0" height="52" rx="18"/><text x="220.0" y="242.0" text-anchor="middle" style="font-size:9.5px">сдвинь АКБ,</text><text x="220.0" y="254.0" text-anchor="middle" style="font-size:9.5px">новый лог</text><path class="ln" d="M360.0 86 L360.0 106.0 L430.0 106.0 L430.0 126" marker-end="url(#ar)"/><text x="434.0" y="102.0" text-anchor="start" class="a t" style="font-size:10px">|p|≈|r|≈|y|</text><rect class="boxa" x="364.0" y="126" width="132.0" height="52" rx="6"/><text x="430.0" y="144.0" text-anchor="middle" class="b" style="font-size:9.5px">один мотор</text><text x="430.0" y="156.0" text-anchor="middle" class="b" style="font-size:9.5px">в углу: swap</text><text x="430.0" y="168.0" text-anchor="middle" class="b" style="font-size:9.5px">пропов</text><path class="ln" d="M430.0 178 L430.0 198.0 L360.0 198.0 L360.0 218" marker-end="url(#ar)"/><text x="364.0" y="194.0" text-anchor="start" class="a t" style="font-size:10px">с пропом</text><rect class="box" x="294.0" y="218" width="132.0" height="52" rx="18"/><text x="360.0" y="242.0" text-anchor="middle" style="font-size:9.5px">проп: замена,</text><text x="360.0" y="254.0" text-anchor="middle" style="font-size:9.5px">балансировка</text><path class="ln" d="M430.0 178 L430.0 198.0 L500.0 198.0 L500.0 218" marker-end="url(#ar)"/><text x="504.0" y="194.0" text-anchor="start" class="a t" style="font-size:10px">остался</text><rect class="box" x="434.0" y="218" width="132.0" height="52" rx="18"/><text x="500.0" y="236.0" text-anchor="middle" style="font-size:9.5px">swap моторов:</text><text x="500.0" y="248.0" text-anchor="middle" style="font-size:9.5px">мотор или</text><text x="500.0" y="260.0" text-anchor="middle" style="font-size:9.5px">ESC/луч</text><path class="ln" d="M360.0 86 L360.0 106.0 L640.0 106.0 L640.0 126" marker-end="url(#ar)"/><text x="644.0" y="102.0" text-anchor="start" class="a t" style="font-size:10px">только yaw</text><rect class="box" x="574.0" y="126" width="132.0" height="52" rx="6"/><text x="640.0" y="150.0" text-anchor="middle" style="font-size:9.5px">pitch/roll ≈ 0:</text><text x="640.0" y="162.0" text-anchor="middle" style="font-size:9.5px">момент</text><path class="ln" d="M640.0 178 L640.0 198.0 L640.0 198.0 L640.0 218" marker-end="url(#ar)"/><rect class="box" x="574.0" y="218" width="132.0" height="52" rx="18"/><text x="640.0" y="236.0" text-anchor="middle" style="font-size:9.5px">наклон мотора,</text><text x="640.0" y="248.0" text-anchor="middle" style="font-size:9.5px">луч, разные</text><text x="640.0" y="260.0" text-anchor="middle" style="font-size:9.5px">пропы</text></svg>
