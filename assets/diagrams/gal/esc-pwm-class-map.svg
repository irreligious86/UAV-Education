<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Частота ШИМ ESC по классу аппарата</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Стартовая частота ШИМ по классу аппарата (ступени Bluejay 24 / 48 / 96 кГц)</text><rect x="343" y="58" width="104" height="286" fill="var(--gc-signal-red, #e8636b)" opacity="0.10"/><text x="395" y="40" text-anchor="middle" class="d t b" style="font-size:10.5px">DJI O3/O4 + Gyroflow:</text><text x="395" y="53" text-anchor="middle" class="d t b" style="font-size:10.5px">не ниже 48 кГц</text><line class="lnm" x1="395" y1="60" x2="395" y2="344"/><text x="395" y="360" text-anchor="middle" class="b" style="font-size:11.5px">24 кГц</text><line class="lnm" x1="525" y1="60" x2="525" y2="344"/><text x="525" y="360" text-anchor="middle" class="b" style="font-size:11.5px">48 кГц</text><line class="lnm" x1="655" y1="60" x2="655" y2="344"/><text x="655" y="360" text-anchor="middle" class="b" style="font-size:11.5px">96 кГц</text><text x="16" y="81.0" text-anchor="start" class="b" style="font-size:11px">Вуп 65–75 мм, 1S, 0603–0802</text><text x="16" y="95.0" text-anchor="start" class="m t" style="font-size:10.5px">96 — только при dead time в layout &lt; 30</text><line class="lnm" x1="343" y1="104.0" x2="695" y2="104.0" style="opacity:0.4"/><circle cx="525" cy="84.0" r="7" fill="var(--gc-accent-hud, #5ef1d2)"/><circle cx="655" cy="84.0" r="6" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="2"/><text x="16" y="121.0" text-anchor="start" class="b" style="font-size:11px">2–3.5&quot;, 2–4S</text><text x="16" y="135.0" text-anchor="start" class="m t" style="font-size:10.5px">toothpick, cinewhoop</text><line class="lnm" x1="343" y1="144.0" x2="695" y2="144.0" style="opacity:0.4"/><circle cx="525" cy="124.0" r="7" fill="var(--gc-accent-hud, #5ef1d2)"/><text x="16" y="161.0" text-anchor="start" class="b" style="font-size:11px">5&quot; фристайл, 4–6S</text><text x="16" y="175.0" text-anchor="start" class="m t" style="font-size:10.5px">плавность, чистый гироскоп</text><line class="lnm" x1="343" y1="184.0" x2="695" y2="184.0" style="opacity:0.4"/><circle cx="525" cy="164.0" r="7" fill="var(--gc-accent-hud, #5ef1d2)"/><text x="16" y="201.0" text-anchor="start" class="b" style="font-size:11px">5&quot; гонка, 4–6S</text><text x="16" y="215.0" text-anchor="start" class="m t" style="font-size:10.5px">AM32 — 24 с переменной (до 2·f)</text><line class="lnm" x1="343" y1="224.0" x2="695" y2="224.0" style="opacity:0.4"/><path d="M395 204.0 L525 204.0" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="6" opacity="0.45" fill="none"/><circle cx="395" cy="204.0" r="7" fill="var(--gc-accent-hud, #5ef1d2)"/><path class="ln" d="M405 195.0 Q460.0 184.0 515 195.0" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:4 3"/><path d="M515 195.0 l-7 -1 l3 6 z" fill="var(--gc-signal-red, #e8636b)"/><text x="16" y="241.0" text-anchor="start" class="b" style="font-size:11px">7&quot; long range, 6S</text><text x="16" y="255.0" text-anchor="start" class="m t" style="font-size:10.5px">или переменная 24–48; Bluejay — 48</text><line class="lnm" x1="343" y1="264.0" x2="695" y2="264.0" style="opacity:0.4"/><path d="M395 244.0 L525 244.0" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="6" opacity="0.45" fill="none"/><circle cx="395" cy="244.0" r="7" fill="var(--gc-accent-hud, #5ef1d2)"/><path class="ln" d="M405 235.0 Q460.0 224.0 515 235.0" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:4 3"/><path d="M515 235.0 l-7 -1 l3 6 z" fill="var(--gc-signal-red, #e8636b)"/><circle cx="525" cy="244.0" r="6" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="2"/><text x="16" y="281.0" text-anchor="start" class="b" style="font-size:11px">10&quot; и больше, низкий KV</text><text x="16" y="295.0" text-anchor="start" class="m t" style="font-size:10.5px">фиксированная; оценка, источника нет</text><line class="lnm" x1="343" y1="304.0" x2="695" y2="304.0" style="opacity:0.4"/><circle cx="395" cy="284.0" r="7" fill="var(--gc-accent-hud, #5ef1d2)"/><path class="ln" d="M405 275.0 Q460.0 264.0 515 275.0" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:4 3"/><path d="M515 275.0 l-7 -1 l3 6 z" fill="var(--gc-signal-red, #e8636b)"/><text x="16" y="321.0" text-anchor="start" class="b" style="font-size:11px">Самолёт, 1–2 мотора</text><text x="16" y="335.0" text-anchor="start" class="m t" style="font-size:10.5px">оценка</text><line class="lnm" x1="343" y1="344.0" x2="695" y2="344.0" style="opacity:0.4"/><circle cx="395" cy="324.0" r="7" fill="var(--gc-accent-hud, #5ef1d2)"/><path class="ln" d="M405 315.0 Q460.0 304.0 515 315.0" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:4 3"/><path d="M515 315.0 l-7 -1 l3 6 z" fill="var(--gc-signal-red, #e8636b)"/><text x="16" y="53" text-anchor="start" class="m t" style="font-size:10.5px">класс</text><circle cx="22" cy="376" r="6" fill="var(--gc-accent-hud, #5ef1d2)"/><text x="34" y="380" text-anchor="start" class="t" style="font-size:10.5px">старт</text><circle cx="92" cy="376" r="5" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="2"/><text x="104" y="380" text-anchor="start" class="t" style="font-size:10.5px">допустимо</text><path d="M190 376 L226 376" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="6" opacity="0.45"/><text x="232" y="380" text-anchor="start" class="t" style="font-size:10.5px">переменная частота</text><path class="ln" d="M380 376 L414 376" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:4 3"/><text x="420" y="380" text-anchor="start" class="d t" style="font-size:10.5px">сдвиг при DJI O3/O4 + Gyroflow</text><rect class="box" x="16.0" y="396.0" width="688.0" height="56.0" rx="6"/><text x="26" y="415.0" text-anchor="start" style="font-size:10.5px">Затем для любого класса: N = 10·f/eRPM на висении (периодов ШИМ на шаг коммутации)</text><text x="26" y="428.0" text-anchor="start" style="font-size:10.5px">7&quot;: висение ≈ 50 000 eRPM, 24 кГц → N = 10·24 000/50 000 = 4.8 — запас есть</text><text x="26" y="441.0" text-anchor="start" style="font-size:10.5px">N &lt; 3 — ступень вверх; N &gt; 10 при горячем ESC — вниз; дальше — по симптомам в полёте</text></svg>
