<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">PX4 самолёт / VTOL с нуля: 17 шагов — стол или поле</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="17" y="34" width="106" height="44" rx="6"/><text x="70.0" y="53.0" text-anchor="middle" style="font-size:10.5px">1 Прошивка,</text><text x="70.0" y="67.0" text-anchor="middle" style="font-size:10.5px">бэкап</text><text x="70.0" y="91" text-anchor="middle" class="m t">стол</text><rect class="box" x="133" y="34" width="106" height="44" rx="6"/><text x="186.0" y="53.0" text-anchor="middle" style="font-size:10.5px">2 Airframe</text><text x="186.0" y="67.0" text-anchor="middle" style="font-size:10.5px">13000, CA_*</text><text x="186.0" y="91" text-anchor="middle" class="m t">стол</text><rect class="box" x="249" y="34" width="106" height="44" rx="6"/><text x="302.0" y="53.0" text-anchor="middle" style="font-size:10.5px">3 Порты,</text><text x="302.0" y="67.0" text-anchor="middle" style="font-size:10.5px">датчик скорости</text><text x="302.0" y="91" text-anchor="middle" class="m t">стол</text><rect class="box" x="365" y="34" width="106" height="44" rx="6"/><text x="418.0" y="53.0" text-anchor="middle" style="font-size:10.5px">4 Приёмник,</text><text x="418.0" y="67.0" text-anchor="middle" style="font-size:10.5px">бинд</text><text x="418.0" y="91" text-anchor="middle" class="m t">стол</text><rect class="box" x="481" y="34" width="106" height="44" rx="6"/><text x="534.0" y="53.0" text-anchor="middle" style="font-size:10.5px">5 Радио,</text><text x="534.0" y="67.0" text-anchor="middle" style="font-size:10.5px">тумблер перехода</text><text x="534.0" y="91" text-anchor="middle" class="m t">стол</text><rect class="box" x="597" y="34" width="106" height="44" rx="6"/><text x="650.0" y="53.0" text-anchor="middle" style="font-size:10.5px">6 Протоколы</text><text x="650.0" y="67.0" text-anchor="middle" style="font-size:10.5px">по группам</text><text x="650.0" y="91" text-anchor="middle" class="m t">стол</text><rect class="box" x="597" y="112" width="106" height="44" rx="6"/><text x="650.0" y="131.0" text-anchor="middle" style="font-size:10.5px">7 Моторы</text><text x="650.0" y="145.0" text-anchor="middle" style="font-size:10.5px">и рули</text><text x="650.0" y="169" text-anchor="middle" class="m t">стол, без пропов</text><rect class="box" x="481" y="112" width="106" height="44" rx="6"/><text x="534.0" y="131.0" text-anchor="middle" style="font-size:10.5px">8 ESC тянущего</text><text x="534.0" y="145.0" text-anchor="middle" style="font-size:10.5px">мотора (PWM)</text><text x="534.0" y="169" text-anchor="middle" class="m t">стол, без пропов</text><rect class="box" x="365" y="112" width="106" height="44" rx="6"/><text x="418.0" y="131.0" text-anchor="middle" style="font-size:10.5px">9 Датчики,</text><text x="418.0" y="145.0" text-anchor="middle" style="font-size:10.5px">калибр. скорости</text><text x="418.0" y="169" text-anchor="middle" class="m t">стол</text><rect class="box" x="249" y="112" width="106" height="44" rx="6"/><text x="302.0" y="131.0" text-anchor="middle" style="font-size:10.5px">10 Питание</text><text x="302.0" y="145.0" text-anchor="middle" style="font-size:10.5px">BAT1_*</text><text x="302.0" y="169" text-anchor="middle" class="m t">стол</text><rect class="box" x="133" y="112" width="106" height="44" rx="6"/><text x="186.0" y="138.0" text-anchor="middle" style="font-size:10.5px">11 Режимы</text><text x="186.0" y="169" text-anchor="middle" class="m t">стол</text><rect class="boxa" x="17" y="112" width="106" height="44" rx="6"/><text x="70.0" y="131.0" text-anchor="middle" class="b" style="font-size:10.5px">12 Failsafe,</text><text x="70.0" y="145.0" text-anchor="middle" class="b" style="font-size:10.5px">quad-chute</text><text x="70.0" y="169" text-anchor="middle" class="m t">стол + поле</text><rect class="box" x="17" y="190" width="106" height="44" rx="6"/><text x="70.0" y="209.0" text-anchor="middle" style="font-size:10.5px">13 OSD,</text><text x="70.0" y="223.0" text-anchor="middle" style="font-size:10.5px">телеметрія</text><text x="70.0" y="247" text-anchor="middle" class="m t">стол</text><rect class="box" x="133" y="190" width="106" height="44" rx="6"/><text x="186.0" y="209.0" text-anchor="middle" style="font-size:10.5px">14 Return,</text><text x="186.0" y="223.0" text-anchor="middle" style="font-size:10.5px">посадка миссии</text><text x="186.0" y="247" text-anchor="middle" class="m t">стол</text><rect class="boxa" x="249" y="190" width="106" height="44" rx="6"/><text x="302.0" y="209.0" text-anchor="middle" class="b" style="font-size:10.5px">15 Висение →</text><text x="302.0" y="223.0" text-anchor="middle" class="b" style="font-size:10.5px">переход ≥ 20 м</text><text x="302.0" y="247" text-anchor="middle" class="m t">поле</text><rect class="boxa" x="365" y="190" width="106" height="44" rx="6"/><text x="418.0" y="209.0" text-anchor="middle" class="b" style="font-size:10.5px">16 MC, затем</text><text x="418.0" y="223.0" text-anchor="middle" class="b" style="font-size:10.5px">FW_AT_*</text><text x="418.0" y="247" text-anchor="middle" class="m t">поле</text><rect class="box" x="481" y="190" width="106" height="44" rx="6"/><text x="534.0" y="209.0" text-anchor="middle" style="font-size:10.5px">17 ULog,</text><text x="534.0" y="223.0" text-anchor="middle" style="font-size:10.5px">.params</text><text x="534.0" y="247" text-anchor="middle" class="m t">стол</text><path class="ln" d="M123 56.0 L133 56.0" marker-end="url(#ar)"/><path class="ln" d="M239 56.0 L249 56.0" marker-end="url(#ar)"/><path class="ln" d="M355 56.0 L365 56.0" marker-end="url(#ar)"/><path class="ln" d="M471 56.0 L481 56.0" marker-end="url(#ar)"/><path class="ln" d="M587 56.0 L597 56.0" marker-end="url(#ar)"/><path class="ln" d="M650.0 78 L650.0 112" marker-end="url(#ar)"/><path class="ln" d="M597 134.0 L587 134.0" marker-end="url(#ar)"/><path class="ln" d="M481 134.0 L471 134.0" marker-end="url(#ar)"/><path class="ln" d="M365 134.0 L355 134.0" marker-end="url(#ar)"/><path class="ln" d="M249 134.0 L239 134.0" marker-end="url(#ar)"/><path class="ln" d="M133 134.0 L123 134.0" marker-end="url(#ar)"/><path class="ln" d="M70.0 156 L70.0 190" marker-end="url(#ar)"/><path class="ln" d="M123 212.0 L133 212.0" marker-end="url(#ar)"/><path class="ln" d="M239 212.0 L249 212.0" marker-end="url(#ar)"/><path class="ln" d="M355 212.0 L365 212.0" marker-end="url(#ar)"/><path class="ln" d="M471 212.0 L481 212.0" marker-end="url(#ar)"/><text x="17" y="268" text-anchor="start" class="m t">Выделено — шаг требует поля. «стол» — без пропеллеров; рули — после перехода в FW без арма.</text><text x="17" y="284" text-anchor="start" class="m t">Пропеллеры ставятся только на шаге 15; первый переход — на 20 м и выше, против ветра.</text></svg>
