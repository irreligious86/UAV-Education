era Trigger назначить нельзя</text><text x="12" y="272" text-anchor="start" class="m t">Под группой — план из шага 1: 4 мотора DShot600, 3 сервы 50 Гц, триггер камеры.</text><text x="12" y="286" text-anchor="start" class="m t">Одна группа — один протокол и одна частота: серва в группе DShot работать не будет.</text></svg>
