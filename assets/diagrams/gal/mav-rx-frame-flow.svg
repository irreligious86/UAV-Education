<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 566" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Приём кадра MAVLink 2</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="380" height="38" rx="6"/><text x="200.0" y="63.0" text-anchor="middle" class="b">1. Байт = STX 0xFD (v1 — 0xFE)?</text><rect class="box" x="10" y="106" width="380" height="44" rx="6"/><text x="200.0" y="125.0" text-anchor="middle">2. Заголовок 10 байт: все биты</text><text x="200.0" y="139.0" text-anchor="middle">incompat_flags известны?</text><rect class="box" x="10" y="176" width="380" height="44" rx="6"/><text x="200.0" y="195.0" text-anchor="middle">3. Добрать len + 2 байта CRC</text><text x="200.0" y="209.0" text-anchor="middle">(+13 подписи, если бит 0)</text><rect class="box" x="10" y="246" width="380" height="44" rx="6"/><text x="200.0" y="265.0" text-anchor="middle">4. CRC-16/MCRF4XX по байтам 1…payload</text><text x="200.0" y="279.0" text-anchor="middle">+ CRC_EXTRA(msgid) = checksum?</text><rect class="box" x="10" y="316" width="380" height="44" rx="6"/><text x="200.0" y="335.0" text-anchor="middle">5. Подписан: SHA-256 (6 байт) верна</text><text x="200.0" y="349.0" text-anchor="middle">и timestamp растёт?</text><rect class="box" x="10" y="386" width="380" height="44" rx="6"/><text x="200.0" y="405.0" text-anchor="middle">6. seq: потеряно (seq − seq_прошл − 1) mod 256</text><text x="200.0" y="419.0" text-anchor="middle">— отдельно для пары sysid/compid</text><rect class="boxa" x="10" y="456" width="380" height="44" rx="6"/><text x="200.0" y="475.0" text-anchor="middle" class="b">7. len &lt; размера структуры →</text><text x="200.0" y="489.0" text-anchor="middle" class="b">дополнить нулями, распаковать</text><rect class="box" x="430" y="37" width="280" height="44" rx="6"/><text x="570.0" y="56.0" text-anchor="middle">нет: пропустить байт,</text><text x="570.0" y="70.0" text-anchor="middle">искать STX дальше</text><rect class="box" x="430" y="109" width="280" height="38" rx="6"/><text x="570.0" y="132.0" text-anchor="middle">неизвестный бит: кадр отбросить</text><rect class="box" x="430" y="240" width="280" height="56" rx="6"/><text x="570.0" y="258.0" text-anchor="middle">нет: тихо отбросить — битый</text><text x="570.0" y="272.0" text-anchor="middle">байт или разные диалекты:</text><text x="570.0" y="286.0" text-anchor="middle">heartbeat есть, данных нет</text><rect class="box" x="430" y="319" width="280" height="38" rx="6"/><text x="570.0" y="342.0" text-anchor="middle">нет: отбросить (подмена, повтор)</text><path class="ln" d="M200.0 78 L200.0 106" marker-end="url(#ar)"/><text x="206.0" y="88.0" text-anchor="start" class="m t" style="font-size:10px">так</text><path class="ln" d="M200.0 150 L200.0 176" marker-end="url(#ar)"/><text x="206.0" y="159.0" text-anchor="start" class="m t" style="font-size:10px">так</text><path class="ln" d="M200.0 220 L200.0 246" marker-end="url(#ar)"/><path class="ln" d="M200.0 290 L200.0 316" marker-end="url(#ar)"/><text x="206.0" y="299.0" text-anchor="start" class="m t" style="font-size:10px">так</text><path class="ln" d="M200.0 360 L200.0 386" marker-end="url(#ar)"/><text x="206.0" y="369.0" text-anchor="start" class="m t" style="font-size:10px">так</text><path class="lna" d="M200.0 430 L200.0 456" marker-end="url(#ara)"/><path class="ln" d="M390 59.0 L430 59.0" marker-end="url(#ar)"/><path class="ln" d="M390 128.0 L430 128.0" marker-end="url(#ar)"/><path class="ln" d="M390 268.0 L430 268.0" marker-end="url(#ar)"/><path class="ln" d="M390 338.0 L430 338.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">Приём кадра MAVLink 2: где пакет теряется молча</text><text x="430" y="374" text-anchor="start" class="m t">неподписанный при включённой подписи —</text><text x="430" y="388" text-anchor="start" class="m t">отбросить; ArduPilot принимает его на</text><text x="430" y="402" text-anchor="start" class="m t">канале 0 (USB), RADIO_STATUS, а в 4.7+</text><text x="430" y="416" text-anchor="start" class="m t">на канале с MAVn_OPTIONS бит 0</text><text x="10" y="538" text-anchor="start" class="m t">Парсер, который вместо шага 7 проверяет len == sizeof(struct), отбрасывает обрезанные кадры —</text><text x="10" y="554" text-anchor="start" class="m t">это выглядит как «случайные потери» команд.</text></svg>
