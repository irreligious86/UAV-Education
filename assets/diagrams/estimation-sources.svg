<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Оценка состояния: датчики → EKF → контуры</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="20" width="120" height="44" rx="6"/><text x="70.0" y="39.0" text-anchor="middle" class="b">IMU</text><text x="70.0" y="53.0" text-anchor="middle" class="b">гиро + accel</text><rect class="box" x="10" y="80" width="120" height="44" rx="6"/><text x="70.0" y="106.0" text-anchor="middle">Баро</text><rect class="box" x="10" y="140" width="120" height="44" rx="6"/><text x="70.0" y="159.0" text-anchor="middle">GNSS</text><text x="70.0" y="173.0" text-anchor="middle">pos/vel</text><rect class="box" x="10" y="200" width="120" height="44" rx="6"/><text x="70.0" y="226.0" text-anchor="middle">Компас</text><rect class="box" x="10" y="260" width="120" height="44" rx="6"/><text x="70.0" y="279.0" text-anchor="middle">Поток, дальномер,</text><text x="70.0" y="293.0" text-anchor="middle">ExternalNav</text><rect class="boxa" x="200" y="110" width="170" height="90" rx="6"/><text x="285.0" y="138.0" text-anchor="middle" class="b">EKF3</text><text x="285.0" y="152.0" text-anchor="middle" class="b">предсказание по IMU,</text><text x="285.0" y="166.0" text-anchor="middle" class="b">коррекция измерениями,</text><text x="285.0" y="180.0" text-anchor="middle" class="b">ворота инноваций</text><rect class="box" x="430" y="40" width="120" height="44" rx="6"/><text x="490.0" y="59.0" text-anchor="middle">Ориентация</text><text x="490.0" y="73.0" text-anchor="middle">q, углы</text><rect class="box" x="430" y="110" width="120" height="44" rx="6"/><text x="490.0" y="136.0" text-anchor="middle">Скорость NED</text><rect class="box" x="430" y="180" width="120" height="44" rx="6"/><text x="490.0" y="206.0" text-anchor="middle">Позиция NED</text><rect class="box" x="430" y="250" width="120" height="44" rx="6"/><text x="490.0" y="269.0" text-anchor="middle">Bias гиро/accel</text><text x="490.0" y="283.0" text-anchor="middle">поле, ветер</text><rect class="box" x="580" y="110" width="135" height="44" rx="6"/><text x="647.5" y="129.0" text-anchor="middle">Контуры</text><text x="647.5" y="143.0" text-anchor="middle">rate → angle → pos</text><path class="lna" d="M130 42.0 L165.0 42.0 L165.0 155.0 L200 155.0" marker-end="url(#ara)"/><text x="165.0" y="36.0" text-anchor="middle" class="m t" style="font-size:10px">1–8 кГц</text><path class="ln" d="M130 102.0 L165.0 102.0 L165.0 155.0 L200 155.0" marker-end="url(#ar)"/><path class="ln" d="M130 162.0 L165.0 162.0 L165.0 155.0 L200 155.0" marker-end="url(#ar)"/><text x="165.0" y="149.0" text-anchor="middle" class="m t" style="font-size:10px">5–10 Гц</text><path class="ln" d="M130 222.0 L165.0 222.0 L165.0 155.0 L200 155.0" marker-end="url(#ar)"/><path class="ln" d="M130 282.0 L165.0 282.0 L165.0