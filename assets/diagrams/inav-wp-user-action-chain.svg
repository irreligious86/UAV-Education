<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">User action миссии INAV → логика → PINIO</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">User action в миссии INAV 9.1.0: бит p3 сам ничего не включает (пример модуля)</text><rect class="boxa" x="10.0" y="34.0" width="190.0" height="64.0" rx="6"/><text x="105.0" y="57.0" text-anchor="middle" class="b" style="font-size:10.5px">1. Точка 2: p3 = 2</text><text x="105.0" y="70.0" text-anchor="middle" style="font-size:10.5px">бит 1 → user action 1</text><text x="105.0" y="83.0" text-anchor="middle" style="font-size:10.5px">на участке этой точки</text><path class="ln" d="M200 66.0 L222 66.0" marker-end="url(#ar)"/><rect class="box" x="222.0" y="34.0" width="238.0" height="64.0" rx="6"/><text x="341.0" y="57.0" text-anchor="middle" style="font-size:10.5px">2. logic 0 1 -1 1 7 6 0 1 0</text><text x="341.0" y="70.0" text-anchor="middle" style="font-size:10.5px">тип 7 (миссия), операнд 6:</text><text x="341.0" y="83.0" text-anchor="middle" style="font-size:10.5px">«действие 1 активно» = 1</text><path class="ln" d="M460 66.0 L482 66.0" marker-end="url(#ar)"/><rect class="box" x="482.0" y="34.0" width="228.0" height="64.0" rx="6"/><text x="596.0" y="50.5" text-anchor="middle" style="font-size:10.5px">3. logic 1 1 0 38 0 12 0 2000 0</text><text x="596.0" y="63.5" text-anchor="middle" style="font-size:10.5px">операция 38 (Override RC):</text><text x="596.0" y="76.5" text-anchor="middle" style="font-size:10.5px">пока правило 0 true —</text><text x="596.0" y="89.5" text-anchor="middle" style="font-size:10.5px">канал 12 = 2000 мкс</text><path class="ln" d="M596 98 L596 126" marker-end="url(#ar)"/><rect class="box" x="482.0" y="126.0" width="228.0" height="64.0" rx="6"/><text x="596.0" y="149.0" text-anchor="middle" style="font-size:10.5px">4. aux: режим USER1</text><text x="596.0" y="162.0" text-anchor="middle" style="font-size:10.5px">на канале 12,</text><text x="596.0" y="175.0" text-anchor="middle" style="font-size:10.5px">диапазон 1700–2100</text><path class="ln" d="M482 158.0 L460 158.0" marker-end="url(#ar)"/><rect class="box" x="222.0" y="126.0" width="238.0" height="64.0" rx="6"/><text x="341.0" y="149.0" text-anchor="middle" style="font-size:10.5px">5. pinio_box1 = 47 (USER1)</text><text x="341.0" y="162.0" text-anchor="middle" style="font-size:10.5px">режим USER1 включает</text><text x="341.0" y="175.0" text-anchor="middle" style="font-size:10.5px">свой выход PINIO1</text><path class="lna" d="M222 158.0 L200 158.0" marker-end="url(#ara)"/><rect class="boxa" x="10.0" y="126.0" width="190.0" height="64.0" rx="6"/><text x="105.0" y="149.0" text-anchor="middle" class="b" style="font-size:10.5px">PINIO1 включён:</text><text x="105.0" y="162.0" text-anchor="middle" style="font-size:10.5px">затвор, свет, сброс</text><text x="105.0" y="175.0" text-anchor="middle" style="font-size:10.5px">(inav-led-pinio-beeper)</text><text x="16" y="216" text-anchor="start" class="m t">Какой участок «помечен», решает номер операнда (logic_condition.c):</text><path class="lnm" d="M150 256 L380 256"/><path class="lnm" d="M150 306 L380 306"/><path class="lnm" d="M380 256 L610 256"/><path class="lnm" d="M380 306 L610 306"/><path d="M380 256 L610 256" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="5" fill="none"/><path d="M150 306 L380 306" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="5" fill="none"/><circle cx="150" cy="256" r="6" fill="currentColor"/><circle cx="150" cy="306" r="6" fill="currentColor"/><text x="150" y="236" text-anchor="middle" class="t" style="font-size:10.5px">точка 1</text><circle cx="380" cy="256" r="6" fill="var(--gc-accent-hud, #5ef1d2)"/><circle cx="380" cy="306" r="6" fill="var(--gc-accent-hud, #5ef1d2)"/><text x="380" y="236" text-anchor="middle" class="a t b" style="font-size:10.5px">точка 2 (p3 = 2)</text><circle cx="610" cy="256" r="6" fill="currentColor"/><circle cx="610" cy="306" r="6" fill="currentColor"/><text x="610" y="236" text-anchor="middle" class="t" style="font-size:10.5px">точка 3</text><text x="16" y="260" text-anchor="start" class="b" style="font-size:10.5px">операнд 6</text><text x="16" y="310" text-anchor="start" class="b" style="font-size:10.5px">операнд 10</text><text x="495.0" y="276" text-anchor="middle" class="a t" style="font-size:10.5px">PINIO1 вкл: летит ОТ точки 2</text><text x="265.0" y="326" text-anchor="middle" class="a t" style="font-size:10.5px">PINIO1 вкл: летит К точке 2</text></svg>
