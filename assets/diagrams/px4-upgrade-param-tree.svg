<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Что станет с параметром после обновления до PX4 1.17</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Обновление до 1.17: хранятся только значения, отличные от умолчания, а переводится лишь пара имён</text><path class="ln" d="M360.0 74 L360.0 95.0 L185.0 95.0 L185.0 116" marker-end="url(#ar)"/><text x="191" y="109.5" text-anchor="start" class="a t b" style="font-size:10.5px">нет</text><path class="ln" d="M360.0 74 L360.0 95.0 L535.0 95.0 L535.0 116" marker-end="url(#ar)"/><text x="541" y="109.5" text-anchor="start" class="a t b" style="font-size:10.5px">да</text><path class="ln" d="M185.0 156 L185.0 178.0 L97.0 178.0 L97.0 200" marker-end="url(#ar)"/><text x="103" y="193.0" text-anchor="start" class="a t b" style="font-size:10.5px">да</text><path class="ln" d="M185.0 156 L185.0 178.0 L272.0 178.0 L272.0 200" marker-end="url(#ar)"/><text x="278" y="193.0" text-anchor="start" class="a t b" style="font-size:10.5px">нет</text><path class="ln" d="M535.0 156 L535.0 178.0 L447.0 178.0 L447.0 200" marker-end="url(#ar)"/><text x="453" y="193.0" text-anchor="start" class="a t b" style="font-size:10.5px">да</text><path class="ln" d="M535.0 156 L535.0 178.0 L622.0 178.0 L622.0 200" marker-end="url(#ar)"/><text x="628" y="193.0" text-anchor="start" class="a t b" style="font-size:10.5px">нет</text><rect class="boxa" x="210.0" y="32.0" width="300.0" height="42.0" rx="6"/><text x="360.0" y="50.5" text-anchor="middle" class="b" style="font-size:10.5px">Параметр на полётнике (1.15 / 1.16):</text><text x="360.0" y="63.5" text-anchor="middle" style="font-size:10.5px">имя есть в 1.17?</text><rect class="box" x="65.0" y="116.0" width="240.0" height="40.0" rx="6"/><text x="185.0" y="133.5" text-anchor="middle" style="font-size:10.5px">Имя есть в</text><text x="185.0" y="146.5" text-anchor="middle" style="font-size:10.5px">param_translation.cpp?</text><rect class="box" x="415.0" y="116.0" width="240.0" height="40.0" rx="6"/><text x="535.0" y="133.5" text-anchor="middle" style="font-size:10.5px">Значение отличалось</text><text x="535.0" y="146.5" text-anchor="middle" style="font-size:10.5px">от умолчания?</text><rect class="box" x="14.5" y="200.0" width="165.0" height="54.0" rx="16"/><text x="97.0" y="218.0" text-anchor="middle" style="font-size:10.5px">переведён сам:</text><text x="97.0" y="231.0" text-anchor="middle" style="font-size:10.5px">SDLOG_MODE −1 →</text><text x="97.0" y="244.0" text-anchor="middle" style="font-size:10.5px">SDLOG_BACKEND 0</text><rect class="box" x="189.5" y="200.0" width="165.0" height="54.0" rx="16"/><text x="272.0" y="218.0" text-anchor="middle" style="font-size:10.5px">потерян — руками:</text><text x="272.0" y="231.0" text-anchor="middle" style="font-size:10.5px">MPC_HOLD_DZ →</text><text x="272.0" y="244.0" text-anchor="middle" style="font-size:10.5px">MAN_DEADZONE</text><rect class="box" x="364.5" y="200.0" width="165.0" height="54.0" rx="16"/><text x="447.0" y="218.0" text-anchor="middle" style="font-size:10.5px">сохранён; смысл</text><text x="447.0" y="231.0" text-anchor="middle" style="font-size:10.5px">значения сверить:</text><text x="447.0" y="244.0" text-anchor="middle" style="font-size:10.5px">COM_ARM_WO_GPS</text><rect class="boxa" x="539.5" y="200.0" width="165.0" height="54.0" rx="16"/><text x="622.0" y="218.0" text-anchor="middle" class="b" style="font-size:10.5px">молча умолчание 1.17:</text><text x="622.0" y="231.0" text-anchor="middle" style="font-size:10.5px">MC_ROLL_P 6.5 → 4.0</text><text x="622.0" y="244.0" text-anchor="middle" style="font-size:10.5px">IMU_DGYRO_CUTOFF 30→20</text></svg>
