<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">С какой стороны настраивать симптом</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">С какой стороны настраивать симптом</text><rect class="box" x="270.0" y="34" width="180.0" height="48" rx="6"/><text x="360.0" y="56.0" text-anchor="middle" style="font-size:10.5px">Какой режим был</text><text x="360.0" y="68.0" text-anchor="middle" style="font-size:10.5px">в момент симптома?</text><path class="ln" d="M360.0 82 L360.0 94.0 L80.0 94.0 L80.0 106" marker-end="url(#ar)"/><text x="84.0" y="90.0" text-anchor="start" class="a t" style="font-size:10px">Q-режим</text><rect class="boxa" x="13.0" y="106" width="134.0" height="48" rx="18"/><text x="80.0" y="122.0" text-anchor="middle" class="b" style="font-size:9.5px">Коптер: notch,</text><text x="80.0" y="134.0" text-anchor="middle" class="b" style="font-size:9.5px">Q_A_RAT_*, Q_M_THST_</text><text x="80.0" y="146.0" text-anchor="middle" class="b" style="font-size:9.5px">HOVER, Q_P_*</text><path class="ln" d="M360.0 82 L360.0 94.0 L360.0 94.0 L360.0 106" marker-end="url(#ar)"/><text x="364.0" y="90.0" text-anchor="start" class="a t" style="font-size:10px">самолётный</text><rect class="box" x="270.0" y="106" width="180.0" height="48" rx="6"/><text x="360.0" y="128.0" text-anchor="middle" style="font-size:10.5px">Есть QTUN? (подъём-</text><text x="360.0" y="140.0" text-anchor="middle" style="font-size:10.5px">ные моторы активны)</text><path class="ln" d="M360.0 154 L360.0 166.0 L220.0 166.0 L220.0 178" marker-end="url(#ar)"/><text x="224.0" y="162.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="boxa" x="153.0" y="178" width="134.0" height="48" rx="18"/><text x="220.0" y="194.0" text-anchor="middle" class="b" style="font-size:9.5px">Самолёт: RLL_RATE_*,</text><text x="220.0" y="206.0" text-anchor="middle" class="b" style="font-size:9.5px">PTCH_RATE_*, TECS_,</text><text x="220.0" y="218.0" text-anchor="middle" class="b" style="font-size:9.5px">NAVL1_</text><path class="ln" d="M360.0 154 L360.0 166.0 L430.0 166.0 L430.0 178" marker-end="url(#ar)"/><text x="434.0" y="162.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="340.0" y="178" width="180.0" height="48" rx="6"/><text x="430.0" y="200.0" text-anchor="middle" style="font-size:10.5px">Только что сменил</text><text x="430.0" y="212.0" text-anchor="middle" style="font-size:10.5px">Q-режим (MODE)?</text><path class="ln" d="M430.0 226 L430.0 238.0 L360.0 238.0 L360.0 250" marker-end="url(#ar)"/><text x="364.0" y="234.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="293.0" y="250" width="134.0" height="48" rx="18"/><text x="360.0" y="266.0" text-anchor="middle" style="font-size:9.5px">Переход: AIRSPEED_</text><text x="360.0" y="278.0" text-anchor="middle" style="font-size:9.5px">MIN, Q_TRANSITION_MS,</text><text x="360.0" y="290.0" text-anchor="middle" style="font-size:9.5px">Q_TILT_*, рули</text><path class="ln" d="M430.0 226 L430.0 238.0 L500.0 238.0 L500.0 250" marker-end="url(#ar)"/><text x="504.0" y="234.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="433.0" y="250" width="134.0" height="48" rx="18"/><text x="500.0" y="266.0" text-anchor="middle" style="font-size:9.5px">Q-assist: Q_ASSIST_*,</text><text x="500.0" y="278.0" text-anchor="middle" style="font-size:9.5px">ARSPD_RATIO</text><text x="500.0" y="290.0" text-anchor="middle" style="font-size:9.5px">(Trn снова 0, Ast ≠ 0)</text><path class="ln" d="M360.0 82 L360.0 94.0 L640.0 94.0 L640.0 106" marker-end="url(#ar)"/><text x="644.0" y="90.0" text-anchor="start" class="a t" style="font-size:10px">MANUAL</text><rect class="box" x="573.0" y="106" width="134.0" height="48" rx="18"/><text x="640.0" y="122.0" text-anchor="middle" style="font-size:9.5px">Самолёт без</text><text x="640.0" y="134.0" text-anchor="middle" style="font-size:9.5px">страховки: рули,</text><text x="640.0" y="146.0" text-anchor="middle" style="font-size:9.5px">центровка</text><text x="16" y="348.0" text-anchor="start" class="m t">Правка «чужой» половины не помогает: на крейсере подъёмные моторы стоят,</text><text x="16" y="364.0" text-anchor="start" class="m t">а на висении крен держат моторы, не рули. Q-assist в крейсере тоже даёт QTUN.Trn 0 → 1 → 2</text></svg>
