<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Порядок тюнинга PX4: autotune или вручную</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Порядок тюнинга PX4: фильтры — до всего; autotune заменяет ручной rate и attitude P</text><rect class="boxa" x="130.0" y="32.0" width="460.0" height="46.0" rx="6"/><text x="360.0" y="52.5" text-anchor="middle" class="b" style="font-size:10.5px">1. Фильтры по спектру (Flight Review)</text><text x="360.0" y="65.5" text-anchor="middle" style="font-size:10.5px">умолч.: IMU_GYRO_CUTOFF 40 Гц · IMU_DGYRO_CUTOFF 20 Гц · notch</text><path class="ln" d="M360 78 L360 100 L170 100"/><path class="ln" d="M170 100 L170 122" marker-end="url(#ar)"/><path class="ln" d="M360 100 L550 100 L550 122" marker-end="url(#ar)"/><rect class="boxa" x="20.0" y="122.0" width="300.0" height="86.0" rx="6"/><text x="170.0" y="143.0" text-anchor="middle" class="b" style="font-size:10.5px">2а. Autotune — большинство рам</text><text x="170.0" y="156.0" text-anchor="middle" style="font-size:10.5px">MC_AT_EN = 1 + перезагрузка,</text><text x="170.0" y="169.0" text-anchor="middle" style="font-size:10.5px">QGC → PID Tuning → Autotune;</text><text x="170.0" y="182.0" text-anchor="middle" style="font-size:10.5px">пишет MC_*RATE_P/I/D, K = 1</text><text x="170.0" y="195.0" text-anchor="middle" style="font-size:10.5px">и MC_ROLL_P / PITCH_P / YAW_P</text><rect class="box" x="400.0" y="122.0" width="300.0" height="86.0" rx="6"/><text x="550.0" y="143.0" text-anchor="middle" style="font-size:10.5px">2б. Вручную — нестандартная рама,</text><text x="550.0" y="156.0" text-anchor="middle" style="font-size:10.5px">большой аппарат, autotune не справился:</text><text x="550.0" y="169.0" text-anchor="middle" style="font-size:10.5px">rate K → D → I, затем attitude P;</text><text x="550.0" y="182.0" text-anchor="middle" style="font-size:10.5px">перелёт → K↓ или D↑, медленно → K↑,</text><text x="550.0" y="195.0" text-anchor="middle" style="font-size:10.5px">дрейф → I↑</text><path class="ln" d="M550 208 L550 226 L360 226"/><path class="ln" d="M170 208 L170 226 L360 226 L360 244" marker-end="url(#ar)"/><rect class="box" x="160.0" y="244.0" width="400.0" height="44.0" rx="6"/><text x="360.0" y="263.5" text-anchor="middle" style="font-size:10.5px">3. Проверка step response (Flight Review)</text><text x="360.0" y="276.5" text-anchor="middle" style="font-size:10.5px">перелёт ≤ 10 %, D без шума</text><path class="ln" d="M560 266 L670 266 L670 208" marker-end="url(#ar)" style="stroke-dasharray:5 4"/><text x="568" y="244" text-anchor="start" class="m t" style="font-size:10px">если нужно:</text><text x="568" y="258" text-anchor="start" class="m t" style="font-size:10px">K/D ±10–20 %</text><path class="ln" d="M360 288 L360 310" marker-end="url(#ar)"/><rect class="box" x="110.0" y="310.0" width="500.0" height="44.0" rx="6"/><text x="360.0" y="329.5" text-anchor="middle" style="font-size:10.5px">4. Скорость (умолч.): MPC_XY_VEL_P_ACC 1.8 · MPC_Z_VEL_P_ACC 4.0</text><text x="360.0" y="342.5" text-anchor="middle" style="font-size:10.5px">качает в Position — сначала здесь, а не MPC_XY_P</text><path class="ln" d="M360 354 L360 376" marker-end="url(#ar)"/><rect class="box" x="110.0" y="376.0" width="500.0" height="40.0" rx="6"/><text x="360.0" y="400.0" text-anchor="middle" style="font-size:10.5px">5. Позиция (умолч.): MPC_XY_P 0.95 · MPC_Z_P 1.0 (1/с)</text></svg>
