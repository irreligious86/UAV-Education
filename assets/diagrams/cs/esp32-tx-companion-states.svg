<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Состояния компаньона пульта на ESP32</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Компаньон TX16S: радио включается только по явному «disarmed» от пульта</text><rect class="box" x="232.0" y="36.0" width="252.0" height="70.0" rx="6"/><text x="358" y="55" text-anchor="middle" class="b" style="font-size:11px">Lua на пульте (AUX, режим Lua)</text><text x="358" y="73" text-anchor="middle" style="font-size:10.5px">tick() из refresh() и background():</text><text x="358" y="89" text-anchor="middle" class="m t" style="font-size:10.5px">шлёт, даже когда виджет скрыт</text><path class="ln" d="M484 60 L512 60" marker-end="url(#ar)"/><rect class="box" x="514.0" y="36.0" width="196.0" height="70.0" rx="6"/><text x="612" y="54" text-anchor="middle" class="m t" style="font-size:10.5px">каждые 500 мс:</text><text x="612" y="70" text-anchor="middle" style="font-size:10.5px">S,&lt;mode&gt;,&lt;armed&gt;,</text><text x="612" y="85" text-anchor="middle" style="font-size:10.5px">&lt;vbat&gt;,&lt;rssi&gt;\n</text><rect class="boxa" x="20.0" y="140.0" width="230.0" height="110.0" rx="10"/><text x="135.0" y="164" text-anchor="middle" class="a b" style="font-size:14px">FLIGHT</text><text x="135.0" y="186" text-anchor="middle" class="m t" style="font-size:11px">радио выключено:</text><text x="135.0" y="202" text-anchor="middle" style="font-size:11px">WiFi.mode(WIFI_OFF)</text><text x="135.0" y="218" text-anchor="middle" style="font-size:11px">+ esp_wifi_stop()</text><text x="135.0" y="234" text-anchor="middle" style="font-size:11px">настройки недоступны</text><rect class="box" x="470.0" y="140.0" width="230.0" height="110.0" rx="10"/><text x="585.0" y="164" text-anchor="middle" class="b" style="font-size:14px">GROUND</text><text x="585.0" y="186" text-anchor="middle" style="font-size:11px">Wi-Fi AP, веб-настройки</text><text x="585.0" y="202" text-anchor="middle" style="font-size:11px">STAGE: JSON в RAM</text><text x="585.0" y="218" text-anchor="middle" style="font-size:11px">APPLY: запись NVS</text><text x="585.0" y="234" text-anchor="middle" style="font-size:11px">с копией прошлой версии</text><rect x="10" y="124" width="700" height="158" rx="12" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1" stroke-dasharray="5 4"/><path class="ln" d="M612 106 L612 124" marker-end="url(#ar)"/><text x="24" y="272" text-anchor="start" class="m t" style="font-size:10.5px">ESP32-S3 (строки читает в обоих состояниях)</text><circle cx="135.0" cy="86" r="5" fill="var(--gc-accent-hud, #5ef1d2)"/><text x="135.0" y="70" text-anchor="middle" class="a t" style="font-size:10.5px">старт, неопределённость</text><path class="lna" d="M135.0 91 L135.0 140" marker-end="url(#ara)"/><path class="ln" d="M250 174 L470 174" marker-end="url(#ar)"/><text x="360.0" y="166" text-anchor="middle" class="t" style="font-size:10.5px">armed=0 ≥ 3 с подряд</text><path class="lna" d="M470 218 L250 218" marker-end="url(#ara)"/><text x="360.0" y="210" text-anchor="middle" class="a t" style="font-size:10.5px">любое armed=1</text><text x="360.0" y="234" text-anchor="middle" class="a t" style="font-size:10.5px">или нет строк &gt; 2 с</text><line class="lnm" x1="585.0" y1="250" x2="585.0" y2="292"/><rect class="box" x="440.0" y="292.0" width="260.0" height="54.0" rx="6"/><text x="570.0" y="310" text-anchor="middle" style="font-size:10.5px">APPLY — только в GROUND;</text><text x="570.0" y="325" text-anchor="middle" style="font-size:10.5px">Lua блокирует при арме в</text><text x="570.0" y="340" text-anchor="middle" style="font-size:10.5px">телеметрии, прошивка ESP32 тоже</text><text x="16" y="368" text-anchor="start" class="m t">Heartbeat только в refresh() → пилот сменил экран, строки пропали, через 2 с ESP32 ушёл в FLIGHT</text></svg>
