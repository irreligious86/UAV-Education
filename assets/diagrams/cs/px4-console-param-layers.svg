<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">PX4 1.17: откуда берётся значение параметра</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="44" width="164" height="58" rx="6"/><text x="92.0" y="63.0" text-anchor="middle">1. Умолчание прошивки</text><text x="92.0" y="77.0" text-anchor="middle">(вшито при сборке)</text><text x="92.0" y="91.0" text-anchor="middle">RTL_RETURN_ALT = 60</text><rect class="box" x="196" y="44" width="164" height="58" rx="6"/><text x="278.0" y="63.0" text-anchor="middle">2. Умолчание запуска</text><text x="278.0" y="77.0" text-anchor="middle">param set-default:</text><text x="278.0" y="91.0" text-anchor="middle">плата, airframe</text><text x="278.0" y="115" text-anchor="middle" class="m t">rc.mc_defaults: 30</text><rect class="boxa" x="382" y="44" width="150" height="58" rx="6"/><text x="457.0" y="63.0" text-anchor="middle" class="b">3. Сохранённое</text><text x="457.0" y="77.0" text-anchor="middle" class="b">param set, QGC,</text><text x="457.0" y="91.0" text-anchor="middle" class="b">калибровка, драйвер</text><rect class="box" x="556" y="44" width="154" height="58" rx="6"/><text x="633.0" y="63.0" text-anchor="middle">4. param_get()</text><text x="633.0" y="77.0" text-anchor="middle">видит модуль:</text><text x="633.0" y="91.0" text-anchor="middle">RTL_RETURN_ALT = 30</text><rect class="boxa" x="366" y="150" width="182" height="46" rx="6"/><text x="457.0" y="170.0" text-anchor="middle" class="b">BSON: /fs/mtd_params</text><text x="457.0" y="184.0" text-anchor="middle" class="b">parameters_backup.bson</text><rect class="box" x="10" y="144" width="164" height="58" rx="6"/><text x="92.0" y="163.0" text-anchor="middle">Загрузка: param import</text><text x="92.0" y="177.0" text-anchor="middle">→ плата → airframe</text><text x="92.0" y="191.0" text-anchor="middle">→ config.txt → модули</text><rect class="box" x="556" y="144" width="154" height="58" rx="6"/><text x="633.0" y="163.0" text-anchor="middle">reboot_required:</text><text x="633.0" y="177.0" text-anchor="middle">модуль прочитал</text><text x="633.0" y="191.0" text-anchor="middle">значение при старте</text><path class="ln" d="M174 73.0 L196 73.0" marker-end="url(#ar)"/><path class="ln" d="M360 73.0 L382 73.0" marker-end="url(#ar)"/><path class="lna" d="M532 73.0 L556 73.0" marker-end="url(#ara)"/><path class="lna" d="M457.0 102 L457.0 150" marker-end="url(#ara)"/><text x="463.0" y="122.0" text-anchor="middle" class="m t" style="font-size:10px">через 0.3–2 с</text><path class="ln" d="M633.0 102 L633.0 144" marker-end="url(#ar)"/><text x="10" y="30" text-anchor="start" class="m t">Побеждает верхний непустой слой: сохранённое → умолчание запуска → умолчание прошивки.</text><text x="10" y="228" text-anchor="start" class="m t">В файл уходит только то, что отличается от слоя 2. Значение, совпавшее с умолчанием</text><text x="10" y="243" text-anchor="start" class="m t">airframe, не хранится и после обновления прошивки молча получит новое умолчание.</text><text x="10" y="258" text-anchor="start" class="m t">Слой 2 живёт в RAM и собирается заново при каждой загрузке; param reset убирает запись слоя 3.</text></svg>
