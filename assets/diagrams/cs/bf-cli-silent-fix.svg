<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Где значение после set меняется без сообщений</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="16" width="120" height="48" rx="6"/><text x="70.0" y="37.0" text-anchor="middle" style="font-size:10.5px">set → RAM</text><text x="70.0" y="51.0" text-anchor="middle" style="font-size:10.5px">«set to 20»</text><rect class="box" x="150" y="16" width="190" height="48" rx="6"/><text x="245.0" y="37.0" text-anchor="middle">save</text><text x="245.0" y="51.0" text-anchor="middle">(ошибка в batch → отказ)</text><rect class="boxa" x="360" y="16" width="180" height="48" rx="6"/><text x="450.0" y="37.0" text-anchor="middle" class="b">validateAndFixConfig</text><text x="450.0" y="51.0" text-anchor="middle" class="b">① перед записью</text><rect class="box" x="560" y="16" width="150" height="48" rx="6"/><text x="635.0" y="44.0" text-anchor="middle">EEPROM</text><rect class="box" x="560" y="120" width="150" height="48" rx="6"/><text x="635.0" y="141.0" text-anchor="middle">перезагрузка:</text><text x="635.0" y="155.0" text-anchor="middle">save / exit</text><rect class="boxa" x="360" y="120" width="180" height="48" rx="6"/><text x="450.0" y="141.0" text-anchor="middle" class="b">validateAndFixConfig</text><text x="450.0" y="155.0" text-anchor="middle" class="b">② при загрузке</text><rect class="boxa" x="130" y="120" width="190" height="48" rx="6"/><text x="225.0" y="141.0" text-anchor="middle" class="b">get / diff all:</text><text x="225.0" y="155.0" text-anchor="middle" class="b">фактическое значение</text><rect class="box" x="10" y="120" width="104" height="48" rx="6"/><text x="62.0" y="141.0" text-anchor="middle" style="font-size:10.5px">сравнить</text><text x="62.0" y="155.0" text-anchor="middle" style="font-size:10.5px">с записанным</text><path class="ln" d="M130 40.0 L150 40.0" marker-end="url(#ar)"/><path class="ln" d="M340 40.0 L360 40.0" marker-end="url(#ar)"/><path class="ln" d="M540 40.0 L560 40.0" marker-end="url(#ar)"/><path class="ln" d="M635.0 64 L635.0 120" marker-end="url(#ar)"/><path class="ln" d="M560 144.0 L540 144.0" marker-end="url(#ar)"/><path class="ln" d="M360 144.0 L320 144.0" marker-end="url(#ar)"/><path class="lna" d="M130 144.0 L114 144.0" marker-end="url(#ara)"/><text x="10" y="198" text-anchor="start" class="m t">SITL 2025.12.5: d_max_roll = 20 при d_roll = 30 → 0; GPS-RESCUE вне перечня сборки (GPS нет) → DROP.</text><text x="10" y="214" text-anchor="start" class="m t">По config.c: d_min &gt; D → 0 (4.5.3); GPS-RESCUE без feature GPS → DROP; bidir без DShot → OFF.</text><text x="10" y="236" text-anchor="start" class="a t">Правило скрипта: после save перечитать get каждый изменённый ключ; ответ «set to» ничего не гарантирует.</text></svg>
