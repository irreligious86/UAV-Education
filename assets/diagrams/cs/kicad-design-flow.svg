<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 508" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Цикл проектирования платы в KiCad</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Цикл в KiCad: каждая проверка возвращает к шагу, где ошибка сделана</text><rect class="box" x="40.0" y="36.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="52.0" text-anchor="middle" style="font-size:11px">1. Схема: символы, цепи,</text><text x="205.0" y="66.0" text-anchor="middle" style="font-size:11px">номиналы, PWR_FLAG</text><rect class="boxa" x="40.0" y="88.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="111.0" text-anchor="middle" class="b" style="font-size:11px">ERC: ошибок нет?</text><rect class="box" x="40.0" y="140.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="156.0" text-anchor="middle" style="font-size:11px">2. Посадочные места: 0603,</text><text x="205.0" y="170.0" text-anchor="middle" style="font-size:11px">SOT-23-6, MSOP-10, JST-GH</text><rect class="box" x="40.0" y="192.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="208.0" text-anchor="middle" style="font-size:11px">Board Setup: правила фабрики</text><text x="205.0" y="222.0" text-anchor="middle" style="font-size:11px">(до разводки)</text><rect class="box" x="40.0" y="244.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="260.0" text-anchor="middle" style="font-size:11px">3. Разводка: контур, слои, дорожки,</text><text x="205.0" y="274.0" text-anchor="middle" style="font-size:11px">полигоны, Kelvin-пара шунта</text><rect class="boxa" x="40.0" y="296.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="319.0" text-anchor="middle" class="b" style="font-size:11px">4. DRC: ошибок нет?</text><rect class="boxa" x="40.0" y="348.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="371.0" text-anchor="middle" class="b" style="font-size:11px">3D-вид: корпуса и разъёмы встают?</text><rect class="box" x="40.0" y="400.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="416.0" text-anchor="middle" style="font-size:11px">5. Выход: Gerber, сверловка,</text><text x="205.0" y="430.0" text-anchor="middle" style="font-size:11px">BOM, файл позиций</text><rect class="box" x="40.0" y="452.0" width="330.0" height="38.0" rx="6"/><text x="205.0" y="468.0" text-anchor="middle" style="font-size:11px">Gerber Viewer: каждый слой —</text><text x="205.0" y="482.0" text-anchor="middle" style="font-size:11px">контур, маска, шелкография, отверстия</text><path class="lna" d="M205.0 74 L205.0 88" marker-end="url(#ara)"/><path class="lna" d="M205.0 126 L205.0 140" marker-end="url(#ara)"/><text x="211.0" y="137" text-anchor="start" class="a t" style="font-size:10px">да</text><path class="lna" d="M205.0 178 L205.0 192" marker-end="url(#ara)"/><path class="lna" d="M205.0 230 L205.0 244" marker-end="url(#ara)"/><path class="lna" d="M205.0 282 L205.0 296" marker-end="url(#ara)"/><path class="lna" d="M205.0 334 L205.0 348" marker-end="url(#ara)"/><text x="211.0" y="345" text-anchor="start" class="a t" style="font-size:10px">да</text><path class="lna" d="M205.0 386 L205.0 400" marker-end="url(#ara)"/><text x="211.0" y="397" text-anchor="start" class="a t" style="font-size:10px">да</text><path class="lna" d="M205.0 438 L205.0 452" marker-end="url(#ara)"/><rect class="box" x="420.0" y="85.0" width="290.0" height="44.0" rx="6"/><text x="430" y="103.0" text-anchor="start" class="t" style="font-size:10.5px">неподключённый вывод, два выхода</text><text x="430" y="117.0" text-anchor="start" class="t" style="font-size:10.5px">на цепи, нет PWR_FLAG → в схему</text><path class="ln" d="M370 107.0 L420 107.0" marker-end="url(#ar)"/><text x="376" y="102.0" text-anchor="start" class="d t" style="font-size:10px">нет</text><path class="ln" d="M696 85.0 L696 55.0 L370 55.0" marker-end="url(#ar)" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:5 4"/><rect class="box" x="420.0" y="293.0" width="290.0" height="44.0" rx="6"/><text x="430" y="311.0" text-anchor="start" class="t" style="font-size:10.5px">ширина, зазор, отверстие, отступ</text><text x="430" y="325.0" text-anchor="start" class="t" style="font-size:10.5px">от края → в разводку</text><path class="ln" d="M370 315.0 L420 315.0" marker-end="url(#ar)"/><text x="376" y="310.0" text-anchor="start" class="d t" style="font-size:10px">нет</text><path class="ln" d="M696 293.0 L696 263.0 L370 263.0" marker-end="url(#ar)" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:5 4"/><path class="ln" d="M40 367.0 L18 367.0 L18 159.0 L40 159.0" marker-end="url(#ar)" style="stroke:var(--gc-signal-red, #e8636b);stroke-dasharray:5 4"/><text x="420" y="363.0" text-anchor="start" class="d t" style="font-size:10.5px">нет: ошибка посадочного места — самая</text><text x="420" y="377.0" text-anchor="start" class="d t" style="font-size:10.5px">дорогая (плата пришла, микросхема не</text><text x="420" y="391.0" text-anchor="start" class="d t" style="font-size:10.5px">встаёт) → назад к шагу 2, линия слева</text><line x1="370.0" y1="367.0" x2="414.0" y2="367.0" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1" stroke-dasharray="2 3"/><text x="420" y="216" text-anchor="start" class="m t" style="font-size:10.5px">правила загружены → DRC проверяет</text><text x="420" y="230" text-anchor="start" class="m t" style="font-size:10.5px">именно их: дорожка и зазор ~0.127–0.15 мм,</text><text x="420" y="244" text-anchor="start" class="m t" style="font-size:10.5px">отверстия от ~0.3 мм</text><line x1="370.0" y1="211.0" x2="414.0" y2="212.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="0.8"/></svg>
