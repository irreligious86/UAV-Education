<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">AP_DDS: порядок GUIDED → arm → takeoff → cmd_vel → LAND (ArduCopter 4.7)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">AP_DDS: порядок GUIDED → arm → takeoff → cmd_vel → LAND (ArduCopter 4.7)</text><rect class="box" x="20.0" y="26" width="120" height="26" rx="5"/><text x="80.0" y="43" text-anchor="middle" class="b" style="font-size:11px">ROS 2 узел</text><line class="lnm" x1="80.0" y1="52" x2="80.0" y2="368"/><rect class="box" x="410.0" y="26" width="120" height="26" rx="5"/><text x="470.0" y="43" text-anchor="middle" class="b" style="font-size:11px">AP_DDS (Copter)</text><line class="lnm" x1="470.0" y1="52" x2="470.0" y2="368"/><path class="ln" style="stroke-dasharray:5 4" d="M470.0 74 L84.0 74" marker-end="url(#ar)"/><text x="275.0" y="69" text-anchor="middle" class="t" style="font-size:10px">/ap/status, /ap/pose/filtered (ENU)</text><path class="ln" d="M80.0 106 L466.0 106" marker-end="url(#ar)"/><text x="275.0" y="101" text-anchor="middle" class="t" style="font-size:10px">/ap/mode_switch {mode: 4} → GUIDED</text><path class="ln" style="stroke-dasharray:5 4" d="M470.0 138 L84.0 138" marker-end="url(#ar)"/><text x="275.0" y="133" text-anchor="middle" class="t" style="font-size:10px">ответ: status, curr_mode = 4</text><path class="ln" d="M80.0 170 L466.0 170" marker-end="url(#ar)"/><text x="275.0" y="165" text-anchor="middle" class="t" style="font-size:10px">/ap/arm_motors {arm: true}</text><path class="ln" d="M80.0 202 L466.0 202" marker-end="url(#ar)"/><text x="275.0" y="197" text-anchor="middle" class="t" style="font-size:10px">/ap/experimental/takeoff {alt}</text><path class="lna" d="M80.0 234 L466.0 234" marker-end="url(#ara)"/><text x="275.0" y="229" text-anchor="middle" class="a t" style="font-size:10px">/ap/cmd_vel поток, frame_id map (ENU)</text><text x="275.0" y="270" text-anchor="middle" class="w t" style="font-size:10px">— поток cmd_vel прервался —</text><text x="275.0" y="302" text-anchor="middle" class="w t" style="font-size:10px">— GUID_TIMEOUT = 3 с → остановка —</text><path class="ln" d="M80.0 330 L466.0 330" marker-end="url(#ar)"/><text x="275.0" y="325" text-anchor="middle" class="t" style="font-size:10px">/ap/mode_switch {mode: 9} → LAND</text><text x="704" y="78" text-anchor="end" class="m t" style="font-size:10px">BEST_EFFORT; status — RELIABLE</text><text x="704" y="174" text-anchor="end" class="m t" style="font-size:10px">только после pre-arm проверок</text><text x="704" y="206" text-anchor="end" class="m t" style="font-size:10px">иначе на земле уставки игнорируются</text><text x="704" y="238" text-anchor="end" class="m t" style="font-size:10px">base_link — оси корпуса, не мира</text><text x="704" y="302" text-anchor="end" class="m t" style="font-size:10px">тот же принцип, что Offboard у PX4</text></svg>
