<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">DroneCAN DNA: как узел получает номер</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">DNA: номер узла выдаёт полётник и запоминает его за уникальным ID узла</text><rect class="box" x="10.0" y="32.0" width="200.0" height="46.0" rx="6"/><text x="110.0" y="52.5" text-anchor="middle" style="font-size:10.5px">Новый узел без номера</text><text x="110.0" y="65.5" text-anchor="middle" style="font-size:10.5px">(GPS, компас, датчик тока)</text><path class="ln" d="M210 55 L240 55" marker-end="url(#ar)"/><rect class="box" x="240.0" y="32.0" width="200.0" height="46.0" rx="6"/><text x="340.0" y="52.5" text-anchor="middle" style="font-size:10.5px">Просит номер у сервера,</text><text x="340.0" y="65.5" text-anchor="middle" style="font-size:10.5px">шлёт свой уникальный ID</text><path class="ln" d="M440 55 L470 55" marker-end="url(#ar)"/><rect class="boxa" x="470.0" y="26.0" width="240.0" height="58.0" rx="6"/><text x="590.0" y="46.0" text-anchor="middle" class="b" style="font-size:10.5px">DNA-сервер — полётник:</text><text x="590.0" y="59.0" text-anchor="middle" style="font-size:10.5px">этот уникальный ID</text><text x="590.0" y="72.0" text-anchor="middle" style="font-size:10.5px">уже есть в таблице?</text><path class="lnm" d="M484 84 L484 92 L145 92 L145 112"/><text x="151" y="106" text-anchor="start" class="m t" style="font-size:10.5px">кто сервер</text><rect class="box" x="10.0" y="112.0" width="270.0" height="128.0" rx="6"/><text x="20" y="141.0" text-anchor="start" style="font-size:10.5px">ArduPilot — полётник, его номер</text><text x="20" y="154.0" text-anchor="start" style="font-size:10.5px">CAN_D1_UC_NODE = 10 (умолч.);</text><text x="20" y="167.0" text-anchor="start" style="font-size:10.5px">не совпадать с жёстким номером</text><text x="20" y="180.0" text-anchor="start" style="font-size:10.5px">ни одного узла;</text><text x="20" y="193.0" text-anchor="start" style="font-size:10.5px">PX4 — только при UAVCAN_ENABLE</text><text x="20" y="206.0" text-anchor="start" style="font-size:10.5px">2 или 3 (умолч. 0 — шина выключена;</text><text x="20" y="219.0" text-anchor="start" style="font-size:10.5px">1 — номера узлов вручную)</text><path class="ln" d="M590 84 L590 98 L470 98"/><path class="ln" d="M470 98 L470 112" marker-end="url(#ar)"/><path class="ln" d="M590 98 L650 98 L650 112" marker-end="url(#ar)"/><text x="656" y="108" text-anchor="start" class="a t b" style="font-size:10.5px">да</text><text x="476" y="108" text-anchor="start" class="a t b" style="font-size:10.5px">нет</text><rect class="box" x="300.0" y="112.0" width="300.0" height="58.0" rx="6"/><text x="450.0" y="132.0" text-anchor="middle" style="font-size:10.5px">свободный номер 1…125 (126, 127 —</text><text x="450.0" y="145.0" text-anchor="middle" style="font-size:10.5px">для сервисных инструментов),</text><text x="450.0" y="158.0" text-anchor="middle" style="font-size:10.5px">записать «ID → номер»</text><rect class="box" x="610.0" y="112.0" width="100.0" height="58.0" rx="6"/><text x="660.0" y="138.5" text-anchor="middle" style="font-size:10.5px">прежний</text><text x="660.0" y="151.5" text-anchor="middle" style="font-size:10.5px">номер</text><path class="ln" d="M450 170 L450 186 L660 186 L660 170"/><path class="ln" d="M555 186 L555 200" marker-end="url(#ar)"/><rect class="box" x="400.0" y="200.0" width="310.0" height="40.0" rx="6"/><text x="555.0" y="217.5" text-anchor="middle" style="font-size:10.5px">узел работает: NodeStatus</text><text x="555.0" y="230.5" text-anchor="middle" style="font-size:10.5px">(здоровье, режим, время работы)</text><text x="16" y="262" text-anchor="start" class="d t b" style="font-size:10.5px">Где ломается</text><rect class="box" x="10.0" y="274.0" width="220.0" height="72.0" rx="6"/><text x="120.0" y="294.5" text-anchor="middle" style="font-size:10.5px">узлы переставили между</text><text x="120.0" y="307.5" text-anchor="middle" style="font-size:10.5px">аппаратами или скопировали</text><text x="120.0" y="320.5" text-anchor="middle" style="font-size:10.5px">настройки: два узла</text><text x="120.0" y="333.5" text-anchor="middle" style="font-size:10.5px">с одним номером</text><path class="ln" d="M230 310 L252 310" marker-end="url(#ar)"/><rect class="box" x="252.0" y="274.0" width="210.0" height="72.0" rx="6"/><text x="357.0" y="301.0" text-anchor="middle" style="font-size:10.5px">ArduPilot: PreArm</text><text x="357.0" y="314.0" text-anchor="middle" style="font-size:10.5px">«Duplicate Node», арм</text><text x="357.0" y="327.0" text-anchor="middle" style="font-size:10.5px">запрещён; датчик не виден</text><path class="lna" d="M462 310 L484 310" marker-end="url(#ara)"/><rect class="boxa" x="484.0" y="274.0" width="226.0" height="72.0" rx="6"/><text x="597.0" y="288.0" text-anchor="middle" class="b" style="font-size:10.5px">CAN_D1_UC_OPTION бит 0 (1):</text><text x="597.0" y="301.0" text-anchor="middle" style="font-size:10.5px">очистить таблицу при загрузке —</text><text x="597.0" y="314.0" text-anchor="middle" style="font-size:10.5px">«UC DNA database reset»,</text><text x="597.0" y="327.0" text-anchor="middle" style="font-size:10.5px">бит сбросится сам; или</text><text x="597.0" y="340.0" text-anchor="middle" style="font-size:10.5px">жёсткий номер на узле</text></svg>
