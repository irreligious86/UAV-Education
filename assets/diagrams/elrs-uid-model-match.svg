<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ExpressLRS 4.1: что делает фраза привязки и где проверяется Model Match</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="30" width="150" height="58" rx="6"/><text x="85.0" y="56.0" text-anchor="middle" class="b">Binding phrase</text><text x="85.0" y="70.0" text-anchor="middle" class="b">«my-quad-2026»</text><rect class="box" x="200" y="30" width="230" height="58" rx="6"/><text x="315.0" y="49.0" text-anchor="middle">MD5 строки</text><text x="315.0" y="63.0" text-anchor="middle">-DMY_BINDING_PHRASE=</text><text x="315.0" y="77.0" text-anchor="middle">&quot;my-quad-2026&quot;</text><rect class="boxa" x="480" y="30" width="220" height="58" rx="6"/><text x="590.0" y="56.0" text-anchor="middle" class="b">UID = первые 6 байт</text><text x="590.0" y="70.0" text-anchor="middle" class="b">250,147,85,15,155,38</text><rect class="box" x="10" y="140" width="220" height="62" rx="6"/><text x="120.0" y="161.0" text-anchor="middle">Seed прыжков</text><text x="120.0" y="175.0" text-anchor="middle">UID[2..5], UID[5]^4</text><text x="120.0" y="189.0" text-anchor="middle">= 0x550F9B22</text><rect class="box" x="250" y="140" width="220" height="62" rx="6"/><text x="360.0" y="161.0" text-anchor="middle">Начало CRC пакета</text><text x="360.0" y="175.0" text-anchor="middle">(UID[4]&lt;&lt;8|UID[5])^0x400</text><text x="360.0" y="189.0" text-anchor="middle">= 0x9F26</text><rect class="box" x="480" y="140" width="220" height="62" rx="6"/><text x="590.0" y="161.0" text-anchor="middle">UID4, UID5 в SYNC</text><text x="590.0" y="175.0" text-anchor="middle">Model Match On: младшие</text><text x="590.0" y="189.0" text-anchor="middle">6 бит UID5 ^ ~ID модели</text><rect class="boxa" x="480" y="250" width="220" height="62" rx="6"/><text x="590.0" y="271.0" text-anchor="middle" class="b">Приёмник</text><text x="590.0" y="285.0" text-anchor="middle" class="b">UID4 + биты 7–6 → связь;</text><text x="590.0" y="299.0" text-anchor="middle" class="b">биты 5–0 → каналы в FC</text><path class="ln" d="M160 59.0 L200 59.0" marker-end="url(#ar)"/><path class="ln" d="M430 59.0 L480 59.0" marker-end="url(#ar)"/><path class="ln" d="M590.0 88 L590.0 114.0 L120.0 114.0 L120.0 140" marker-end="url(#ar)"/><path class="ln" d="M590.0 88 L590.0 114.0 L360.0 114.0 L360.0 140" marker-end="url(#ar)"/><path class="ln" d="M590.0 88 L590.0 140" marker-end="url(#ar)"/><path class="lna" d="M590.0 202 L590.0 250" marker-end="url(#ara)"/><text x="10" y="236" text-anchor="start" class="m t">Другая фраза → другой порядок прыжков (совпало 7 из 240);</text><text x="10" y="250" text-anchor="start" class="m t">чужой SYNC на общем sync-канале отбрасывается по UID4 и CRC.</text><text x="10" y="272" text-anchor="start" class="w t">UID[0..1] в эфир не идут; шифрования нет:</text><text x="10" y="286" text-anchor="start" class="w t">фраза отделяет линки, но не защищает их.</text><text x="10" y="308" text-anchor="start" class="m t">ID 1, Model Match On: UID5 38 → 24 в SYNC.</text></svg>
