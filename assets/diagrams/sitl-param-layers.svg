<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">SITL: откуда берётся значение параметра</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="12" y="56" width="150" height="58" rx="6"/><text x="87.0" y="75.0" text-anchor="middle">1. Код прошивки</text><text x="87.0" y="89.0" text-anchor="middle">AP_GROUPINFO</text><text x="87.0" y="103.0" text-anchor="middle">RTL_ALT_M = 15</text><rect class="box" x="190" y="56" width="150" height="58" rx="6"/><text x="265.0" y="75.0" text-anchor="middle">2. --defaults</text><text x="265.0" y="89.0" text-anchor="middle">copter.parm,</text><text x="265.0" y="103.0" text-anchor="middle">lab.parm (20)</text><rect class="boxa" x="368" y="56" width="150" height="58" rx="6"/><text x="443.0" y="75.0" text-anchor="middle" class="b">3. eeprom.bin</text><text x="443.0" y="89.0" text-anchor="middle" class="b">сюда пишет</text><text x="443.0" y="103.0" text-anchor="middle" class="b">param set (4)</text><rect class="box" x="546" y="56" width="150" height="58" rx="6"/><text x="621.0" y="75.0" text-anchor="middle">Значение</text><text x="621.0" y="89.0" text-anchor="middle">в прошивке</text><text x="621.0" y="103.0" text-anchor="middle">RTL_ALT_M</text><rect class="box" x="368" y="176" width="150" height="44" rx="6"/><text x="443.0" y="195.0" text-anchor="middle">-w / --wipe</text><text x="443.0" y="209.0" text-anchor="middle">стирает eeprom.bin</text><path class="ln" d="M162 85.0 L190 85.0" marker-end="url(#ar)"/><path class="ln" d="M340 85.0 L368 85.0" marker-end="url(#ar)"/><path class="lna" d="M518 85.0 L546 85.0" marker-end="url(#ara)"/><path class="ln" d="M443.0 176 L443.0 114" marker-end="url(#ar)"/><text x="12" y="30" text-anchor="start" class="m t">Стрелка: слой справа перебивает слой слева.</text><text x="12" y="250" text-anchor="start" class="m t">Правый файл в --defaults перебивает левый; eeprom.bin перебивает все файлы.</text><text x="12" y="266" text-anchor="start" class="m t">Правка .parm «не работает» → в eeprom.bin старое значение: запуск с -w.</text><text x="12" y="282" text-anchor="start" class="m t">Шаг 5: copter.parm + lab.parm с -w → RTL_ALT_M = 20, а не 15.</text></svg>
