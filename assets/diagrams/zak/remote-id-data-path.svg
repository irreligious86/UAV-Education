<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Remote ID: откуда берутся данные трансляции</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="140" height="50" rx="6"/><text x="80.0" y="62.0" text-anchor="middle">Наземка</text><text x="80.0" y="76.0" text-anchor="middle">координаты пилота</text><rect class="boxa" x="200" y="34" width="160" height="62" rx="6"/><text x="280.0" y="55.0" text-anchor="middle" class="b">Автопілот</text><text x="280.0" y="69.0" text-anchor="middle" class="b">ArduPilot / PX4</text><text x="280.0" y="83.0" text-anchor="middle" class="b">позиция, высота</text><rect class="boxa" x="480" y="34" width="190" height="62" rx="6"/><text x="575.0" y="55.0" text-anchor="middle" class="b">Модуль Remote ID</text><text x="575.0" y="69.0" text-anchor="middle" class="b">ArduRemoteID</text><text x="575.0" y="83.0" text-anchor="middle" class="b">(ESP32-S3/C3), Cube ID</text><rect class="box" x="10" y="150" width="150" height="50" rx="6"/><text x="85.0" y="172.0" text-anchor="middle">Отдельный маячок</text><text x="85.0" y="186.0" text-anchor="middle">свой GPS и батарея</text><rect class="box" x="440" y="150" width="270" height="50" rx="6"/><text x="575.0" y="172.0" text-anchor="middle">Широковещание: BT 4 legacy,</text><text x="575.0" y="186.0" text-anchor="middle">BT 5 LR, Wi-Fi NAN/Beacon</text><rect class="box" x="500" y="250" width="150" height="46" rx="6"/><text x="575.0" y="270.0" text-anchor="middle">Смартфон рядом</text><text x="575.0" y="284.0" text-anchor="middle">без интернета</text><path class="ln" d="M150 65.0 L200 65.0" marker-end="url(#ar)"/><text x="175.0" y="58.0" text-anchor="middle" class="m t" style="font-size:10px">SYSTEM</text><path class="lna" d="M360 74.0 L480 74.0" marker-end="url(#ara)"/><text x="420.0" y="67.0" text-anchor="middle" class="m t" style="font-size:10px">BASIC_ID, LOCATION</text><path class="ln" d="M480 74.0 L360 74.0" marker-end="url(#ar)"/><text x="420.0" y="87.0" text-anchor="middle" class="m t" style="font-size:10px">статус → PreArm</text><path class="lna" d="M575.0 96 L575.0 150" marker-end="url(#ara)"/><path class="ln" d="M160 175.0 L440 175.0" marker-end="url(#ar)"/><path class="ln" d="M575.0 200 L575.0 250" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">Remote ID: OPEN_DRONE_ID_* по MAVLink или DroneCAN, трансляция без сервера</text><text x="10" y="236" text-anchor="start" class="m t">Сертифицированная сборка ArduPilot:</text><text x="10" y="252" text-anchor="start" class="m t">без рабочего Remote ID нет арма —</text><text x="10" y="268" text-anchor="start" class="m t">искать в PreArm, а не в моторах</text></svg>
