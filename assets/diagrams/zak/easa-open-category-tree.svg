<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ЕС: Open или Specific (самодельный аппарат — без маркировки класса C)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">ЕС: Open или Specific (самодельный аппарат — без маркировки класса C)</text><rect class="box" x="285.0" y="34" width="150.0" height="46" rx="6"/><text x="360.0" y="55.0" text-anchor="middle" style="font-size:10.5px">BVLOS или над</text><text x="360.0" y="67.0" text-anchor="middle" style="font-size:10.5px">скоплениями людей?</text><path class="ln" d="M360.0 80 L360.0 93.0 L80.0 93.0 L80.0 106" marker-end="url(#ar)"/><text x="84.0" y="89.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="box" x="13.0" y="106" width="134.0" height="46" rx="18"/><text x="80.0" y="127.0" text-anchor="middle" style="font-size:9.5px">Specific:</text><text x="80.0" y="139.0" text-anchor="middle" style="font-size:9.5px">SORA или STS</text><path class="ln" d="M360.0 80 L360.0 93.0 L430.0 93.0 L430.0 106" marker-end="url(#ar)"/><text x="434.0" y="89.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="box" x="355.0" y="106" width="150.0" height="46" rx="6"/><text x="430.0" y="127.0" text-anchor="middle" style="font-size:10.5px">Взлётная масса</text><text x="430.0" y="139.0" text-anchor="middle" style="font-size:10.5px">&lt; 25 кг?</text><path class="ln" d="M430.0 152 L430.0 165.0 L220.0 165.0 L220.0 178" marker-end="url(#ar)"/><text x="224.0" y="161.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="box" x="153.0" y="178" width="134.0" height="46" rx="18"/><text x="220.0" y="205.0" text-anchor="middle" style="font-size:9.5px">Specific</text><path class="ln" d="M430.0 152 L430.0 165.0 L500.0 165.0 L500.0 178" marker-end="url(#ar)"/><text x="504.0" y="161.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="box" x="425.0" y="178" width="150.0" height="46" rx="6"/><text x="500.0" y="199.0" text-anchor="middle" style="font-size:10.5px">Маркировка</text><text x="500.0" y="211.0" text-anchor="middle" style="font-size:10.5px">класса C есть?</text><path class="ln" d="M500.0 224 L500.0 237.0 L360.0 237.0 L360.0 250" marker-end="url(#ar)"/><text x="364.0" y="233.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="box" x="293.0" y="250" width="134.0" height="46" rx="18"/><text x="360.0" y="271.0" text-anchor="middle" style="font-size:9.5px">Open: подкатегория</text><text x="360.0" y="283.0" text-anchor="middle" style="font-size:9.5px">по классу C0–C4</text><path class="ln" d="M500.0 224 L500.0 237.0 L570.0 237.0 L570.0 250" marker-end="url(#ar)"/><text x="574.0" y="233.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="box" x="495.0" y="250" width="150.0" height="46" rx="6"/><text x="570.0" y="271.0" text-anchor="middle" style="font-size:10.5px">&lt; 250 г и</text><text x="570.0" y="283.0" text-anchor="middle" style="font-size:10.5px">&lt; 19 м/с?</text><path class="ln" d="M570.0 296 L570.0 309.0 L500.0 309.0 L500.0 322" marker-end="url(#ar)"/><text x="504.0" y="305.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="boxa" x="433.0" y="322" width="134.0" height="46" rx="18"/><text x="500.0" y="349.0" text-anchor="middle" class="b" style="font-size:9.5px">Open A1</text><path class="ln" d="M570.0 296 L570.0 309.0 L640.0 309.0 L640.0 322" marker-end="url(#ar)"/><text x="644.0" y="305.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="boxa" x="573.0" y="322" width="134.0" height="46" rx="18"/><text x="640.0" y="337.0" text-anchor="middle" class="b" style="font-size:9.5px">Open A3: ≥ 150 м от</text><text x="640.0" y="349.0" text-anchor="middle" class="b" style="font-size:9.5px">зон, вдали от людей;</text><text x="640.0" y="361.0" text-anchor="middle" class="b" style="font-size:9.5px">7&quot; 1.4 кг — здесь</text></svg>
