<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Жизненный цикл Lua-виджета EdgeTX 2.12</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="160" height="50" rx="6"/><text x="90.0" y="62.0" text-anchor="middle">Старт пульта:</text><text x="90.0" y="76.0" text-anchor="middle">/WIDGETS/*/main.lua</text><rect class="box" x="196" y="40" width="160" height="50" rx="6"/><text x="276.0" y="62.0" text-anchor="middle">Регистрация, если</text><text x="276.0" y="76.0" text-anchor="middle">name, create, options</text><rect class="box" x="382" y="40" width="160" height="50" rx="6"/><text x="462.0" y="62.0" text-anchor="middle">Виджет выбран</text><text x="462.0" y="76.0" text-anchor="middle">в зоне экрана</text><rect class="boxa" x="556" y="40" width="160" height="50" rx="6"/><text x="636.0" y="62.0" text-anchor="middle" class="b">create(zone,</text><text x="636.0" y="76.0" text-anchor="middle" class="b">options, path) → w</text><rect class="box" x="556" y="150" width="160" height="50" rx="6"/><text x="636.0" y="172.0" text-anchor="middle">update(w, options):</text><text x="636.0" y="186.0" text-anchor="middle">смена опций / зоны</text><rect class="box" x="382" y="150" width="160" height="50" rx="6"/><text x="462.0" y="172.0" text-anchor="middle">Цикл меню</text><text x="462.0" y="186.0" text-anchor="middle">каждые 50 мс</text><rect class="boxa" x="196" y="150" width="160" height="50" rx="6"/><text x="276.0" y="172.0" text-anchor="middle" class="b">refresh(w, event,</text><text x="276.0" y="186.0" text-anchor="middle" class="b">touchState): рисует</text><rect class="box" x="196" y="260" width="160" height="50" rx="6"/><text x="276.0" y="282.0" text-anchor="middle">background(w):</text><text x="276.0" y="296.0" text-anchor="middle">lcd.* не рисует</text><rect class="box" x="10" y="150" width="160" height="50" rx="6"/><text x="90.0" y="172.0" text-anchor="middle">Ошибка в любой ф-ции</text><text x="90.0" y="186.0" text-anchor="middle">или &gt; ~20 000 инстр.</text><rect class="box" x="10" y="260" width="160" height="50" rx="6"/><text x="90.0" y="282.0" text-anchor="middle">«ERROR in …» в зоне,</text><text x="90.0" y="296.0" text-anchor="middle">до пересоздания</text><path class="ln" d="M170 65.0 L196 65.0" marker-end="url(#ar)"/><path class="ln" d="M356 65.0 L382 65.0" marker-end="url(#ar)"/><path class="ln" d="M542 65.0 L556 65.0" marker-end="url(#ar)"/><path class="ln" d="M636.0 90 L636.0 150" marker-end="url(#ar)"/><path class="ln" d="M556 175.0 L542 175.0" marker-end="url(#ar)"/><path class="lna" d="M382 175.0 L356 175.0" marker-end="url(#ara)"/><path class="ln" d="M462.0 200 L462.0 230.0 L276.0 230.0 L276.0 260" marker-end="url(#ar)"/><path class="ln" d="M196 175.0 L170 175.0" marker-end="url(#ar)"/><path class="ln" d="M90.0 200 L90.0 260" marker-end="url(#ar)"/><text x="10" y="24" text-anchor="start" class="m t">Нет name, create или таблицы options — виджета нет в списке, ошибки тоже нет.</text><text x="369" y="142" text-anchor="middle" class="a t">видна</text><text x="500" y="224" text-anchor="middle" class="m t">не видна</text><text x="556" y="270" text-anchor="start" class="a t">LinkBox: до 393</text><text x="556" y="286" text-anchor="start" class="a t">инструкций main.lua</text><text x="556" y="302" text-anchor="start" class="a t">на вызов, 2 % бюджета</text><text x="628" y="124" text-anchor="end" class="m t">сразу после create —</text><text x="628" y="138" text-anchor="end" class="m t">только с useLvgl</text><text x="10" y="336" text-anchor="start" class="m t">event — число только в полноэкранном режиме, touchState — только при касании.</text></svg>
