<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">PX4 1.18: канал пульта → нормировка → стики, тумблеры, подстройка</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="12" y="60" width="108" height="46" rx="6"/><text x="66.0" y="80.0" text-anchor="middle" style="font-size:10.5px">Приёмник:</text><text x="66.0" y="94.0" text-anchor="middle" style="font-size:10.5px">CRSF, SBUS, PPM</text><rect class="box" x="138" y="60" width="118" height="46" rx="6"/><text x="197.0" y="80.0" text-anchor="middle" style="font-size:10.5px">input_rc</text><text x="197.0" y="94.0" text-anchor="middle" style="font-size:10.5px">мкс, до 18 каналов</text><rect class="boxa" x="276" y="52" width="150" height="62" rx="6"/><text x="351.0" y="73.0" text-anchor="middle" class="b">rc_update</text><text x="351.0" y="87.0" text-anchor="middle" class="b">MIN / TRIM / MAX / REV</text><text x="351.0" y="101.0" text-anchor="middle" class="b">→ −1…+1</text><rect class="box" x="452" y="30" width="256" height="36" rx="6"/><text x="580.0" y="45.0" text-anchor="middle">manual_control_input</text><text x="580.0" y="59.0" text-anchor="middle">стики, flaps, aux1…6</text><rect class="box" x="452" y="78" width="256" height="36" rx="6"/><text x="580.0" y="93.0" text-anchor="middle">manual_control_switches</text><text x="580.0" y="107.0" text-anchor="middle">mode_slot, arm, kill, return…</text><rect class="box" x="100" y="160" width="156" height="46" rx="6"/><text x="178.0" y="180.0" text-anchor="middle">rc_parameter_map</text><text x="178.0" y="194.0" text-anchor="middle">от GCS: PARAM_MAP_RC</text><rect class="box" x="276" y="160" width="150" height="46" rx="6"/><text x="351.0" y="180.0" text-anchor="middle">param_set()</text><text x="351.0" y="194.0" text-anchor="middle">ручки 1…3, ≤ 1 Гц</text><rect class="boxa" x="452" y="160" width="122" height="46" rx="6"/><text x="513.0" y="180.0" text-anchor="middle" class="b" style="font-size:10.5px">manual_control</text><text x="513.0" y="194.0" text-anchor="middle" class="b" style="font-size:10.5px">COM_RC_IN_MODE</text><rect class="box" x="596" y="160" width="112" height="46" rx="6"/><text x="652.0" y="180.0" text-anchor="middle" style="font-size:10.5px">MAVLink:</text><text x="652.0" y="194.0" text-anchor="middle" style="font-size:10.5px">джойстик GCS</text><rect class="box" x="452" y="240" width="122" height="40" rx="6"/><text x="513.0" y="257.0" text-anchor="middle" style="font-size:10.5px">commander</text><text x="513.0" y="271.0" text-anchor="middle" style="font-size:10.5px">режим, арм, kill</text><path class="ln" d="M120 83.0 L138 83.0" marker-end="url(#ar)"/><path class="ln" d="M256 83.0 L276 83.0" marker-end="url(#ar)"/><path class="lna" d="M426 83.0 L439.0 83.0 L439.0 48.0 L452 48.0" marker-end="url(#ara)"/><path class="lna" d="M426 83.0 L439.0 83.0 L439.0 96.0 L452 96.0" marker-end="url(#ara)"/><path class="lna" d="M351.0 114 L351.0 160" marker-end="url(#ara)"/><path class="ln" d="M256 183.0 L276 183.0" marker-end="url(#ar)"/><path class="ln" d="M580.0 114 L580.0 137.0 L513.0 137.0 L513.0 160" marker-end="url(#ar)"/><path class="ln" d="M596 183.0 L574 183.0" marker-end="url(#ar)"/><path class="ln" d="M513.0 206 L513.0 240" marker-end="url(#ar)"/><text x="12" y="300" text-anchor="start" class="m t">Тумблеры и ручки подстройки живут только в rc_update: джойстик MAVLink приходит</text><text x="12" y="315" text-anchor="start" class="m t">в manual_control мимо него — слотов режимов, kill и RC_MAP_PARAMn у джойстика нет.</text><text x="12" y="236" text-anchor="start" class="m t">Привязка ручки к параметру (rc_parameter_map)</text><text x="12" y="251" text-anchor="start" class="m t">хранится в ОЗУ и теряется при перезагрузке.</text></svg>
