<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">HD-видео на Betaflight 4.5: питание, UART и маска порта</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="100" height="44" rx="6"/><text x="60.0" y="59.0" text-anchor="middle" style="font-size:10.5px">АКБ 6S</text><text x="60.0" y="73.0" text-anchor="middle" style="font-size:10.5px">18–25.2 В</text><rect class="boxa" x="160" y="40" width="150" height="44" rx="6"/><text x="235.0" y="59.0" text-anchor="middle" class="b">Полётник F405</text><text x="235.0" y="73.0" text-anchor="middle" class="b">BEC 9–12 В, UART</text><rect class="box" x="160" y="150" width="150" height="44" rx="6"/><text x="235.0" y="169.0" text-anchor="middle">ELRS RX</text><text x="235.0" y="183.0" text-anchor="middle">UART1: serial 0 64</text><rect class="boxa" x="420" y="40" width="150" height="44" rx="6"/><text x="495.0" y="59.0" text-anchor="middle" class="b">Воздушный модуль</text><text x="495.0" y="73.0" text-anchor="middle" class="b">UART4: 131073</text><rect class="box" x="420" y="150" width="150" height="44" rx="6"/><text x="495.0" y="169.0" text-anchor="middle">Камера</text><text x="495.0" y="183.0" text-anchor="middle">MIPI/шлейф</text><rect class="box" x="620" y="40" width="90" height="44" rx="6"/><text x="665.0" y="59.0" text-anchor="middle" style="font-size:10.5px">Очки</text><text x="665.0" y="73.0" text-anchor="middle" style="font-size:10.5px">рисуют OSD</text><path class="ln" d="M110 62.0 L160 62.0" marker-end="url(#ar)"/><text x="135.0" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">VBAT</text><path class="lna" d="M310 71.0 L420 71.0" marker-end="url(#ara)"/><text x="365.0" y="64.0" text-anchor="middle" class="m t" style="font-size:10px">TX→RX 115200</text><path class="lna" d="M420 71.0 L310 71.0" marker-end="url(#ara)"/><text x="365.0" y="84.0" text-anchor="middle" class="m t" style="font-size:10px">RX←TX</text><path class="ln" d="M235.0 150 L235.0 84" marker-end="url(#ar)"/><text x="241.0" y="113.0" text-anchor="middle" class="m t" style="font-size:10px">CRSF</text><path class="ln" d="M495.0 150 L495.0 84" marker-end="url(#ar)"/><path class="ln" d="M570 62.0 L620 62.0" marker-end="url(#ar)"/><text x="595.0" y="55.0" text-anchor="middle" class="m t" style="font-size:10px">5.8 ГГц</text><text x="10" y="222" text-anchor="start" class="m t">Питание: O3, O4 Pro, Vista — VBAT 2S–6S; O4 (не Pro) 3.7–13.2 В, Walksnail Mini 3.1–13 В,</text><text x="10" y="237" text-anchor="start" class="m t">HDZero Race V3 4–12 В — только от BEC. Земля питания и сигнальная земля — обе на полётник.</text><text x="10" y="252" text-anchor="start" class="w t">UART4 = serial 3 131073: MSP (1) + VTX_MSP (131072). Без бита MSP конфиг портов сбрасывается.</text><text x="10" y="267" text-anchor="start" class="m t">DJI HDL/S.Bus (жёлтый) — на S.Bus-пад, только если управление идёт с пульта DJI.</text></svg>
