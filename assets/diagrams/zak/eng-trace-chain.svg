<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Трассировка: от строки FMEA до матрицы</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="64" width="214" height="74" rx="6"/><text x="117.0" y="91.0" text-anchor="middle" class="b">FMEA: прошивка сменила</text><text x="117.0" y="105.0" text-anchor="middle" class="b">имена параметров</text><text x="117.0" y="119.0" text-anchor="middle" class="b">S 9 · O 3 · D 8 = RPN 216</text><rect class="box" x="253" y="64" width="214" height="74" rx="6"/><text x="360.0" y="91.0" text-anchor="middle">Мера: инварианты в CI,</text><text x="360.0" y="105.0" text-anchor="middle">diff параметров</text><text x="360.0" y="119.0" text-anchor="middle">после обновления</text><rect class="box" x="496" y="64" width="214" height="74" rx="6"/><text x="603.0" y="91.0" text-anchor="middle">Требование R-PRC-02:</text><text x="603.0" y="105.0" text-anchor="middle">ID, критерий, метод,</text><text x="603.0" y="119.0" text-anchor="middle">источник, владелец</text><rect class="box" x="496" y="200" width="214" height="74" rx="6"/><text x="603.0" y="227.0" text-anchor="middle">Тест: check_params.py</text><text x="603.0" y="241.0" text-anchor="middle">(метод: анализ</text><text x="603.0" y="255.0" text-anchor="middle">конфига в CI)</text><rect class="box" x="253" y="200" width="214" height="74" rx="6"/><text x="360.0" y="227.0" text-anchor="middle">Запись теста: дата,</text><text x="360.0" y="241.0" text-anchor="middle">тег конфига, лог,</text><text x="360.0" y="255.0" text-anchor="middle">вердикт</text><rect class="boxa" x="10" y="200" width="214" height="74" rx="6"/><text x="117.0" y="227.0" text-anchor="middle" class="b">Матрица трассировки:</text><text x="117.0" y="241.0" text-anchor="middle" class="b">требование ↔ тест</text><text x="117.0" y="255.0" text-anchor="middle" class="b">↔ результат</text><path class="ln" d="M224 101.0 L253 101.0" marker-end="url(#ar)"/><path class="ln" d="M467 101.0 L496 101.0" marker-end="url(#ar)"/><path class="ln" d="M603.0 138 L603.0 200" marker-end="url(#ar)"/><path class="ln" d="M496 237.0 L467 237.0" marker-end="url(#ar)"/><path class="ln" d="M253 237.0 L224 237.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">Строка FMEA превращается в требование, тест и запись — цепочку можно пройти в обе стороны</text><text x="127.0" y="164" text-anchor="start" class="w t">результат теста → RPN</text><text x="127.0" y="178" text-anchor="start" class="w t">пересчитать после меры</text><text x="10" y="292" text-anchor="start" class="m t">пустая клетка — требование не закрыто;</text><text x="10" y="306" text-anchor="start" class="m t">тест без требования — лишний</text><text x="10" y="320" text-anchor="start" class="m t">или требование забыто</text><text x="48" y="50" text-anchor="start" class="m t">инцидент → разбор → новая строка FMEA или обновлённая мера</text><path class="ln" d="M360.0 200 L360.0 188 L117.0 188 L117.0 138" marker-end="url(#ar)" style="stroke:var(--gc-signal-amber, #f0b24c);stroke-dasharray:5 4"/><path class="ln" d="M36 32 L36 64" marker-end="url(#ar)"/></svg>
