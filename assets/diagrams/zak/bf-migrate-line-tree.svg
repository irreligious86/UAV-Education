<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Строка старого diff all (4.5.3) после перехода на 2025.12</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Строка старого diff all (4.5.3) после перехода на 2025.12</text><rect class="box" x="292.0" y="34" width="136.0" height="60" rx="6"/><text x="360.0" y="62.0" text-anchor="middle" style="font-size:9.5px">Плата есть в списке</text><text x="360.0" y="74.0" text-anchor="middle" style="font-size:9.5px">target 2025.12?</text><path class="ln" d="M360.0 94 L360.0 106.0 L80.0 106.0 L80.0 118" marker-end="url(#ar)"/><text x="84.0" y="102.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="box" x="13.0" y="118" width="134.0" height="60" rx="18"/><text x="80.0" y="140.0" text-anchor="middle" style="font-size:9.5px">Остаться на 4.5.x:</text><text x="80.0" y="152.0" text-anchor="middle" style="font-size:9.5px">чужой target —</text><text x="80.0" y="164.0" text-anchor="middle" style="font-size:9.5px">неверные resource</text><path class="ln" d="M360.0 94 L360.0 106.0 L430.0 106.0 L430.0 118" marker-end="url(#ar)"/><text x="434.0" y="102.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="box" x="362.0" y="118" width="136.0" height="60" rx="6"/><text x="430.0" y="146.0" text-anchor="middle" style="font-size:9.5px">Имя параметра</text><text x="430.0" y="158.0" text-anchor="middle" style="font-size:9.5px">есть в 2025.12?</text><path class="ln" d="M430.0 178 L430.0 190.0 L290.0 190.0 L290.0 202" marker-end="url(#ar)"/><text x="294.0" y="186.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="box" x="222.0" y="202" width="136.0" height="60" rx="6"/><text x="290.0" y="224.0" text-anchor="middle" style="font-size:9.5px">По таблице:</text><text x="290.0" y="236.0" text-anchor="middle" style="font-size:9.5px">переименован</text><text x="290.0" y="248.0" text-anchor="middle" style="font-size:9.5px">или удалён?</text><path class="ln" d="M290.0 262 L290.0 274.0 L220.0 274.0 L220.0 286" marker-end="url(#ar)"/><text x="224.0" y="270.0" text-anchor="start" class="a t" style="font-size:10px">переим.</text><rect class="boxa" x="153.0" y="286" width="134.0" height="60" rx="18"/><text x="220.0" y="302.0" text-anchor="middle" class="b" style="font-size:9.5px">Новое имя; значение</text><text x="220.0" y="314.0" text-anchor="middle" class="b" style="font-size:9.5px">сверить по таблице:</text><text x="220.0" y="326.0" text-anchor="middle" class="b" style="font-size:9.5px">failsafe_off_delay</text><text x="220.0" y="338.0" text-anchor="middle" class="b" style="font-size:9.5px">÷ 10</text><path class="ln" d="M290.0 262 L290.0 274.0 L360.0 274.0 L360.0 286" marker-end="url(#ar)"/><text x="364.0" y="270.0" text-anchor=