="middle" style="font-size:9.5px">vbat_*, rxrange</text><text x="16" y="396.0" text-anchor="start" class="m t">Опасна правая ветка: строка с прежним именем принимается молча, но даёт другой тюн или другие сигналы</text><text x="16" y="412.0" text-anchor="start" class="m t">Не переносятся и под новым именем (п. 6): D-составляющая PID и газ GPS Rescue — задать заново</text></svg>
