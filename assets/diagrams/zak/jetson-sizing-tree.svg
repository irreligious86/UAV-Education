<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" width="100%" role="img" aria-labelledby="t" style="max-width:760px;display:block;margin:0 auto"><title id="t">Какой companion: Pi 5, Jetson Nano или Orin Nano</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Какой companion: Pi 5, Jetson Nano или Orin Nano</text><rect class="box" x="298.0" y="34" width="164.0" height="40" rx="6"/><text x="380.0" y="52.0" text-anchor="middle" style="font-size:10.5px">Что считаем</text><text x="380.0" y="64.0" text-anchor="middle" style="font-size:10.5px">на борту?</text><path class="ln" d="M380.0 74 L380.0 89.0 L102.5 89.0 L102.5 104" marker-end="url(#ar)"/><text x="106.5" y="85.0" text-anchor="start" class="a t" style="font-size:10px">MAVLink + логика</text><rect class="boxa" x="20.5" y="104" width="164.0" height="40" rx="18"/><text x="102.5" y="122.0" text-anchor="middle" class="b" style="font-size:10.5px">Pi 5: 5 В 5 А,</text><text x="102.5" y="134.0" text-anchor="middle" class="b" style="font-size:10.5px">CPU-детектор ≤ 15 к/с</text><path class="ln" d="M380.0 74 L380.0 89.0 L287.5 89.0 L287.5 104" marker-end="url(#ar)"/><text x="291.5" y="85.0" text-anchor="start" class="a t" style="font-size:10px">1 сеть, 20 к/с</text><rect class="box" x="205.5" y="104" width="164.0" height="40" rx="18"/><text x="287.5" y="122.0" text-anchor="middle" style="font-size:10.5px">Jetson Nano: 10 Вт,</text><text x="287.5" y="134.0" text-anchor="middle" style="font-size:10.5px">JP4 EOL, NVENC есть</text><path class="ln" d="M380.0 74 L380.0 89.0 L472.5 89.0 L472.5 104" marker-end="url(#ar)"/><text x="476.5" y="85.0" text-anchor="start" class="a t" style="font-size:10px">детектор + трекер</text><rect class="boxa" x="390.5" y="104" width="164.0" height="40" rx="18"/><text x="472.5" y="122.0" text-anchor="middle" class="b" style="font-size:10.5px">Orin Nano: 7–25 Вт,</text><text x="472.5" y="134.0" text-anchor="middle" class="b" style="font-size:10.5px">TRT INT8, без NVENC</text><path class="ln" d="M380.0 74 L380.0 89.0 L657.5 89.0 L657.5 104" marker-end="url(#ar)"/><text x="661.5" y="85.0" text-anchor="start" class="a t" style="font-size:10px">SLAM, 2+ сети</text><rect class="box" x="575.5" y="104" width="164.0" height="40" rx="18"/><text x="657.5" y="122.0" text-anchor="middle" style="font-size:10.5px">Orin NX / AGX:</text><text x="657.5" y="134.0" text-anchor="middle" style="font-size:10.5px">RAM 16 ГБ+, DLA</text></svg>
