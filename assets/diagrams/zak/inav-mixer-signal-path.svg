<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Путь сигнала: PID → mmix / smix → таймеры → выходы S</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="150" height="48" rx="6"/><text x="85.0" y="61.0" text-anchor="middle" class="b">PID: axisPID</text><text x="85.0" y="75.0" text-anchor="middle" class="b">крен/танг./рыск. ±500</text><rect class="box" x="10" y="112" width="150" height="48" rx="6"/><text x="85.0" y="133.0" text-anchor="middle">Газ</text><text x="85.0" y="147.0" text-anchor="middle">1000…2000</text><rect class="box" x="10" y="204" width="150" height="48" rx="6"/><text x="85.0" y="225.0" text-anchor="middle">RC, GVAR, MAX, flaps,</text><text x="85.0" y="239.0" text-anchor="middle">CAMSTAB, вход 38</text><rect class="boxa" x="196" y="76" width="150" height="48" rx="6"/><text x="271.0" y="97.0" text-anchor="middle" class="b">mmix: до 12 строк</text><text x="271.0" y="111.0" text-anchor="middle" class="b">throttle R P Y</text><rect class="boxa" x="196" y="204" width="150" height="48" rx="6"/><text x="271.0" y="225.0" text-anchor="middle" class="b">smix: до 36 правил</text><text x="271.0" y="239.0" text-anchor="middle" class="b">вход×вес, speed, lc</text><rect class="box" x="382" y="76" width="150" height="48" rx="6"/><text x="457.0" y="97.0" text-anchor="middle">Ограничение</text><text x="457.0" y="111.0" text-anchor="middle">idle 1080…2000</text><rect class="box" x="382" y="176" width="150" height="48" rx="6"/><text x="457.0" y="197.0" text-anchor="middle">servo: rate,</text><text x="457.0" y="211.0" text-anchor="middle">min / mid / max</text><rect class="box" x="382" y="248" width="150" height="48" rx="6"/><text x="457.0" y="269.0" text-anchor="middle">servo_lpf_hz</text><text x="457.0" y="283.0" text-anchor="middle">20 Гц</text><rect class="box" x="560" y="76" width="150" height="48" rx="6"/><text x="635.0" y="97.0" text-anchor="middle">Таймеры MOTORS</text><text x="635.0" y="111.0" text-anchor="middle">DShot / OneShot</text><rect class="box" x="560" y="212" width="150" height="48" rx="6"/><text x="635.0" y="233.0" text-anchor="middle">Таймеры SERVOS</text><text x="635.0" y="247.0" text-anchor="middle">servo_pwm_rate 50 Гц</text><path class="lna" d="M160 64.0 L178.0 64.0 L178.0 100.0 L196 100.0" marker-end="url(#ara)"/><path class="ln" d="M160 136.0 L178.0 136.0 L178.0 100.0 L196 100.0" marker-end="url(#ar)"/><path class="ln" d="M160 64.0 L178.0 64.0 L178.0 228.0 L196 228.0" marker-end="url(#ar)"/><path class="ln" d="M160 228.0 L196 228.0" marker-end="url(#ar)"/><path class="lna" d="M346 100.0 L382 100.0" marker-end="url(#ara)"/><path class="ln" d="M346 228.0 L364.0 228.0 L364.0 200.0 L382 200.0" marker-end="url(#ar)"/><text x="364.0" y="194.0" text-anchor="middle" class="m t" style="font-size:10px">сумма</text><p