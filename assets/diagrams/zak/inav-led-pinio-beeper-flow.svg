<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" width="100%" role="img" aria-labelledby="t" style="max-width:740px;display:block;margin:0 auto"><title id="t">INAV 9.1: что управляет лентой, PINIO и пищалкой</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="310" height="44" rx="6"/><text x="165.0" y="59.0" text-anchor="middle">Тумблер AUX</text><text x="165.0" y="73.0" text-anchor="middle">строка aux, шаг 25</text><rect class="box" x="350" y="40" width="190" height="44" rx="6"/><text x="445.0" y="59.0" text-anchor="middle">Миссия: p3 точки, user action 1–4</text><text x="445.0" y="73.0" text-anchor="middle">операнды логики 6–13</text><rect class="boxa" x="580" y="40" width="150" height="44" rx="6"/><text x="655.0" y="59.0" text-anchor="middle" class="b">Логическое условие</text><text x="655.0" y="73.0" text-anchor="middle" class="b">10 Гц, не в CLI</text><rect class="box" x="10" y="150" width="140" height="44" rx="6"/><text x="80.0" y="169.0" text-anchor="middle">BEEPER 13</text><text x="80.0" y="183.0" text-anchor="middle">BEEPER MUTE 60</text><rect class="boxa" x="180" y="150" width="140" height="44" rx="6"/><text x="250.0" y="169.0" text-anchor="middle" class="b">Режим USER1–4</text><text x="250.0" y="183.0" text-anchor="middle" class="b">id 47, 48, 57, 58</text><rect class="box" x="370" y="150" width="170" height="44" rx="6"/><text x="455.0" y="169.0" text-anchor="middle">Оп. 38: подмена канала</text><text x="455.0" y="183.0" text-anchor="middle">с диапазоном USER</text><rect class="box" x="580" y="150" width="150" height="44" rx="6"/><text x="655.0" y="169.0" text-anchor="middle">Оп. 52: LED Pin PWM</text><text x="655.0" y="183.0" text-anchor="middle">0…100 %, иначе стоп</text><rect class="boxa" x="10" y="260" width="150" height="44" rx="6"/><text x="85.0" y="279.0" text-anchor="middle" class="b">Пищалка; моторы DShot</text><text x="85.0" y="293.0" text-anchor="middle" class="b">только в дизарме</text><rect class="boxa" x="180" y="260" width="140" height="44" rx="6"/><text x="250.0" y="279.0" text-anchor="middle" class="b">PINIO 1–4</text><text x="250.0" y="293.0" text-anchor="middle" class="b">pinio_box1..4</text><rect class="boxa" x="480" y="260" width="250" height="44" rx="6"/><text x="605.0" y="279.0" text-anchor="middle" class="b">Пин LED: лента WS2812</text><text x="605.0" y="293.0" text-anchor="middle" class="b">или ШИМ 24 кГц</text><rect class="box" x="10" y="360" width="720" height="44" rx="6"/><text x="370.0" y="379.0" text-anchor="middle">События прошивки: арм, батарея, GPS, failsafe, стики</text><text x="370.0" y="393.0" text-anchor="middle">24 условия пищалки и функции ленты; LEDS OFF (15) гасит ленту</text><path class="ln" d="M165.0 84 L165.0 117.0 L80.0 117.0 L80.0 150" marker-end="url(#ar)"/><path class="lna" d="M165.0 84 L165.0 117.0 L250.0 117.0 L250.0 150" marker-end="url(#ara)"/><path class="ln" d="M540 62.0 L580 62.0" marker-end="url(#ar)"/><path class="ln" d="M655.0 84 L655.0 117.0 L455.0 117.0 L455.0 150" marker-end="url(#ar)"/><path class="lna" d="M655.0 84 L655.0 150" marker-end="url(#ara)"/><path class="ln" d="M370 172.0 L320 172.0" marker-end="url(#ar)"/><path class="lna" d="M80.0 194 L80.0 227.0 L85.0 227.0 L85.0 260" marker-end="url(#ara)"/><path class="lna" d="M250.0 194 L250.0 260" marker-end="url(#ara)"/><path class="lna" d="M655.0 194 L655.0 227.0 L605.0 227.0 L605.0 260" marker-end="url(#ara)"/><path class="ln" d="M370.0 360 L370.0 332.0 L85.0 332.0 L85.0 304" marker-end="url(#ar)"/><path class="ln" d="M370.0 360 L370.0 332.0 L605.0 332.0 L605.0 304" marker-end="url(#ar)"/><text x="10" y="430" text-anchor="start" class="w t">User action миссии сам ничего не включает: это операнд для логики.</text><text x="10" y="446" text-anchor="start" class="m t">Прямой операции «логика → PINIO» нет: только подмена канала с диапазоном USER.</text></svg>
