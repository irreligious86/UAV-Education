<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">PX4: какой командой отвечать на вопрос</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="40" width="150" height="40" rx="6"/><text x="85.0" y="64.0" text-anchor="middle" class="b">Датчик виден?</text><rect class="box" x="200" y="40" width="232" height="40" rx="6"/><text x="316.0" y="57.0" text-anchor="middle">listener &lt;топик&gt;</text><text x="316.0" y="71.0" text-anchor="middle">&lt;драйвер&gt; status · dmesg</text><rect class="box" x="472" y="40" width="238" height="40" rx="6"/><text x="591.0" y="57.0" text-anchor="middle">never published /</text><text x="591.0" y="71.0" text-anchor="middle">N instances, not running</text><rect class="boxa" x="10" y="92" width="150" height="40" rx="6"/><text x="85.0" y="116.0" text-anchor="middle" class="b">Почему нет арма?</text><rect class="box" x="200" y="92" width="232" height="40" rx="6"/><text x="316.0" y="109.0" text-anchor="middle">commander check</text><text x="316.0" y="123.0" text-anchor="middle">dmesg · QGC Arming checks</text><rect class="box" x="472" y="92" width="238" height="40" rx="6"/><text x="591.0" y="109.0" text-anchor="middle">Preflight check: FAILED</text><text x="591.0" y="123.0" text-anchor="middle">строки Preflight Fail: …</text><rect class="boxa" x="10" y="144" width="150" height="40" rx="6"/><text x="85.0" y="168.0" text-anchor="middle" class="b">Драйвер запущен?</text><rect class="box" x="200" y="144" width="232" height="40" rx="6"/><text x="316.0" y="161.0" text-anchor="middle">&lt;модуль&gt; status</text><text x="316.0" y="175.0" text-anchor="middle">work_queue status</text><rect class="box" x="472" y="144" width="238" height="40" rx="6"/><text x="591.0" y="161.0" text-anchor="middle">not running /</text><text x="591.0" y="175.0" text-anchor="middle">строка с частотой, Гц</text><rect class="boxa" x="10" y="196" width="150" height="40" rx="6"/><text x="85.0" y="213.0" text-anchor="middle" class="b">Что изменено</text><text x="85.0" y="227.0" text-anchor="middle" class="b">в параметрах?</text><rect class="box" x="200" y="196" width="232" height="40" rx="6"/><text x="316.0" y="213.0" text-anchor="middle">param show -c</text><text x="316.0" y="227.0" text-anchor="middle">param show-for-airframe</text><rect class="box" x="472" y="196" width="238" height="40" rx="6"/><text x="591.0" y="213.0" text-anchor="middle">метки + и *,</text><text x="591.0" y="227.0" text-anchor="middle">строки param set-default</text><rect class="boxa" x="10" y="248" width="150" height="40" rx="6"/><text x="85.0" y="272.0" text-anchor="middle" class="b">CPU перегружен?</text><rect class="box" x="200" y="248" width="232" height="40" rx="6"/><text x="316.0" y="265.0" text-anchor="middle">top once</text><text x="316.0" y="279.0" text-anchor="middle">listener cpuload</text><rect class="box" x="472" y="248" width="238" height="40" rx="6"/><text x="591.0" y="265.0" text-anchor="middle">CPU usage: … % idle</text><text x="591.0" y="279.0" text-anchor="middle">load против COM_CPU_MAX</text><path class="ln" d="M160 60.0 L200 60.0" marker-end="url(#ar)"/><path class="ln" d="M432 60.0 L472 60.0" marker-end="url(#ar)"/><path class="ln" d="M160 112.0 L200 112.0" marker-end="url(#ar)"/><path class="ln" d="M432 112.0 L472 112.0" marker-end="url(#ar)"/><path class="ln" d="M160 164.0 L200 164.0" marker-end="url(#ar)"/><path class="ln" d="M432 164.0 L472 164.0" marker-end="url(#ar)"/><path class="ln" d="M160 216.0 L200 216.0" marker-end="url(#ar)"/><path class="ln" d="M432 216.0 L472 216.0" marker-end="url(#ar)"/><path class="ln" d="M160 268.0 L200 268.0" marker-end="url(#ar)"/><path class="ln" d="M432 268.0 L472 268.0" marker-end="url(#ar)"/><text x="10" y="30" text-anchor="start" class="m t">Вопрос</text><text x="200" y="30" text-anchor="start" class="m t">Команда (первая — основная)</text><text x="472" y="30" text-anchor="start" class="m t">Куда смотреть в выводе</text><text x="10" y="312" text-anchor="start" class="m t">Эти команды только читают. Меняют состояние param set, commander arm, actuator_test, reboot:</text><text x="10" y="327" text-anchor="start" class="m t">их набирают без пропеллеров и не в полёте. В SITL (pxh) нет top, dmesg и reboot.</text></svg>
