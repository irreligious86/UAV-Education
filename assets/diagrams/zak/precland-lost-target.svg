<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Точная посадка: потеря цели на разной высоте</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="130" width="124" height="74" rx="6"/><text x="72.0" y="150.0" text-anchor="middle" class="b" style="font-size:10.5px">Цель пропала</text><text x="72.0" y="164.0" text-anchor="middle" class="b" style="font-size:10.5px">при посадке.</text><text x="72.0" y="178.0" text-anchor="middle" class="b" style="font-size:10.5px">Высота по</text><text x="72.0" y="192.0" text-anchor="middle" class="b" style="font-size:10.5px">дальномеру?</text><rect class="box" x="156" y="36" width="140" height="44" rx="6"/><text x="226.0" y="55.0" text-anchor="middle">выше</text><text x="226.0" y="69.0" text-anchor="middle">PLND_ALT_MAX</text><rect class="box" x="156" y="145" width="140" height="44" rx="6"/><text x="226.0" y="164.0" text-anchor="middle">между ALT_MIN</text><text x="226.0" y="178.0" text-anchor="middle">и ALT_MAX</text><rect class="box" x="156" y="276" width="140" height="44" rx="6"/><text x="226.0" y="295.0" text-anchor="middle">ниже</text><text x="226.0" y="309.0" text-anchor="middle">PLND_ALT_MIN</text><rect class="box" x="318" y="36" width="392" height="44" rx="6"/><text x="514.0" y="62.0" text-anchor="middle">отсутствие цели ещё не считается проблемой</text><rect class="boxa" x="318" y="145" width="104" height="44" rx="6"/><text x="370.0" y="171.0" text-anchor="middle" class="b" style="font-size:10.5px">PLND_STRICT?</text><rect class="box" x="440" y="92" width="270" height="36" rx="6"/><text x="575.0" y="114.0" text-anchor="middle">0: сразу садится вертикально</text><rect class="boxa" x="440" y="138" width="270" height="58" rx="6"/><text x="575.0" y="157.0" text-anchor="middle" class="b">1 (по умолчанию): снижение ещё</text><text x="575.0" y="171.0" text-anchor="middle" class="b">PLND_TIMEOUT с → повторный заход;</text><text x="575.0" y="185.0" text-anchor="middle" class="b">цели нет — висит 7 с и садится</text><rect class="box" x="440" y="206" width="270" height="44" rx="6"/><text x="575.0" y="225.0" text-anchor="middle">2: тот же повторный заход;</text><text x="575.0" y="239.0" text-anchor="middle">цели нет — висит, не садится</text><rect class="box" x="318" y="276" width="392" height="44" rx="6"/><text x="514.0" y="295.0" text-anchor="middle">посадка продолжается без цели: у земли</text><text x="514.0" y="309.0" text-anchor="middle">камера не видит маркер целиком</text><path class="ln" d="M134 167.0 L145.0 167.0 L145.0 58.0 L156 58.0" marker-end="url(#ar)"/><path class="ln" d="M134 167.0 L156 167.0" marker-end="url(#ar)"/><path class="ln" d="M134 167.0 L145.0 167.0 L145.0 298.0 L156 298.0" marker-end="url(#ar)"/><path class="ln" d="M296 58.0 L318 58.0" marker-end="url(#ar)"/><path class="lna" d="M296 167.0 L318 167.0" marker-end="url(#ara)"/><path class="ln" d="M296 298.0 L318 298.0" marker-end="url(#ar)"/><path class="ln" d="M422 167.0 L431.0 167.0 L431.0 110.0 L440 110.0" marker-end="url(#ar)"/><path class="lna" d="M422 167.0 L440 167.0" marker-end="url(#ara)"/><path class="ln" d="M422 167.0 L431.0 167.0 L431.0 228.0 L440 228.0" marker-end="url(#ar)"/><text x="10" y="20" text-anchor="start" class="m t">ArduPilot PLND: что делает аппарат без цели — решает высота (дальномер обязателен)</text><text x="10" y="342" text-anchor="start" class="m t">Повторных заходов за режим — не больше PLND_RET_MAX</text><text x="10" y="358" text-anchor="start" class="m t">PX4 — та же логика у земли: ниже PLD_FAPPR_ALT снижение продолжается и при потере цели</text></svg>
