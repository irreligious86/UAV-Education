<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Остановка скрипта offboard: таймауты автопилота</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Скрипт offboard убит (kill -9) в 0 с: кто и когда реагирует — умолчания параметров</text><text x="140" y="78" text-anchor="end" class="b" style="font-size:11.5px">уставки скрипта</text><text x="140" y="134" text-anchor="end" class="b" style="font-size:11.5px">PX4</text><text x="140" y="190" text-anchor="end" class="b" style="font-size:11.5px">ArduPilot</text><line x1="150.0" y1="64" x2="150.0" y2="86" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.4"/><line x1="159.2" y1="64" x2="159.2" y2="86" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.4"/><line x1="168.3" y1="64" x2="168.3" y2="86" strok