y="46" text-anchor="end" class="d t b" style="font-size:10.5px">kill -9</text><line x1="333.3" y1="50" x2="333.3" y2="224" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="333.33333333333337" y="46" text-anchor="middle" class="a t b" style="font-size:10.5px">COM_OF_LOSS_T = 1 с</text><line x1="516.7" y1="50" x2="516.7" y2="224" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="516.6666666666667" y="46" text-anchor="middle" class="a t b" style="font-size:10.5px">GUID_TIMEOUT = 3 с</text><line class="ln" x1="150.0" y1="232" x2="700.0" y2="232"/><line class="ln" x1="150.0" y1="228" x2="150.0" y2="236"/><text x="150.0" y="250" text-anchor="middle" class="m t" style="font-size:11px">-1</text><line class="ln" x1="241.7" y1="228" x2="241.7" y2="236"/><text x="241.66666666666669" y="250" text-anchor="middle" class="m t" style="font-size:11px">0</text><line class="ln" x1="333.3" y1="228" x2="333.3" y2="236"/><text x="333.33333333333337" y="250" text-anchor="middle" class="m t" style="font-size:11px">1</text><line class="ln" x1="425.0" y1="228" x2="425.0" y2="236"/><text x="425.0" y="250" text-anchor="middle" class="m t" style="font-size:11px">2</text><line class="ln" x1="516.7" y1="228" x2="516.7" y2="236"/><text x="516.6666666666667" y="250" text-anchor="middle" class="m t" style="font-size:11px">3</text><line class="ln" x1="608.3" y1="228" x2="608.3" y2="236"/><text x="608.3333333333333" y="250" text-anchor="middle" class="m t" style="font-size:11px">4</text><line class="ln" x1="700.0" y1="228" x2="700.0" y2="236"/><text x="700.0" y="250" text-anchor="middle" class="m t" style="font-size:11px">5</text><text x="425.0" y="266" text-anchor="middle" class="m t" style="font-size:11px">время после остановки скрипта, с</text><text x="16" y="292" text-anchor="start" class="m t">Безопасность — на автопилоте; перезапущенный скрипт заново шлёт уставки и входит в Offboard.</text><text x="16" y="308" text-anchor="start" class="m t">Практика, шаг 3: время смены режима по логу сравнить с этими параметрами.</text></svg>
