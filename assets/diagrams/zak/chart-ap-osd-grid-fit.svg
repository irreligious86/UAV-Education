<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Сетки OSD ArduPilot 4.7 и элементы примера</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="60" y="20" text-anchor="start" class="b" style="font-size:13px">Сетки OSDn_TXT_RES в одном масштабе и элементы шага 2 (раскладка под 60×22)</text><rect x="60" y="44" width="600" height="264" fill="none" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="656" y="303" text-anchor="end" class="m t">TXT_RES 2: 60×22</text><rect x="60" y="44" width="500" height="216" fill="none" stroke="var(--gc-accent-hud, #5ef1d2)" stroke-width="1.4"/><text x="556" y="116" text-anchor="end" class="a t">TXT_RES 1: 50×18</text><rect x="60" y="44" width="300" height="192" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="356" y="58" text-anchor="end" class="t">TXT_RES 0: 30×16</text><text x="60" y="38" text-anchor="middle" class="m t">0</text><text x="160" y="38" text-anchor="middle" class="m t">10</text><text x="260" y="38" text-anchor="middle" class="m t">20</text><text x="360" y="38" text-anchor="middle" class="m t">30</text><text x="460" y="38" text-anchor="middle" class="m t">40</text><text x="560" y="38" text-anchor="middle" class="m t">50</text><text x="660" y="38" text-anchor="middle" class="m t">60</text><text x="52" y="48" text-anchor="end" class="m t">0</text><text x="52" y="108" text-anchor="end" class="m t">5</text><text x="52" y="168" text-anchor="end" class="m t">10</text><text x="52" y="240" text-anchor="end" class="m t">16</text><text x="52" y="264" text-anchor="end" class="m t">18</text><text x="52" y="312" text-anchor="end" class="m t">22</text><text x="52" y="24" text-anchor="end" class="m t">Y</text><text x="674" y="38" text-anchor="start" class="m t">X</text><circle cx="85.0" cy="62.0" r="3.6" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="93.0" y="66.0" text-anchor="start" class="t" style="font-size:10px">BAT_VOLT 2,1</text><circle cx="85.0" cy="74.0" r="3.6" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="93.0" y="78.0" text-anchor="start" class="t" style="font-size:10px">CURRENT 2,2</text><circle cx="85.0" cy="170.0" r="3.6" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="93.0" y="174.0" text-anchor="start" class="t" style="font-size:10px">GSPEED 2,10</text><circle cx="525.0" cy="62.0" r="3.6" fill="var(--gc-signal-amber, #f0b24c)" stroke="var(--gc-signal-amber, #f0b24c)" stroke-width="1.2"/><text x="517.0" y="66.0" text-anchor="end" class="t" style="font-size:10px">HOME 46,1</text><rect x="600" y="164" width="50" height="12" fill="none" stroke="var(--gc-signal-red, #e8636b)" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="605.0" cy="170.0" r="3.6" fill="var(--gc-signal-red, #e8636b)" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.2"/><text x="597.0" y="164.0" text-anchor="end" class="t" style="font-size:10px">ALTITUDE 54,10</text><circle cx="315.0" cy="230.0" r="3.6" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="315.0" y="247.0" text-anchor="middle" class="t" style="font-size:10px">VSPEED 25,15</text><rect x="120" y="224" width="260" height="12" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="125.0" cy="230.0" r="3.6" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><text x="133.0" y="222.0" text-anchor="start" class="t" style="font-size:10px">MESSAGE 6,15 (ширина 26)</text><rect x="80" y="284" width="40" height="12" fill="none" stroke="var(--gc-signal-red, #e8636b)" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="85.0" cy="290.0" r="3.6" fill="var(--gc-signal-red, #e8636b)" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.2"/><text x="93.0" y="294.0" text-anchor="start" class="t" style="font-size:10px">SATS 2,20</text><rect x="330" y="284" width="50" height="12" fill="none" stroke="var(--gc-signal-red, #e8636b)" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="335.0" cy="290.0" r="3.6" fill="var(--gc-signal-red, #e8636b)" stroke="var(--gc-signal-red, #e8636b)" stroke-width="1.2"/><text x="343.0" y="294.0" text-anchor="start" class="t" style="font-size:10px">FLTMODE 27,20</text><rect x="460" y="200" width="70" height="72" fill="none" stroke="var(--gc-signal-amber, #f0b24c)" stroke-width="0.9" stroke-dasharray="2 2"/><circle cx="465.0" cy="206.0" r="3.6" fill="var(--gc-signal-amber, #f0b24c)" stroke="var(--gc-signal-amber, #f0b24c)" stroke-width="1.2"/><text x="457.0" y="200.0" text-anchor="end" class="t" style="font-size:10px">STATS 40,13</text><text x="60" y="328" text-anchor="start" class="m t">Тёмная точка — якорь внутри 30×16; жёлтая — вне 30×16, внутри 50×18; красная — вне 50×18.</text><text x="60" y="343" text-anchor="start" class="w t">Вне 50×18 — 3 якоря из 10 и нижняя строка STATS; вне 30×16 — 5 якорей и 2 символа MESSAGE.</text><text x="60" y="358" text-anchor="start" class="m t">ArduPilot не сдвигает элементы при смене OSDn_TXT_RES: координаты остаются как записаны.</text></svg>
