<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Правило выбора класса: работа → требования → класс</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Правило выбора класса: работа → требования → класс</text><rect class="box" x="280.0" y="34" width="160.0" height="40" rx="6"/><text x="360.0" y="52.0" text-anchor="middle" style="font-size:10.5px">Рабочее время</text><text x="360.0" y="64.0" text-anchor="middle" style="font-size:10.5px">t ≤ 40 мин?</text><path class="ln" d="M360.0 74 L360.0 89.0 L185.0 89.0 L185.0 104" marker-end="url(#ar)"/><text x="189.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="box" x="105.0" y="104" width="160.0" height="40" rx="6"/><text x="185.0" y="122.0" text-anchor="middle" style="font-size:10.5px">Висение — основная</text><text x="185.0" y="134.0" text-anchor="middle" style="font-size:10.5px">работа?</text><path class="ln" d="M185.0 144 L185.0 159.0 L97.5 159.0 L97.5 174" marker-end="url(#ar)"/><text x="101.5" y="155.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="boxa" x="17.5" y="174" width="160.0" height="40" rx="18"/><text x="97.5" y="192.0" text-anchor="middle" class="b" style="font-size:10.5px">VTOL / самолёт 1–3 ч:</text><text x="97.5" y="204.0" text-anchor="middle" class="b" style="font-size:10.5px">карта 120 га = 56 мин</text><path class="ln" d="M185.0 144 L185.0 159.0 L272.5 159.0 L272.5 174" marker-end="url(#ar)"/><text x="276.5" y="155.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="box" x="192.5" y="174" width="160.0" height="40" rx="18"/><text x="272.5" y="192.0" text-anchor="middle" style="font-size:10.5px">Несколько вылетов</text><text x="272.5" y="204.0" text-anchor="middle" style="font-size:10.5px">мультиротора</text><path class="ln" d="M360.0 74 L360.0 89.0 L535.0 89.0 L535.0 104" marker-end="url(#ar)"/><text x="539.0" y="85.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="box" x="455.0" y="104" width="160.0" height="40" rx="6"/><text x="535.0" y="122.0" text-anchor="middle" style="font-size:10.5px">Над людьми, BVLOS</text><text x="535.0" y="134.0" text-anchor="middle" style="font-size:10.5px">или MTOW &gt; 25 кг?</text><path class="ln" d="M535.0 144 L535.0 159.0 L447.5 159.0 L447.5 174" marker-end="url(#ar)"/><text x="451.5" y="155.0" text-anchor="start" class="a t" style="font-size:10px">ні</text><rect class="box" x="367.5" y="174" width="160.0" height="40" rx="18"/><text x="447.5" y="192.0" text-anchor="middle" style="font-size:10.5px">Квадро: тепловизор,</text><text x="447.5" y="204.0" text-anchor="middle" style="font-size:10.5px">шоу (+RTK)</text><path class="ln" d="M535.0 144 L535.0 159.0 L622.5 159.0 L622.5 174" marker-end="url(#ar)"/><text x="626.5" y="155.0" text-anchor="start" class="a t" style="font-size:10px">так</text><rect class="boxa" x="542.5" y="174" width="160.0" height="40" rx="18"/><text x="622.5" y="192.0" text-anchor="middle" class="b" style="font-size:10.5px">Гекса / окто: агро 92 кг,</text><text x="622.5" y="204.0" text-anchor="middle" class="b" style="font-size:10.5px">доставка BVLOS</text></svg>
