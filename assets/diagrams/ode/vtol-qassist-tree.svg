<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 514" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Q-assist в самолётном режиме: включать ли подъёмные моторы</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Q-assist в самолётном режиме: включать ли подъёмные моторы</text><rect class="box" x="255.0" y="34" width="210.0" height="48" rx="6"/><text x="360.0" y="56.0" text-anchor="middle" style="font-size:10.5px">Выключен? Дизарм, тумблер 82</text><text x="360.0" y="68.0" text-anchor="middle" style="font-size:10.5px">вниз, выравнивание посадки</text><path class="ln" d="M360.0 82 L360.0 94.0 L68.3 94.0 L68.3 106" marker-end="url(#ar)"/><text x="72.33333333333334" y="90.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="13.0" y="106" width="110.7" height="48" rx="18"/><text x="68.33333333333334" y="134.0" text-anchor="middle" style="font-size:9.5px">Помощи нет</text><path class="ln" d="M360.0 82 L360.0 94.0 L418.3 94.0 L418.3 106" marker-end="url(#ar)"/><text x="422.33333333333337" y="90.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="313.3" y="106" width="210.0" height="48" rx="6"/><text x="418.33333333333337" y="128.0" text-anchor="middle" style="font-size:10.5px">Безопасно? Авто-газ,</text><text x="418.33333333333337" y="140.0" text-anchor="middle" style="font-size:10.5px">газ &gt; 0 или летит</text><path class="ln" d="M418.3 154 L418.3 166.0 L185.0 166.0 L185.0 178" marker-end="url(#ar)"/><text x="189.0" y="162.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="129.7" y="178" width="110.7" height="48" rx="18"/><text x="185.0" y="206.0" text-anchor="middle" style="font-size:9.5px">Помощи нет</text><path class="ln" d="M418.3 154 L418.3 166.0 L476.7 166.0 L476.7 178" marker-end="url(#ar)"/><text x="480.6666666666667" y="162.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="371.7" y="178" width="210.0" height="48" rx="6"/><text x="476.6666666666667" y="200.0" text-anchor="middle" style="font-size:10.5px">Force: тумблер 82</text><text x="476.6666666666667" y="212.0" text-anchor="middle" style="font-size:10.5px">вверх или бит 7?</text><path class="ln" d="M476.7 226 L476.7 238.0 L301.7 238.0 L301.7 250" marker-end="url(#ar)"/><text x="305.6666666666667" y="234.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="boxa" x="246.3" y="250" width="110.7" height="48" rx="18"/><text x="301.6666666666667" y="272.0" text-anchor="middle" class="b" style="font-size:9.5px">Помощь</text><text x="301.6666666666667" y="284.0" text-anchor="middle" class="b" style="font-size:9.5px">всегда</text><path class="ln" d="M476.7 226 L476.7 238.0 L535.0 238.0 L535.0 250" marker-end="url(#ar)"/><text x="539.0" y="234.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="430.0" y="250" width="210.0" height="48" rx="6"/><text x="535.0" y="278.0" text-anchor="middle" style="font-size:10.5px">Q_ASSIST_SPEED &gt; 0?</text><path class="ln" d="M535.0 298 L535.0 310.0 L418.3 310.0 L418.3 322" marker-end="url(#ar)"/><text x="422.3333333333333" y="306.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="363.0" y="322" width="110.7" height="48" rx="18"/><text x="418.3333333333333" y="344.0" text-anchor="middle" style="font-size:9.5px">Только на</text><text x="418.3333333333333" y="356.0" text-anchor="middle" style="font-size:9.5px">переходах</text><path class="ln" d="M535.0 298 L535.0 310.0 L593.3 310.0 L593.3 322" marker-end="url(#ar)"/><text x="597.3333333333334" y="306.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="488.3" y="322" width="210.0" height="48" rx="6"/><text x="593.3333333333334" y="338.0" text-anchor="middle" style="font-size:10.5px">V &lt; Q_ASSIST_SPEED (сразу)</text><text x="593.3333333333334" y="350.0" text-anchor="middle" style="font-size:10.5px">или h &lt; Q_ASSIST_ALT, или угол</text><text x="593.3333333333334" y="362.0" text-anchor="middle" style="font-size:10.5px">вне пределов (0.5 с)?</text><path class="ln" d="M593.3 370 L593.3 382.0 L535.0 382.0 L535.0 394" marker-end="url(#ar)"/><text x="539.0" y="378.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="boxa" x="479.7" y="394" width="110.7" height="48" rx="18"/><text x="535.0" y="416.0" text-anchor="middle" class="b" style="font-size:9.5px">Моторы вкл.,</text><text x="535.0" y="428.0" text-anchor="middle" class="b" style="font-size:9.5px">режим тот же</text><path class="ln" d="M593.3 370 L593.3 382.0 L651.7 382.0 L651.7 394" marker-end="url(#ar)"/><text x="655.6666666666667" y="378.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="596.3" y="394" width="110.7" height="48" rx="18"/><text x="651.6666666666667" y="422.0" text-anchor="middle" style="font-size:9.5px">Помощи нет</text><text x="16" y="492.0" text-anchor="start" class="m t">Q_ASSIST_SPEED = 0 запрещает арм; помощь по высоте и углу снимается через 2 × Q_ASSIST_DELAY</text><text x="16" y="508.0" text-anchor="start" class="m t">Без смены режима — в отличие от quad-chute PX4</text></svg>
