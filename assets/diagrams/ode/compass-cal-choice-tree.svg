<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Калибровка компаса (ArduPilot): после мачты и ориентации — два вопроса</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Калибровка компаса (ArduPilot): после мачты и ориентации — два вопроса</text><rect class="boxa" x="275.0" y="34" width="170.0" height="52" rx="6"/><text x="360.0" y="58.0" text-anchor="middle" class="b" style="font-size:10.5px">Аппарат можно</text><text x="360.0" y="70.0" text-anchor="middle" class="b" style="font-size:10.5px">вращать в руках?</text><path class="ln" d="M360.0 86 L360.0 100.0 L185.0 100.0 L185.0 114" marker-end="url(#ar)"/><text x="189.0" y="96.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="100.0" y="114" width="170.0" height="52" rx="6"/><text x="185.0" y="138.0" text-anchor="middle" style="font-size:10.5px">Длина MAG</text><text x="185.0" y="150.0" text-anchor="middle" style="font-size:10.5px">меняется с газом?</text><path class="ln" d="M185.0 166 L185.0 180.0 L97.5 180.0 L97.5 194" marker-end="url(#ar)"/><text x="101.5" y="176.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="boxa" x="13.0" y="194" width="169.0" height="52" rx="18"/><text x="97.5" y="212.0" text-anchor="middle" class="b" style="font-size:10.5px">Вращением:</text><text x="97.5" y="224.0" text-anchor="middle" class="b" style="font-size:10.5px">COMPASS_CAL_FIT 16</text><text x="97.5" y="236.0" text-anchor="middle" class="b" style="font-size:10.5px">(внешний первый)</text><path class="ln" d="M185.0 166 L185.0 180.0 L272.5 180.0 L272.5 194" marker-end="url(#ar)"/><text x="276.5" y="176.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="boxa" x="188.0" y="194" width="169.0" height="52" rx="18"/><text x="272.5" y="212.0" text-anchor="middle" class="b" style="font-size:10.5px">Вращением + CompassMot</text><text x="272.5" y="224.0" text-anchor="middle" class="b" style="font-size:10.5px">(Copter) или MagFit</text><text x="272.5" y="236.0" text-anchor="middle" class="b" style="font-size:10.5px">по логу с током</text><path class="ln" d="M360.0 86 L360.0 100.0 L535.0 100.0 L535.0 114" marker-end="url(#ar)"/><text x="539.0" y="96.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="450.0" y="114" width="170.0" height="52" rx="6"/><text x="535.0" y="138.0" text-anchor="middle" style="font-size:10.5px">Длина MAG</text><text x="535.0" y="150.0" text-anchor="middle" style="font-size:10.5px">меняется с газом?</text><path class="ln" d="M535.0 166 L535.0 180.0 L447.5 180.0 L447.5 194" marker-end="url(#ar)"/><text x="451.5" y="176.0" text-anchor="start" class="a t" style="font-size:10px">нет</text><rect class="box" x="363.0" y="194" width="169.0" height="52" rx="18"/><text x="447.5" y="212.0" text-anchor="middle" style="font-size:10.5px">Large Vehicle MagCal:</text><text x="447.5" y="224.0" text-anchor="middle" style="font-size:10.5px">известный курс,</text><text x="447.5" y="236.0" text-anchor="middle" style="font-size:10.5px">только смещения</text><path class="ln" d="M535.0 166 L535.0 180.0 L622.5 180.0 L622.5 194" marker-end="url(#ar)"/><text x="626.5" y="176.0" text-anchor="start" class="a t" style="font-size:10px">да</text><rect class="box" x="538.0" y="194" width="169.0" height="52" rx="18"/><text x="622.5" y="212.0" text-anchor="middle" style="font-size:10.5px">Large Vehicle MagCal</text><text x="622.5" y="224.0" text-anchor="middle" style="font-size:10.5px">+ CompassMot (Copter)</text><text x="622.5" y="236.0" text-anchor="middle" style="font-size:10.5px">или MagFit по логу</text><text x="16" y="300.0" text-anchor="start" class="m t">Принять: |B| постоянна ±5 % при повороте, смещения &lt; COMPASS_OFFS_MAX 1800,</text><text x="16" y="316.0" text-anchor="start" class="m t">отличие от модели &lt; ARMING_MAGTHRESH 100 мГс по горизонтали, CompassMot &lt; 30 %, MagFit: курс &lt; 10°.</text><text x="16" y="332.0" text-anchor="start" class="m t">INAV: компенсации по току нет — только перенос компаса.</text></svg>
