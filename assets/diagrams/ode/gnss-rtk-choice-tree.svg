<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Нужен ли RTK: решает требуемая точность, а не «чем точнее, тем лучше»</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="16" text-anchor="start" class="m t">Нужен ли RTK: решает требуемая точность, а не «чем точнее, тем лучше»</text><rect class="box" x="285.0" y="34" width="150.0" height="62" rx="6"/><text x="360.0" y="63.0" text-anchor="middle" style="font-size:10.5px">Что нужно</text><text x="360.0" y="75.0" text-anchor="middle" style="font-size:10.5px">задаче?</text><path class="ln" d="M360.0 96 L360.0 110.0 L80.0 110.0 L80.0 124" marker-end="url(#ar)"/><text x="84.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">~2 м</text><rect class="box" x="13.0" y="124" width="134.0" height="62" rx="18"/><text x="80.0" y="147.0" text-anchor="middle" style="font-size:9.5px">Полёт по точкам, FPV:</text><text x="80.0" y="159.0" text-anchor="middle" style="font-size:9.5px">GNSS + EKF, 1.5–3 м</text><text x="80.0" y="171.0" text-anchor="middle" style="font-size:9.5px">в поле — RTK не нужен</text><path class="ln" d="M360.0 96 L360.0 110.0 L290.0 110.0 L290.0 124" marker-end="url(#ar)"/><text x="294.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">см, в полёте</text><rect class="boxa" x="215.0" y="124" width="150.0" height="62" rx="6"/><text x="290.0" y="147.0" text-anchor="middle" class="b" style="font-size:10.5px">RTK: F9P / UM982</text><text x="290.0" y="159.0" text-anchor="middle" class="b" style="font-size:10.5px">на базе и борту,</text><text x="290.0" y="171.0" text-anchor="middle" class="b" style="font-size:10.5px">поправки RTCM</text><path class="ln" d="M290.0 186 L290.0 200.0 L220.0 200.0 L220.0 214" marker-end="url(#ar)"/><text x="224.0" y="196.0" text-anchor="start" class="a t" style="font-size:10px">своя база</text><rect class="boxa" x="153.0" y="214" width="134.0" height="62" rx="18"/><text x="220.0" y="237.0" text-anchor="middle" class="b" style="font-size:9.5px">≤ 10–20 км: fix</text><text x="220.0" y="249.0" text-anchor="middle" class="b" style="font-size:9.5px">1–3 см, float</text><text x="220.0" y="261.0" text-anchor="middle" class="b" style="font-size:9.5px">10–50 см</text><path class="ln" d="M290.0 186 L290.0 200.0 L360.0 200.0 L360.0 214" marker-end="url(#ar)"/><text x="364.0" y="196.0" text-anchor="start" class="a t" style="font-size:10px">NTRIP</text><rect class="box" x="293.0" y="214" width="134.0" height="62" rx="18"/><text x="360.0" y="237.0" text-anchor="middle" style="font-size:9.5px">до 50–100 км:</text><text x="360.0" y="249.0" text-anchor="middle" style="font-size:9.5px">1 ppm и дольше</text><text x="360.0" y="261.0" text-anchor="middle" style="font-size:9.5px">сходимость</text><path class="ln" d="M360.0 96 L360.0 110.0 L500.0 110.0 L500.0 124" marker-end="url(#ar)"/><text x="504.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">см, после</text><rect class="box" x="433.0" y="124" width="134.0" height="62" rx="18"/><text x="500.0" y="147.0" text-anchor="middle" style="font-size:9.5px">Фотограмметрия:</text><text x="500.0" y="159.0" text-anchor="middle" style="font-size:9.5px">PPK — постобработка</text><text x="500.0" y="171.0" text-anchor="middle" style="font-size:9.5px">по логам</text><path class="ln" d="M360.0 96 L360.0 110.0 L640.0 110.0 L640.0 124" marker-end="url(#ar)"/><text x="644.0" y="106.0" text-anchor="start" class="a t" style="font-size:10px">курс</text><rect class="box" x="573.0" y="124" width="134.0" height="62" rx="18"/><text x="640.0" y="141.0" text-anchor="middle" style="font-size:9.5px">Курс без компаса:</text><text x="640.0" y="153.0" text-anchor="middle" style="font-size:9.5px">moving baseline:</text><text x="640.0" y="165.0" text-anchor="middle" style="font-size:9.5px">GPS1_TYPE = 17,</text><text x="640.0" y="177.0" text-anchor="middle" style="font-size:9.5px">GPS2_TYPE = 18</text><text x="16" y="330.0" text-anchor="start" class="m t">RTK не лечит многолучёвость (скачки 1–10+ м у стены) и потерю спутников под крышей</text></svg>
