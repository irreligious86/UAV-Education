<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">ArduPilot 4.7: от команды до выхода — камера, подвес, захват</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="44" width="250" height="46" rx="6"/><text x="135.0" y="64.0" text-anchor="middle">RCx_OPTION 9, DO_DIGICAM_CONTROL,</text><text x="135.0" y="78.0" text-anchor="middle">DO_SET_CAM_TRIGG_DIST</text><rect class="boxa" x="300" y="44" width="150" height="46" rx="6"/><text x="375.0" y="64.0" text-anchor="middle" class="b">AP_Camera</text><text x="375.0" y="78.0" text-anchor="middle" class="b">CAM1_TYPE</text><rect class="box" x="544" y="44" width="166" height="46" rx="6"/><text x="627.0" y="64.0" text-anchor="middle">серва 10, реле 4,</text><text x="627.0" y="78.0" text-anchor="middle">подвес, MAVLink</text><rect class="box" x="10" y="124" width="250" height="46" rx="6"/><text x="135.0" y="144.0" text-anchor="middle">RCx_OPTION 212–214, 27, 163,</text><text x="135.0" y="158.0" text-anchor="middle">DO_GIMBAL_MANAGER_PITCHYAW</text><rect class="boxa" x="300" y="124" width="150" height="46" rx="6"/><text x="375.0" y="144.0" text-anchor="middle" class="b">AP_Mount</text><text x="375.0" y="158.0" text-anchor="middle" class="b">MNT1_TYPE</text><rect class="box" x="544" y="124" width="166" height="46" rx="6"/><text x="627.0" y="144.0" text-anchor="middle">сервы 6–8, 9;</text><text x="627.0" y="158.0" text-anchor="middle">UART 8 или 7; MAVLink</text><rect class="box" x="10" y="204" width="250" height="46" rx="6"/><text x="135.0" y="224.0" text-anchor="middle">RCx_OPTION 19, DO_GRIPPER,</text><text x="135.0" y="238.0" text-anchor="middle">FS_OPTIONS бит 5</text><rect class="boxa" x="300" y="204" width="150" height="46" rx="6"/><text x="375.0" y="224.0" text-anchor="middle" class="b">AP_Gripper</text><text x="375.0" y="238.0" text-anchor="middle" class="b">GRIP_TYPE</text><rect class="box" x="544" y="204" width="166" height="46" rx="6"/><text x="627.0" y="224.0" text-anchor="middle">серва 28 или</text><text x="627.0" y="238.0" text-anchor="middle">узел DroneCAN</text><path class="ln" d="M260 67.0 L300 67.0" marker-end="url(#ar)"/><path class="lna" d="M450 67.0 L544 67.0" marker-end="url(#ara)"/><path class="ln" d="M260 147.0 L300 147.0" marker-end="url(#ar)"/><path class="lna" d="M450 147.0 L544 147.0" marker-end="url(#ara)"/><path class="ln" d="M260 227.0 L300 227.0" marker-end="url(#ar)"/><path class="lna" d="M450 227.0 L544 227.0" marker-end="url(#ara)"/><path class="ln" d="M375.0 90 L375.0 124" marker-end="url(#ar)"/><text x="385.0" y="111" text-anchor="start" class="m t">CAM1_TYPE = 4</text><text x="14" y="276" text-anchor="start" class="t">Источник не пишет в выход напрямую: тумблер, миссия и MAVLink вызывают библиотеку, она выбирает драйвер по TYPE.</text><text x="14" y="292" text-anchor="start" class="a t">Камера типа 4 спускается через драйвер подвеса: без рабочего MNT1_TYPE кадров не будет.</text><text x="14" y="308" text-anchor="start" class="w t">Сервы — обычные PWM-выходы: группы таймеров и BRD_SAFETY_MASK действуют; реле на GPIO кнопка не блокирует.</text><text x="14" y="324" text-anchor="start" class="m t">Захват отпускают три разных источника: тумблер 19 (LOW), DO_GRIPPER и failsafe с FS_OPTIONS бит 5.</text></svg>
