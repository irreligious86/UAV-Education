<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">AP_Notify 4.7: от события до светодиода и пищалки</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="14" y="96" width="128" height="48" rx="6"/><text x="78.0" y="117.0" text-anchor="middle" style="font-size:10.5px">Код прошивки</text><text x="78.0" y="131.0" text-anchor="middle" style="font-size:10.5px">арм, failsafe, EKF</text><text x="78.0" y="157" text-anchor="middle" class="m t">флаги и события</text><rect class="boxa" x="176" y="96" width="128" height="48" rx="6"/><text x="240.0" y="117.0" text-anchor="middle" class="b" style="font-size:10.5px">AP_Notify</text><text x="240.0" y="131.0" text-anchor="middle" class="b" style="font-size:10.5px">50 раз в секунду</text><text x="240.0" y="157" text-anchor="middle" class="m t">параметры NTF_*</text><rect class="boxa" x="348" y="28" width="150" height="44" rx="6"/><text x="423.0" y="47.0" text-anchor="middle" class="b">RGBLed</text><text x="423.0" y="61.0" text-anchor="middle" class="b">одна таблица цветов</text><rect class="box" x="348" y="98" width="150" height="44" rx="6"/><text x="423.0" y="117.0" text-anchor="middle">Светодиоды платы</text><text x="423.0" y="131.0" text-anchor="middle">1–2 штуки, ритм</text><rect class="boxa" x="348" y="168" width="150" height="44" rx="6"/><text x="423.0" y="187.0" text-anchor="middle" class="b">ToneAlarm</text><text x="423.0" y="201.0" text-anchor="middle" class="b">мелодии</text><rect class="box" x="348" y="238" width="150" height="44" rx="6"/><text x="423.0" y="257.0" text-anchor="middle">Buzzer</text><text x="423.0" y="271.0" text-anchor="middle">NTF_BUZZ_PIN</text><rect class="box" x="548" y="28" width="158" height="44" rx="6"/><text x="627.0" y="47.0" text-anchor="middle">I2C, CAN, NeoPixel,</text><text x="627.0" y="61.0" text-anchor="middle">ProfiLED, ESC LED</text><rect class="box" x="548" y="168" width="158" height="44" rx="6"/><text x="627.0" y="187.0" text-anchor="middle">пад BUZZ, DroneCAN,</text><text x="627.0" y="201.0" text-anchor="middle">писк моторами</text><rect class="box" x="548" y="238" width="158" height="44" rx="6"/><text x="627.0" y="257.0" text-anchor="middle">активная пищалка</text><text x="627.0" y="271.0" text-anchor="middle">на ножке GPIO</text><path class="ln" d="M142 120.0 L176 120.0" marker-end="url(#ar)"/><path class="lna" d="M304 120.0 L326.0 120.0 L326.0 50.0 L348 50.0" marker-end="url(#ara)"/><path class="ln" d="M304 120.0 L348 120.0" marker-end="url(#ar)"/><path class="lna" d="M304 120.0 L326.0 120.0 L326.0 190.0 L348 190.0" marker-end="url(#ara)"/><path class="ln" d="M304 120.0 L326.0 120.0 L326.0 260.0 L348 260.0" marker-end="url(#ar)"/><path class="lna" d="M498 50.0 L548 50.0" marker-end="url(#ara)"/><path class="lna" d="M498 190.0 L548 190.0" marker-end="url(#ara)"/><path class="ln" d="M498 260.0 L548 260.0" marker-end="url(#ar)"/><text x="14" y="312" text-anchor="start" class="a t">Флаги общие: RGB-светодиод платы, модуля GPS и лента показывают одно и то же.</text><text x="14" y="328" text-anchor="start" class="w t">Писк моторами (NTF_BUZZ_TYPES бит 1), светодиоды ESC (NTF_LED_TYPES бит 11): только в дизарме.</text><text x="14" y="344" text-anchor="start" class="m t">Устройства создаются при загрузке: после смены NTF_LED_TYPES, NTF_BUZZ_TYPES — перезагрузка.</text><text x="14" y="360" text-anchor="start" class="m t">Экран I2C (NTF_DISPLAY_TYPE) — отдельное устройство, в арме не обновляется.</text></svg>
