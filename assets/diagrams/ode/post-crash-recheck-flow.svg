<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Чек-лист после аварии: порядок</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="boxa" x="10" y="34" width="160" height="58" rx="6"/><text x="90.0" y="53.0" text-anchor="middle" class="b">АКБ первой:</text><text x="90.0" y="67.0" text-anchor="middle" class="b">оболочка, нагрев,</text><text x="90.0" y="81.0" text-anchor="middle" class="b">банки сразу и 30 мин</text><rect class="box" x="190" y="34" width="160" height="58" rx="6"/><text x="270.0" y="60.0" text-anchor="middle">Карантин ≥ 15 мин,</text><text x="270.0" y="74.0" text-anchor="middle">журнал «удар»</text><rect class="box" x="370" y="34" width="160" height="58" rx="6"/><text x="450.0" y="53.0" text-anchor="middle">Рама, лучи,</text><text x="450.0" y="67.0" text-anchor="middle">диагонали, моторы,</text><text x="450.0" y="81.0" text-anchor="middle">все пропы</text><rect class="box" x="550" y="34" width="160" height="58" rx="6"/><text x="630.0" y="60.0" text-anchor="middle">Проводка, разъёмы,</text><text x="630.0" y="74.0" text-anchor="middle">стек, антенны, GPS</text><rect class="box" x="550" y="134" width="160" height="58" rx="6"/><text x="630.0" y="160.0" text-anchor="middle">Пропы сняты,</text><text x="630.0" y="174.0" text-anchor="middle">smoke stopper</text><rect class="box" x="370" y="134" width="160" height="58" rx="6"/><text x="450.0" y="160.0" text-anchor="middle">Горизонт 0, каналы,</text><text x="450.0" y="174.0" text-anchor="middle">failsafe</text><rect class="box" x="190" y="134" width="160" height="58" rx="6"/><text x="270.0" y="153.0" text-anchor="middle">Моторы по одному,</text><text x="270.0" y="167.0" text-anchor="middle">все 20–30 с: шум</text><text x="270.0" y="181.0" text-anchor="middle">≤ логов до аварии</text><rect class="boxa" x="10" y="134" width="160" height="58" rx="6"/><text x="90.0" y="153.0" text-anchor="middle" class="b">Новые пропы: висение</text><text x="90.0" y="167.0" text-anchor="middle" class="b">30–60 с на 1–2 м,</text><text x="90.0" y="181.0" text-anchor="middle" class="b">лог против тренда</text><path class="ln" d="M170 63.0 L190 63.0" marker-end="url(#ar)"/><path class="ln" d="M350 63.0 L370 63.0" marker-end="url(#ar)"/><path class="ln" d="M530 63.0 L550 63.0" marker-end="url(#ar)"/><path class="ln" d="M630.0 92 L630.0 134" marker-end="url(#ar)"/><path class="ln" d="M550 163.0 L530 163.0" marker-end="url(#ar)"/><path class="ln" d="M370 163.0 L350 163.0" marker-end="url(#ar)"/><path class="lna" d="M190 163.0 L170 163.0" marker-end="url(#ara)"/><text x="10" y="20" text-anchor="start" class="m t">После аварии: порядок проверки; любой критерий «не летать» — аппарат на земле</text><text x="10" y="222" text-anchor="start" class="m t">Запись в журнал: что случилось, что заменено (серийники), результат висения, номер АКБ в карантине</text></svg>
