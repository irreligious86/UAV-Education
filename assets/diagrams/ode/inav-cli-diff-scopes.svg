gnal-amber, #f0b24c)" stroke-width="1.6"/><rect x="564.0" y="239.0" width="52" height="12" rx="3" fill="currentColor"/><rect x="644.0" y="239.0" width="52" height="12" rx="3" fill="currentColor"/><text x="16" y="271" text-anchor="start" class="t" style="font-size:10.5px">battery_profile — остальные 2</text><text x="302" y="271" text-anchor="end" class="m t" style="font-size:10.5px">6</text><path d="M345.0 267.0 L355.0 267.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><rect x="404.0" y="261.0" width="52" height="12" rx="3" fill="var(--gc-accent-hud, #5ef1d2)"/><path d="M505.0 267.0 L515.0 267.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><path d="M585.0 267.0 L595.0 267.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><rect x="644.0" y="261.0" width="52" height="12" rx="3" fill="currentColor"/><rect x="10" y="278" width="700" height="22" fill="var(--gc-surface-200, rgba(128,128,128,0.08))"/><text x="16" y="293" text-anchor="start" class="t" style="font-size:10.5px">возврат выбора профилей (3 строки)</text><text x="302" y="293" text-anchor="end" class="m t" style="font-size:10.5px">3</text><path d="M345.0 289.0 L355.0 289.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><rect x="404.0" y="283.0" width="52" height="12" rx="3" fill="var(--gc-accent-hud, #5ef1d2)"/><path d="M505.0 289.0 L515.0 289.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><path d="M585.0 289.0 L595.0 289.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><rect x="644.0" y="283.0" width="52" height="12" rx="3" fill="currentColor"/><text x="16" y="315" text-anchor="start" class="t" style="font-size:10.5px">save</text><text x="302" y="315" text-anchor="end" class="m t" style="font-size:10.5px">1</text><rect x="324.0" y="305.0" width="52" height="12" rx="3" fill="currentColor"/><rect x="404.0" y="305.0" width="52" height="12" rx="3" fill="var(--gc-accent-hud, #5ef1d2)"/><path d="M505.0 311.0 L515.0 311.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><rect x="564.0" y="305.0" width="52" height="12" rx="3" fill="currentColor"/><rect x="644.0" y="305.0" width="52" height="12" rx="3" fill="currentColor"/><rect x="10" y="322" width="700" height="22" fill="var(--gc-surface-200, rgba(128,128,128,0.08))"/><text x="16" y="337" text-anchor="start" class="t" style="font-size:10.5px">batch end (после save)</text><text x="302" y="337" text-anchor="end" class="m t" style="font-size:10.5px">+1</text><rect x="324.0" y="327.0" width="52" height="12" rx="3" fill="currentColor"/><path d="M425.0 333.0 L435.0 333.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><path d="M505.0 333.0 L515.0 333.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><rect x="564.0" y="327.0" width="52" height="12" rx="3" fill="currentColor"/><path d="M665.0 333.0 L675.0 333.0" stroke="var(--gc-ink-muted, #8a93a3)" stroke-width="1.4"/><text x="10" y="362" text-anchor="start" class="t">Пример модуля: diff all — 69 командных строк, diff — 38. В diff нет 32 строк из diff all:</text><text x="10" y="377" text-anchor="start" class="w t">23 строки с настройками неактивных профилей, 5 строк выбора профиля, 3 строки возврата, defaults noreboot.</text><text x="10" y="392" text-anchor="start" class="m t">Рамка — печатается только блок, названный в команде (активный профиль), без version, batch и save.</text><text x="10" y="407" text-anchor="start" class="m t">Счётчики профилей: control 3, mixer 2 (на F411 — 1), battery 3. Область rates из help не реализована.</text></svg>
