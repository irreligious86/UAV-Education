<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Подвес: путь команды в ArduPilot и PX4</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><text x="16" y="18" text-anchor="start" class="m t">Путь команды подвесу: где включается и где молча обрывается (ArduPilot 4.7.2, PX4 1.17)</text><text x="16" y="40" text-anchor="start" class="b" style="font-size:12px">ArduPilot</text><rect class="box" x="10.0" y="46.0" width="206.0" height="96.0" rx="6"/><text x="113.0" y="65.5" text-anchor="middle" class="b" style="font-size:10.5px">Клиенты</text><text x="113.0" y="78.5" text-anchor="middle" style="font-size:10.5px">пульт: RCx_OPTION 212–214</text><text x="113.0" y="91.5" text-anchor="middle" style="font-size:10.5px">(163 — Mount Yaw Lock);</text><text x="113.0" y="104.5" text-anchor="middle" style="font-size:10.5px">GCS / companion:</text><text x="113.0" y="117.5" text-anchor="middle" style="font-size:10.5px">DO_GIMBAL_MANAGER_PITCHYAW;</text><text x="113.0" y="130.5" text-anchor="middle" style="font-size:10.5px">миссия: DO_SET_ROI_LOCATION</text><path class="ln" d="M216 94 L238 94" marker-end="url(#ar)"/><rect class="boxa" x="238.0" y="46.0" width="206.0" height="96.0" rx="6"/><text x="341.0" y="72.0" text-anchor="middle" class="b" style="font-size:10.5px">Менеджер в автопилоте</text><text x="341.0" y="85.0" text-anchor="middle" style="font-size:10.5px">MNT1_DEFLT_MODE:</text><text x="341.0" y="98.0" text-anchor="middle" style="font-size:10.5px">умолч. 3 — слушает пульт;</text><text x="341.0" y="111.0" text-anchor="middle" style="font-size:10.5px">MNT1_RC_RATE: 0 — угол,</text><text x="341.0" y="124.0" text-anchor="middle" style="font-size:10.5px">&gt; 0 — скорость °/с</text><path class="ln" d="M444 94 L470 94"/><rect class="box" x="488.0" y="32.0" width="222.0" height="32.0" rx="5"/><text x="599.0" y="46.0" text-anchor="middle" style="font-size:10.5px">1 Servo, 7 BrushlessPWM:</text><text x="599.0" y="58.0" text-anchor="middle" style="font-size:10.5px">SERVOn_FUNCTION 6 / 7 / 8</text><rect class="box" x="488.0" y="70.0" width="222.0" height="44.0" rx="5"/><text x="599.0" y="84.0" text-anchor="middle" style="font-size:10.5px">5, 8, 11–14 — UART:</text><text x="599.0" y="96.0" text-anchor="middle" style="font-size:10.5px">SERIALn_PROTOCOL = 8 (Gimbal);</text><text x="599.0" y="108.0" text-anchor="middle" style="font-size:10.5px">3 Alexmos — протокол 7</text><rect class="box" x="488.0" y="120.0" width="222.0" height="32.0" rx="5"/><text x="599.0" y="134.0" text-anchor="middle" style="font-size:10.5px">4, 6 — порт MAVLink 2:</text><text x="599.0" y="146.0" text-anchor="middle" style="font-size:10.5px">подвес — компонент 154</text><rect class="box" x="488.0" y="158.0" width="222.0" height="22.0" rx="5"/><text x="599.0" y="173.0" text-anchor="middle" style="font-size:10.5px">10 Xacti — DroneCAN</text><path class="ln" d="M470 48.0 L470 169.0"/><path class="ln" d="M470 48.0 L488 48.0" marker-end="url(#ar)"/><path class="ln" d="M470 92.0 L488 92.0" marker-end="url(#ar)"/><path class="ln" d="M470 136.0 L488 136.0" marker-end="url(#ar)"/><path class="ln" d="M470 169.0 L488 169.0" marker-end="url(#ar)"/><text x="466" y="164" text-anchor="end" class="a t b" style="font-size:10.5px">MNT1_TYPE</text><text x="16" y="208" text-anchor="start" class="b" style="font-size:12px">PX4</text><rect class="box" x="10.0" y="214.0" width="206.0" height="96.0" rx="6"/><text x="113.0" y="233.5" text-anchor="middle" class="b" style="font-size:10.5px">Клиенты</text><text x="113.0" y="246.5" text-anchor="middle" style="font-size:10.5px">пульт: MNT_MAN_PITCH = AUX n</text><text x="113.0" y="259.5" text-anchor="middle" style="font-size:10.5px">и RC_MAP_AUXn — нужны оба,</text><text x="113.0" y="272.5" text-anchor="middle" style="font-size:10.5px">иначе по оси ноль;</text><text x="113.0" y="285.5" text-anchor="middle" style="font-size:10.5px">GCS / миссия / companion —</text><text x="113.0" y="298.5" text-anchor="middle" style="font-size:10.5px">Gimbal v2</text><path class="ln" d="M216 262 L238 262" marker-end="url(#ar)"/><rect class="boxa" x="238.0" y="214.0" width="206.0" height="96.0" rx="6"/><text x="341.0" y="233.5" text-anchor="middle" class="b" style="font-size:10.5px">Модуль gimbal</text><text x="341.0" y="246.5" text-anchor="middle" style="font-size:10.5px">MNT_MODE_IN: умолч. −1 —</text><text x="341.0" y="259.5" text-anchor="middle" style="font-size:10.5px">не стартует («not running»);</text><text x="341.0" y="272.5" text-anchor="middle" style="font-size:10.5px">0 пульт + v2, 1 пульт,</text><text x="341.0" y="285.5" text-anchor="middle" style="font-size:10.5px">4 только v2 (2, 3 — v1,</text><text x="341.0" y="298.5" text-anchor="middle" style="font-size:10.5px">не выбирать); перезагрузка</text><path class="ln" d="M444 262 L470 262"/><rect class="box" x="488.0" y="216.0" width="222.0" height="40.0" rx="5"/><text x="599.0" y="234.0" text-anchor="middle" style="font-size:10.5px">MNT_MODE_OUT = 0 — AUX:</text><text x="599.0" y="246.0" text-anchor="middle" style="font-size:10.5px">функции 420 / 421 / 422, 50 Гц</text><rect class="box" x="488.0" y="262.0" width="222.0" height="52.0" rx="5"/><text x="599.0" y="274.0" text-anchor="middle" style="font-size:10.5px">MNT_MODE_OUT = 2 — Gimbal v2:</text><text x="599.0" y="286.0" text-anchor="middle" style="font-size:10.5px">MAV_n_MODE = 10; без</text><text x="599.0" y="298.0" text-anchor="middle" style="font-size:10.5px">GIMBAL_DEVICE_INFORMATION —</text><text x="599.0" y="310.0" text-anchor="middle" style="font-size:10.5px">«compid not found»</text><path class="ln" d="M470 236.0 L470 288.0"/><path class="ln" d="M470 236.0 L488 236.0" marker-end="url(#ar)"/><path class="ln" d="M470 288.0 L488 288.0" marker-end="url(#ar)"/><rect class="box" x="10.0" y="330.0" width="700.0" height="40.0" rx="6"/><text x="20" y="347.5" text-anchor="start" style="font-size:10.5px">Проверка: ArduPilot — нет «PreArm: Mount: …», стик RCx_OPTION = 213 двигает наклон в режиме 3;</text><text x="20" y="360.5" text-anchor="start" style="font-size:10.5px">PX4 — gimbal status, затем gimbal test pitch -45 (руки и кабели из зоны хода)</text></svg>
