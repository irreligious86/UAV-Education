<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">GPS в Betaflight 4.5 от включения до точки дома (io/gps.c)</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="40" width="110" height="46" rx="6"/><text x="65.0" y="60.0" text-anchor="middle" style="font-size:10.5px">Питание</text><text x="65.0" y="74.0" text-anchor="middle" style="font-size:10.5px">UART из serial</text><rect class="box" x="140" y="40" width="130" height="46" rx="6"/><text x="205.0" y="60.0" text-anchor="middle">DETECT_BAUD</text><text x="205.0" y="74.0" text-anchor="middle">MON-VER ×3, 330 мс</text><rect class="box" x="290" y="40" width="130" height="46" rx="6"/><text x="355.0" y="60.0" text-anchor="middle">CHANGE_BAUD</text><text x="355.0" y="74.0" text-anchor="middle">PUBX,41 → 57600</text><rect class="boxa" x="440" y="40" width="140" height="46" rx="6"/><text x="510.0" y="60.0" text-anchor="middle" class="b">CONFIGURE (RAM)</text><text x="510.0" y="74.0" text-anchor="middle" class="b">1 с + шаги ≥ 110 мс</text><rect class="box" x="600" y="40" width="110" height="46" rx="6"/><text x="655.0" y="60.0" text-anchor="middle" style="font-size:10.5px">RECEIVING</text><text x="655.0" y="74.0" text-anchor="middle" style="font-size:10.5px">NAV-PVT 10 Гц</text><rect class="boxa" x="440" y="150" width="170" height="46" rx="6"/><text x="525.0" y="170.0" text-anchor="middle" class="b">Первый 3D fix:</text><text x="525.0" y="184.0" text-anchor="middle" class="b">flight model AIRBORNE_4G</text><rect class="box" x="225" y="150" width="190" height="46" rx="6"/><text x="320.0" y="170.0" text-anchor="middle">fix и sats ≥ min_sats:</text><text x="320.0" y="184.0" text-anchor="middle">флаг GPS снят, READY_BEEP</text><rect class="boxa" x="10" y="150" width="190" height="46" rx="6"/><text x="105.0" y="170.0" text-anchor="middle" class="b">ARM: дом = точка,</text><text x="105.0" y="184.0" text-anchor="middle" class="b">если sats ≥ min_sats</text><path class="ln" d="M120 63.0 L140 63.0" marker-end="url(#ar)"/><path class="lna" d="M270 63.0 L290 63.0" marker-end="url(#ara)"/><text x="280.0" y="56.0" text-anchor="middle" class="m t" style="font-size:10px">ответ</text><path class="ln" d="M420 63.0 L440 63.0" marker-end="url(#ar)"/><text x="430.0" y="56.0" text-anchor="middle" class="m t" style="font-size:10px">990 мс</text><path class="ln" d="M580 63.0 L600 63.0" marker-end="url(#ar)"/><path class="ln" d="M655.0 86 L655.0 118.0 L525.0 118.0 L525.0 150" marker-end="url(#ar)"/><path class="ln" d="M440 173.0 L415 173.0" marker-end="url(#ar)"/><path class="lna" d="M225 173.0 L200 173.0" marker-end="url(#ara)"/><text x="10" y="232" text-anchor="start" class="m t">Нет ответа 3 раза — следующая скорость: 57600 → 115200 → 9600 → 19200 → 38400 → 57600 …</text><text x="10" y="247" text-anchor="start" class="m t">Нет NAV-данных 2.5 с → LOST_COMMUNICATION → снова DETECT_BAUD. gps_auto_config = OFF — CONFIGURE пропущен.</text><text x="10" y="262" text-anchor="start" class="w t">До первого fix — gps_ublox_acquire_model (STATIONARY), не до арма. Всё пишется в RAM модуля.</text><text x="10" y="277" text-anchor="start" class="m t">gps_set_home_point_once = OFF: дом сбрасывается при каждом дизарме и пишется заново при арме.</text></svg>
