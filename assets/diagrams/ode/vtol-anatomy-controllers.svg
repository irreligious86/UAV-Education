<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">QuadPlane: самолётный и коптерный комплекты регуляторов</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="16" y="40" width="200" height="50" rx="6"/><text x="116.0" y="62.0" text-anchor="middle">Датчики: IMU, GPS,</text><text x="116.0" y="76.0" text-anchor="middle">баро, ARSPD_*</text><rect class="boxa" x="260" y="40" width="200" height="50" rx="6"/><text x="360.0" y="62.0" text-anchor="middle" class="b">AHRS / EKF3:</text><text x="360.0" y="76.0" text-anchor="middle" class="b">одна оценка на всех</text><rect class="box" x="504" y="40" width="200" height="50" rx="6"/><text x="604.0" y="62.0" text-anchor="middle">Режим: Q-режимы,</text><text x="604.0" y="76.0" text-anchor="middle">самолётные, MANUAL</text><rect class="box" x="16" y="150" width="228" height="64" rx="6"/><text x="130.0" y="172.0" text-anchor="middle">Самолётный комплект:</text><text x="130.0" y="186.0" text-anchor="middle">RLL_RATE_, PTCH_RATE_,</text><text x="130.0" y="200.0" text-anchor="middle">TECS_, NAVL1_</text><rect class="boxa" x="262" y="150" width="196" height="64" rx="6"/><text x="360.0" y="172.0" text-anchor="middle" class="b">Переход и Q-assist:</text><text x="360.0" y="186.0" text-anchor="middle" class="b">работают оба</text><text x="360.0" y="200.0" text-anchor="middle" class="b">комплекта</text><rect class="box" x="476" y="150" width="228" height="64" rx="6"/><text x="590.0" y="172.0" text-anchor="middle">Коптерный комплект:</text><text x="590.0" y="186.0" text-anchor="middle">Q_A_, Q_P_, Q_M_,</text><text x="590.0" y="200.0" text-anchor="middle">Q_WP_, Q_LOIT_</text><rect class="box" x="16" y="280" width="228" height="50" rx="6"/><text x="130.0" y="302.0" text-anchor="middle">Рули 4, 19, 21 и</text><text x="130.0" y="316.0" text-anchor="middle">маршевый газ 70</text><rect class="box" x="476" y="280" width="228" height="50" rx="6"/><text x="590.0" y="302.0" text-anchor="middle">Подъёмные моторы</text><text x="590.0" y="316.0" text-anchor="middle">Motor1…8 (33…40)</text><path class="ln" d="M216 65.0 L260 65.0" marker-end="url(#ar)"/><path class="ln" d="M360.0 90 L360.0 120.0 L130.0 120.0 L130.0 150" marker-end="url(#ar)"/><path class="ln" d="M360.0 90 L360.0 120.0 L590.0 120.0 L590.0 150" marker-end="url(#ar)"/><path class="ln" d="M604.0 90 L604.0 120.0 L590.0 120.0 L590.0 150" marker-end="url(#ar)"/><path class="ln" d="M130.0 214 L130.0 280" marker-end="url(#ar)"/><path class="ln" d="M590.0 214 L590.0 280" marker-end="url(#ar)"/><path class="lna" d="M262 182.0 L253.0 182.0 L253.0 305.0 L244 305.0" marker-end="url(#ara)"/><path class="lna" d="M458 182.0 L467.0 182.0 L467.0 305.0 L476 305.0" marker-end="url(#ara)"/><text x="16" y="20" text-anchor="start" class="m t">QuadPlane: одна прошивка ArduPlane, два комплекта регуляторов</text><text x="138" y="240" text-anchor="start" class="m t">FBWA, AUTO, RTL…</text><text x="598" y="240" text-anchor="start" class="m t">Q-режимы</text><text x="16" y="350" text-anchor="start" class="m t">MANUAL, ACRO, TRAINING: коптерный комплект не работает (4+1 — моторы стоят)</text></svg>
