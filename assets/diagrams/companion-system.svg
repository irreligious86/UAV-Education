-anchor="middle">GCS</text><text x="650.0" y="86.0" text-anchor="middle">оператор</text><rect class="box" x="330" y="160" width="100" height="44" rx="6"/><text x="380.0" y="186.0" text-anchor="middle">Камера</text><rect class="box" x="590" y="160" width="120" height="44" rx="6"/><text x="650.0" y="186.0" text-anchor="middle">4G / Wi-Fi</text><path class="lna" d="M330 84.0 L170 84.0" marker-end="url(#ara)"/><text x="250.0" y="97.0" text-anchor="middle" class="m t" style="font-size:10px">цели GUIDED / Offboard</text><path class="ln" d="M170 84.0 L330 84.0" marker-end="url(#ar)"/><text x="250.0" y="77.0" text-anchor="middle" class="m t" style="font-size:10px">телеметрия, статус</text><path class="ln" d="M490 75.0 L590 75.0" marker-end="url(#ar)"/><text x="540.0" y="68.0" text-anchor="middle" class="m t" style="font-size:10px">видео</text><path class="ln" d="M380.0 160 L380.0 135.0 L410.0 135.0 L410.0 110" marker-end="url(#ar)"/><path class="ln" d="M650.0 110 L650.0 160" marker-end="url(#ar)"/><path class="ln" d="M590 182.0 L540.0 182.0 L540.0 75.0 L490 75.0" marker-end="url(#ar)"/><text x="10" y="140" text-anchor="start" class="m t">Правило: companion советует, FC решает;</text><text x="10" y="154" text-anchor="start" class="m t">молчит companion — таймаут GUIDED и failsafe.</text></svg>
