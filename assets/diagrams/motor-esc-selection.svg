<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="t" style="max-width:720px;display:block;margin:0 auto"><title id="t">Подбор мотора и ESC: от T/W к току регулятора</title><style>text{font-family: var(--gc-font-mono, ui-monospace, Menlo, monospace); font-size: 12px;fill:currentColor} .m{fill:var(--gc-ink-muted, #8a93a3)} .a{fill:var(--gc-accent-hud, #5ef1d2)} .w{fill:var(--gc-signal-amber, #f0b24c)} .d{fill:var(--gc-signal-red, #e8636b)} .box{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:currentColor;stroke-width:1.2} .boxa{fill:var(--gc-surface-200, rgba(128,128,128,0.08));stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6} .ln{stroke:currentColor;stroke-width:1.2;fill:none} .lna{stroke:var(--gc-accent-hud, #5ef1d2);stroke-width:1.6;fill:none} .lnm{stroke:var(--gc-ink-muted, #8a93a3);stroke-width:1;fill:none;stroke-dasharray:4 3} .t{font-size:11px} .b{font-weight:600}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--gc-accent-hud, #5ef1d2)"/></marker></defs><rect class="box" x="10" y="34" width="160" height="48" rx="6"/><text x="90.0" y="55.0" text-anchor="middle">5&quot; 6S, 700 г</text><text x="90.0" y="69.0" text-anchor="middle">нужен T/W ≥ 5</text><rect class="box" x="190" y="34" width="160" height="48" rx="6"/><text x="270.0" y="55.0" text-anchor="middle">5 × 700 = 3500 г,</text><text x="270.0" y="69.0" text-anchor="middle">≥ 875 г на мотор</text><rect class="box" x="370" y="34" width="160" height="48" rx="6"/><text x="450.0" y="55.0" text-anchor="middle">2207 1750KV, 5.1×3:</text><text x="450.0" y="69.0" text-anchor="middle">~1600 г при 38 А</text><rect class="boxa" x="550" y="34" width="160" height="48" rx="6"/><text x="630.0" y="55.0" text-anchor="middle" class="b">ESC ≥ 1.3 × 38 А</text><text x="630.0" y="69.0" text-anchor="middle" class="b">= 49.4 → ≥ 50 А</text><rect class="box" x="370" y="124" width="160" height="44" rx="6"/><text x="450.0" y="143.0" text-anchor="middle">45 А: запас 1.18×</text><text x="450.0" y="157.0" text-anchor="middle">— впритык</text><rect class="boxa" x="550" y="124" width="160" height="44" rx="6"/><text x="630.0" y="143.0" text-anchor="middle" class="b">55–60 А —</text><text x="630.0" y="157.0" text-anchor="middle" class="b">спокойнее</text><rect class="box" x="10" y="214" width="150" height="48" rx="6"/><text x="85.0" y="242.0" text-anchor="middle">7&quot; 6S, 1.4 кг</text><rect class="box" x="178" y="214" width="184" height="48" rx="6"/><text x="270.0" y="235.0" text-anchor="middle">2806.5 1300KV, 7×3.5:</text><text x="270.0" y="249.0" text-anchor="middle">~1200 г при ~22 А</text><rect class="box" x="380" y="214" width="160" height="48" rx="6"/><text x="460.0" y="235.0" text-anchor="middle">T/W = 4·1200/1400</text><text x="460.0" y="249.0" text-anchor="middle">= 3.4</text><rect class="boxa" x="560" y="214" width="150" height="48" rx="6"/><text x="635.0" y="235.0" text-anchor="middle" class="b">ESC ≥ 1.3 × 22 А</text><text x="635.0" y="249.0" text-anchor="middle" class="b">= 28.6 → 35–45 А</text><path class="ln" d="M170 58.0 L190 58.0" marker-end="url(#ar)"/><path class="ln" d="M350 58.0 L370 58.0" marker-end="url(#ar)"/><path class="lna" d="M530 58.0 L550 58.0" marker-end="url(#ara)"/><path class="ln" d="M630.0 82 L630.0 103.0 L450.0 103.0 L450.0 124" marker-end="url(#ar)"/><text x="546.0" y="99.0" text-anchor="middle" class="m t" style="font-size:10px">мало</text><path class="lna" d="M630.0 82 L630.0 124" marker-end="url(#ara)"/><path class="ln" d="M160 238.0 L178 238.0" marker-end="url(#ar)"/><path class="ln" d="M362 238.0 L380 238.0" marker-end="url(#ar)"/><path class="lna" d="M540 238.0 L560 238.0" marker-end="url(#ara)"/><text x="10" y="20" text-anchor="start" class="m t">Подбор: задача → тяга на мотор → пиковый ток по таблице тяги → ESC по правилу ≥ 1.3×</text><text x="10" y="290" text-anchor="start" class="m t">Разница KV у 5&quot; и 7&quot; — из-за момента на пропе (Kt = 60/(2π·KV))</text><text x="10" y="140" text-anchor="start" class="m t">45 А держит пик секундами,</text><text x="10" y="156" text-anchor="start" class="m t">но впритык в агрессивном</text><text x="10" y="172" text-anchor="start" class="m t">полёте на свежей АКБ</text></svg>
