<h2>✅ Быстрые чек-листы перед полетом</h2>
        <div class="grid">
          <div class="checklist-card">
            <h3>Перед включением питания</h3>
            <ul>
              <li><input type="checkbox"><label>Пропеллеры сняты (настройка) / затянуты (полет)</label></li>
              <li><input type="checkbox"><label>Аккумулятор заряжен, напряжение в норме</label></li>
              <li><input type="checkbox"><label>Антенны VTX и приемника установлены</label></li>
              <li><input type="checkbox"><label>SD-карта вставлена (логи/скрипты)</label></li>
              <li><input type="checkbox"><label>Нет видимых повреждений рамы и проводов</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>После подключения к GCS</h3>
            <ul>
              <li><input type="checkbox"><label>Сделан backup конфигурации (diff / param)</label></li>
              <li><input type="checkbox"><label>Калибровка акселерометра выполнена</label></li>
              <li><input type="checkbox"><label>Калибровка компаса выполнена (если есть MAG)</label></li>
              <li><input type="checkbox"><label>GPS fix получен (≥ 8 спутников, HDOP &lt; 1.5)</label></li>
              <li><input type="checkbox"><label>Режимы назначены на переключатели</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>Перед взлетом (armed)</h3>
            <ul>
              <li><input type="checkbox"><label>Проверка направления вращения моторов</label></li>
              <li><input type="checkbox"><label>Проверка движения серв (для крыла)</label></li>
              <li><input type="checkbox"><label>Проверка работы OSD и телеметрии</label></li>
              <li><input type="checkbox"><label>Проверка failsafe (выключение пульта)</label></li>
              <li><input type="checkbox"><label>Дрон в безопасной зоне, люди на расстоянии</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>После полета</h3>
            <ul>
              <li><input type="checkbox"><label>Сохранение лога полета (Blackbox / .bin)</label></li>
              <li><input type="checkbox"><label>Проверка температуры моторов и ESC</label></li>
              <li><input type="checkbox"><label>Проверка остаточного напряжения батареи</label></li>
              <li><input type="checkbox"><label>Визуальный осмотр на повреждения</label></li>
              <li><input type="checkbox"><label>Запись наблюдений в журнал ошибок</label></li>
            </ul>
          </div>
        </div>
