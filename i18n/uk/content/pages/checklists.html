<h2>✅ Швидкі чек-листи перед польотом</h2>
        <div class="grid">
          <div class="checklist-card">
            <h3>Перед увімкненням живлення</h3>
            <ul>
              <li><input type="checkbox"><label>Пропелери зняті (налаштування) / затягнуті (політ)</label></li>
              <li><input type="checkbox"><label>Акумулятор заряджений, напруга в нормі</label></li>
              <li><input type="checkbox"><label>Антени VTX і приймача встановлені</label></li>
              <li><input type="checkbox"><label>SD-карта вставлена (логи/скрипти)</label></li>
              <li><input type="checkbox"><label>Немає видимих пошкоджень рами й проводів</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>Після підключення до GCS</h3>
            <ul>
              <li><input type="checkbox"><label>Зроблено backup конфігурації (diff / param)</label></li>
              <li><input type="checkbox"><label>Калібрування акселерометра виконано</label></li>
              <li><input type="checkbox"><label>Калібрування компаса виконано (якщо є MAG)</label></li>
              <li><input type="checkbox"><label>GPS fix отримано (≥ 8 супутників, HDOP &lt; 1.5)</label></li>
              <li><input type="checkbox"><label>Режими призначені на перемикачі</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>Перед зльотом (armed)</h3>
            <ul>
              <li><input type="checkbox"><label>Перевірка напрямку обертання моторів</label></li>
              <li><input type="checkbox"><label>Перевірка руху серв (для крила)</label></li>
              <li><input type="checkbox"><label>Перевірка роботи OSD і телеметрії</label></li>
              <li><input type="checkbox"><label>Перевірка failsafe (вимкнення пульта)</label></li>
              <li><input type="checkbox"><label>Дрон у безпечній зоні, люди на відстані</label></li>
            </ul>
          </div>
          <div class="checklist-card">
            <h3>Після польоту</h3>
            <ul>
              <li><input type="checkbox"><label>Збереження логу польоту (Blackbox / .bin)</label></li>
              <li><input type="checkbox"><label>Перевірка температури моторів і ESC</label></li>
              <li><input type="checkbox"><label>Перевірка залишкової напруги батареї</label></li>
              <li><input type="checkbox"><label>Візуальний огляд на пошкодження</label></li>
              <li><input type="checkbox"><label>Запис спостережень у журнал фейлів</label></li>
            </ul>
          </div>
        </div>
